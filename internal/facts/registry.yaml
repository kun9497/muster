schema_version: 1
keys:
  - key: services.ssh.installed
    type: bool
    description: An SSH server package or unit exists on the host.
    since: 1
    sensitivity: public
    collector: services
  - key: services.ssh.active
    type: bool
    description: The SSH service is running or socket-activated.
    since: 1
    sensitivity: public
    collector: services
  - key: services.telnet.installed
    type: bool
    description: A telnet server package, unit or inetd entry exists on the host.
    since: 1
    sensitivity: public
    collector: services
  - key: services.telnet.reachable
    type: bool
    description: A telnet server would accept a connection from off the host (active unit or listening socket unit, non-loopback).
    since: 1
    sensitivity: public
    collector: services
  - key: sockets.listening
    type: list<record>
    description: Listening TCP/UDP sockets with proto, address, port, inode, pid and executable.
    since: 1
    sensitivity: internal
    collector: sockets
    subject_kind: port
  - key: sshd.collect_method
    type: string
    description: How sshd options were obtained - G, T or parse.
    since: 1
    sensitivity: public
    collector: sshd
  - key: sshd.personas_collected
    type: bool
    description: Whether per-persona (Match) values were collected; false means options hold global values only.
    since: 1
    sensitivity: public
    collector: sshd
  - key: sshd.options.permit_root_login
    type: setting<string>
    description: Effective PermitRootLogin value (daemon-reported versus parsed files).
    since: 1
    sensitivity: public
    collector: sshd
    default_on: effective
  - key: files.etc_securetty
    type: record
    description: Presence and permission facts of /etc/securetty (absent on RHEL 8+ and Debian-family).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_securetty_lines
    type: list<string>
    description: Non-comment lines of /etc/securetty. A sibling leaf, not a member of files.etc_securetty, because every leaf under facts is an envelope of its own.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.mode
    type: int
    description: Permission bits of /etc/passwd as an integer (e.g. 420 for 0644).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.uid
    type: int
    description: Owner uid of /etc/passwd.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.gid
    type: int
    description: Group gid of /etc/passwd.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.acl_present
    type: bool
    description: Whether a POSIX ACL xattr is present on /etc/passwd.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.group
    type: string
    description: Group name for the gid of /etc/passwd from /etc/group; empty when the gid has no name.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.group_readable
    type: bool
    description: Whether the group permission bits of /etc/passwd include read (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.group_writable
    type: bool
    description: Whether the group permission bits of /etc/passwd include write (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.other_readable
    type: bool
    description: Whether the other permission bits of /etc/passwd include read (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.other_writable
    type: bool
    description: Whether the other permission bits of /etc/passwd include write (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.acl_entries
    type: list<string>
    description: Access ACL entries of /etc/passwd in setfacl form with numeric ids (user::rw-, user:1000:rw-, group::r--, mask::rw-, other::r--); empty when no ACL is set.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts.mode
    type: int
    description: Permission bits of /etc/hosts as an integer (e.g. 384 for 0600).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts.uid
    type: int
    description: Owner uid of /etc/hosts.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts.gid
    type: int
    description: Group gid of /etc/hosts.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts.group
    type: string
    description: Group name for the gid of /etc/hosts from /etc/group; empty when the gid has no name.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts.group_readable
    type: bool
    description: Whether the group permission bits of /etc/hosts include read (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts.group_writable
    type: bool
    description: Whether the group permission bits of /etc/hosts include write (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts.other_readable
    type: bool
    description: Whether the other permission bits of /etc/hosts include read (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts.other_writable
    type: bool
    description: Whether the other permission bits of /etc/hosts include write (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts.acl_present
    type: bool
    description: Whether a POSIX ACL xattr is present on /etc/hosts.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_services.mode
    type: int
    description: Permission bits of /etc/services as an integer (e.g. 384 for 0600).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_services.uid
    type: int
    description: Owner uid of /etc/services.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_services.gid
    type: int
    description: Group gid of /etc/services.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_services.group
    type: string
    description: Group name for the gid of /etc/services from /etc/group; empty when the gid has no name.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_services.group_readable
    type: bool
    description: Whether the group permission bits of /etc/services include read (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_services.group_writable
    type: bool
    description: Whether the group permission bits of /etc/services include write (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_services.other_readable
    type: bool
    description: Whether the other permission bits of /etc/services include read (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_services.other_writable
    type: bool
    description: Whether the other permission bits of /etc/services include write (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_services.acl_present
    type: bool
    description: Whether a POSIX ACL xattr is present on /etc/services.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_lpd.mode
    type: int
    description: Permission bits of /etc/hosts.lpd as an integer (e.g. 384 for 0600).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_lpd.uid
    type: int
    description: Owner uid of /etc/hosts.lpd.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_lpd.gid
    type: int
    description: Group gid of /etc/hosts.lpd.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_lpd.group
    type: string
    description: Group name for the gid of /etc/hosts.lpd from /etc/group; empty when the gid has no name.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_lpd.group_readable
    type: bool
    description: Whether the group permission bits of /etc/hosts.lpd include read (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_lpd.group_writable
    type: bool
    description: Whether the group permission bits of /etc/hosts.lpd include write (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_lpd.other_readable
    type: bool
    description: Whether the other permission bits of /etc/hosts.lpd include read (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_lpd.other_writable
    type: bool
    description: Whether the other permission bits of /etc/hosts.lpd include write (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_lpd.acl_present
    type: bool
    description: Whether a POSIX ACL xattr is present on /etc/hosts.lpd.
    since: 1
    sensitivity: public
    collector: files
  - key: accounts.login_defs.pass_max_days
    type: setting<int>
    description: PASS_MAX_DAYS - persisted in login.defs, effective as the maximum over existing accounts' shadow fields.
    since: 1
    sensitivity: public
    collector: accounts
    default_on: both
  - key: accounts.login_defs.pass_min_days
    type: setting<int>
    description: PASS_MIN_DAYS - persisted in login.defs, effective as the minimum over existing accounts' shadow fields.
    since: 1
    sensitivity: public
    collector: accounts
    default_on: both
  - key: accounts.login_defs.pass_min_len
    type: int
    description: PASS_MIN_LEN from login.defs (ignored by PAM when pwquality is present; stage 2 adds the pwquality side).
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.login_defs.pass_warn_age
    type: setting<int>
    description: PASS_WARN_AGE - persisted in login.defs, effective as the minimum warn field over existing accounts' shadow rows.
    since: 1
    sensitivity: public
    collector: accounts
    default_on: both
  - key: accounts.login_defs.uid_min
    type: int
    description: UID_MIN from login.defs, the lowest uid of a regular (non-system) account.
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.login_defs.sys_uid_max
    type: int
    description: SYS_UID_MAX from login.defs, the highest uid useradd assigns to a system account.
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.login_defs.sha_crypt_min_rounds
    type: int
    description: SHA_CRYPT_MIN_ROUNDS from login.defs.
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.login_defs.umask
    type: string
    description: UMASK from login.defs, verbatim (a mask, not a number).
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.login_defs.home_mode
    type: string
    description: HOME_MODE from login.defs, verbatim.
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.login_defs.encrypt_method
    type: string
    description: ENCRYPT_METHOD from login.defs, verbatim (SHA512, YESCRYPT, ...); PAM may override it.
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.login_defs.env_supath
    type: string
    description: ENV_SUPATH from login.defs, verbatim (the PATH= assignment for root logins).
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.login_defs.env_path
    type: string
    description: ENV_PATH from login.defs, verbatim (the PATH= assignment for other logins).
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.users
    type: list<record>
    description: Local accounts with name, uid, gid, shell, password_status and ageing fields; no hashes. Ageing fields are -1 when the shadow field is empty, and uid/gid are -1 when the passwd field is unparsable.
    since: 1
    sensitivity: internal
    collector: accounts
    subject_kind: user
  - key: env.container
    type: string
    description: Container runtime detected from filesystem markers (none, docker, podman, lxc, other); the same value the run header carries.
    since: 1
    sensitivity: public
    collector: os
  - key: env.has_systemd
    type: bool
    description: Whether /run/systemd/system exists, so unit state can be asked of systemd.
    since: 1
    sensitivity: public
    collector: os
  - key: walk.world_writable
    type: list<record>
    description: World-writable files found by the deep walk, with path, sticky, uid, gid, package_declared.
    since: 1
    sensitivity: internal
    collector: walk
    subject_kind: file
  - key: walk.complete
    type: bool
    description: Whether the deep walk finished within its budget.
    since: 1
    sensitivity: public
    collector: walk
