    sensitivity: public
    collector: fim
  - key: fim.aide.config_path
    type: string
    description: The first AIDE configuration file that exists, /etc/aide/aide.conf (Debian family) then /etc/aide.conf (EL); absent when neither does.
    since: 1
    sensitivity: public
    collector: fim
  - key: fim.aide.database_path
    type: string
    description: The file the configuration reads its database from - database_in= (aide 0.17 and later), else database=, with the file prefix removed and @@define macros substituted; a macro the file never defines is left as written and the reason names it; the read's status when the configuration cannot be read.
    since: 1
    sensitivity: public
    collector: fim
  - key: fim.aide.database_present
    type: bool
    description: Whether a regular file exists at fim.aide.database_path; false, with the reason, when AIDE is installed and neither configuration file exists or the configuration has no database_in= or database= line; absent, naming the path, when that path is outside /var/lib/aide.
    since: 1
    sensitivity: public
    collector: fim
  - key: fim.aide.database_modified
    type: string
    description: The database file's modification time as RFC 3339 UTC; absent when there is no database; evidence (no key says whether the database is fresh).
    since: 1
    sensitivity: public
    collector: fim
  - key: fim.aide.scheduled
    type: bool
    description: Whether at least one fim.aide.schedules row is armed; the read's status when /etc/default/aide cannot be read and no row it does not control is armed; unsupported when a systemd host's timer inventory cannot be read.
    since: 1
    sensitivity: public
    collector: fim
  - key: fim.aide.schedules
    type: list<record>
    description: Every way this host schedules AIDE, sorted by path, with kind (cron_daily, cron_d, crontab or timer), path (the file, or the timer unit), armed and detail (why it will not run) - a cron.daily script whose name contains aide is armed when it is a regular executable file with a name run-parts runs (letters, digits, _ and -), not the Ubuntu 24.04 shim on a systemd host, and CRON_DAILY_RUN in /etc/default/aide is yes, empty or unset (an /etc/default/aide that cannot be read disarms every row it controls); a cron.d or crontab line whose command names aide is armed; a timer whose name contains aide is armed when systemctl list-timers shows a next elapse and the same CRON_DAILY_RUN gate holds; capped at 64 rows.
    since: 1
    sensitivity: public
    collector: fim
  - key: fim.other_tools
    type: list<record>
    description: The binaries of file-integrity tools other than AIDE that exist, each with name and path, sorted by path; capped at 64 rows; evidence.
    since: 1
    sensitivity: public
    collector: fim
  - key: units.root_services
    type: list<record>
    description: "The system services in scope - enabled (a .wants or .requires link in any tree of the systemd.unit(5) search path names them) or active (systemctl list-units lists them) - whose merged User= is unset, root or 0, one row per unit sorted by unit with unit, enabled, active, user, unit_file (file, symlink or missing), files (the unit file and each drop-in read, with path, mode, uid and gid), exec (one row per command of each Exec* line - a lone ; separates two - with directive, path, resolved, stat_status (ok, missing, unresolved, undeclared, symlink_in_path, link_undeclared, link_chain, denied or error), stat_path (the path stat-ed: the /usr spelling of a merged-/usr alias, or a symlink's one-hop target), exists and kind (of path itself: for a symlink the link, which exists even when stat_status says its target at stat_path is missing), mode, uid, gid, group_writable and other_writable; mode, uid and gid -1 when not stat-ed), read_status (ok, denied or error) and reason. A unit file that is a symlink to /dev/null, or empty, is a mask and out of scope; User=%i names the instance. Capped at 500 units; evidence."
    since: 1
    sensitivity: internal
    collector: units
    subject_kind: unit
  - key: units.exec_writable
    type: list<record>
    description: "The judged subset of units.root_services, sorted by unit, path and why: an executable owned by a uid other than 0, group-writable or other-writable, or in a directory that is not root-owned or is group/other-writable (why owner, group_writable, other_writable or parent_writable; a symlinked executable judged by its owner and its directory, and by its target one hop on), and a unit file or drop-in owned by a uid other than 0, group-writable or other-writable (why unit_file:owner, unit_file:group_writable or unit_file:other_writable; its directory is not judged). Absent, naming the unit and path, when an in-scope unit file or drop-in exists and cannot be read, a unit file is a symlink not followed, an active unit has no unit file, or an executable (or its symlink target) is outside the collector's declaration or cannot be stat-ed."
    since: 1
    sensitivity: public
    collector: units
    subject_kind: unit
  - key: units.exec_unresolved
    type: int
    description: "How many units.root_services exec rows are resolved false (a command that is not an absolute path, or carries a % specifier), plus the units whose unit_file is symlink or missing; evidence."
    since: 1
    sensitivity: public
    collector: units
  - key: ssh.authorized_keys
    type: list<record>
    description: "The authorized_keys and authorized_keys2 files (the two AuthorizedKeysFile defaults of sshd_config(5)) under the .ssh directory of every /etc/passwd account with a home path, one row per account and file sorted by user and path with user, uid, path, exists, mode, owner_uid (both -1 when no file was read), keys (line, type, bits, fingerprint, options, restricted; the key body is never stored; capped at 200 per file), unparsed (lines that are neither a comment, blank nor a key sshd would read), unfollowed, read_status (ok, denied or error; empty on an unfollowed row and on the row of a home outside the declaration) and reason. A home outside the collector's declaration is one row with path empty, exists false, unfollowed false and the reason; a file behind a symlink (the file or its .ssh), which sshd follows and muster does not, is a row with exists and unfollowed true; a file that cannot be read is a row with the read's status. Capped at 500 rows; evidence."
    since: 1
    sensitivity: internal
    collector: sshkeys
    subject_kind: user
  - key: ssh.root_key_count
    type: int
    description: "How many keys the authorized_keys files of the uid-0 accounts hold, both defaults counted (on EL, where sshd reads only authorized_keys, a key in authorized_keys2 is a stale one for review). The read's status, naming the path, when one of the files exists and cannot be read; /etc/shells' status (denied for the libc default) when it cannot say which accounts are interactive; absent, naming the path, when a file is behind a symlink muster does not follow, and naming the account and home when an interactive account's home is outside the collector's declaration."
    since: 1
    sensitivity: public
    collector: sshkeys
  - key: ssh.dsa_key_count
    type: int
    description: "How many ssh-dss keys (not DSA certificates) the authorized_keys files read hold, across every account. Degraded as ssh.root_key_count is."
    since: 1
    sensitivity: public
    collector: sshkeys
  - key: ssh.rsa_keys
    type: list<record>
    description: "Every RSA key whose modulus was read (the ssh-rsa type, or a signature-only rsa-sha2-* word over an ssh-rsa blob, which sshd reads as the same key), one row per key and file (a file two accounts share is listed once, under the first account by name), sorted by user, path and line, with user, path, line, bits (the modulus bit length ssh-keygen -l prints) and fingerprint (SHA256:, unpadded base64). Capped at 2000 rows; degraded as ssh.root_key_count is."
    since: 1
    sensitivity: internal
    collector: sshkeys
    subject_kind: key
  - key: privilege.ld_so_preload
    type: list<string>
    description: "The entries of /etc/ld.so.preload, the shared objects the dynamic loader loads into every program, in file order, as glibc's loader reads them: a # starts a comment anywhere on a line, entries are separated by space, tab, newline or colon, empty entries dropped. A missing file is an empty list (the normal state); a file that exists and cannot be read is the read's status, naming the path."
    since: 1
    sensitivity: public
    collector: privilege
    subject_kind: file
  - key: privilege.runtime_sockets
    type: list<record>
    description: "The control sockets of the four container runtimes whose API is root (/run/docker.sock, /run/containerd/containerd.sock, /run/podman/podman.sock, /run/crio/crio.sock, at their physical paths), one row each in that order with path, exists (something is at the path), kind (socket, or what the stat found there: regular, dir, ...), mode (the 0o7777 bits), uid, gid, group (the name /etc/group gives the gid; empty when /etc/group cannot be read), group_writable, other_writable, owner_nonroot (the owner is not uid 0, so that account reaches the API) and acl_present (a POSIX access ACL is set, whose named entries reach the API without the group; group_writable then reads the ACL mask). A socket that does not exist (the path or a parent missing) is exists false, kind empty, mode, uid and gid -1, group empty, every flag false; a stat or ACL read that fails otherwise (/run/podman is 0700, so a non-root run on a podman host) is the read's status on the whole list, naming the path."
    since: 1
    sensitivity: public
    collector: privilege
    subject_kind: file
  - key: privilege.runtime_group_members
    type: list<record>
    description: "For every existing group-writable socket of privilege.runtime_sockets, the accounts other than uid 0 that hold its gid, judged from the local files: the supplementary members of every /etc/group line with that gid and the /etc/passwd accounts whose primary gid it is, one row per group, member and socket with group, member, uid (-1 when /etc/passwd does not name the member) and socket, sorted by group, member and socket. Empty when no socket is group-writable or its group is empty; the status of privilege.runtime_sockets when that is not ok, else /etc/group's or /etc/passwd's read status, naming the path, when either cannot be read (absent when /etc/group does not exist)."
    since: 1
    sensitivity: public
    collector: privilege
    subject_kind: user
