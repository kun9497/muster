  - key: sockets.listening
    type: list<record>
    description: Listening TCP/UDP sockets with proto, address, port and inode.
    since: 1
    sensitivity: internal
    collector: sockets
    subject_kind: port
  - key: processes.list
    type: list<record>
    description: "Every process /proc lists, one row per pid sorted by pid, with pid, ppid, uid (the real uid), name, cmd (the first NUL-separated token of the command line, from at most 4 KiB), exe (the exe link's text without proc(5)'s \" (deleted)\" suffix), exe_deleted (the link carried it: the executable was unlinked or replaced after it started - an upgraded daemon not yet restarted, a binary removed from disk, or a memfd: executable, the suspicious case), exe_read_status (ok, denied or error; empty on a kernel thread or a zombie), kind (kernel: the Kthread flag, or pid 2 or a child of pid 2 where the kernel does not print it; zombie: state Z; user otherwise), mnt_ns (host when the ns/mnt link equals pid 1's, or when the process's root link is / and the mount its exe lies on names the same file pid 1 sees at that path - the device, the path within it, the type and the source of the longest mount point prefixing exe, as a systemd service with PrivateTmp= or ProtectSystem= sees it; foreign otherwise - a container, a bind or extension image over /usr or the exe, or a process with another root seen from the host; empty when it was not read, or when the root link or a mountinfo it needs could not be read, which is the row's ns_read_status), ns_read_status (ok, denied or error; empty on a kernel thread or a zombie), package and package_status (for a user process whose exe and namespace were read: snap with package snap:<name> for an exe under /snap/<name>/<rev>/ in any namespace, then foreign_ns for a foreign process - never looked up, the path is in another root - then flatpak, appimage, packaged with the owning package, unpackaged, or no_index when the package index could not be built; empty otherwise). An executable whose file name itself ends in \" (deleted)\" cannot be told apart from a deleted one. A process that exits between the listing and the read leaves no row. Capped at 4096 rows; truncated also when the 5-second enumeration budget ran out."
    since: 1
    sensitivity: internal
    collector: processes
  - key: processes.deleted_executables
    type: list<record>
    description: "The judged subset of processes.list: the user processes whose executable was deleted or replaced since it started, sorted by pid, with pid, uid, name and exe. The status of the read when any status file or any user process's exe could not be read (denied in a non-root run), never the readable subset; never absent. Truncated when the enumeration budget ran out."
    since: 1
    sensitivity: internal
    collector: processes
  - key: processes.listeners
    type: list<record>
    description: "Every listening socket of the kernel's tcp, tcp6, udp and udp6 tables, sorted by proto, port and addr, with proto (tcp or udp), family (v4 or v6, from the table), addr, port, loopback, link_local, inode, owner_status, owners (the processes whose fd table holds the socket, sorted by pid and capped at 64, each with pid, uid, name, exe, exe_deleted, mnt_ns, package and package_status) and owners_count (how many hold it, before the cap). owner_status is ok; kernel when no process holds the socket, every fd table was read whole, the run sees pid 1 (its ns/mnt and mountinfo read) and at least one kernel thread, and the run is not inside a container (a kernel-owned socket carries a real inode no fd table names - measured for WireGuard, whose udp and udp6 listen sockets print non-zero inodes; nfsd was not measured; inode 0 reads the same; owners empty); denied when an fd table could not be read; unmatched when no process holds it and a table failed otherwise, the enumeration budget ran out, or the pid view may be partial - inside a container, or without pid 1 or a kernel thread in sight (hidepid, a private pid namespace) - (the leaf is then absent, naming the socket); error on a row whose inode did not parse. A zombie thread-group leader with live threads is read through its tasks' fd tables, and a socket it holds makes the leaf absent naming it: its exe and namespace cannot be read, so the owner cannot be judged. Socket inode numbers come from a 32-bit counter that can wrap on a long-lived host, which can only add a spurious owner, never hide one. The status of the read when an fd table, or the exe or ns/mnt of a process holding a socket, could not be read; error when a table row's inode did not parse, a process holds more than 65536 fds or an fd link could not be read. Capped at 2000 rows; truncated when a socket table or the package index was cut or the enumeration budget ran out."
    since: 1
    sensitivity: internal
    collector: processes
  - key: processes.unpackaged_listeners
    type: list<record>
    description: "The judged subset of processes.listeners: one row per listening socket and holding process whose package_status is unpackaged, snap, flatpak, appimage or foreign_ns (a process whose executable was deleted is processes.deleted_executables' and is not repeated), sorted as processes.listeners, with proto, family, addr, port, pid, name, exe and package_status. Carries processes.listeners' status when that is not ok, and the package index's when it could not be built (absent \"no package database\" on a host with neither dpkg nor rpm), a failure never marked truncated. Capped at 2000 rows; truncated as processes.listeners."
    since: 1
    sensitivity: internal
    collector: processes
    subject_kind: file
  - key: processes.stats
    type: record
    description: "The process collector's account of itself - count (rows read), kernel_threads, zombies, foreign_ns, denied (reads refused), vanished (processes that exited under the read), fd_reads, index_source (dpkg or rpm, or none when the host has neither or the index could not be built), index_ms and elapsed_ms; provenance, read by no control."
    since: 1
    sensitivity: internal
    collector: processes
  - key: exposure.listeners
    type: list<record>
    description: "Every listening socket not on loopback (127.0.0.0/8, ::1), sorted by proto, port and addr, with service (tcp/<port> or udp/<port> - the string an allow list names, never tcp6), proto, family (v4 or v6), addr, port, link_local (fe80::/10 or 169.254.0.0/16 - reachable by every neighbour on the link, so a candidate like any other), owner_status, owners and owners_count as in processes.listeners (a socket the kernel holds has no owner), exposed, via, rule_chain, rule_source and rule_raw. via is how the verdict was reached: no_chain_in_family (the host speaks the family - v6 when a tcp6 or udp6 table exists and disable_ipv6 is not 1 on all, default and every present interface except lo - and no input base chain of it, or of an inet table, exists while the other family has one), open_policy (restricts_inbound is false), any_port_rule (an accept with no protocol, port, interface or destination), rule (an accept of the listener's protocol whose port, range or set takes the port; rule_chain, rule_source - the rule's source address as written - and rule_raw name it), filtered (no path in), ipv6_disabled (only v6 traffic could reach the socket and IPv6 is disabled on all, default and every present interface except lo, so the kernel drops it), or undecided (the verdict could not be read; see exposure.stats). A socket on 0.0.0.0 asks the v4 rules; on :: the v6 rules and, when net.ipv6.bindv6only is 0, the v4 rules too, exposed when either lets it in; a specific address asks its own family; with IPv6 disabled the v6 rules are never asked. Rules are read from firewall.rules as classified for exposure: drop and reject rows never open a path; an accept on lo, one for established or related traffic only, one for a protocol other than tcp or udp, and log, return and followed-jump rows cannot reach a listener; any other accept the model cannot read is opaque. Rule order is ignored: an accept counts whether or not a drop precedes it. Evidence; carries the firewall read's status when it did not answer and processes.listeners' status when that is not ok. Capped at 2000 rows."
    since: 1
    sensitivity: internal
    collector: processes
  - key: exposure.exposed
    type: list<record>
    description: "The judged subset of exposure.listeners: one row per listening socket a packet from off the host can reach, with service, proto, family, addr, port, pid, name and package (the holder with the lowest pid; exposure.listeners has them all; pid -1 and empty name and package for a socket the kernel holds), via, rule_chain and rule_source. Absent when some non-loopback listener's verdict cannot be read - normalization confidence is partial (with no non-loopback listener the leaf is an empty list), or an opaque rule sits in every family that could admit the listener and none of its other families lets it in (an opaque rule blocks only the family it is in, inet blocking both) - with the cause in exposure.stats.manual_reason and the rules in exposure.opaque_rules. A host with no firewall binary reads the firewall's unsupported status, though everything is reachable; a host whose backend is configured but restricts nothing reads every listener exposed via open_policy (U-28 reads FAIL there for the same cause). The status of processes.listeners when that is not ok, of net.ipv6.bindv6only when it exists, cannot be read and a socket listens on ::, of a net.ipv6.conf disable_ipv6 file (all, default or a present interface) when it exists and cannot be read, or the conf directory cannot be listed, and a socket takes v6 traffic; error naming the firewall fact when the firewall collector did not run. Truncated when processes.listeners or firewall.rules was cut. Capped at 2000 rows."
    since: 1
    sensitivity: internal
    collector: processes
    subject_kind: port
  - key: exposure.opaque_rules
    type: list<record>
    description: "The rows of firewall.rules the exposure verdict cannot read, in rule order, with chain, via_chain, table, family, action and raw: an accept the parser left a match unmodelled on, an accept with a destination address and no port, a jump the fold could not follow, or a rule whose verdict was not read. One blocks only its own family (an inet one both): it makes exposure.exposed absent when a non-loopback listener has no other family that lets it in. Evidence. Capped at 2000 rows."
    since: 1
    sensitivity: internal
    collector: processes
  - key: exposure.stats
    type: record
    description: "The exposure verdict's account of itself - confidence (firewall.normalization_confidence), manual_reason (why exposure.exposed is absent or carries another read's status, empty when it was decided), listeners (non-loopback listening sockets), exposed, filtered (decided and not exposed, ipv6_disabled included), loopback (listening sockets left out on loopback), link_local, kernel_owned (non-loopback sockets no process holds), opaque_rules, folded_rules (the rows of firewall.rules read) and ipv6_disabled (disable_ipv6 1 on all, default and every present interface except lo); provenance, read by no control."
    since: 1
    sensitivity: internal
    collector: processes
  - key: sshd.collect_method
    type: string
    description: How sshd options were obtained - G, T or parse.
    since: 1
    sensitivity: public
    collector: sshd
  - key: sshd.personas_collected
    type: bool
    description: Whether per-persona (Match) values were collected; false means options hold global values only.
    since: 1
    sensitivity: public
    collector: sshd
  - key: sshd.options.permit_root_login
    type: setting<string>
    description: Effective PermitRootLogin value (daemon-reported versus parsed files). The pre-7.0 spelling without-password, which sshd -T and -G print for the compiled default whatever the file says, is stored as prohibit-password on every side; the other values are stored lower-cased, as sshd matches them.
    since: 1
    sensitivity: public
    collector: sshd
    default_on: effective
  - key: sshd.version
    type: string
    description: OpenSSH version reported by sshd -V (major.minor); absent when it could not be read.
    since: 1
    sensitivity: public
    collector: sshd
  - key: sshd.options.max_auth_tries
    type: setting<int>
    description: Effective MaxAuthTries (daemon-reported versus parsed files).
    since: 1
    sensitivity: public
    collector: sshd
    default_on: effective
  - key: sshd.options.client_alive_interval
    type: setting<int>
    description: Effective ClientAliveInterval in seconds (daemon-reported versus parsed files); 0 disables the keepalive.
    since: 1
    sensitivity: public
    collector: sshd
    default_on: effective
  - key: sshd.options.client_alive_count_max
    type: setting<int>
    description: Effective ClientAliveCountMax (daemon-reported versus parsed files).
    since: 1
    sensitivity: public
    collector: sshd
    default_on: effective
  - key: sshd.options.banner
    type: setting<string>
    description: Effective Banner path, or none for sshd's default of no pre-auth banner.
    since: 1
    sensitivity: public
    collector: sshd
    default_on: effective
  - key: sshd.include_sources
    type: list<record>
    description: Every Include the sshd_config parse followed, in expansion order - path, line, depth.
    since: 1
    sensitivity: public
    collector: sshd
  - key: sshd.banner_file.exists
    type: bool
    description: Whether the file named by sshd's Banner exists; false when Banner is none.
    since: 1
    sensitivity: public
    collector: sshd
  - key: sshd.banner_file.nonempty
    type: bool
    description: Whether the file named by sshd's Banner has non-whitespace content.
    since: 1
