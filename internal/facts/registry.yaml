schema_version: 1
keys:
  - key: services.ssh.installed
    type: bool
    description: An SSH server package or unit exists on the host.
    since: 1
    sensitivity: public
    collector: services
  - key: services.ssh.active
    type: bool
    description: The SSH service is running or socket-activated.
    since: 1
    sensitivity: public
    collector: services
  - key: services.ssh.unit_file_state
    type: string
    description: UnitFileState of the first present SSH unit (evidence only; "not-found" when none).
    since: 1
    sensitivity: public
    collector: services
  - key: services.ssh.enabled
    type: bool
    description: An SSH unit will start at boot or on socket activation.
    since: 1
    sensitivity: public
    collector: services
  - key: services.telnet.installed
    type: bool
    description: A telnet server package, unit or inetd entry exists on the host.
    since: 1
    sensitivity: public
    collector: services
  - key: services.telnet.active
    type: bool
    description: The telnet service is running, socket-activated or reachable on its port.
    since: 1
    sensitivity: public
    collector: services
  - key: services.telnet.unit_file_state
    type: string
    description: UnitFileState of the first present telnet unit (evidence only; "not-found" when none).
    since: 1
    sensitivity: public
    collector: services
  - key: services.telnet.enabled
    type: bool
    description: A telnet unit will start at boot or on socket activation.
    since: 1
    sensitivity: public
    collector: services
  - key: services.telnet.reachable
    type: bool
    description: A telnet server would accept a connection from off the host (active unit or listening socket unit, non-loopback).
    since: 1
    sensitivity: public
    collector: services
  - key: services.finger.installed
    type: bool
    description: A finger server package, unit or inetd entry exists on the host.
    since: 1
    sensitivity: public
    collector: services
  - key: services.finger.active
