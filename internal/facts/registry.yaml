    description: Group gid of /etc/hosts.lpd.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_lpd.group
    type: string
    description: Group name for the gid of /etc/hosts.lpd from /etc/group; empty when the gid has no name.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_lpd.group_readable
    type: bool
    description: Whether the group permission bits of /etc/hosts.lpd include read (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_lpd.group_writable
    type: bool
    description: Whether the group permission bits of /etc/hosts.lpd include write (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_lpd.other_readable
    type: bool
    description: Whether the other permission bits of /etc/hosts.lpd include read (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_lpd.other_writable
    type: bool
    description: Whether the other permission bits of /etc/hosts.lpd include write (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_lpd.acl_present
    type: bool
    description: Whether a POSIX ACL xattr is present on /etc/hosts.lpd.
    since: 1
    sensitivity: public
    collector: files
  - key: files.home_dirs
    type: list<record>
    description: One row per /etc/passwd account with its home path, interactive flag, and the home's stat status, mode, ownership match, group/other write bits and whether it sits on a remote filesystem.
    since: 1
    sensitivity: public
    collector: files
    subject_kind: user
  - key: files.env_files
    type: list<record>
    description: System-scope and per-home shell environment files that exist, with path, scope, owning account, mode, owner match, group/other write bits and whether the file is a symlink.
    since: 1
    sensitivity: public
    collector: files
  - key: files.user_rhosts
    type: list<record>
    description: .rhosts and .shosts files under interactive homes, as derived flags only - owning account match, whether a wildcard "+" entry is present and the non-comment entry count, never the file body.
    since: 1
    sensitivity: internal
    collector: files
  - key: files.root_home.mode
    type: int
    description: Permission bits of /root as an integer (e.g. 448 for 0700).
    since: 1
    sensitivity: public
    collector: files
  - key: files.root_home.uid
    type: int
    description: Owner uid of /root.
    since: 1
    sensitivity: public
    collector: files
  - key: files.root_home.gid
    type: int
    description: Group gid of /root.
    since: 1
    sensitivity: public
    collector: files
  - key: files.root_home.group_writable
    type: bool
    description: Whether the group permission bits of /root include write (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.root_home.other_writable
    type: bool
    description: Whether the other permission bits of /root include write (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.root_home.acl_present
    type: bool
    description: Whether a POSIX ACL xattr is present on /root.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_equiv.mode
    type: int
    description: Permission bits of /etc/hosts.equiv as an integer; absent when the file does not exist.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_equiv.uid
    type: int
    description: Owner uid of /etc/hosts.equiv; absent when the file does not exist.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_equiv_lines
    type: list<string>
    description: Non-comment lines of /etc/hosts.equiv; an OK empty list when the file does not exist, since a host-based trust file that is absent grants no trust.
    since: 1
    sensitivity: public
    collector: files
  - key: files.dev_entries
    type: list<record>
    description: Every node one and two levels under /dev, each with name, path, kind, serving filesystem type, mode and owner uid; bounded and marked truncated if the bound is hit.
    since: 1
    sensitivity: public
    collector: files
  - key: files.dev_nondevice
    type: list<record>
    description: The subset of /dev entries that are regular files served by the /dev mount itself (not a deeper tmpfs such as /dev/shm) - the stale or planted files U-26 flags.
    since: 1
    sensitivity: public
    collector: files
  - key: files.startup_scripts
    type: list<record>
    description: SysV init scripts and systemd unit files under the startup roots, each with path, mode, owner, group, the group/other-writable flags and is_symlink - the enabled-unit symlinks U-17 filters out.
    since: 1
    sensitivity: public
    collector: files
    subject_kind: file
  - key: files.startup_dirs
    type: list<record>
    description: The startup-script directories themselves (/etc/init.d, /etc/systemd/system, the rcN.d dirs), each with path, mode, owner, group and the group/other-writable flags.
    since: 1
    sensitivity: public
    collector: files
    subject_kind: file
  - key: files.syslog_configs
    type: list<record>
    description: The rsyslog and syslog-ng configuration files, each with path, mode, owner, group and the group/other-writable flags.
    since: 1
    sensitivity: public
    collector: files
    subject_kind: file
  - key: files.journald_configs
    type: list<record>
    description: The systemd-journald configuration files, each with path, mode, owner, group and the group/other-writable flags.
    since: 1
    sensitivity: public
    collector: files
    subject_kind: file
  - key: files.etc_inetd_conf.mode
    type: int
    description: Mode bits of /etc/inetd.conf (0o7777); absent when the file does not exist, as it does not on either stock family.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_inetd_conf.uid
    type: int
    description: Owner uid of /etc/inetd.conf; absent when the file does not exist.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_inetd_conf.group_writable
    type: bool
    description: Whether /etc/inetd.conf is group-writable; absent when the file does not exist.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_inetd_conf.other_readable
    type: bool
    description: Whether /etc/inetd.conf is world-readable; absent when the file does not exist.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_xinetd_conf.mode
    type: int
    description: Mode bits of /etc/xinetd.conf (0o7777); absent when the file does not exist.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_xinetd_conf.uid
    type: int
    description: Owner uid of /etc/xinetd.conf; absent when the file does not exist.
    since: 1
    sensitivity: public
    collector: files
  - key: files.xinetd_d
    type: list<record>
    description: The /etc/xinetd.d fragment files, each with path, mode, owner, group and the group/other-writable flags; an ok empty list when the directory holds none.
    since: 1
    sensitivity: public
    collector: files
    subject_kind: file
  - key: files.etc_sudoers.mode
    type: int
    description: Mode bits of /etc/sudoers (0o7777); absent when the file does not exist.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_sudoers.uid
    type: int
    description: Owner uid of /etc/sudoers; absent when the file does not exist.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_sudoers.gid
    type: int
    description: Owner gid of /etc/sudoers; absent when the file does not exist.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_sudoers.acl_present
    type: bool
    description: Whether /etc/sudoers carries a POSIX access ACL; denied on a non-root run, since the ACL probe needs the file open.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_sudoers_d.mode
    type: int
    description: Mode bits of the /etc/sudoers.d drop-in directory (0o7777); absent when it does not exist.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_sudoers_d.uid
    type: int
    description: Owner uid of /etc/sudoers.d; absent when the directory does not exist.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_sudoers_d.gid
    type: int
    description: Owner gid of /etc/sudoers.d; absent when the directory does not exist.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_sudoers_d.acl_present
    type: bool
    description: Whether /etc/sudoers.d carries a POSIX access ACL; denied on a non-root run, since the ACL probe needs the directory open.
    since: 1
    sensitivity: public
    collector: files
  - key: files.sudoers_d_entries
    type: list<record>
    description: The /etc/sudoers.d drop-in files, each with path, mode, owner, group, the group/other-writable flags and an ignored flag (a name ending in ~ or containing a dot, which sudo skips).
    since: 1
    sensitivity: public
    collector: files
    subject_kind: file
  - key: files.log_dirs
    type: list<record>
    description: /var/log itself and the directories one and two levels under it, each with path, mode, owner, group and the group/other-writable flags; bounded and marked truncated if the bound is hit.
    since: 1
    sensitivity: public
    collector: files
    subject_kind: file
  - key: files.log_files
    type: list<record>
    description: The non-directory entries one and two levels under /var/log, each with path, mode, owner, group and the group/other-writable flags; a symlink is is_symlink:true and an unreadable entry carries a reason. Bounded and marked truncated if the bound is hit.
    since: 1
    sensitivity: public
    collector: files
    subject_kind: file
  - key: files.etc_hosts_allow_lines
    type: list<string>
    description: Non-comment lines of /etc/hosts.allow; an OK empty list when the file does not exist.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_deny_lines
    type: list<string>
    description: Non-comment lines of /etc/hosts.deny; an OK empty list when the file does not exist.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_deny_all
    type: bool
    description: Whether /etc/hosts.deny contains an "ALL:ALL" daemon-to-client deny rule; an OK false when the file does not exist, since a host with no tcp_wrappers deny file is not restricted by it.
    since: 1
    sensitivity: public
    collector: files
  - key: sudo.installed
    type: bool
    description: Whether /etc/sudoers exists (sudo is configured on the host).
    since: 1
    sensitivity: public
    collector: files
  - key: sudo.includedir
    type: string
    description: The directory named by the @includedir/#includedir directive in /etc/sudoers; an empty string when none is present.
    since: 1
    sensitivity: public
    collector: files
  - key: sudo.secure_path
    type: string
    description: The Defaults secure_path value from /etc/sudoers (quotes and surrounding spaces stripped); an empty string when unset.
    since: 1
    sensitivity: public
    collector: files
  - key: accounts.login_defs.pass_max_days
    type: setting<int>
    description: PASS_MAX_DAYS - persisted in login.defs, effective as the maximum over existing accounts' shadow fields.
    since: 1
    sensitivity: public
    collector: accounts
    default_on: both
  - key: accounts.login_defs.pass_min_days
    type: setting<int>
    description: PASS_MIN_DAYS - persisted in login.defs, effective as the minimum over existing accounts' shadow fields.
    since: 1
    sensitivity: public
    collector: accounts
    default_on: both
  - key: accounts.login_defs.pass_min_len
    type: int
    description: PASS_MIN_LEN from login.defs (ignored by PAM when pwquality is present; stage 2 adds the pwquality side).
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.login_defs.pass_warn_age
    type: setting<int>
    description: PASS_WARN_AGE - persisted in login.defs, effective as the minimum warn field over existing accounts' shadow rows.
    since: 1
    sensitivity: public
    collector: accounts
    default_on: both
  - key: accounts.login_defs.uid_min
    type: int
    description: UID_MIN from login.defs, the lowest uid of a regular (non-system) account.
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.login_defs.sys_uid_max
    type: int
    description: SYS_UID_MAX from login.defs, the highest uid useradd assigns to a system account.
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.login_defs.sha_crypt_min_rounds
    type: int
    description: SHA_CRYPT_MIN_ROUNDS from login.defs.
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.login_defs.umask
    type: string
    description: UMASK from login.defs, verbatim (a mask, not a number).
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.login_defs.home_mode
    type: string
    description: HOME_MODE from login.defs, verbatim.
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.login_defs.encrypt_method
    type: string
    description: ENCRYPT_METHOD from login.defs, verbatim (SHA512, YESCRYPT, ...); PAM may override it.
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.login_defs.env_supath
    type: string
    description: ENV_SUPATH from login.defs, verbatim (the PATH= assignment for root logins).
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.login_defs.env_path
    type: string
    description: ENV_PATH from login.defs, verbatim (the PATH= assignment for other logins).
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.users
    type: list<record>
    description: Local accounts in /etc/passwd order with name, uid, gid, home, shell, system (0 < uid < UID_MIN, where UID_MIN is login.defs' value or 1000 when it is unset or unreadable; nobody is not a system account), shadowed (passwd field is x), uid_duplicate, name_duplicate, shell_valid (shell listed in /etc/shells) and, when /etc/shadow was read or does not exist, password_status (hashed | locked | nopass | noshadow), locked, hash_algo ("$6$"-style id, "legacy" for a hash without one, "" when there is no hash) and the ageing fields; no hashes. Ageing fields are -1 when the shadow field is empty, and uid/gid are -1 when the passwd field is unparsable.
    since: 1
    sensitivity: internal
    collector: accounts
    subject_kind: user
  - key: accounts.shells
    type: list<string>
    description: The login shells listed in /etc/shells, in file order; when the file does not exist, the libc default (/bin/sh, /bin/csh) with a reason saying so; carries the read's status when the file is unreadable.
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.parse_failures
    type: int
    description: Lines of /etc/passwd and /etc/group that could not be parsed as an account or group (too few fields, a non-numeric uid or gid); a mangled file must not read as a clean host.
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.groups
    type: list<record>
    description: Local groups in /etc/group order with name, gid, members (the listed secondary members, duplicates removed), member_count and gid_duplicate.
    since: 1
    sensitivity: internal
    collector: accounts
    subject_kind: group
  - key: accounts.orphan_gids
    type: list<record>
    description: Accounts whose primary gid names no group in /etc/group, as name and gid in /etc/passwd order; [] when every primary group exists; carries the read's status when /etc/passwd or /etc/group is unreadable.
    since: 1
    sensitivity: internal
    collector: accounts
    subject_kind: user
  - key: accounts.admin_group_members
    type: list<record>
    description: Members of the administrative groups root, wheel, sudo and admin other than the root account itself - name, group and via (primary when the account's gid is the group's, secondary when listed in /etc/group) - in /etc/group order, primary members before secondary ones.
    since: 1
    sensitivity: internal
    collector: accounts
    subject_kind: user
  - key: accounts.shadow_in_use
    type: bool
    description: Whether /etc/shadow exists and every /etc/passwd entry defers to it (password field x); a false names the first account that does not; carries the read's status when /etc/shadow or /etc/passwd is unreadable.
    since: 1
    sensitivity: internal
    collector: accounts
  - key: accounts.nss.passwd_sources
    type: list<string>
    description: The sources on the passwd line of /etc/nsswitch.conf, in order, with bracketed actions removed; absent when the file or the line is missing (glibc then resolves from files).
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.nss.group_sources
    type: list<string>
    description: The sources on the group line of /etc/nsswitch.conf, in order, with bracketed actions removed; absent when the file or the line is missing.
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.nss.remote
    type: bool
    description: "Whether the passwd or group database names a remote source in use: any source other than files, compat, systemd or db, where sss counts only when /etc/sssd/sssd.conf exists (compat's NIS + entries are not detected); account controls judged on the local files report WARN while this is true (spec section 7.3)."
    since: 1
    sensitivity: public
    collector: accounts
  - key: pam.stacks
    type: list<record>
    description: The expanded PAM stacks of login, sshd, su, sudo, passwd and other (those whose /etc/pam.d file exists) - service, type, control, module, args, path, line - with @include, include and substack spliced where they stand and authselect's symlinks resolved by name into /etc/authselect, never by following the link. Backslash line continuation and a pam.conf-only host are not handled.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.managing_layer
    type: string
    description: How the stacks are generated - authselect (a managed file is a symlink into /etc/authselect), pam-auth-update (the marker in common-auth) or manual.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.parse_complete
    type: bool
    description: Whether every include of every published service was read; a false names the first unreadable, missing, undeclared, looping or too-deep include in its reason, and every derived pam.* value then carries error instead of a number.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.pwquality.enabled
    type: bool
    description: pam_pwquality.so is stacked in passwd's password stack with a control field other than optional; a false names why. Every other pam.pwquality.* key is absent while this is false.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.pwquality.local_users_only
    type: bool
    description: The local_users_only argument or setting is present, so pwquality skips accounts that are not in /etc/passwd.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.pwquality.minlen
    type: int
    description: Effective minlen - the default 8, then pwquality.conf, then pwquality.conf.d/*.conf in name order, then the module arguments, each overriding the last.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.pwquality.minclass
    type: int
    description: Effective minclass (default 0), resolved like minlen.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.pwquality.dcredit
    type: int
    description: Effective dcredit (default 0), resolved like minlen; a negative value is a minimum count of digits.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.pwquality.ucredit
    type: int
    description: Effective ucredit (default 0), resolved like minlen.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.pwquality.lcredit
    type: int
    description: Effective lcredit (default 0), resolved like minlen.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.pwquality.ocredit
    type: int
    description: Effective ocredit (default 0), resolved like minlen.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.pwquality.required_classes
    type: int
    description: The character classes a new password must contain - the larger of minclass and the number of credits set to -1 or lower.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.pwquality.enforce_for_root
    type: bool
    description: enforce_for_root is set in a conf file or as a module argument.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.password.unix_hash
    type: string
    description: The hashing argument on pam_unix.so in passwd's password stack (md5, bigcrypt, sha256, sha512, blowfish, gost_yescrypt or yescrypt); empty when none is given and login.defs ENCRYPT_METHOD decides; absent when the stack has no pam_unix line.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.password.remember
    type: int
    description: How many previous passwords a new one is checked against - remember= on pam_pwhistory.so (argument, else pwhistory.conf, else the module default 10) or on pam_unix.so; absent when neither module sets it.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.faillock.enabled
    type: bool
    description: Every existing login-facing service (login, sshd) stacks pam_faillock.so with preauth and with authfail in its auth phase and, in its account phase, pam_faillock.so, or an authsucc line in the auth phase; a false names the first service that does not. The other pam.faillock.* keys are absent while this is false.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.faillock.deny
    type: int
    description: Effective deny - the default 3, then faillock.conf, then the preauth arguments, then the authfail arguments; 0 disables the lockout. What is published is the merge of faillock.conf, the preauth arguments and the authfail arguments, the authfail line applied last; when the two lines disagree pam.faillock.enabled says so in its reason. A conf= argument naming another file is not handled.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.faillock.unlock_time
    type: int
    description: Effective unlock_time in seconds (default 600), resolved like deny; 0 means the account stays locked until an administrator releases it.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.faillock.fail_interval
    type: int
    description: Effective fail_interval in seconds (default 900), resolved like deny.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.faillock.even_deny_root
    type: bool
    description: even_deny_root is set in faillock.conf or as a module argument (with or without a value), or root_unlock_time is set, which implies it.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.faillock.root_unlock_time
    type: int
    description: Effective root_unlock_time in seconds, resolved like deny; unlock_time when not set.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.su.wheel_required
    type: bool
    description: su's auth stack has a pam_wheel.so line whose control field is required or requisite and whose arguments do not include deny, so only the wheel group (or group=) may use su; a false names why.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.su.wheel_control
    type: string
    description: The control field of the first pam_wheel.so line in su's auth stack; absent when there is none.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.su.wheel_group
    type: string
    description: The group pam_wheel.so restricts su to - its group= argument, or wheel; absent when there is no pam_wheel line.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.su.wheel_args
    type: list<string>
    description: The arguments of that pam_wheel.so line; absent when there is none.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.umask_module.enabled
    type: bool
    description: pam_umask.so is in the session stack of login (else sshd, else other), which applies a umask where /etc/profile never runs.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.umask_module.args
    type: list<string>
    description: The arguments of the first pam_umask.so session line; absent when the module is not stacked.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.securetty_enabled
    type: bool
    description: login's auth stack has a pam_securetty.so line (any control), so /etc/securetty is consulted for root logins on a console; absent when there is no login service.
    since: 1
    sensitivity: public
    collector: pam
  - key: env.container
    type: string
    description: Container runtime detected from filesystem markers (none, docker, podman, lxc, other); the same value the run header carries.
    since: 1
    sensitivity: public
    collector: os
  - key: env.has_systemd
    type: bool
    description: Whether /run/systemd/system exists, so unit state can be asked of systemd.
    since: 1
    sensitivity: public
    collector: os
  - key: env.shell.tmout
    type: int
    description: Effective TMOUT in seconds from the system profile files; 0 when unset (bash reads 0 as no timeout).
    since: 1
    sensitivity: public
    collector: env
  - key: env.shell.tmout_exported
    type: bool
    description: Whether the winning TMOUT is exported so child login shells inherit it.
    since: 1
    sensitivity: public
    collector: env
  - key: env.shell.tmout_readonly
    type: bool
    description: Whether TMOUT is made readonly so a user cannot unset it.
    since: 1
    sensitivity: public
    collector: env
  - key: env.shell.tmout_settings
    type: list<record>
    description: Every TMOUT assignment - path, line, value, exported, readonly, conditional, scope.
    since: 1
    sensitivity: public
    collector: env
  - key: env.shell.umask_settings
    type: list<record>
    description: Every umask assignment - path, line, value, symbolic, conditional, scope.
    since: 1
    sensitivity: public
    collector: env
  - key: env.shell.root_path_raw
    type: string
    description: The winning PATH assignment for root, verbatim, with its file and line.
    since: 1
    sensitivity: public
    collector: env
  - key: env.shell.root_path_entries
    type: list<record>
    description: Each root PATH element - position, value, exists, mode, uid, gid, group_writable, world_writable, is_dot, variable, unresolved, undeclared.
    since: 1
    sensitivity: public
    collector: env
  - key: walk.world_writable
    type: list<record>
    description: World-writable files found by the deep walk, with path, sticky, uid, gid, package_declared.
    since: 1
    sensitivity: internal
    collector: walk
    subject_kind: file
  - key: walk.complete
    type: bool
    description: Whether the deep walk finished within its budget.
    since: 1
    sensitivity: public
    collector: walk
  - key: cron.files
    type: list<record>
    description: Every cron/at configuration and spool file - path, scope, user, mode, owner and the group/other-writable flags.
    since: 1
    sensitivity: public
    collector: cron
    subject_kind: file
  - key: cron.dirs
    type: list<record>
    description: The cron and at directories - path, mode, owner and the group/other-writable flags.
    since: 1
    sensitivity: public
    collector: cron
    subject_kind: file
  - key: cron.timers
    type: list<record>
    description: The systemd timer unit-file inventory - name and enablement state.
    since: 1
    sensitivity: public
    collector: cron
    subject_kind: unit
  - key: firewall.backend
    type: string
    description: The detected firewall backend (firewalld, ufw, nftables, iptables or none); unsupported/denied when the kernel ruleset could not be read.
    since: 1
    sensitivity: public
    collector: firewall
  - key: firewall.enabled
    type: setting<bool>
    description: Whether a host firewall is on - runtime from a non-empty kernel ruleset, persisted from the backend configuration on disk.
    since: 1
    sensitivity: public
    collector: firewall
    default_on: both
  - key: firewall.default_policy.input
    type: setting<string>
    description: The default policy of the INPUT hook (accept/drop) - runtime from the base-chain policy, persisted from the backend configuration.
    since: 1
    sensitivity: public
    collector: firewall
    default_on: both
  - key: firewall.default_policy.forward
    type: setting<string>
    description: The default policy of the FORWARD hook (accept/drop) - runtime from the base-chain policy, persisted from the backend configuration.
    since: 1
    sensitivity: public
    collector: firewall
    default_on: both
  - key: firewall.restricts_inbound
    type: bool
    description: Whether the ruleset restricts inbound traffic by default (derived by normalisation); absent when confidence is below full (accept-with-rules, mixed policies, a missing policy, a non-input inbound chain with rules, or a truncated dump); the unsupported/denied envelope when the ruleset could not be read.
    since: 1
    sensitivity: public
    collector: firewall
  - key: firewall.normalization_confidence
    type: string
    description: Confidence in the normalised inbound judgement - full (every input filter chain is drop/reject, or every input filter chain is accept with zero rules) or partial (everything else - accept-with-rules, mixed policies, a missing policy, a non-input inbound chain with rules, or a truncated dump); the unsupported/denied envelope when the ruleset could not be read.
    since: 1
    sensitivity: public
    collector: firewall
  - key: firewall.rules
    type: list<record>
    description: The normalised inbound-affecting rules, each with chain, action, protocol, dport (a string, since ports may be ranges or sets) and source; the unsupported/denied envelope when the ruleset could not be read.
    since: 1
    sensitivity: internal
    collector: firewall
  - key: firewall.raw_dumps
    type: list<record>
    description: The captured kernel ruleset dumps, each with source (the command), content (capped at 64 KiB) and truncated; the raw evidence the normaliser parses.
    since: 1
    sensitivity: internal
    collector: firewall
  - key: time_sync.provider
    type: string
    description: Which time-synchronisation provider is configured on disk - chrony, timesyncd, ntpd or none; chosen from the persisted configuration in the order chrony, ntpd, systemd-timesyncd, so a leftover configuration file of a removed provider still decides and should be purged. Evidence only (which daemon is running is services.ntp.active).
    since: 1
    sensitivity: public
    collector: timesync
  - key: time_sync.servers
    type: list<string>
    description: The de-duplicated, sorted time sources the provider is configured with - server/pool/peer names, chrony reference clocks as refclock:<driver>:<arg>, and (timesyncd) the lists timedatectl show-timesync reports; absent when the effective list cannot be known (timedatectl unavailable on the timesyncd branch, or a chrony sourcedir/confdir outside the collector's declaration).
    since: 1
    sensitivity: public
    collector: timesync
  - key: time_sync.server_count
    type: int
    description: How many time sources time_sync.servers holds; 0 when no provider is configured, and absent under the same conditions as time_sync.servers.
    since: 1
    sensitivity: public
    collector: timesync
  - key: time_sync.synchronized
    type: bool
    description: Whether the host's clock is currently synchronised, from timedatectl NTPSynchronized; evidence only (a freshly booted or air-gapped host is not a finding), and unsupported wherever timedatectl cannot run.
    since: 1
    sensitivity: public
    collector: timesync
  - key: logging.syslog.implementation
    type: string
    description: Which syslog implementation is configured on disk - rsyslog, syslog-ng, journald-only or none; a daemon is named only when its binary is installed as well as its configuration file, so a conffile left behind by a removed package does not decide. Evidence only (which daemon is running is services.syslog.active).
    since: 1
    sensitivity: public
    collector: logging
  - key: logging.rsyslog.rules
    type: list<record>
    description: The rsyslog routing rules in file order, one record per selected facility and action, each with facility, priority, target and target_kind (file, device, remote, user, pipe, program, module or discard; a device is a /dev/ target, which is logged but keeps nothing); absent when the host has no rsyslog configuration, and the read's status when a configuration file exists but cannot be read.
    since: 1
    sensitivity: public
    collector: logging
  - key: logging.rsyslog.parse_complete
    type: bool
    description: Whether every rsyslog configuration file the main file includes was read; false when an include could not be read or named a path outside the collector's declaration, which makes logging.rsyslog.coverage absent.
    since: 1
    sensitivity: public
    collector: logging
  - key: logging.rsyslog.unmodelled
    type: int
    description: How many rsyslog constructs this version does not model - an if/then conditional, a ruleset() or call statement (and the legacy $RuleSet/$DefaultRuleset), an action that runs only when the previous one was suspended or only every Nth message, a property filter on the facility or severity, a discard restricted to some severities, a numeric facility or priority code, a ?TemplateName dynamic file target, and an omfile or omfwd action whose argument cannot be parsed; any of them makes logging.rsyslog.coverage absent.
    since: 1
    sensitivity: public
    collector: logging
  - key: logging.rsyslog.property_filters
    type: int
    description: How many property-based filter lines the configuration carries (the leading-colon msg/syslogtag form); they add a destination for a tagged subset of messages and can never un-log a facility, so they are evidence only and leave coverage untouched; a filter on the facility or severity property is counted in logging.rsyslog.unmodelled instead, since it can.
    since: 1
    sensitivity: public
    collector: logging
  - key: logging.rsyslog.coverage
    type: list<record>
    description: Per-facility routing derived from the rules in file order, each with facility, logged, priority_floor, target, persistent and reason; persistent means the winning target is a local file path, not that the file already exists - a remote collector and a /dev/ device are logged but never persistent. Absent when the parse was incomplete, when an unmodelled construct was seen, or when the host has no rsyslog configuration.
    since: 1
    sensitivity: public
    collector: logging
    subject_kind: facility
  - key: logging.journald.storage
    type: setting<string>
    description: journald's Storage= from /etc/systemd/journald.conf (or the /usr/lib copy) merged with its drop-in directories - persisted as configured (auto when unset, journald's default), runtime as persistent or volatile from whether /var/log/journal is a directory; the read's status on both sides when a file in the chain exists but cannot be read, and unsupported on a host with no systemd.
    since: 1
    sensitivity: public
    collector: logging
    default_on: both
  - key: logging.journald.forward_to_syslog
    type: bool
    description: journald's merged ForwardToSyslog=, false when unset (journald's default); evidence only, since forwarding neither adds nor removes journal storage.
    since: 1
    sensitivity: public
    collector: logging
  - key: logging.journald.persistent
    type: bool
    description: Whether the journal survives a reboot - true when Storage is persistent, or when it is auto (the default, and what journald falls back to for a value it cannot parse) and /var/log/journal is a directory; the read's status when a configuration file in the chain exists but cannot be read, and unsupported on a host with no systemd.
    since: 1
    sensitivity: public
    collector: logging
  - key: logging.log_targets
    type: list<record>
    description: The distinct local file targets the rules name, each with path, exists, persistent, mtime_age_s and stat_status (ok, absent, denied, error or undeclared); mtime_age_s is the whole seconds between the file's modification time and the run's collected_at and is omitted when either is unknown or the file was modified after the run started, and a path outside the collector's declaration is recorded with stat_status undeclared and never stat-ed. Evidence only.
    since: 1
    sensitivity: public
    collector: logging
  - key: nfs.exports
    type: list<record>
    description: Every NFS export as {path, client, options, wildcard, root_squash} parsed from /etc/exports and /etc/exports.d/*.exports; a path with no client spec, or a bare "(options)" spec with a space before the parenthesis (exportfs's own space-sensitive trap), exports to the world (client "*", wildcard true); root_squash is derived from the absence of no_root_squash in the client's options. An export file that exists but cannot be read, and a file the read primitive cut at the size cap, both make this list carry that answer instead - the read's status or absent, naming the path in either case - because a parse of the files that happened to be readable, or of a prefix, would publish a partial export list as the whole one; nothing partial is ever published here.
    since: 1
    sensitivity: public
    collector: nfs
    subject_kind: dir
  - key: nfs.exports_source
    type: list<string>
    description: The export files actually read, in the order they were parsed.
    since: 1
    sensitivity: public
    collector: nfs
  - key: nfs.exports_runtime_collected
    type: bool
    description: Whether exportfs -v ran successfully to corroborate the parsed exports; exportfs is never the judged source, so its absence or a non-root failure is recorded as false, never an error.
    since: 1
    sensitivity: public
    collector: nfs
  - key: files.etc_exports.mode
    type: int
    description: Permission bits of /etc/exports as an integer (e.g. 384 for 0600).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_exports.uid
    type: int
    description: Owner uid of /etc/exports.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_exports.gid
    type: int
    description: Group gid of /etc/exports.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_exports.group
    type: string
    description: Group name for the gid of /etc/exports from /etc/group; empty when the gid has no name.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_exports.group_readable
    type: bool
    description: Whether the group permission bits of /etc/exports include read (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_exports.group_writable
    type: bool
    description: Whether the group permission bits of /etc/exports include write (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_exports.other_readable
    type: bool
    description: Whether the other permission bits of /etc/exports include read (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_exports.other_writable
    type: bool
    description: Whether the other permission bits of /etc/exports include write (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_exports.acl_present
    type: bool
    description: Whether a POSIX ACL xattr is present on /etc/exports.
    since: 1
    sensitivity: public
    collector: files
  - key: snmp.versions_enabled
    type: list<string>
    description: The SNMP protocol versions the configuration enables, a subset of v1, v2c and v3; a rocommunity/rwcommunity directive enables both v1 and v2c, a com2sec enables a version only once a group names that model for its security name, and v3 is enabled by the existence of any v3 user. Absent when no snmpd configuration was found, or when part of it could not be read.
    since: 1
    sensitivity: public
    collector: snmp
  - key: snmp.communities
    type: list<record>
    description: Every configured SNMP community, REDACTED to {ref, kind, is_default, length, source_restricted} - the string itself is never stored, not even hashed, since a hash of a short well-known word is trivially reversible. ref is an opaque ordinal (c1, c2, ...) in file order; kind is ro, rw, trap or proxy (a com2sec community is rw only when an access rule reachable from its security name grants a write view; trap is a trapcommunity, a community named by a trapsink, trap2sink, informsink or by a trapsess -c option, or - for a trap destination that names none and has no trapcommunity directive above it - net-snmp's compiled-in fallback, which is recorded once per such destination because the agent really does send it; proxy is the community a proxy directive forwards with, read from its -c option, with the destination host and the OID subtree never stored; trap and proxy are both outbound and carry no source); is_default says the string is one of the collector's embedded well-known defaults; length is its rune count; and source_restricted says it is bound to a source other than default or an any-address form.
    since: 1
    sensitivity: secret
    collector: snmp
  - key: snmp.v3_users
    type: list<record>
    description: The SNMPv3 users named by a createUser, rouser or rwuser directive, as {name, auth_proto, priv_proto, level} sorted by name; a usmUser line in the persistent state file is not parsed, so a user with no createUser and no rouser/rwuser is not listed. No passphrase, master key or localized key is ever stored - auth_proto and priv_proto are filled only from an allow-list of protocol names and are empty for a user whose protocols were not named. level is the level the user's key material supports, falling back to the minimum an access line demands. Absent when no snmpd configuration was found, or when part of it could not be read.
    since: 1
    sensitivity: secret
    collector: snmp
  - key: snmp.access_rules
    type: list<record>
    description: The VACM and community-mapping lines in file order as {kind, name, sec_model, sec_level, source, read_view, write_view}; kind is com2sec, group, view or access. Each kind fills the fields that carry its meaning - com2sec puts the security name in name and the address or range in source; group puts the group name in name, the model in sec_model and the security name in source; view puts the view name in name, included/excluded in sec_level and the OID subtree in source; access puts the group name in name, the context in source and the two views in read_view/write_view. A com2sec community string is never one of the fields.
    since: 1
    sensitivity: internal
    collector: snmp
  - key: snmp.agent_addresses
    type: list<string>
    description: The listen specifications of every agentaddress directive in file order, one entry per comma-separated spec.
    since: 1
    sensitivity: public
    collector: snmp
  - key: snmp.config_files
    type: list<string>
    description: The snmpd configuration files actually read, sorted; includes followed through includeFile and includeDir appear alongside the declared candidates, and each file appears exactly once however it was reached.
    since: 1
    sensitivity: public
    collector: snmp
  - key: snmp.parse_complete
    type: bool
    description: Whether every configuration file the collector was told to read could be read; false when a read failed or when an includeFile/includeDir named a target outside the collector's declaration, which is recorded and never touched. A host with no snmpd configuration at all read everything there was, so the parse is complete and the judged lists carry that story instead.
    since: 1
    sensitivity: public
    collector: snmp
  - key: patch.manager
    type: string
    description: The package manager this host is judged through - apt when the dpkg database /var/lib/dpkg/status exists, which is tested first; dnf when any of the dnf metadata cache /var/cache/dnf, /etc/dnf/dnf.conf or the rpm database directory /var/lib/rpm exists, so a host whose cache was wiped is still judged as a dnf host and reads a manual review until it has one again; otherwise unknown, in which case every other patch fact is unsupported. The Source names the artefact that actually proved the family, not a fixed path.
    since: 1
    sensitivity: public
    collector: patch
  - key: patch.metadata_age_s
    type: int
    description: Whole seconds between the newest cached package metadata (the newest apt Packages list or update-success stamp; the newest dnf repomd.xml) and the run's collected_at, so the same snapshot always renders the same age. A cache NEWER than collected_at - an index rewritten between the run's single clock reading and this stat, or a little clock skew - is a cache refreshed during the run, so the age is floored at zero and the reason says why; it is never reported as underivable, which would hide the pending security count under a not-applicable result. Absent when the host holds no metadata cache at all, and then pending_security_count is absent too; muster never refreshes the metadata itself.
    since: 1
    sensitivity: public
    collector: patch
  - key: patch.security_metadata_available
    type: bool
    description: Whether the metadata cache carries a security channel at all - an apt list file of a -security suite, or a cached repomd.xml declaring an updateinfo data section. It is decided from the cached files, never from a command's exit code, because a security query that exits cleanly with no output says the same thing whether the channel is missing or nothing is pending. A cached repomd that exists but cannot be READ carries that read's status here - denied on an unprivileged run - rather than a false, so an unreadable cache is never reported as a host with no security channel.
    since: 1
    sensitivity: public
    collector: patch
  - key: patch.pending_security_count
    type: int
    description: How many pending updates come from a security channel - counted from the origins of the cache-only apt simulation, and from the cached updateinfo on dnf. Unsupported when a cache exists but carries no security channel, never 0, which would read as nothing pending; absent when there is no metadata cache at all.
    since: 1
    sensitivity: public
    collector: patch
  - key: patch.pending_updates
    type: list<record>
    description: The upgrades the cache-only simulation reports as {name, current, candidate, origin}, sorted by name then candidate; current is empty for a package the upgrade would newly install, and origin is the suite or repository the candidate comes from. Evidence only, and never obtained by refreshing metadata.
    since: 1
    sensitivity: internal
    collector: patch
  - key: patch.reboot_required
    type: bool
    description: Whether the host is waiting for a reboot - the /run/reboot-required flag on apt hosts, needs-restarting -r on dnf hosts. Unsupported inside a container, where the kernel belongs to the host rather than to this namespace and nothing is run at all, and unsupported where needs-restarting, which the dnf-utils package ships, is not installed.
    since: 1
    sensitivity: public
    collector: patch
  - key: patch.auto_update.enabled
    type: setting<bool>
    description: Whether unattended upgrades are configured to apply updates - persisted from APT::Periodic::Unattended-Upgrade or from dnf-automatic's apply_updates. The runtime side is not probed in this version, since a timer's state belongs to the services inventory. Evidence only - a fleet may patch centrally by policy.
    since: 1
    sensitivity: public
    collector: patch
    default_on: both
  - key: patch.held_packages
    type: list<string>
    description: Packages pinned to their current version and therefore held back from an upgrade, sorted; from apt-mark showhold. Unsupported on dnf hosts, whose versionlock plugin is not probed in this version.
    since: 1
    sensitivity: public
    collector: patch
  - key: patch.days_since_last_install
    type: int
    description: Whole days between the newest package installation the dpkg log records and the run's collected_at. dpkg writes local time with no zone and collected_at is UTC, so this is a whole-day approximation that can be one day out on a host away from UTC - evidence that a host is being maintained, never a judged value. Absent when the log records no installation, and unsupported on dnf hosts, whose rpm installation times are not probed in this version.
    since: 1
    sensitivity: public
    collector: patch
  - key: packages.installed
    type: list<record>
    description: Installed packages as {name, version, arch} read from the package database (dpkg status on apt hosts, rpm -qa on dnf hosts); a version is evidence only and is never obtained by invoking a daemon.
    since: 1
    sensitivity: internal
    collector: patch
  - key: services.ftp.installed
    type: bool
    description: An FTP server unit or inetd entry exists on the host.
    since: 1
    sensitivity: public
    collector: services
  - key: services.ftp.active
    type: bool
    description: The FTP service is running, socket-activated or reachable on its port.
    since: 1
    sensitivity: public
    collector: services
  - key: services.ftp.unit_file_state
    type: string
    description: UnitFileState of the first present FTP unit (evidence only; "not-found" when none).
    since: 1
    sensitivity: public
    collector: services
  - key: services.ftp.enabled
    type: bool
    description: An FTP unit will start at boot or on socket activation.
    since: 1
    sensitivity: public
    collector: services
  - key: services.ftp.reachable
    type: bool
    description: The FTP service would accept a connection from off the host (non-loopback listener on port 21).
    since: 1
    sensitivity: public
    collector: services
  - key: services.mail.installed
    type: bool
    description: A mail transfer agent unit (postfix, sendmail or exim) exists on the host.
    since: 1
    sensitivity: public
    collector: services
  - key: services.mail.active
    type: bool
    description: The mail transfer agent is running or reachable on its port.
    since: 1
    sensitivity: public
    collector: services
  - key: services.mail.unit_file_state
    type: string
    description: UnitFileState of the first present mail unit (evidence only; "not-found" when none).
    since: 1
    sensitivity: public
    collector: services
  - key: services.mail.enabled
    type: bool
    description: A mail unit will start at boot.
    since: 1
    sensitivity: public
    collector: services
  - key: services.mail.reachable
    type: bool
    description: The mail transfer agent would accept a connection from off the host (non-loopback listener on port 25).
    since: 1
    sensitivity: public
    collector: services
  - key: services.dns.installed
    type: bool
    description: A DNS server unit (bind or unbound) exists on the host.
    since: 1
    sensitivity: public
    collector: services
  - key: services.dns.active
    type: bool
    description: The DNS server is running or reachable on its port.
    since: 1
    sensitivity: public
    collector: services
  - key: services.dns.unit_file_state
    type: string
    description: UnitFileState of the first present DNS unit (evidence only; "not-found" when none).
    since: 1
    sensitivity: public
    collector: services
  - key: services.dns.enabled
    type: bool
    description: A DNS unit will start at boot.
    since: 1
    sensitivity: public
    collector: services
  - key: services.dns.reachable
    type: bool
    description: The DNS server would accept a query from off the host (non-loopback listener on port 53).
    since: 1
    sensitivity: public
    collector: services
  - key: files.libwrap_present
    type: bool
    description: Whether the TCP wrappers library is installed, from a presence probe over the paths libwrap.so.0 lives at on the Debian and RHEL families; a symlink counts as present, so false means every candidate was absent. RHEL 8 and later ship no libwrap at all, so a daemon built against it - and a deny-all /etc/hosts.deny - restricts nothing there. Evidence for the operator and the gate stage 2M's U-28 needs before it can judge a hosts.deny; no control in this stage reads it.
    since: 1
    sensitivity: public
    collector: files
  - key: ftp.implementation
    type: string
    description: Which FTP daemon this host is configured with - vsftpd, proftpd, pure-ftpd or none. A daemon is named only when its binary is installed as well as its configuration file, so a conffile left behind by a removed package does not decide, and the reason then names that leftover. Evidence only (whether an FTP service is running is services.ftp.active).
    since: 1
    sensitivity: public
    collector: ftp
  - key: ftp.config_files
    type: list<string>
    subject_kind: file
    description: The FTP configuration files actually read, sorted; a proftpd Include the declaration covers appears alongside the main file, and each file appears once however it was reached.
    since: 1
    sensitivity: public
    collector: ftp
  - key: ftp.parse_complete
    type: bool
    description: Whether every configuration file the collector was told to read could be read in full; false when a read failed or when the read primitive cut a file at its limit. A construct outside the model is not a read failure - it counts in ftp.unmodelled instead. A host with no FTP configuration at all read everything there was, so the parse is complete and the judged leaves carry that story.
    since: 1
    sensitivity: public
    collector: ftp
  - key: ftp.unmodelled
    type: int
    description: How many constructs outside this collector's model the configuration uses - a second vsftpd instance under /etc/vsftpd, a proftpd VirtualHost, Global or IfModule section enclosing a modelled directive, or a proftpd Include outside the collector's declaration. Any of them makes every judged leaf absent, so a server whose real settings live where the model does not read is reported as unjudgeable rather than judged by settings it never uses.
    since: 1
    sensitivity: public
    collector: ftp
  - key: ftp.local_enabled
    type: bool
    description: Whether local accounts may log in over FTP - vsftpd's local_enable, whose compiled default is NO; proftpd and pure-ftpd authenticate local accounts and have no directive that turns them off wholesale, so both read true with that reason.
    since: 1
    sensitivity: public
    collector: ftp
  - key: ftp.anonymous_enabled
    type: bool
    description: Whether an anonymous login is served - vsftpd's anonymous_enable, whose COMPILED default is YES in both the Debian and the RHEL build (the Debian man page's "Default NO" is a documentation-only patch), so a file that never names it does serve anonymous logins; a proftpd Anonymous block at an attributed depth; pure-ftpd's NoAnonymous not being yes.
    since: 1
    sensitivity: public
    collector: ftp
  - key: ftp.tls_enforced
    type: bool
    description: Whether every session this daemon serves must be encrypted - vsftpd's ssl_enable with force_local_logins_ssl and force_local_data_ssl (both default YES) left on and, when anonymous logins are served, force_anon_logins_ssl and force_anon_data_ssl (both default NO) turned on; proftpd's TLSEngine on with TLSRequired on at the top level; pure-ftpd's TLS setting at 2 or higher, which refuses a cleartext session.
    since: 1
    sensitivity: public
    collector: ftp
  - key: ftp.tcp_wrappers
    type: bool
    description: Whether vsftpd consults /etc/hosts.allow and /etc/hosts.deny - the tcp_wrappers setting, whose compiled default is NO. Absent on proftpd, which wraps connections through mod_wrap2's directives, and on pure-ftpd, which has no setting of its own in this model. Whether the library is installed at all is files.libwrap_present.
    since: 1
    sensitivity: public
    collector: ftp
  - key: ftp.userlist_enable
    type: bool
    description: Whether vsftpd consults its user list at all - userlist_enable, whose compiled default is NO. Absent on proftpd and pure-ftpd, whose access list is /etc/ftpusers rather than a list of this shape.
    since: 1
    sensitivity: public
    collector: ftp
  - key: ftp.userlist_deny
    type: bool
    description: Whether vsftpd's user list is a DENY list (the compiled default YES) rather than the allow list userlist_deny=NO makes it, which refuses every account the file does not name. Absent on proftpd and pure-ftpd.
    since: 1
    sensitivity: public
    collector: ftp
  - key: ftp.userlist_file
    type: string
    description: The file vsftpd reads its user list from - the explicit userlist_file, or the build default that is actually on disk (/etc/vsftpd.user_list on the Debian build, /etc/vsftpd/user_list on the RHEL build), preferring the one that matches the layout the main configuration file proved. Absent when the setting is unset and neither default exists, and on proftpd and pure-ftpd.
    since: 1
    sensitivity: public
    collector: ftp
  - key: ftp.access_files
    type: list<record>
    subject_kind: file
    description: >-
      One row per access-control file this host's FTP configuration names, sorted by path, with
      fields path, role, exists, root_listed, mode, uid, gid and stat_status (plus reason when
      something could not be seen). role is pam_deny or pam_allow for a file named by a
      pam_listfile.so line in /etc/pam.d/<pam_service_name>, userlist_deny or userlist_allow for
      vsftpd's own user list with its sense taken from userlist_deny, and ftpusers for proftpd's
      /etc/ftpusers when UseFtpUsers is not off. The pam.d service file itself is a SOURCE, not a
      row - it is world-readable by design and is not an access list. mode is the raw 0o7777 bits
      as an int (416 for 0640) and uid/gid are ints; a row whose stat did not succeed carries -1 in
      all three, never 0. stat_status is ok, absent, denied, error or undeclared, the last meaning
      the configuration named a path outside this collector's declaration, which is recorded and
      never opened. root_listed is true when a non-comment line of the file is exactly root; it is
      false, with a reason, whenever the file could be stat-ed but not read. This list and
      ftp.access_file_present are ABSENT together whenever the SET could not be completed - a
      source outside the declaration, an unreadable or truncated pam.d service file, or a row
      whose own stat_status is undeclared, denied or error - because a partial list is not
      evidence a control may judge, however clean the rows the collector did reach. A row that
      stats but cannot be READ keeps the list ok: its permissions are known, and only
      ftp.root_denied loses its answer.
    since: 1
    sensitivity: public
    collector: ftp
  - key: ftp.access_file_present
    type: bool
    description: Whether at least one of the access-control files in ftp.access_files exists on this host. False with a reason when the configuration names none at all, which is a different finding from a list that exists and is empty. Absent, alongside ftp.access_files, whenever the set of access files could not be completed, so a blind spot never reads as an affirmative "this host has no access list".
    since: 1
    sensitivity: public
    collector: ftp
  - key: ftp.root_denied
    type: bool
    description: >-
      Whether a root login over FTP is refused. vsftpd - local_enable NO, or root named in a
      pam_deny or userlist_deny file, or an allow list (userlist_deny NO, or pam_listfile
      sense=allow) that does not name root. proftpd - RootLogin not on, whose own default is off,
      or root named in /etc/ftpusers while UseFtpUsers is on. pure-ftpd - always true, because it
      refuses every account below MinUID, which is at least 1 in every build. A pam_listfile.so
      line counts only when its control field is required or requisite (a bracketed spec writes
      its own failure handling, and optional or sufficient do not make a failure refuse the
      login), it filters on item=user, it names an explicit sense, and it carries no apply=; a
      line that fails any of those still becomes a row, because U-56 judges a list's permissions
      whatever PAM does with it, but it cannot decide this leaf. Absent when a list that would
      decide it could not be read - an undeclared path, an unreadable or truncated file, or a
      directive that cannot refuse a login by itself - with the reason naming it; DENIED rather
      than absent when the pam.d service file itself could not be read, so a reader sees a
      privilege problem and not a host without FTP access control.
    since: 1
    sensitivity: public
    collector: ftp
  - key: ftp.banner_source
    type: string
    description: What configures the greeting a client is shown before it authenticates - ftpd_banner or banner_file for vsftpd, serverident for proftpd's ServerIdent, default when nothing is configured and the daemon sends its compiled greeting, none when a daemon sends no greeting at all. Absent on pure-ftpd, whose greeting is not configurable in this version's model.
    since: 1
    sensitivity: public
    collector: ftp
  - key: ftp.banner_text
    type: string
    description: The configured greeting text - the ftpd_banner value, the content of banner_file, or the string of a proftpd ServerIdent on. A daemon's COMPILED greeting is not invented here - the source is then default and this text is empty, with the reason naming the product whose greeting is served. Absent when the configured banner file is outside this collector's declaration, could not be read, or was cut at the read limit.
    since: 1
    sensitivity: internal
    collector: ftp
  - key: ftp.banner_discloses_version
    type: bool
    description: >-
      Whether the greeting names the FTP software. True whenever the text matches vsftpd, proftpd,
      pure-ftpd or wu-ftpd, case-insensitively; a bare version number in an otherwise custom
      greeting is deliberately NOT a disclosure, since it identifies no product. An unset vsftpd
      banner and an unset or argument-less proftpd ServerIdent are true, because both compiled
      greetings name the product; ServerIdent off is false. Absent on pure-ftpd and wherever
      ftp.banner_text is absent.
    since: 1
    sensitivity: public
    collector: ftp
  - key: mail.implementation
    type: string
    description: >-
      Which mail transfer agent this host is configured with - postfix, sendmail, exim or none. An
      MTA is named only when its binary is installed as well as its configuration file, so a
      conffile left behind by a removed package does not decide, and the reason then names that
      leftover. When two of them are installed at once - which RHEL allows, postfix and sendmail
      side by side under alternatives - the fixed order postfix, sendmail, exim picks the one whose
      configuration the mail.postfix.* and mail.sendmail.* leaves describe, and the reason names
      the other; which of them actually serves port 25 is decided by the enabled unit
      (services.mail.*) and cannot be read out of the files, so mail.expn_vrfy_restricted is then
      ABSENT rather than drawn from the winner of this order.
      Evidence only (whether a mail service is running is services.mail.active).
    since: 1
    sensitivity: public
    collector: mail
  - key: mail.config_files
    type: list<string>
    subject_kind: file
    description: >-
      The mail transfer agent configuration files this collector found, sorted. For postfix and
      sendmail these are the files it read - /etc/postfix/main.cf and /etc/mail/sendmail.cf, the
      only files it opens; a path main.cf names (a lookup table, an alias database, a chroot) is
      never followed. For exim the file is listed as the evidence that named the implementation
      and is NOT parsed. A configuration file that exists but could not be read carries the read's
      own status here - denied, naming the path - rather than an empty list, which would say this
      host has no mail configuration at all.
    since: 1
    sensitivity: public
    collector: mail
  - key: mail.postfix.inet_interfaces
    type: string
    description: The inet_interfaces value of /etc/postfix/main.cf, exactly as written, with any $name reference left unexpanded because expanding it needs parameters this collector does not model. Absent, naming postfix's compiled default "all", when main.cf does not set it; absent on a sendmail or exim host, and denied when main.cf exists but could not be read.
    since: 1
    sensitivity: public
    collector: mail
  - key: mail.postfix.mynetworks
    type: string
    description: The mynetworks value of /etc/postfix/main.cf, exactly as written and unexpanded - the client networks postfix relays for without authentication. Absent when main.cf does not set it, because postfix then computes the list from the host's own interfaces and netmasks and no file states it; absent on a sendmail or exim host, and denied when main.cf could not be read.
    since: 1
    sensitivity: public
    collector: mail
  - key: mail.postfix.smtpd_relay_restrictions
    type: string
    description: The smtpd_relay_restrictions value of /etc/postfix/main.cf, exactly as written and unexpanded. Absent, naming postfix's compiled default "permit_mynetworks, permit_sasl_authenticated, defer_unauth_destination", when main.cf does not set it; absent on a sendmail or exim host, and denied when main.cf could not be read.
    since: 1
    sensitivity: public
    collector: mail
  - key: mail.postfix.smtpd_recipient_restrictions
    type: string
    description: The smtpd_recipient_restrictions value of /etc/postfix/main.cf, exactly as written and unexpanded. Absent, naming postfix's compiled default of an empty list, when main.cf does not set it; absent on a sendmail or exim host, and denied when main.cf could not be read.
    since: 1
    sensitivity: public
    collector: mail
  - key: mail.postfix.disable_vrfy_command
    type: string
    description: The disable_vrfy_command value of /etc/postfix/main.cf, as written, so a reader sees the spelling the file uses; postfix accepts yes, true, on and 1 for the affirmative, case-insensitively. Absent, naming the compiled default "no", when main.cf does not set it - the derived mail.expn_vrfy_restricted still reads that default. Absent on a sendmail or exim host, and denied when main.cf could not be read.
    since: 1
    sensitivity: public
    collector: mail
  - key: mail.postfix.authorized_submit_users
    type: string
    description: The authorized_submit_users value of /etc/postfix/main.cf, exactly as written and unexpanded - which accounts may hand a message to the sendmail-compatible submission command. Absent, naming postfix's compiled default "static:anyone", when main.cf does not set it; absent on a sendmail or exim host, and denied when main.cf could not be read. Evidence for the operator judging U-46; no automatic control reads it.
    since: 1
    sensitivity: public
    collector: mail
  - key: mail.sendmail.privacy_options
    type: list<string>
    description: >-
      The union of the flags of EVERY PrivacyOptions line of /etc/mail/sendmail.cf, lower-cased,
      deduplicated and sorted. Every spelling sendmail accepts is read: the long
      "O PrivacyOptions=" form, the "OpPrivacyOptions=" form and the bare legacy "Op" form where
      the flags follow the option letter; flags may be separated by commas or by whitespace, and a
      following line that begins with whitespace continues the value. The lines are a UNION rather
      than a last-one-wins, because sendmail's own setoption ORs each list into its privacy flags
      and never clears them. A goaway token is KEPT in the list and its expansion appended beside
      it, because which flags goaway covers depends on the sendmail release - 8.14 covers
      authwarnings, noexpn, novrfy, noverb, needmailhelo, needexpnhelo, needvrfyhelo and
      nobodyreturn - so only novrfy and noexpn, present in every version, are judged. An empty list
      means the file was read and carries no such line, which is sendmail's default "public"; that
      is a different finding from an absence. ABSENT, naming the line, when a line carries a token
      outside sendmail's own flag vocabulary - a macro reference, a typo, or a flag a later release
      added - since a set this collector knows is incomplete must not become a verdict. Absent on a
      postfix or exim host, and denied when sendmail.cf could not be read.
    since: 1
    sensitivity: public
    collector: mail
  - key: mail.expn_vrfy_restricted
    type: bool
    description: >-
      Whether the MTA refuses the SMTP VRFY and EXPN commands, which enumerate accounts and
      mailing lists to anyone who can open port 25. postfix - disable_vrfy_command is affirmative;
      postfix implements no EXPN command at all, so that one parameter settles both, and its
      compiled default no leaves VRFY answered. A per-service "-o disable_vrfy_command" override in
      master.cf is NOT modelled, so this reads main.cf's answer for every service. sendmail - both
      novrfy and noexpn are in mail.sendmail.privacy_options after a goaway is expanded and every
      PrivacyOptions line is folded in. exim - ABSENT, because exim decides both in its ACLs, which
      this collector does not model. ABSENT when more than one MTA is installed at once, naming
      both, because the configuration files cannot say which of them serves port 25. Absent on a
      host with no MTA, and denied when the configuration exists but could not be read.
    since: 1
    sensitivity: public
    collector: mail
  - key: dns.implementation
    type: string
    description: Which DNS server this host is configured with - bind, unbound or none. A server is named only when its binary is installed as well as its configuration file, so a conffile left behind by a removed package does not decide, and the reason then names that leftover. bind is recognised by /etc/bind/named.conf, /etc/named.conf or the bind-chroot copy under /var/named/chroot with /usr/sbin/named beside it; unbound by /etc/unbound/unbound.conf with /usr/sbin/unbound. unbound is a caching resolver that serves no authoritative zones, so its configuration is recorded as evidence and never parsed. Evidence only (whether a DNS service is running is services.dns.active).
    since: 1
    sensitivity: public
    collector: dns
  - key: dns.config_files
    type: list<string>
    subject_kind: file
    description: >-
      The DNS configuration files actually read, sorted, each appearing once however it was
      reached - named.conf plus every include the collector's declaration covers, which on a stock
      host is the Debian options and local fragments or the RHEL crypto-policy fragment,
      named.rfc1912.zones and named.root.key. A zone's own file is NEVER opened and never appears
      here. For unbound the file is listed as the evidence that named the implementation and is
      NOT parsed. A main configuration file that exists but could not be read carries the read's
      own status here - denied, naming the path - rather than an empty list, which would say this
      host has no DNS configuration at all; a FRAGMENT that could not be read leaves the files
      that did answer listed and shows up in dns.parse_complete instead.
    since: 1
    sensitivity: public
    collector: dns
  - key: dns.parse_complete
    type: bool
    description: >-
      Whether every configuration file the collector was told to read could be read in full; false
      when a read failed, when the read primitive cut a file at its limit, or when an include named
      a path this collector's declaration does not cover - that last one is a file the configuration
      told the collector to read and the collector did not, so what it sets is unknown either way,
      and it counts in dns.unmodelled as well. A construct outside the model is not a read failure
      and counts only in dns.unmodelled. A host with no DNS configuration at all read everything
      there was, so the parse is complete and the judged leaves carry that story.
    since: 1
    sensitivity: public
    collector: dns
  - key: dns.unmodelled
    type: int
    description: >-
      How many constructs outside this collector's model the configuration uses - a view statement,
      whose per-client zones are a configuration of their own; an address match list nested inside
      another; an address match list element naming an acl nothing in the chain defines; an include
      outside the collector's declaration. Any of them makes dns.options.allow_transfer,
      dns.options.allow_update and dns.zones absent, so a server whose real zones live where the
      model does not read is reported as unjudgeable rather than judged by the part that was read.
    since: 1
    sensitivity: public
    collector: dns
  - key: dns.options.allow_transfer
    type: string
    description: >-
      The options-level allow-transfer address match list, rendered as its elements in file order
      separated by "; " - the list every zone that does not set its own inherits. A key reference is
      rendered "key <name>" and an acl name is left as written; resolving what an acl covers is
      dns.zones' business, not this leaf's. ABSENT when options does not set it, with the reason
      naming the default it was not set against: the collector reads ID and VERSION_ID from
      /etc/os-release (falling back to /usr/lib/os-release) and knows the BIND 9.16/9.18 builds -
      ubuntu 22.04 and 24.04, debian 12, and rhel, rocky or almalinux 9.x - whose default is any;
      on any other build, or when os-release could not be read, the reason says the default depends
      on the version (any before 9.20, none from 9.20). Absent on unbound and on a host with no DNS
      server, denied when named.conf could not be read, and absent naming the limit when the
      rendered list is longer than a value may be.
    since: 1
    sensitivity: public
    collector: dns
  - key: dns.options.allow_update
    type: string
    description: The options-level allow-update address match list, rendered as its elements in file order separated by "; " - the list every zone that does not set its own inherits. ABSENT when options does not set it, because an unset allow-update is none in EVERY BIND version and no file states it. Absent on unbound and on a host with no DNS server, and denied when named.conf could not be read.
    since: 1
    sensitivity: public
    collector: dns
  - key: dns.zones
    type: list<record>
    subject_kind: zone
    description: >-
      Every zone statement of the named.conf chain, sorted by name, as records of name, type, file,
      allow_transfer, allow_update, transfer_restricted and update_restricted. type is the zone's
      own - primary, master, secondary, slave, forward, hint, stub, mirror or redirect. file is the
      path the zone names, recorded verbatim and NEVER opened: every real zone file lives outside
      this collector's declaration, and a record field is evidence for the operator rather than a
      path muster reads. allow_transfer and allow_update are the EFFECTIVE lists - the zone's own
      when it sets one, the options level's otherwise - and are left out of the record when neither
      level sets one. transfer_restricted is true when the effective list is set and contains no
      "any"; an acl name is resolved through the whole chain wherever it is defined, and a key
      reference, localhost, localnets, none and an address or prefix all restrict, while a negated
      element restricts nothing by itself. When NOTHING sets allow-transfer the build decides
      (see dns.options.allow_transfer): false on a BIND 9.16/9.18 build, and the field is LEFT OUT
      on any other build, because 9.20 turned outgoing transfers off by default and the file says
      neither. update_restricted is true when allow-update is unset - none in every version - or
      sets no "any", and true when the zone carries an update-policy, which grants named identities
      per-name updates rather than opening the zone. The WHOLE list is absent when
      dns.parse_complete is false or dns.unmodelled is above zero; it is the empty list on unbound,
      which serves no authoritative zones.
    since: 1
    sensitivity: public
    collector: dns
