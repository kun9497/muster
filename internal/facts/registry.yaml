  - key: services.syslog.enabled
    type: bool
    description: A syslog unit will start at boot.
    since: 1
    sensitivity: public
    collector: services
  - key: sockets.listening
    type: list<record>
    description: Listening TCP/UDP sockets with proto, address, port, inode, pid and executable.
    since: 1
    sensitivity: internal
    collector: sockets
    subject_kind: port
  - key: sshd.collect_method
    type: string
    description: How sshd options were obtained - G, T or parse.
    since: 1
    sensitivity: public
    collector: sshd
  - key: sshd.personas_collected
    type: bool
    description: Whether per-persona (Match) values were collected; false means options hold global values only.
    since: 1
    sensitivity: public
    collector: sshd
  - key: sshd.options.permit_root_login
    type: setting<string>
    description: Effective PermitRootLogin value (daemon-reported versus parsed files).
    since: 1
    sensitivity: public
    collector: sshd
    default_on: effective
  - key: sshd.version
    type: string
    description: OpenSSH version reported by sshd -V (major.minor); absent when it could not be read.
    since: 1
    sensitivity: public
    collector: sshd
  - key: sshd.options.max_auth_tries
    type: setting<int>
    description: Effective MaxAuthTries (daemon-reported versus parsed files).
    since: 1
    sensitivity: public
    collector: sshd
    default_on: effective
  - key: sshd.options.client_alive_interval
    type: setting<int>
    description: Effective ClientAliveInterval in seconds (daemon-reported versus parsed files); 0 disables the keepalive.
    since: 1
    sensitivity: public
    collector: sshd
    default_on: effective
  - key: sshd.options.client_alive_count_max
    type: setting<int>
    description: Effective ClientAliveCountMax (daemon-reported versus parsed files).
    since: 1
    sensitivity: public
    collector: sshd
    default_on: effective
  - key: sshd.options.banner
    type: setting<string>
    description: Effective Banner path, or none for sshd's default of no pre-auth banner.
    since: 1
    sensitivity: public
    collector: sshd
    default_on: effective
  - key: sshd.include_sources
    type: list<record>
    description: Every Include the sshd_config parse followed, in expansion order - path, line, depth.
    since: 1
    sensitivity: public
    collector: sshd
  - key: sshd.banner_file.exists
    type: bool
    description: Whether the file named by sshd's Banner exists; false when Banner is none.
    since: 1
    sensitivity: public
    collector: sshd
  - key: sshd.banner_file.nonempty
    type: bool
    description: Whether the file named by sshd's Banner has non-whitespace content.
    since: 1
    sensitivity: public
    collector: sshd
  - key: banners.issue.nonempty
    type: bool
    description: Whether /etc/issue has non-whitespace content.
    since: 1
    sensitivity: public
    collector: banners
  - key: banners.issue.os_escapes
    type: bool
    description: Whether /etc/issue announces the distribution or release (an issue escape or the distro name).
    since: 1
    sensitivity: public
    collector: banners
  - key: banners.issue.mode
    type: int
    description: Permission bits of /etc/issue; 0 when the file is absent.
    since: 1
    sensitivity: public
    collector: banners
  - key: banners.issue_net.nonempty
    type: bool
    description: Whether /etc/issue.net has non-whitespace content.
    since: 1
    sensitivity: public
    collector: banners
  - key: banners.issue_net.os_escapes
    type: bool
    description: Whether /etc/issue.net announces the distribution or release (an issue escape or the distro name).
    since: 1
    sensitivity: public
    collector: banners
  - key: banners.issue_net.mode
    type: int
    description: Permission bits of /etc/issue.net; 0 when the file is absent.
    since: 1
    sensitivity: public
    collector: banners
  - key: banners.motd.nonempty
    type: bool
    description: Whether /etc/motd has non-whitespace content.
    since: 1
    sensitivity: public
    collector: banners
  - key: banners.motd.mode
    type: int
    description: Permission bits of /etc/motd; 0 when the file is absent.
    since: 1
    sensitivity: public
    collector: banners
  - key: banners.motd_d
    type: list<record>
    description: Inventory of /etc/update-motd.d entries - name and whether each is executable.
    since: 1
    sensitivity: public
    collector: banners
  - key: banners.dynamic_motd
    type: bool
    description: Whether /etc/update-motd.d holds at least one executable script.
    since: 1
    sensitivity: public
    collector: banners
  - key: files.etc_securetty
    type: record
    description: Presence and permission facts of /etc/securetty (absent on RHEL 8+ and Debian-family).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_securetty_lines
    type: list<string>
    description: Non-comment lines of /etc/securetty. A sibling leaf, not a member of files.etc_securetty, because every leaf under facts is an envelope of its own.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.mode
    type: int
    description: Permission bits of /etc/passwd as an integer (e.g. 420 for 0644).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.uid
    type: int
    description: Owner uid of /etc/passwd.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.gid
    type: int
    description: Group gid of /etc/passwd.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.acl_present
    type: bool
    description: Whether a POSIX ACL xattr is present on /etc/passwd.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.group
    type: string
    description: Group name for the gid of /etc/passwd from /etc/group; empty when the gid has no name.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.group_readable
    type: bool
    description: Whether the group permission bits of /etc/passwd include read (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.group_writable
    type: bool
    description: Whether the group permission bits of /etc/passwd include write (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.other_readable
    type: bool
    description: Whether the other permission bits of /etc/passwd include read (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.other_writable
    type: bool
    description: Whether the other permission bits of /etc/passwd include write (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.acl_entries
    type: list<string>
    description: Access ACL entries of /etc/passwd in setfacl form with numeric ids (user::rw-, user:1000:rw-, group::r--, mask::rw-, other::r--); empty when no ACL is set.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_shadow.mode
    type: int
    description: Permission bits of /etc/shadow as an integer (e.g. 256 for 0400).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_shadow.uid
