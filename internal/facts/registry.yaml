schema_version: 1
keys:
  - key: services.ssh.installed
    type: bool
    description: An SSH server package or unit exists on the host.
    since: 1
    sensitivity: public
    collector: services
  - key: services.ssh.active
    type: bool
    description: The SSH service is running or socket-activated.
    since: 1
    sensitivity: public
    collector: services
  - key: services.telnet.installed
    type: bool
    description: A telnet server package, unit or inetd entry exists on the host.
    since: 1
    sensitivity: public
    collector: services
  - key: services.telnet.reachable
    type: bool
    description: A telnet server would accept a connection from off the host (active unit or listening socket unit, non-loopback).
    since: 1
    sensitivity: public
    collector: services
  - key: sockets.listening
    type: list<record>
    description: Listening TCP/UDP sockets with proto, address, port, inode, pid and executable.
    since: 1
    sensitivity: internal
    collector: sockets
    subject_kind: port
  - key: sshd.collect_method
    type: string
    description: How sshd options were obtained - G, T or parse.
    since: 1
    sensitivity: public
    collector: sshd
  - key: sshd.personas_collected
    type: bool
    description: Whether per-persona (Match) values were collected; false means options hold global values only.
    since: 1
    sensitivity: public
    collector: sshd
  - key: sshd.options.permit_root_login
    type: setting<string>
    description: Effective PermitRootLogin value (daemon-reported versus parsed files).
    since: 1
    sensitivity: public
    collector: sshd
    default_on: effective
  - key: files.etc_securetty
    type: record
    description: Presence and permission facts of /etc/securetty (absent on RHEL 8+ and Debian-family).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_securetty_lines
    type: list<string>
    description: Non-comment lines of /etc/securetty. A sibling leaf, not a member of files.etc_securetty, because every leaf under facts is an envelope of its own.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.mode
    type: int
    description: Permission bits of /etc/passwd as an integer (e.g. 420 for 0644).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.uid
    type: int
    description: Owner uid of /etc/passwd.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.gid
    type: int
    description: Group gid of /etc/passwd.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.acl_present
    type: bool
    description: Whether a POSIX ACL xattr is present on /etc/passwd.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.group
    type: string
    description: Group name for the gid of /etc/passwd from /etc/group; empty when the gid has no name.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.group_readable
    type: bool
    description: Whether the group permission bits of /etc/passwd include read (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.group_writable
    type: bool
    description: Whether the group permission bits of /etc/passwd include write (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.other_readable
    type: bool
    description: Whether the other permission bits of /etc/passwd include read (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.other_writable
    type: bool
    description: Whether the other permission bits of /etc/passwd include write (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_passwd.acl_entries
    type: list<string>
    description: Access ACL entries of /etc/passwd in setfacl form with numeric ids (user::rw-, user:1000:rw-, group::r--, mask::rw-, other::r--); empty when no ACL is set.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_shadow.mode
    type: int
    description: Permission bits of /etc/shadow as an integer (e.g. 256 for 0400).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_shadow.uid
    type: int
    description: Owner uid of /etc/shadow.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_shadow.gid
    type: int
    description: Group gid of /etc/shadow.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_shadow.group
    type: string
    description: Group name for the gid of /etc/shadow from /etc/group; empty when the gid has no name.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_shadow.group_readable
    type: bool
    description: Whether the group permission bits of /etc/shadow include read (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_shadow.group_writable
    type: bool
    description: Whether the group permission bits of /etc/shadow include write (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_shadow.other_readable
    type: bool
    description: Whether the other permission bits of /etc/shadow include read (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_shadow.other_writable
    type: bool
    description: Whether the other permission bits of /etc/shadow include write (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_shadow.acl_present
    type: bool
    description: Whether a POSIX ACL xattr is present on /etc/shadow.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_shadow.acl_entries
    type: list<string>
    description: Access ACL entries of /etc/shadow in setfacl form with numeric ids (user::rw-, user:1000:rw-, group::r--, mask::rw-, other::r--); empty when no ACL is set.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts.mode
    type: int
    description: Permission bits of /etc/hosts as an integer (e.g. 384 for 0600).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts.uid
    type: int
    description: Owner uid of /etc/hosts.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts.gid
    type: int
    description: Group gid of /etc/hosts.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts.group
    type: string
    description: Group name for the gid of /etc/hosts from /etc/group; empty when the gid has no name.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts.group_readable
    type: bool
    description: Whether the group permission bits of /etc/hosts include read (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts.group_writable
    type: bool
    description: Whether the group permission bits of /etc/hosts include write (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts.other_readable
    type: bool
    description: Whether the other permission bits of /etc/hosts include read (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts.other_writable
    type: bool
    description: Whether the other permission bits of /etc/hosts include write (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts.acl_present
    type: bool
    description: Whether a POSIX ACL xattr is present on /etc/hosts.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_services.mode
    type: int
    description: Permission bits of /etc/services as an integer (e.g. 384 for 0600).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_services.uid
    type: int
    description: Owner uid of /etc/services.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_services.gid
    type: int
    description: Group gid of /etc/services.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_services.group
    type: string
    description: Group name for the gid of /etc/services from /etc/group; empty when the gid has no name.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_services.group_readable
    type: bool
    description: Whether the group permission bits of /etc/services include read (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_services.group_writable
    type: bool
    description: Whether the group permission bits of /etc/services include write (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_services.other_readable
    type: bool
    description: Whether the other permission bits of /etc/services include read (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_services.other_writable
    type: bool
    description: Whether the other permission bits of /etc/services include write (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_services.acl_present
    type: bool
    description: Whether a POSIX ACL xattr is present on /etc/services.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_lpd.mode
    type: int
    description: Permission bits of /etc/hosts.lpd as an integer (e.g. 384 for 0600).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_lpd.uid
    type: int
    description: Owner uid of /etc/hosts.lpd.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_lpd.gid
    type: int
    description: Group gid of /etc/hosts.lpd.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_lpd.group
    type: string
    description: Group name for the gid of /etc/hosts.lpd from /etc/group; empty when the gid has no name.
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_lpd.group_readable
    type: bool
    description: Whether the group permission bits of /etc/hosts.lpd include read (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_lpd.group_writable
    type: bool
    description: Whether the group permission bits of /etc/hosts.lpd include write (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_lpd.other_readable
    type: bool
    description: Whether the other permission bits of /etc/hosts.lpd include read (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_lpd.other_writable
    type: bool
    description: Whether the other permission bits of /etc/hosts.lpd include write (derived from mode).
    since: 1
    sensitivity: public
    collector: files
  - key: files.etc_hosts_lpd.acl_present
    type: bool
    description: Whether a POSIX ACL xattr is present on /etc/hosts.lpd.
    since: 1
    sensitivity: public
    collector: files
  - key: accounts.login_defs.pass_max_days
    type: setting<int>
    description: PASS_MAX_DAYS - persisted in login.defs, effective as the maximum over existing accounts' shadow fields.
    since: 1
    sensitivity: public
    collector: accounts
    default_on: both
  - key: accounts.login_defs.pass_min_days
    type: setting<int>
    description: PASS_MIN_DAYS - persisted in login.defs, effective as the minimum over existing accounts' shadow fields.
    since: 1
    sensitivity: public
    collector: accounts
    default_on: both
  - key: accounts.login_defs.pass_min_len
    type: int
    description: PASS_MIN_LEN from login.defs (ignored by PAM when pwquality is present; stage 2 adds the pwquality side).
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.login_defs.pass_warn_age
    type: setting<int>
    description: PASS_WARN_AGE - persisted in login.defs, effective as the minimum warn field over existing accounts' shadow rows.
    since: 1
    sensitivity: public
    collector: accounts
    default_on: both
  - key: accounts.login_defs.uid_min
    type: int
    description: UID_MIN from login.defs, the lowest uid of a regular (non-system) account.
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.login_defs.sys_uid_max
    type: int
    description: SYS_UID_MAX from login.defs, the highest uid useradd assigns to a system account.
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.login_defs.sha_crypt_min_rounds
    type: int
    description: SHA_CRYPT_MIN_ROUNDS from login.defs.
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.login_defs.umask
    type: string
    description: UMASK from login.defs, verbatim (a mask, not a number).
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.login_defs.home_mode
    type: string
    description: HOME_MODE from login.defs, verbatim.
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.login_defs.encrypt_method
    type: string
    description: ENCRYPT_METHOD from login.defs, verbatim (SHA512, YESCRYPT, ...); PAM may override it.
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.login_defs.env_supath
    type: string
    description: ENV_SUPATH from login.defs, verbatim (the PATH= assignment for root logins).
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.login_defs.env_path
    type: string
    description: ENV_PATH from login.defs, verbatim (the PATH= assignment for other logins).
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.users
    type: list<record>
    description: Local accounts in /etc/passwd order with name, uid, gid, home, shell, system (0 < uid < UID_MIN, where UID_MIN is login.defs' value or 1000 when it is unset or unreadable; nobody is not a system account), shadowed (passwd field is x), uid_duplicate, name_duplicate, shell_valid (shell listed in /etc/shells) and, when /etc/shadow was read or does not exist, password_status (hashed | locked | nopass | noshadow), locked, hash_algo ("$6$"-style id, "legacy" for a hash without one, "" when there is no hash) and the ageing fields; no hashes. Ageing fields are -1 when the shadow field is empty, and uid/gid are -1 when the passwd field is unparsable.
    since: 1
    sensitivity: internal
    collector: accounts
    subject_kind: user
  - key: accounts.shells
    type: list<string>
    description: The login shells listed in /etc/shells, in file order; when the file does not exist, the libc default (/bin/sh, /bin/csh) with a reason saying so; carries the read's status when the file is unreadable.
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.parse_failures
    type: int
    description: Lines of /etc/passwd and /etc/group that could not be parsed as an account or group (too few fields, a non-numeric uid or gid); a mangled file must not read as a clean host.
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.groups
    type: list<record>
    description: Local groups in /etc/group order with name, gid, members (the listed secondary members, duplicates removed), member_count and gid_duplicate.
    since: 1
    sensitivity: internal
    collector: accounts
    subject_kind: group
  - key: accounts.orphan_gids
    type: list<record>
    description: Accounts whose primary gid names no group in /etc/group, as name and gid in /etc/passwd order; [] when every primary group exists; carries the read's status when /etc/passwd or /etc/group is unreadable.
    since: 1
    sensitivity: internal
    collector: accounts
    subject_kind: user
  - key: accounts.admin_group_members
    type: list<record>
    description: Members of the administrative groups root, wheel, sudo and admin other than the root account itself - name, group and via (primary when the account's gid is the group's, secondary when listed in /etc/group) - in /etc/group order, primary members before secondary ones.
    since: 1
    sensitivity: internal
    collector: accounts
    subject_kind: user
  - key: accounts.shadow_in_use
    type: bool
    description: Whether /etc/shadow exists and every /etc/passwd entry defers to it (password field x); a false names the first account that does not; carries the read's status when /etc/shadow or /etc/passwd is unreadable.
    since: 1
    sensitivity: internal
    collector: accounts
  - key: accounts.nss.passwd_sources
    type: list<string>
    description: The sources on the passwd line of /etc/nsswitch.conf, in order, with bracketed actions removed; absent when the file or the line is missing (glibc then resolves from files).
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.nss.group_sources
    type: list<string>
    description: The sources on the group line of /etc/nsswitch.conf, in order, with bracketed actions removed; absent when the file or the line is missing.
    since: 1
    sensitivity: public
    collector: accounts
  - key: accounts.nss.remote
    type: bool
    description: "Whether the passwd or group database names a remote source in use: any source other than files, compat, systemd or db, where sss counts only when /etc/sssd/sssd.conf exists (compat's NIS + entries are not detected); account controls judged on the local files report WARN while this is true (spec section 7.3)."
    since: 1
    sensitivity: public
    collector: accounts
  - key: pam.stacks
    type: list<record>
    description: The expanded PAM stacks of login, sshd, su, sudo, passwd and other (those whose /etc/pam.d file exists) - service, type, control, module, args, path, line - with @include, include and substack spliced where they stand and authselect's symlinks resolved by name into /etc/authselect, never by following the link. Backslash line continuation, a # that starts a later token, and a pam.conf-only host are not handled.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.managing_layer
    type: string
    description: How the stacks are generated - authselect (a managed file is a symlink into /etc/authselect), pam-auth-update (the marker in common-auth) or manual.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.parse_complete
    type: bool
    description: Whether every include of every published service was read; a false names the first unreadable, missing, undeclared, looping or too-deep include in its reason, and every derived pam.* value then carries error instead of a number.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.pwquality.enabled
    type: bool
    description: pam_pwquality.so is stacked in passwd's password stack with a control field other than optional; a false names why. Every other pam.pwquality.* key is absent while this is false.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.pwquality.local_users_only
    type: bool
    description: The local_users_only argument or setting is present, so pwquality skips accounts that are not in /etc/passwd.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.pwquality.minlen
    type: int
    description: Effective minlen - the default 8, then pwquality.conf, then pwquality.conf.d/*.conf in name order, then the module arguments, each overriding the last.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.pwquality.minclass
    type: int
    description: Effective minclass (default 0), resolved like minlen.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.pwquality.dcredit
    type: int
    description: Effective dcredit (default 0), resolved like minlen; a negative value is a minimum count of digits.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.pwquality.ucredit
    type: int
    description: Effective ucredit (default 0), resolved like minlen.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.pwquality.lcredit
    type: int
    description: Effective lcredit (default 0), resolved like minlen.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.pwquality.ocredit
    type: int
    description: Effective ocredit (default 0), resolved like minlen.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.pwquality.required_classes
    type: int
    description: The character classes a new password must contain - the larger of minclass and the number of credits set to -1 or lower.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.pwquality.enforce_for_root
    type: bool
    description: enforce_for_root is set in a conf file or as a module argument.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.password.unix_hash
    type: string
    description: The hashing argument on pam_unix.so in passwd's password stack (md5, bigcrypt, sha256, sha512, blowfish, gost_yescrypt or yescrypt); empty when none is given and login.defs ENCRYPT_METHOD decides; absent when the stack has no pam_unix line.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.password.remember
    type: int
    description: How many previous passwords a new one is checked against - remember= on pam_pwhistory.so (argument, else pwhistory.conf, else the module default 10) or on pam_unix.so; absent when neither module sets it.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.faillock.enabled
    type: bool
    description: Every existing login-facing service (login, sshd) stacks pam_faillock.so with preauth and with authfail in its auth phase and, in its account phase, pam_faillock.so, or an authsucc line in the auth phase; a false names the first service that does not. The other pam.faillock.* keys are absent while this is false.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.faillock.deny
    type: int
    description: Effective deny - the default 3, then faillock.conf, then the preauth arguments, then the authfail arguments; 0 disables the lockout. When the preauth and authfail lines disagree, the authfail value is reported and pam.faillock.enabled says so in its reason.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.faillock.unlock_time
    type: int
    description: Effective unlock_time in seconds (default 600), resolved like deny; 0 means the account stays locked until an administrator releases it.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.faillock.fail_interval
    type: int
    description: Effective fail_interval in seconds (default 900), resolved like deny.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.faillock.even_deny_root
    type: bool
    description: even_deny_root is set in faillock.conf (any value) or as the bare module argument even_deny_root.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.faillock.root_unlock_time
    type: int
    description: Effective root_unlock_time in seconds, resolved like deny; unlock_time when not set.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.su.wheel_required
    type: bool
    description: su's auth stack has a pam_wheel.so line whose control field is required or requisite and whose arguments do not include deny, so only the wheel group (or group=) may use su; a false names why.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.su.wheel_control
    type: string
    description: The control field of the first pam_wheel.so line in su's auth stack; absent when there is none.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.su.wheel_group
    type: string
    description: The group pam_wheel.so restricts su to - its group= argument, or wheel; absent when there is no pam_wheel line.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.su.wheel_args
    type: list<string>
    description: The arguments of that pam_wheel.so line; absent when there is none.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.umask_module.enabled
    type: bool
    description: pam_umask.so is in the session stack of login (else sshd, else other), which applies a umask where /etc/profile never runs.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.umask_module.args
    type: list<string>
    description: The arguments of the first pam_umask.so session line; absent when the module is not stacked.
    since: 1
    sensitivity: public
    collector: pam
  - key: pam.securetty_enabled
    type: bool
    description: login's auth stack has a pam_securetty.so line (any control), so /etc/securetty is consulted for root logins on a console; absent when there is no login service.
    since: 1
    sensitivity: public
    collector: pam
  - key: env.container
    type: string
    description: Container runtime detected from filesystem markers (none, docker, podman, lxc, other); the same value the run header carries.
    since: 1
    sensitivity: public
    collector: os
  - key: env.has_systemd
    type: bool
    description: Whether /run/systemd/system exists, so unit state can be asked of systemd.
    since: 1
    sensitivity: public
    collector: os
  - key: walk.world_writable
    type: list<record>
    description: World-writable files found by the deep walk, with path, sticky, uid, gid, package_declared.
    since: 1
