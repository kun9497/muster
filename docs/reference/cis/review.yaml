# Candidates taken out of a CIS profile, one reason each (CB-7, CB-8).
- { profile: cis-rhel9-l1, id: muster.account.cron_permissions, reason: "the control accepts /etc/crontab at 0640 by default, a mode the mapped file_permissions_crontab rule refuses, and no selection can carry a file mode into allowed_modes (CB-8)" }
- { profile: cis-rhel9-l1, id: muster.account.password_hash_algorithm, reason: "the selections on the hashing method are words outside the conversion grammar while the control has allowed_methods and allowed_pam_hashes for that quantity, and its defaults also accept SHA-256, yescrypt, bcrypt and an absent pam_unix argument" }
- { profile: cis-rhel9-l1, id: muster.account.password_policy, reason: "min_len drives the login.defs and the pwquality length; the recommendation's rule checks pwquality alone" }
- { profile: cis-rhel9-l1, id: muster.account.root_home_and_path, reason: "the control also judges root's home directory (owned by root, neither group- nor world-writable); the reached entry's rules judge root's PATH alone, so a host whose PATH meets them and whose /root is group-writable fails" }
- { profile: cis-rhel9-l1, id: muster.account.root_remote_login, reason: "the control's default allowed list accepts PermitRootLogin prohibit-password, which the mapped sshd_disable_root_login rule refuses, and no selection carries a value into allowed" }
- { profile: cis-rhel9-l1, id: muster.account.session_timeout, reason: "the control passes on either mechanism alone (TMOUT is judged only where no ClientAliveInterval is set), so its PASS cannot stand for both the sshd and the shell-timeout recommendations it joins" }
- { profile: cis-rhel9-l1, id: muster.account.su_restricted, reason: "the control accepts any required pam_wheel line in su's auth stack, one with no group= included, and never judges the group's members, so it passes stacks the mapped use_pam_wheel_group_for_su rule refuses" }
- { profile: cis-rhel9-l1, id: muster.account.umask_policy, reason: "the control also requires pam_umask in the session stack of every login-facing service; the reached entry's rules judge the umask set in login.defs, the bash startup file and the system profile, so a host that sets 027 there without stacking pam_umask fails" }
- { profile: cis-rhel9-l1, id: muster.beyond.account_inactivity_lock, reason: "the control requires an inactivity period on every login-capable account, root and password-locked accounts included, so a stock host whose root is locked with no period fails" }
- { profile: cis-rhel9-l1, id: muster.beyond.aslr_and_link_protection, reason: "the control also requires fs.protected_symlinks and fs.protected_hardlinks to be 1 and fs.protected_fifos and fs.protected_regular to be 1 or 2, failing when a key is absent; no Level 1 entry reaches a rule on those links, so a host with address space randomization at 2 and a link protection off fails" }
- { profile: cis-rhel9-l1, id: muster.beyond.core_dump_policy, reason: "the control judges coredump.conf only when core_pattern pipes into systemd-coredump; a pipe into /bin/false or a plain pattern with a zero hard limit passes without Storage or ProcessSizeMax set, and its judged failures read WARN (automation partial)" }
- { profile: cis-rhel9-l1, id: muster.beyond.ipv6_forwarding_disabled, reason: "the selection on the forwarding quantity this control's allowed_forward carries is an option word whose value is not in the decoded source, and the parameter is not one to one with the mapped rule" }
- { profile: cis-rhel9-l1, id: muster.beyond.ipv6_router_advertisements_ignored, reason: "the selection on the accept_ra quantity this control's allowed_accept_ra carries is an option word whose value is not in the decoded source" }
- { profile: cis-rhel9-l1, id: muster.beyond.ptrace_restriction, reason: "the control also requires kernel.perf_event_paranoid to be 2 or higher; no Level 1 entry reaches a rule on that key, so a host with a restricted ptrace scope and perf_event_paranoid below 2 fails" }
- { profile: cis-rhel9-l1, id: muster.beyond.remote_log_forwarding, reason: "the control passes on rsyslog forwarding alone and judges the journal upload URL and service only when rsyslog does not forward" }
- { profile: cis-rhel9-l1, id: muster.beyond.reverse_path_filtering, reason: "the control accepts loose reverse-path filtering (rp_filter 2); the selection is an opaque word and no parameter carries the accepted set" }
- { profile: cis-rhel9-l1, id: muster.beyond.separate_partitions, reason: "the control requires /var, /var/tmp, /var/log, /var/log/audit and /home to be separate as well as /tmp; only /tmp is reached at Level 1 and no selection sets required_separate" }
- { profile: cis-rhel9-l1, id: muster.beyond.sudo_logging, reason: "the control passes on sudo's syslog logging alone and judges a sudo log file only when syslog is off" }
- { profile: cis-rhel9-l1, id: muster.beyond.sudo_nopasswd_all, reason: "the control also fails any principal allowed every command without a password, which the mapped rule does not check and only Level 2 rules reach; no selection sets the allow list" }
- { profile: cis-rhel9-l1, id: muster.beyond.uncommon_filesystems_disabled, reason: "the control also requires udf to be disabled, which only a Level 2 entry reaches; no parameter narrows its module list" }
- { profile: cis-rhel9-l1, id: muster.file.env_file_permissions, reason: "the control passes a user dotfile owned by root or readable by group and others, and examines only six shell init names; the mapped rules fail both, so a PASS here would claim more than muster checks" }
- { profile: cis-rhel9-l1, id: muster.file.home_dir_permissions, reason: "the control only forbids group and other write on interactive homes, so a group- or world-readable home (0755) passes; the mapped mode rule requires a stricter mode and the control has no parameter for it" }
- { profile: cis-rhel9-l1, id: muster.file.passwd_permissions, reason: "the control also fails a named user or group entry in the POSIX ACL of /etc/passwd; the mapped owner, group and mode rules read no ACL, so a host at 0644 root:root with a named read-only entry fails" }
- { profile: cis-rhel9-l1, id: muster.file.rhosts_forbidden, reason: "the control passes a .rhosts, .shosts or hosts.equiv file that names specific hosts and fails only a '+' wildcard; the mapped rule fails any such file" }
- { profile: cis-rhel9-l1, id: muster.file.shadow_permissions, reason: "the control accepts mode 0400 on /etc/shadow by default, while the mapped mode rule on this product accepts only 0000, and no selection carries an allowed_modes value" }
- { profile: cis-rhel9-l1, id: muster.file.suid_sgid, reason: "the control fails every setuid or setgid file no package declares, one a site has reviewed and kept included; no selection carries an exception list" }
- { profile: cis-rhel9-l1, id: muster.log.syslog_policy, reason: "the control passes a journald-only host on a persistent journal alone and judges the syslog daemon only where one is installed" }
- { profile: cis-rhel9-l1, id: muster.log.time_sync, reason: "the control requires a time-synchronisation daemon to be running; the reached entry's rule judges only chrony's configured server, so a host with chrony installed and configured but stopped fails" }
- { profile: cis-rhel9-l1, id: muster.service.nis_disabled, reason: "the control also fails an NIS client (ypbind) that is enabled or running and an nsswitch passwd or group line naming nis or nisplus; the reached entry concerns the NIS server alone, so a host with no NIS server and a leftover nis source fails" }
- { profile: cis-ubuntu2204-l1, id: muster.account.cron_permissions, reason: "the control accepts /etc/crontab at 0640 by default, a mode the mapped file_permissions_crontab rule refuses, and no selection can carry a file mode into allowed_modes (CB-8)" }
