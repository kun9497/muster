# muster's own map of its controls to ComplianceAsCode rule ids (CB-5, CB-8); every row is reviewed against the control's clauses.
- id: muster.account.cron_permissions
  rules: [file_owner_crontab, file_permissions_crontab, file_owner_cron_allow, file_permissions_cron_allow, file_owner_at_allow, file_permissions_at_allow, file_owner_at_deny, file_permissions_at_deny]
- id: muster.account.lockout_threshold
  rules: [accounts_passwords_pam_faillock_enabled, account_password_pam_faillock_password_auth, account_password_pam_faillock_system_auth, accounts_passwords_pam_faillock_deny]
  vars:
    - { var: var_accounts_passwords_pam_faillock_deny, param: max_attempts, as: int }
- id: muster.account.password_hash_algorithm
  rules: [set_password_hashing_algorithm_logindefs, set_password_hashing_algorithm_systemauth, set_password_hashing_algorithm_passwordauth]
  vars:
    - { var: var_password_hashing_algorithm, param: none, reason: "the control judges ENCRYPT_METHOD against a list of strong methods (allowed_methods); a selected method word is not a table key the conversion grammar admits" }
    - { var: var_password_hashing_algorithm_pam, param: none, reason: "the control judges pam_unix's hashing argument against a list that also admits an absent argument (allowed_pam_hashes); a selected algorithm word is not a table key the conversion grammar admits" }
- id: muster.account.password_policy
  rules: [accounts_maximum_age_login_defs, accounts_minimum_age_login_defs, accounts_password_pam_pwquality_enabled, accounts_password_pam_minlen, accounts_password_pam_minclass, accounts_password_pam_dcredit, accounts_password_pam_lcredit, accounts_password_pam_ocredit, accounts_password_pam_ucredit, accounts_password_pam_enforcing]
  vars:
    - { var: var_password_pam_minlen, param: none, reason: "min_len sets both the login.defs and the pwquality length, so it does not map one to one to a pwquality-only rule" }
    - { var: var_password_pam_minclass, param: min_classes, as: int }
    - { var: var_password_pam_dcredit, param: none, reason: "the control judges the number of character classes required, not each class credit" }
    - { var: var_password_pam_lcredit, param: none, reason: "the control judges the number of character classes required, not each class credit" }
    - { var: var_password_pam_ocredit, param: none, reason: "the control judges the number of character classes required, not each class credit" }
    - { var: var_password_pam_ucredit, param: none, reason: "the control judges the number of character classes required, not each class credit" }
    - { var: var_password_pam_enforcing, param: none, reason: "the control judges only that pwquality enforcing is not 0 and has no parameter for it" }
    - { var: var_accounts_maximum_age_login_defs, param: max_days, as: int }
  recs:
    rhel9:
      - { rec: "5.3.2.3", reason: "the control judges that pam_pwquality is stacked in the PAM password stack" }
- id: muster.account.primary_group_exists
  rules: [gid_passwd_group_same]
- id: muster.account.root_home_and_path
  rules: [root_path_no_dot]
- id: muster.account.root_only_uid_zero
  rules: [accounts_no_uid_except_zero]
- id: muster.account.root_remote_login
  rules: [sshd_disable_root_login]
- id: muster.account.session_timeout
  rules: [sshd_set_idle_timeout, sshd_set_keepalive, accounts_tmout]
  vars:
    - { var: sshd_idle_timeout_value, param: max_interval, as: { "5_minutes": 300 } }
    - { var: var_sshd_set_keepalive, param: max_count, as: int }
    - { var: var_accounts_tmout, param: max_idle, as: { "15_min": 900 } }
- id: muster.account.shadow_passwords
  rules: [accounts_password_all_shadowed, no_empty_passwords_etc_shadow]
- id: muster.account.su_restricted
  rules: [use_pam_wheel_group_for_su]
  vars:
    - { var: var_pam_wheel_group_for_su, param: none, reason: "the control judges that su's stack requires pam_wheel, whichever group the line names; it has no parameter for the group" }
- id: muster.account.system_account_shells
  rules: [no_shelllogin_for_systemaccounts]
- id: muster.account.umask_policy
  rules: [accounts_umask_etc_login_defs]
  vars:
    - { var: var_accounts_user_umask, param: acceptable, as: { "027": ["027", "077", "0027", "0077"] } }
- id: muster.account.unique_uids
  rules: [account_unique_id]
- id: muster.beyond.account_inactivity_lock
  rules: [account_disable_post_pw_expiration, accounts_set_post_pw_existing]
  vars:
    - { var: var_account_disable_post_pw_expiration, param: max_inactive_days, as: int }
- id: muster.beyond.aslr_and_link_protection
  rules: [sysctl_kernel_randomize_va_space]
- id: muster.beyond.audit_disk_actions
  rules: [auditd_data_disk_error_action, auditd_data_disk_full_action, auditd_data_retention_admin_space_left_action, auditd_data_retention_space_left_action, auditd_data_retention_max_log_file_action]
- id: muster.beyond.audit_immutable
  rules: [audit_rules_immutable]
- id: muster.beyond.audit_log_permissions
  rules: [file_permissions_var_log_audit, file_ownership_var_log_audit_stig, file_group_ownership_var_log_audit, directory_permissions_var_log_audit]
- id: muster.beyond.auditd_active
  rules: [package_audit_installed, service_auditd_enabled]
- id: muster.beyond.bootloader_config_permissions
  rules: [file_owner_grub2_cfg, file_groupowner_grub2_cfg, file_permissions_grub2_cfg]
- id: muster.beyond.bootloader_password
  rules: [grub2_password, grub2_uefi_password]
- id: muster.beyond.core_dump_policy
  rules: [coredump_disable_storage, coredump_disable_backtraces, disable_users_coredumps]
- id: muster.beyond.dev_shm_mount_options
  rules: [mount_option_dev_shm_nodev, mount_option_dev_shm_nosuid, mount_option_dev_shm_noexec]
- id: muster.beyond.file_integrity_tool
  rules: [aide_build_database, aide_periodic_checking_systemd_timer, aide_periodic_cron_checking, package_aide_installed]
- id: muster.beyond.home_mount_options
  rules: [mount_option_home_nodev, mount_option_home_nosuid]
- id: muster.beyond.icmp_broadcast_and_bogus_ignored
  rules: [sysctl_net_ipv4_icmp_echo_ignore_broadcasts, sysctl_net_ipv4_icmp_ignore_bogus_error_responses]
  vars:
    - { var: sysctl_net_ipv4_icmp_echo_ignore_broadcasts_value, param: none, reason: "the control has no parameter; it always requires icmp_echo_ignore_broadcasts to be 1" }
    - { var: sysctl_net_ipv4_icmp_ignore_bogus_error_responses_value, param: none, reason: "the control has no parameter; it always requires icmp_ignore_bogus_error_responses to be 1" }
- id: muster.beyond.icmp_redirects_ignored
  rules: [sysctl_net_ipv4_conf_all_accept_redirects, sysctl_net_ipv4_conf_all_secure_redirects, sysctl_net_ipv4_conf_all_send_redirects, sysctl_net_ipv4_conf_default_accept_redirects, sysctl_net_ipv4_conf_default_secure_redirects, sysctl_net_ipv4_conf_default_send_redirects]
  vars:
    - { var: sysctl_net_ipv4_conf_all_accept_redirects_value, param: none, reason: "the control has no parameter; it always requires the value to be 0" }
    - { var: sysctl_net_ipv4_conf_default_accept_redirects_value, param: none, reason: "the control has no parameter; it always requires the value to be 0" }
    - { var: sysctl_net_ipv4_conf_all_secure_redirects_value, param: none, reason: "the control has no parameter; it always requires the value to be 0" }
    - { var: sysctl_net_ipv4_conf_default_secure_redirects_value, param: none, reason: "the control has no parameter; it always requires the value to be 0" }
    - { var: sysctl_net_ipv6_conf_all_accept_redirects_value, param: none, reason: "the control judges only IPv4 redirect keys; IPv6 redirects are muster.beyond.ipv6_redirects_ignored's" }
    - { var: sysctl_net_ipv6_conf_default_accept_redirects_value, param: none, reason: "the control judges only IPv4 redirect keys; IPv6 redirects are muster.beyond.ipv6_redirects_ignored's" }
- id: muster.beyond.ip_forwarding_disabled
  rules: [sysctl_net_ipv4_ip_forward]
  vars:
    - { var: sysctl_net_ipv6_conf_all_forwarding_value, param: none, reason: "the control judges only IPv4 forwarding; its allowed_forward does not reach the IPv6 key, which is muster.beyond.ipv6_forwarding_disabled's" }
- id: muster.beyond.ipv6_forwarding_disabled
  rules: [sysctl_net_ipv6_conf_all_forwarding]
  vars:
    - { var: sysctl_net_ipv6_conf_all_forwarding_value, param: none, reason: "allowed_forward also drives the default.forwarding clause, which no mapped rule checks, and the selection is an option word, not a number" }
- id: muster.beyond.ipv6_redirects_ignored
  rules: [sysctl_net_ipv6_conf_all_accept_redirects, sysctl_net_ipv6_conf_default_accept_redirects]
  vars:
    - { var: sysctl_net_ipv6_conf_all_accept_redirects_value, param: none, reason: "the control has no parameter; it always requires the value to be 0" }
    - { var: sysctl_net_ipv6_conf_default_accept_redirects_value, param: none, reason: "the control has no parameter; it always requires the value to be 0" }
    - { var: sysctl_net_ipv4_conf_all_accept_redirects_value, param: none, reason: "the control judges only IPv6 redirect keys; IPv4 redirects are muster.beyond.icmp_redirects_ignored's" }
    - { var: sysctl_net_ipv4_conf_default_accept_redirects_value, param: none, reason: "the control judges only IPv6 redirect keys; IPv4 redirects are muster.beyond.icmp_redirects_ignored's" }
- id: muster.beyond.ipv6_router_advertisements_ignored
  rules: [sysctl_net_ipv6_conf_all_accept_ra, sysctl_net_ipv6_conf_default_accept_ra]
  vars:
    - { var: sysctl_net_ipv6_conf_all_accept_ra_value, param: none, reason: "the selection is an option word; allowed_accept_ra takes accept_ra numbers and no table key can spell this value" }
    - { var: sysctl_net_ipv6_conf_default_accept_ra_value, param: none, reason: "the selection is an option word; allowed_accept_ra takes accept_ra numbers and no table key can spell this value" }
- id: muster.beyond.ipv6_source_routing_rejected
  rules: [sysctl_net_ipv6_conf_all_accept_source_route, sysctl_net_ipv6_conf_default_accept_source_route]
  vars:
    - { var: sysctl_net_ipv6_conf_all_accept_source_route_value, param: none, reason: "the control has no parameter; it always requires the value to be 0" }
    - { var: sysctl_net_ipv6_conf_default_accept_source_route_value, param: none, reason: "the control has no parameter; it always requires the value to be 0" }
    - { var: sysctl_net_ipv4_conf_all_accept_source_route_value, param: none, reason: "the control judges only IPv6 source routing; IPv4 is muster.beyond.source_routing_rejected's" }
    - { var: sysctl_net_ipv4_conf_default_accept_source_route_value, param: none, reason: "the control judges only IPv6 source routing; IPv4 is muster.beyond.source_routing_rejected's" }
- id: muster.beyond.ptrace_restriction
  rules: [sysctl_kernel_yama_ptrace_scope]
  vars:
    - { var: sysctl_kernel_yama_ptrace_scope_value, param: none, reason: "the control has no parameter; it accepts a ptrace scope of 1, 2 or 3 and also judges kernel.perf_event_paranoid" }
- id: muster.beyond.remote_log_forwarding
  rules: [systemd_journal_upload_url, service_systemd-journal-upload_enabled]
  recs:
    rhel9:
      - { rec: "6.2.2.1.3", reason: "the control judges that systemd-journal-upload is enabled and active when an upload URL is configured" }
      - { rec: "6.2.3.6", reason: "the control judges that rsyslog forwards to a remote host and the syslog service is active" }
    ubuntu2404:
      - { rec: "6.1.3.6", reason: "the control judges that rsyslog forwards to a remote host and the syslog service is active" }
- id: muster.beyond.reverse_path_filtering
  rules: [sysctl_net_ipv4_conf_all_rp_filter, sysctl_net_ipv4_conf_default_rp_filter, sysctl_net_ipv4_conf_all_log_martians, sysctl_net_ipv4_conf_default_log_martians]
  vars:
    - { var: sysctl_net_ipv4_conf_all_rp_filter_value, param: none, reason: "the control has no parameter; it accepts rp_filter 1 or 2 on all" }
    - { var: sysctl_net_ipv4_conf_default_rp_filter_value, param: none, reason: "the control has no parameter; it accepts rp_filter 1 or 2 on default" }
    - { var: sysctl_net_ipv4_conf_all_log_martians_value, param: none, reason: "the control has no parameter; it requires log_martians 1 on all" }
    - { var: sysctl_net_ipv4_conf_default_log_martians_value, param: none, reason: "the control has no parameter; it requires log_martians 1 on default" }
- id: muster.beyond.separate_partitions
  rules: [partition_for_tmp, partition_for_var, partition_for_var_tmp, partition_for_var_log, partition_for_var_log_audit, partition_for_home]
- id: muster.beyond.source_routing_rejected
  rules: [sysctl_net_ipv4_conf_all_accept_source_route, sysctl_net_ipv4_conf_default_accept_source_route]
  vars:
    - { var: sysctl_net_ipv4_conf_all_accept_source_route_value, param: none, reason: "the control has no parameter; it requires accept_source_route 0 on all" }
    - { var: sysctl_net_ipv4_conf_default_accept_source_route_value, param: none, reason: "the control has no parameter; it requires accept_source_route 0 on default" }
    - { var: sysctl_net_ipv6_conf_all_accept_source_route_value, param: none, reason: "the control judges only the IPv4 keys" }
    - { var: sysctl_net_ipv6_conf_default_accept_source_route_value, param: none, reason: "the control judges only the IPv4 keys" }
- id: muster.beyond.sudo_logging
  rules: [sudo_custom_logfile]
- id: muster.beyond.sudo_nopasswd_all
  rules: [sudo_remove_no_authenticate]
- id: muster.beyond.suid_dumpable_disabled
  rules: [sysctl_fs_suid_dumpable]
- id: muster.beyond.syn_cookies_enabled
  rules: [sysctl_net_ipv4_tcp_syncookies]
  vars:
    - { var: sysctl_net_ipv4_tcp_syncookies_value, param: none, reason: "the control has no parameter; it always requires net.ipv4.tcp_syncookies to be 1" }
- id: muster.beyond.tmp_mount_options
  rules: [mount_option_tmp_nodev, mount_option_tmp_nosuid, mount_option_tmp_noexec]
- id: muster.beyond.uncommon_filesystems_disabled
  rules: [kernel_module_cramfs_disabled, kernel_module_freevxfs_disabled, kernel_module_jffs2_disabled, kernel_module_hfs_disabled, kernel_module_hfsplus_disabled, kernel_module_udf_disabled]
- id: muster.beyond.uncommon_network_protocols_disabled
  rules: [kernel_module_dccp_disabled, kernel_module_sctp_disabled, kernel_module_rds_disabled, kernel_module_tipc_disabled]
- id: muster.beyond.usb_storage_disabled
  rules: [kernel_module_usb-storage_disabled]
- id: muster.beyond.var_tmp_mount_options
  rules: [mount_option_var_tmp_nodev, mount_option_var_tmp_nosuid, mount_option_var_tmp_noexec]
- id: muster.file.env_file_permissions
  rules: [accounts_user_dot_user_ownership, file_permission_user_init_files]
  vars:
    - { var: var_user_initialization_files_regex, param: none, reason: "the control examines a fixed set of six shell init dotfiles and has no parameter for which files are examined" }
- id: muster.file.home_dir_exists
  rules: [accounts_user_interactive_home_directory_exists]
- id: muster.file.home_dir_permissions
  rules: [file_ownership_home_directories, file_permissions_home_directories]
- id: muster.file.ip_port_restriction
  rules: [nftables_ensure_default_deny_policy, set_ufw_default_rule, set_iptables_default_rule]
- id: muster.file.log_dir_permissions
  rules: [permissions_local_var_log]
- id: muster.file.passwd_permissions
  rules: [file_owner_etc_passwd, file_groupowner_etc_passwd, file_permissions_etc_passwd]
- id: muster.file.rhosts_forbidden
  rules: [no_rsh_trust_files]
  vars:
    - { var: var_user_initialization_files_regex, param: none, reason: "the control reads only the r-command trust files and has no parameter for which dotfiles are examined" }
- id: muster.file.shadow_permissions
  rules: [file_owner_etc_shadow, file_permissions_etc_shadow]
- id: muster.file.suid_sgid
  rules: [dir_perms_world_writable_sticky_bits]
  recs:
    rhel9:
      - { rec: "7.1.13", reason: "the control lists every setuid and setgid file and fails each one no package ships with that bit" }
    ubuntu2204:
      - { rec: "7.1.13", reason: "the control lists every setuid and setgid file and fails each one no package ships with that bit" }
    ubuntu2404:
      - { rec: "7.1.13", reason: "the control lists every setuid and setgid file and fails each one no package ships with that bit" }
- id: muster.file.suid_sgid_unverified
  rules: []
  recs:
    rhel9:
      - { rec: "7.1.13", reason: "the control lists, for review, each packaged setuid or setgid file whose declared mode muster could not verify" }
    ubuntu2204:
      - { rec: "7.1.13", reason: "the control lists, for review, each packaged setuid or setgid file whose declared mode muster could not verify" }
    ubuntu2404:
      - { rec: "7.1.13", reason: "the control lists, for review, each packaged setuid or setgid file whose declared mode muster could not verify" }
- id: muster.file.unowned_files
  rules: [no_files_unowned_by_user, file_permissions_ungroupowned]
- id: muster.file.world_writable
  rules: [file_permissions_unauthorized_world_writable]
- id: muster.log.syslog_policy
  rules: [service_rsyslog_enabled]
  recs:
    rhel9:
      - { rec: "6.2.3.2", reason: "the control judges that an installed rsyslog or syslog-ng daemon is running" }
      - { rec: "6.2.3.5", reason: "the control judges that the syslog rules send the security-relevant facilities to persistent local files" }
    ubuntu2404:
      - { rec: "6.1.3.5", reason: "the control judges that the syslog rules send the security-relevant facilities to persistent local files" }
- id: muster.log.time_sync
  rules: [service_chronyd_enabled, service_timesyncd_enabled, chronyd_specify_remote_server]
  vars:
    - { var: var_timesync_service, param: none, reason: "the control judges that some time-sync daemon is running, not which one" }
    - { var: var_multiple_time_servers, param: none, reason: "the control counts configured time sources and does not judge which servers they are" }
- id: muster.patch.security_updates
  rules: []
  recs:
    rhel9:
      - { rec: "1.2.2.1", reason: "the control judges that the cached package metadata lists no pending security update and is fresh enough to trust" }
    ubuntu2204:
      - { rec: "1.2.2.1", reason: "the control judges that the cached package metadata lists no pending security update and is fresh enough to trust" }
    ubuntu2404:
      - { rec: "1.2.2.1", reason: "the control judges that the cached package metadata lists no pending security update and is fresh enough to trust" }
- id: muster.service.automount_disabled
  rules: [service_autofs_disabled]
- id: muster.service.login_banner
  rules: [sshd_enable_warning_banner_net]
- id: muster.service.nfs_server_disabled
  rules: [service_nfs_disabled]
- id: muster.service.nis_disabled
  rules: [service_ypserv_disabled]
  recs:
    rhel9:
      - { rec: "2.1.10", reason: "the control judges that the NIS server and client units (ypserv, ypbind, ypxfrd, yppasswdd) are neither enabled nor active, and that nsswitch does not resolve accounts through NIS" }
- id: muster.service.rpcbind_disabled
  rules: [service_rpcbind_disabled]
- id: muster.service.snmp_disabled
  rules: [service_snmpd_disabled]
- id: muster.service.tftp_talk_disabled
  rules: [service_tftp_disabled]
