title = "muster testdata rules"

[extend]
useDefault = true

[[rules]]
id = "unix-password-hash"
description = "crypt(3) password hash committed in a fixture"
regex = '''\$(?:1|5|6|y|2[aby]?)\$[./A-Za-z0-9]{1,16}\$[./A-Za-z0-9]{20,}'''
[rules.allowlist]
regexes = [
  '''saltsalt''',
  '''hashhash''',
]

[[rules]]
id = "ssh-public-key-material"
description = "SSH public key body committed in a fixture (fingerprints are fine, bodies are not)"
regex = '''ssh-(rsa|ed25519|dss|ecdsa)\s+AAAA[0-9A-Za-z+/]{40,}'''

[[rules]]
id = "private-key-block"
description = "PEM private key block"
regex = '''-----BEGIN [A-Z ]*PRIVATE KEY-----'''

# Spec §11 asks for internal-hostname shapes alongside the key and hash
# rules. The pattern is generic: no organisation's name or domain is
# committed here, only the shape a private naming scheme takes.
[[rules]]
id = "internal-hostname-shape"
description = "an internal hostname shape (a private DNS suffix) in tracked files"
regex = '''(?i)\b[a-z0-9][a-z0-9-]*\.(?:corp|internal|intra|lan|local|priv)\b'''
[rules.allowlist]
# .superpowers/ holds the git-ignored SDD working notes for the branch in
# progress. They are never committed, so the CI scan over git history cannot
# see them; only a local --no-git scan of the working tree reaches them.
paths = ['''^\.superpowers[/\\]''']
# net-snmp's optional /etc/snmp/snmpd.local.conf is a real, public file name whose
# ".local" suffix matches the private-DNS shape above. Allow that one literal
# match only (never a path allowlist, which would weaken the lab-host guard).
regexes = ['''^snmpd\.local$''']

[[rules]]
id = "private-ipv4-address"
description = "an RFC 1918 address in tracked files (10/8, 172.16/12, 192.168/16)"
regex = '''\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3})\b'''
[rules.allowlist]
paths = ['''^\.superpowers[/\\]''']
# The three RFC 1918 block network addresses (as in "10.0.0.0/8") are
# documentation identifiers that can never name a host, so a synthetic
# firewall or TCP-wrapper fixture may spell them. The allowlist names the exact
# literal, not a path: a real host address such as 10.1.2.3 still trips the rule
# everywhere. New fixtures should prefer the RFC 5737 documentation ranges.
regexes = ['''^(?:10\.0\.0\.0|172\.16\.0\.0|192\.168\.0\.0)$''']

[[rules]]
id = "non-personal-email"
description = "an e-mail address on a non-personal domain in tracked files"
regex = '''[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.(?:com|net|org|io|co|kr)'''
[rules.allowlist]
paths = ['''go\.sum''', '''LICENSE''']
regexes = [
  '''@openssh\.com''',
  '''@libssh\.org''',
  '''noreply@anthropic\.com''',
  '''@users\.noreply\.github\.com''',
  '''@example\.(com|org|net)''',
]

# R79. gitleaks' own `generic-api-key` rule fires on the synthetic fact-key
# literal that commit 04d93f8 introduced in internal/collect/registry_test.go
# to test Builder.place's prefix-collision panic. The working tree no longer
# contains it (renamed to "prefixcollision.leaf" in 90d815d), but it stays in
# this branch's history, which is what CI's secrets job scans - so the
# allowlist names the exact literal rather than a path or a whole file.
[[rules]]
id = "generic-api-key"
description = "gitleaks' built-in generic key rule, with muster's synthetic fixtures allowed"
[rules.allowlist]
regexes = [
  # synthetic test token from 04d93f8, never a secret
  '''synthetic2\.leaf''',
]
# Parity with internal-hostname-shape and private-ipv4-address above:
# .superpowers/ holds the git-ignored SDD working notes and review diffs for
# the branch in progress. They are never committed, so the CI scan over git
# history cannot see them; only a local --no-git scan of the working tree
# reaches them, and a review diff necessarily quotes the code it reviews.
paths = ['''^\.superpowers[/\\]''']
