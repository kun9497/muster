name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          check-latest: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - name: test
        run: go test -race ./...
      - name: controls lint
        run: go run ./cmd/muster controls lint --references docs/reference
      - name: coverage table is current
        run: go run ./tools/coverage -check
      - name: build
        run: CGO_ENABLED=0 go build -trimpath ./...
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  collect-root:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
      - run: CGO_ENABLED=0 go build -trimpath -o bin/muster ./cmd/muster
      - name: list actions
        run: ./bin/muster collect --list-actions
      - name: prepare output directory
        run: mkdir -m 700 "$RUNNER_TEMP/muster"
      - name: install openssh-server
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openssh-server
      - name: collect as root
        run: |
          set +e
          # Ruling G-26: the one list, .github/walk-excludes, which
          # examples.yml's VM collect reads too.
          mapfile -t walk_excludes < <(grep -vE '^[[:space:]]*(#|$)' .github/walk-excludes)
          excludes=()
          for p in "${walk_excludes[@]}"; do excludes+=(--walk-exclude "$p"); done
          sudo ./bin/muster collect --out "$RUNNER_TEMP/muster/root.json" \
            --deep --walk-budget 15m --walk-max-entries 6000000 \
            "${excludes[@]}" \
            --require-root --require-complete
          code=$?
          set -e
          sudo chown "$(id -u)" "$RUNNER_TEMP/muster/root.json"
          jq -r '.run.partial_failures, (.run.collectors[] | select(.status != "ok") | "\(.name): \(.status) \(.reason)"), .facts.sshd.collect_method.value, .facts.sshd.options.permit_root_login.runtime.status' "$RUNNER_TEMP/muster/root.json"
          test "$code" -eq 0
      - name: what the walk did
        run: |
          # Printed before anything is asserted, so a red assertion below is
          # read next to the stop reason, the counts and the truncation flags
          # rather than guessed at from a bare exit code.
          jq '.facts.walk.stats.value' "$RUNNER_TEMP/muster/root.json"
          jq -r '.facts.walk | to_entries[] | "\(.key): status=\(.value.status) truncated=\(.value.truncated // false) length=\(if (.value.value | type) == "array" then (.value.value | length) else "-" end)"' "$RUNNER_TEMP/muster/root.json"
          # A list at its cap names its cause here, so the remedy can be an
          # exclusion or an allowlist row rather than a raised cap: the
          # runner image's own world-writable entries by top directory, and
          # every root the walk did not enter.
          mapfile -t walk_excludes < <(grep -vE '^[[:space:]]*(#|$)' .github/walk-excludes)
          prune=(-path /proc -o -path /sys -o -path /dev -o -path /run)
          for p in "${walk_excludes[@]}"; do prune+=(-o -path "$p"); done
          echo "== world-writable entries the walk could see on the runner, by top directory (find, independent of muster)"
          sudo find / -xdev \( "${prune[@]}" \) -prune -o -perm -0002 -not -type l -print 2>/dev/null | cut -d/ -f1-4 | sort | uniq -c | sort -rn | head -30
          echo "== other-writable directories without the sticky bit the walk could see, by top directory"
          sudo find / -xdev \( "${prune[@]}" \) -prune -o -type d -perm -0002 -not -perm -1000 -print 2>/dev/null | cut -d/ -f1-4 | sort | uniq -c | sort -rn | head -20
          echo "== walk.skipped"
          jq -r '.facts.walk.skipped.value[] | "\(.reason) \(.path)"' "$RUNNER_TEMP/muster/root.json" | sort | uniq -c | sort -rn | head -40
      - name: the walk finished and every list it produced is ok
        run: |
          jq -e '.facts.walk.complete.value == true' "$RUNNER_TEMP/muster/root.json"
          jq -e '[.facts.walk | to_entries[] | select(.key != "complete" and .key != "stats") | select(.value.status != "ok" or .value.truncated == true)] | length == 0' "$RUNNER_TEMP/muster/root.json"
      - name: check the root snapshot
        run: |
          sudo chown "$(id -u)" "$RUNNER_TEMP/muster/root.json"
          set +e
          ./bin/muster check --facts "$RUNNER_TEMP/muster/root.json" --format json > "$RUNNER_TEMP/muster/root-report.json"
          code=$?
          set -e
          echo "check exit $code"
          test "$code" -ne 2
          jq -e '.results | map(select(.status=="ERROR")) | length == 0' "$RUNNER_TEMP/muster/root-report.json"
          jq -e '.check.guide_edition == "kisa-unix-2026"' "$RUNNER_TEMP/muster/root-report.json"
      - name: sudo-run linux tests
        run: sudo env PATH="$PATH" GOFLAGS="$GOFLAGS" go test ./internal/collect/... ./cmd/muster/ -count=1
      # P-1: the corpus is taken BEFORE the oracle drop-in is written, so it
      # is the image's real files by construction rather than by the removal
      # step below having run -- exactly how the init-container job already
      # does it. An oracle failure used to skip the seed step with it.
      - name: seed files from the runner (artifact)
        run: |
          mkdir -p "$RUNNER_TEMP/seeds/sshd" && sudo cp /etc/ssh/sshd_config "$RUNNER_TEMP/seeds/sshd/" && sudo cp -r /etc/ssh/sshd_config.d "$RUNNER_TEMP/seeds/sshd/" 2>/dev/null || true
          cp /etc/passwd /etc/group "$RUNNER_TEMP/seeds/" && cp /proc/self/mountinfo "$RUNNER_TEMP/seeds/mountinfo"
          sudo chown -R "$(id -u)" "$RUNNER_TEMP/seeds"
      - uses: actions/upload-artifact@v4
        with: {name: seeds-runner, path: "${{ runner.temp }}/seeds"}
      - name: give the sshd oracle something to compare
        run: |
          # The stock sshd_config leaves every keyword the sshd pair compares
          # commented out, so on an untouched runner that pair would run,
          # compare nothing, and still report PASS. This drop-in sets all
          # five; the stock file's first line is
          # "Include /etc/ssh/sshd_config.d/*.conf", so the daemon and
          # parseSshdConfig both see it. The values are deliberately
          # non-default, and "without-password" is the deprecated spelling of
          # "prohibit-password", which exercises the oracle's alias map. The
          # seed corpus was taken above, before this file existed, so it keeps
          # the image's real files whatever happens here.
          printf '%s\n' \
            'PermitRootLogin without-password' \
            'MaxAuthTries 3' \
            'ClientAliveInterval 300' \
            'ClientAliveCountMax 0' \
            'Banner /etc/issue.net' \
            | sudo tee /etc/ssh/sshd_config.d/99-muster-oracle.conf >/dev/null
          # The runner installs openssh-server but never starts sshd, so its
          # privilege-separation directory does not exist and both -t and the
          # oracle's -T would exit 255 on that alone.
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -t
      - name: the parsers agree with the daemons (oracle)
        run: |
          set -o pipefail
          sudo env PATH="$PATH" GOFLAGS="$GOFLAGS" MUSTER_ORACLE=1 go test ./internal/collect/collectors/ -run Oracle -count=1 -v 2>&1 | tee "$RUNNER_TEMP/oracle.log"
          ! grep -q -- '--- SKIP' "$RUNNER_TEMP/oracle.log"
          # A pair that compared nothing is not a pair that agreed: the sshd
          # keywords are set above, so the count has to be non-zero here.
          grep -q 'oracle sshd: compared [1-9]' "$RUNNER_TEMP/oracle.log"
      - name: take the oracle drop-in back out
        # P-1: the runner is thrown away, but a step that exists to undo a
        # change must run whether or not the thing it guarded passed.
        if: always()
        run: sudo rm -f /etc/ssh/sshd_config.d/99-muster-oracle.conf

  collect-nonroot:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
      - name: install cron and sudo
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cron sudo
      - run: CGO_ENABLED=0 go build -trimpath -o bin/muster ./cmd/muster
      - name: prepare output directory
        run: mkdir -m 700 "$RUNNER_TEMP/muster"
      - name: collect without root is partial (exit 1)
        run: |
          set +e
          ./bin/muster collect --deep --out "$RUNNER_TEMP/muster/user.json"
          code=$?
          set -e
          test "$code" -eq 1
          jq -e '.run.complete == false and .run.euid != 0' "$RUNNER_TEMP/muster/user.json"
      - name: every PASS is clean and something is ERROR without root
        run: |
          set +e
          ./bin/muster check --facts "$RUNNER_TEMP/muster/user.json" --format json > "$RUNNER_TEMP/muster/user-report.json"
          code=$?
          set -e
          echo "check exit $code"
          test "$code" -eq 2
          # A PASS carries only ok evidence, except that a control with absent_means: pass
          # (its reason starts "absent counts as pass") may carry absent evidence.
          jq -e '[.results[] | select(.status=="PASS") | . as $r | .evidence[]? | select(.status != "ok" and (.status != "absent" or (($r.reason // "") | startswith("absent counts as pass") | not)))] | length == 0' "$RUNNER_TEMP/muster/user-report.json"
          jq -e '[.results[] | select(.status=="ERROR")] | length > 0' "$RUNNER_TEMP/muster/user-report.json"
      - name: the capability matrix's runner assumptions hold
        run: |
          test -d /var/spool/cron/crontabs && test -f /etc/sudoers || {
            echo "the nonroot capability matrix assumes the cron spool (/var/spool/cron/crontabs, mode 1730)"
            echo "and /etc/sudoers (mode 0440) exist on this runner; without them cron.files, cron.dirs,"
            echo "sudo.includedir and sudo.secure_path read absent instead of denied"
            exit 1
          }
          # G-4: the same argument for the four keys that rest on /etc/shadow
          # (root:shadow 0640) and /root (0700) being unreadable by the runner
          # user. This step runs as that user, so the tests answer for the run
          # the snapshot above came from.
          ! test -r /etc/shadow && ! test -r /root || {
            echo "the nonroot capability matrix assumes this user cannot read /etc/shadow or /root;"
            echo "on a runner where either is readable, accounts.shadow_in_use, files.etc_shadow.acl_present,"
            echo "files.etc_shadow.acl_entries and files.root_home.acl_present read ok instead of denied"
            exit 1
          }
      - name: every fact the capability matrix calls root-only reads denied
        run: |
          jq -e --slurpfile m docs/reference/capability-matrix.json '
            [ $m[0].nonroot.denied[] as $k
              | ($k | split(".")) as $p
              | (.facts | getpath($p) | .status)
              | select(. != "denied") ] | length == 0' "$RUNNER_TEMP/muster/user.json"

  collect-containers:
    runs-on: ubuntu-24.04
    needs: test
    continue-on-error: ${{ matrix.canary == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            init: "false"
            canary: "false"
          - image: ubuntu:24.04
            init: "false"
            canary: "false"
          - image: rockylinux/rockylinux:9-ubi-init
            init: "true"
            canary: "false"
          - image: almalinux/9-init
            init: "true"
            canary: "false"
          - image: debian:12
            init: "false"
            canary: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
      - name: build muster and the collectors test binary
        run: |
          CGO_ENABLED=0 go build -trimpath -o bin/muster ./cmd/muster
          CGO_ENABLED=0 go test -c ./internal/collect/collectors/ -o bin/collectors.test
      - name: collect inside ${{ matrix.image }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/muster"
          mkdir -m 700 "$RUNNER_TEMP/muster/containers"
          if [ "${{ matrix.init }}" = "true" ]; then
            cid=$(docker run -d --privileged --cgroupns=host -v "$PWD/bin:/m:ro" -v "$RUNNER_TEMP/muster/containers:/out" ${{ matrix.image }} /sbin/init)
            for i in $(seq 1 30); do
              state=$(docker exec "$cid" systemctl is-system-running --wait 2>/dev/null || true)
              case "$state" in running|degraded) break ;; esac
              sleep 1
            done
            docker exec "$cid" /m/muster collect --deep --out /out/c.json || true
            # $cid is a shell variable of this block, so everything that needs
            # the container belongs here. The trap removes it however this
            # block ends: a failing oracle below must not leak a container.
            trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
            # F-10: the four files this image really ships, for the fuzz
            # corpus. Copied BEFORE the oracle runs, so a mismatch that stops
            # this step still leaves the artifact the triage needs.
            mkdir -m 700 "$RUNNER_TEMP/muster/containers/seeds"
            for f in /etc/ssh/sshd_config /etc/passwd /etc/group /proc/self/mountinfo; do
              docker exec "$cid" sh -c "cat $f" > "$RUNNER_TEMP/muster/containers/seeds/$(basename "$f")" 2>/dev/null || true
            done
            # A file the image does not ship leaves the redirection's empty
            # file behind; an empty seed claiming to be an image's config
            # would be a lie in the corpus, so it goes.
            find "$RUNNER_TEMP/muster/containers/seeds" -type f -empty -delete
            echo "SEED_NAME=seeds-$(echo '${{ matrix.image }}' | tr '/:' '--')" >> "$GITHUB_ENV"
            # The parsers against the image's own daemons (F-9). A pair whose
            # oracle binary the image does not ship skips — the log counts
            # them — but a mismatch fails the job.
            set -o pipefail
            docker exec "$cid" env MUSTER_ORACLE=1 /m/collectors.test -test.run Oracle -test.v 2>&1 | tee "$RUNNER_TEMP/muster/containers/oracle.log"
            echo "pairs skipped: $(grep -c -- '--- SKIP' "$RUNNER_TEMP/muster/containers/oracle.log" || true)"
            docker rm -f "$cid"
          else
            docker run --rm -v "$PWD/bin:/m:ro" -v "$RUNNER_TEMP/muster/containers:/out" ${{ matrix.image }} /m/muster collect --deep --out /out/c.json || true
          fi
          sudo chown "$(id -u)" "$RUNNER_TEMP/muster/containers/c.json"
          test -s "$RUNNER_TEMP/muster/containers/c.json"
          jq -e '.run.env.container != "none"' "$RUNNER_TEMP/muster/containers/c.json"
          if [ "${{ matrix.init }}" = "true" ]; then
            jq -e '.facts.services.ssh.installed.status == "ok"' "$RUNNER_TEMP/muster/containers/c.json"
            # C-1: the Rocky/Alma 9 images ship no libwrap, so the presence
            # probe must read false. It read true everywhere while the
            # candidate list held /lib64/libwrap.so.0 (a symlink on every
            # merged-usr host), which left U-28's tcp_wrappers gate inert.
            # The Ubuntu/Debian images are not asserted: libwrap0 may or may
            # not be pulled in there.
            jq -e '.facts.files.libwrap_present.value == false' "$RUNNER_TEMP/muster/containers/c.json"
          else
            jq -e '.facts.services.ssh.installed.status == "unsupported"' "$RUNNER_TEMP/muster/containers/c.json"
          fi
      # always(): the seeds are copied before the oracle runs precisely so a
      # mismatch can be triaged against the files it read.
      - uses: actions/upload-artifact@v4
        if: always() && matrix.init == 'true' && env.SEED_NAME != ''
        with: {name: "${{ env.SEED_NAME }}", path: "${{ runner.temp }}/muster/containers/seeds"}
      - name: unseen facts are ERROR or NOT_APPLICABLE, never PASS
        run: |
          set +e
          ./bin/muster check --facts "$RUNNER_TEMP/muster/containers/c.json" --format json > "$RUNNER_TEMP/muster/containers/report.json"
          set -e
          # Same rule as the non-root job: absent evidence is allowed only under absent_means: pass.
          jq -e '[.results[] | select(.status=="PASS") | . as $r | .evidence[]? | select(.status != "ok" and (.status != "absent" or (($r.reason // "") | startswith("absent counts as pass") | not)))] | length == 0' "$RUNNER_TEMP/muster/containers/report.json"
      - name: every fact the capability matrix calls systemd-only reads unsupported
        if: matrix.init == 'false'
        run: |
          jq -e --slurpfile m docs/reference/capability-matrix.json '
            [ $m[0]["no-systemd"].unsupported[] as $k
              | ($k | split(".")) as $p
              | (.facts | getpath($p) | .status)
              | select(. != "unsupported") ] | length == 0' "$RUNNER_TEMP/muster/containers/c.json"
      - name: every fact the capability matrix calls container-unsupported reads unsupported
        run: |
          jq -e --slurpfile m docs/reference/capability-matrix.json '
            [ $m[0].container.unsupported[] as $k
              | ($k | split(".")) as $p
              | (.facts | getpath($p) | .status)
              | select(. != "unsupported") ] | length == 0' "$RUNNER_TEMP/muster/containers/c.json"

  collect-contract:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
      - run: CGO_ENABLED=0 go build -trimpath -o bin/muster ./cmd/muster
      - name: no network, read-only root, one file written
        run: |
          mkdir -m 700 "$RUNNER_TEMP/muster"
          mkdir -m 700 "$RUNNER_TEMP/muster/out"
          docker run --rm --network none --read-only \
            -v "$PWD":/src:ro \
            -v "$RUNNER_TEMP/muster/out":/out \
            ubuntu:24.04 /src/bin/muster collect --deep --out /out/s.json
          sudo chown "$(id -u)" "$RUNNER_TEMP/muster/out/s.json"
          files=$(find "$RUNNER_TEMP/muster/out" -type f)
          test "$files" = "$RUNNER_TEMP/muster/out/s.json"
          test "$(stat -c '%a' "$RUNNER_TEMP/muster/out/s.json")" = "600"
          jq -e '.run.complete == true and .run.env.container != "none"' "$RUNNER_TEMP/muster/out/s.json"
      - name: every fact the capability matrix calls container-unsupported reads unsupported
        run: |
          jq -e --slurpfile m docs/reference/capability-matrix.json '
            [ $m[0].container.unsupported[] as $k
              | ($k | split(".")) as $p
              | (.facts | getpath($p) | .status)
              | select(. != "unsupported") ] | length == 0' "$RUNNER_TEMP/muster/out/s.json"
