id: muster.file.passwd_permissions
title_en: /etc/passwd is owned by root and not writable by others
title_ko: /etc/passwd 가 root 소유이고 다른 사용자가 쓸 수 없다
description_en: Owner and group must be root, mode must be 0644 or stricter, and no named user or group may be granted access through a POSIX ACL. The base ACL entries (user::, group::, mask::, other::) mirror the mode and are allowed.
description_ko: 소유자와 그룹이 root 여야 하고 모드가 0644 이하여야 하며 POSIX ACL 로 특정 사용자나 그룹에 접근을 부여하면 안 됩니다. 모드를 그대로 반영하는 기본 ACL 항목(user::, group::, mask::, other::)은 허용합니다.
category: file
importance: 상
automation: auto
references:
  kisa: { "2026": ["U-16"], "2021": ["U-07"] }
requires_facts: ">=1"
absent_means: fail
checks:
  - { fact: files.etc_passwd.uid, op: eq, expected: 0 }
  - { fact: files.etc_passwd.gid, op: eq, expected: 0 }
  - { fact: files.etc_passwd.mode, op: in, expected: [0, 4, 32, 36, 128, 132, 160, 164, 256, 260, 288, 292, 384, 388, 416, 420] } # 0644 or any subset of its bits; any group/other write or any execute bit fails
  - { fact: files.etc_passwd.acl_entries, op: none, where: { op: matches, expected: "^(user|group):[^:]+:" } } # a named entry widens access whatever its bits
remediation:
  text_en: chown root:root /etc/passwd; chmod 644 /etc/passwd; setfacl -b /etc/passwd
  text_ko: chown root:root /etc/passwd; chmod 644 /etc/passwd; setfacl -b /etc/passwd
  risk: none
  idempotent: true
  script: chown root:root /etc/passwd && chmod 644 /etc/passwd && setfacl -b /etc/passwd
decision: D26
