id: muster.file.env_file_permissions
title_en: Shell environment files are owned correctly and not writable by others
title_ko: 셸 환경변수 파일이 올바른 소유자를 갖고 타인이 쓸 수 없다
description_en: Every system and per-user shell environment file (/etc/profile, the bashrc files, and each interactive user's dotfiles) must be owned by root or by the account whose home it sits in, and must not be group- or world-writable, so no other user can inject commands into a login. A symlinked environment file is treated as not correctly owned. A home outside the declared home roots (not under /home, /home/*/ or /root) cannot be examined under the collector's declaration - muster declines to read it and reports the whole dotfile enumeration as absent, naming each such account, so this control is MANUAL for a reviewer to settle rather than a finding muster cannot substantiate. Because the answer is the whole list, one such account suppresses the judgement of every other file in the same run, including a group-writable /etc/profile. Only interactive accounts' dotfiles are examined; service accounts with a nologin shell are skipped.
description_ko: 모든 시스템·사용자별 셸 환경변수 파일(/etc/profile, bashrc 계열, 각 대화형 사용자의 dotfile)은 root 또는 그 홈의 계정이 소유해야 하고 그룹·전체 쓰기가 가능하면 안 되어, 다른 사용자가 로그인에 명령을 주입할 수 없어야 합니다. 심볼릭 링크인 환경 파일은 소유가 올바르지 않은 것으로 봅니다. 선언된 홈 루트(/home, /home/*/, /root) 밖의 홈은 수집기 선언으로 점검할 수 없어, muster 는 그 경로를 읽지 않고 dotfile 목록 전체를 absent 로 하여 해당 계정을 하나씩 이름과 함께 보고합니다. 따라서 이 컨트롤은 근거 없는 발견 항목 대신 검토자가 판단하는 MANUAL 이 되며, 답이 목록 전체이므로 그런 계정이 하나만 있어도 같은 실행의 다른 파일(그룹 쓰기가 가능한 /etc/profile 을 포함)에 대한 판정까지 함께 보류됩니다. nologin 셸을 쓰는 서비스 계정은 건너뛰고 대화형 계정의 dotfile 만 점검합니다.
category: file
importance: 상
automation: auto
references:
  kisa: { "2026": ["U-24"], "2021": ["U-14"] }
  stig:
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-232045 }
  nist_800_53: ["CM-6"]
requires_facts: ">=1"
absent_means: manual
checks:
  - { fact: files.env_files, op: none, where: { field: owner_ok, op: eq, expected: false } }
  - { fact: files.env_files, op: none, where: { field: group_writable, op: eq, expected: true } }
  - { fact: files.env_files, op: none, where: { field: other_writable, op: eq, expected: true } }
remediation:
  text_en: chown the file to root or the home owner and chmod go-w; replace a symlinked environment file with a regular file.
  text_ko: 해당 파일을 root 또는 홈 소유자로 chown 하고 chmod go-w 를 적용하며, 심볼릭 링크인 환경 파일은 일반 파일로 교체합니다.
  risk: none
  idempotent: true
