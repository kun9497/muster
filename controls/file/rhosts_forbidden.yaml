id: muster.file.rhosts_forbidden
title_en: No .rhosts or hosts.equiv grants blanket trust
title_ko: .rhosts 나 hosts.equiv 가 무조건 신뢰를 허용하지 않는다
description_en: The r-command trust files must not grant blanket access - no interactive user's ~/.rhosts or ~/.shosts may contain a "+" entry, and /etc/hosts.equiv must not begin a line with "+". A "+" trusts every host or user, defeating authentication. This control judges the .rhosts, .shosts and hosts.equiv files muster could actually read. A .rhosts or .shosts that exists but cannot be read is the answer for the whole list - the read's status with the path in the reason - so the control is an ERROR rather than a pass over a file nobody could see; a "+" already found in an earlier file is not reported alongside it, because the answer is the whole list rather than the rows collected so far. A home outside the declared home roots is not searched at all, and the list is then absent naming each such account, which makes the control MANUAL. A home muster cannot reach without following a symlink is not examined either, and the list is then absent naming that path, so the control reads MANUAL there too. Because the screen runs over the whole checks list, one such account also suspends the hosts.equiv judgement for that run - a "+" in /etc/hosts.equiv is then not reported as a finding, and the reviewer reads the lines themselves in the evidence. The absence of any such file is compliant.

description_ko: r-command 신뢰 파일이 무조건 접근을 허용하면 안 됩니다. 어떤 대화형 사용자의 ~/.rhosts 나 ~/.shosts 도 "+" 항목을 담으면 안 되고, /etc/hosts.equiv 도 줄을 "+" 로 시작하면 안 됩니다. "+" 는 모든 호스트나 사용자를 신뢰해 인증을 무력화합니다. 이 컨트롤은 muster 가 실제로 읽을 수 있었던 .rhosts, .shosts, hosts.equiv 파일을 판정합니다. 존재하지만 읽을 수 없는 .rhosts 나 .shosts 는 목록 전체의 답이 되어(경로를 앞에 붙인 읽기 상태 그대로), 아무도 볼 수 없는 파일을 통과시키는 대신 ERROR 로 보고합니다. 이때 앞서 읽은 파일에서 찾은 "+" 는 함께 보고되지 않습니다. 답이 그때까지 수집한 행이 아니라 목록 전체이기 때문입니다. 선언된 홈 루트 밖의 홈은 아예 탐색하지 않으며, 그 경우 목록은 해당 계정을 이름과 함께 밝힌 absent 가 되어 컨트롤은 MANUAL 이 됩니다. 심볼릭 링크를 따라가야만 도달하는 홈도 점검하지 않으며, 그 경우에도 목록은 해당 경로를 밝힌 absent 가 되어 컨트롤은 MANUAL 이 됩니다. 판정 보류는 checks 목록 전체에 적용되므로, 그런 계정이 하나만 있어도 같은 실행의 hosts.equiv 판정까지 함께 보류됩니다. 즉 /etc/hosts.equiv 의 "+" 는 발견 항목으로 보고되지 않으며, 검토자가 증거의 해당 줄을 직접 확인합니다. 그런 파일이 아예 없으면 양호입니다.

category: file
importance: 상
automation: auto
references:
  kisa: { "2026": ["U-27"], "2021": ["U-17"] }
requires_facts: ">=1"
# manual, not pass (M-52, MR-2, MR-4): files.user_rhosts is absent only when an
# interactive home was outside the declaration or reachable only through a
# symlink - never on a stock host, where it was always ok - and
# files.etc_hosts_equiv_lines is never absent (R177). The MANUAL row still
# carries the hosts.equiv lines as evidence, so a "+" there is visible to the
# reviewer even though this run could not judge every home.
absent_means: manual
checks:
  - { fact: files.user_rhosts, op: none, where: { field: has_plus, op: eq, expected: true } }
  - { fact: files.etc_hosts_equiv_lines, op: none, where: { op: matches, expected: "^\\+" } }
remediation:
  text_en: Remove the "+" entries from the offending ~/.rhosts, ~/.shosts and /etc/hosts.equiv, or remove the files entirely if r-command trust is not in use.
  text_ko: 문제되는 ~/.rhosts, ~/.shosts, /etc/hosts.equiv 에서 "+" 항목을 제거하거나, r-command 신뢰를 쓰지 않으면 파일을 아예 삭제합니다.
  risk: none
  idempotent: true
