id: muster.file.rhosts_forbidden
title_en: No .rhosts or hosts.equiv grants blanket trust
title_ko: .rhosts 나 hosts.equiv 가 무조건 신뢰를 허용하지 않는다
description_en: The r-command trust files must not grant blanket access - no interactive user's ~/.rhosts or ~/.shosts may contain a "+" entry, and /etc/hosts.equiv must not begin a line with "+". A "+" trusts every host or user, defeating authentication. This control judges the .rhosts, .shosts and hosts.equiv files muster could actually read. A .rhosts or .shosts that exists but cannot be read is the answer for the whole list - the read's status with the path in the reason - so the control is an ERROR rather than a pass over a file nobody could see; a "+" already found in an earlier file is not reported alongside it, because the answer is the whole list rather than the rows collected so far. A home outside the declared home roots is not searched at all, and the list is then absent naming each such account, which makes the control MANUAL. The absence of any such file is compliant.

description_ko: r-command 신뢰 파일이 무조건 접근을 허용하면 안 됩니다. 어떤 대화형 사용자의 ~/.rhosts 나 ~/.shosts 도 "+" 항목을 담으면 안 되고, /etc/hosts.equiv 도 줄을 "+" 로 시작하면 안 됩니다. "+" 는 모든 호스트나 사용자를 신뢰해 인증을 무력화합니다. 이 컨트롤은 muster 가 실제로 읽을 수 있었던 .rhosts, .shosts, hosts.equiv 파일을 판정합니다. 존재하지만 읽을 수 없는 .rhosts 나 .shosts 는 목록 전체의 답이 되어(경로를 앞에 붙인 읽기 상태 그대로), 아무도 볼 수 없는 파일을 통과시키는 대신 ERROR 로 보고합니다. 이때 앞서 읽은 파일에서 찾은 "+" 는 함께 보고되지 않습니다. 답이 그때까지 수집한 행이 아니라 목록 전체이기 때문입니다. 선언된 홈 루트 밖의 홈은 아예 탐색하지 않으며, 그 경우 목록은 해당 계정을 이름과 함께 밝힌 absent 가 되어 컨트롤은 MANUAL 이 됩니다. 그런 파일이 아예 없으면 양호입니다.

category: file
importance: 상
automation: auto
references:
  kisa: { "2026": ["U-27"], "2021": ["U-17"] }
requires_facts: ">=1"
# manual, not pass (M-52): files.user_rhosts is absent only when a home was
# outside the declaration - never on a stock host, where it was always ok - and
# files.etc_hosts_equiv_lines is never absent (R177). So this can only turn a
# would-be vacuous PASS into a reviewer question.
absent_means: manual
checks:
  - { fact: files.user_rhosts, op: none, where: { field: has_plus, op: eq, expected: true } }
  - { fact: files.etc_hosts_equiv_lines, op: none, where: { op: matches, expected: "^\\+" } }
remediation:
  text_en: Remove the "+" entries from the offending ~/.rhosts, ~/.shosts and /etc/hosts.equiv, or remove the files entirely if r-command trust is not in use.
  text_ko: 문제되는 ~/.rhosts, ~/.shosts, /etc/hosts.equiv 에서 "+" 항목을 제거하거나, r-command 신뢰를 쓰지 않으면 파일을 아예 삭제합니다.
  risk: none
  idempotent: true
