id: muster.file.services_permissions
title_en: /etc/services is owned by root and not writable by group or others
title_ko: /etc/services 가 root 소유이고 그룹과 다른 사용자가 쓸 수 없다
description_en: The guide's criterion is owner root and mode 0644 or stricter, so group and other members may read the file but never write it.
description_ko: 가이드 기준은 소유자 root, 모드 0644 이하로, 그룹과 다른 사용자는 파일을 읽을 수는 있지만 쓸 수는 없습니다.
category: file
importance: 상
automation: auto
references:
  kisa: { "2026": ["U-22"], "2021": ["U-12"] }
requires_facts: ">=1"
absent_means: fail
params:
  allowed_modes: { type: list<int>, default: [0, 4, 32, 36, 128, 132, 160, 164, 256, 260, 288, 292, 384, 388, 416, 420], description: Modes that count as 0644 or stricter (0644 and every subset of its bits) }
checks:
  - { fact: files.etc_services.uid, op: eq, expected: 0 }
  - { fact: files.etc_services.mode, op: in, expected: "${allowed_modes}" }
remediation:
  text_en: chown root:root /etc/services; chmod 644 /etc/services (the script only clears bits; a stricter file is left as it is)
  text_ko: chown root:root /etc/services; chmod 644 /etc/services (스크립트는 비트를 지우기만 하므로 더 엄격한 파일은 그대로 둡니다)
  risk: none
  idempotent: true
  backup: [/etc/services]
  script: |
    [ -f /etc/services ]
    chown root:root /etc/services
    chmod u-xs,g-wxs,o-wxt /etc/services
  validate: "case \"$(stat -c '%u %g %a' /etc/services)\" in '0 0 0'|'0 0 4'|'0 0 40'|'0 0 44'|'0 0 200'|'0 0 204'|'0 0 240'|'0 0 244'|'0 0 400'|'0 0 404'|'0 0 440'|'0 0 444'|'0 0 600'|'0 0 604'|'0 0 640'|'0 0 644') ;; *) false;; esac"
