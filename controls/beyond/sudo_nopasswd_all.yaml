id: muster.beyond.sudo_nopasswd_all
title_en: No principal may run every command through sudo without a password, and sudo never skips authentication
title_ko: 어떤 주체도 비밀번호 없이 sudo 로 모든 명령을 실행할 수 없고, sudo 는 인증을 건너뛰지 않는다
description_en: A principal that sudoers(5) lets run ALL under NOPASSWD — any command as any user, no password asked — is root with an extra step, and a Defaults !authenticate line does the same for everyone it covers; whoever takes over that account's session, or runs code as it, is root at once. muster reads /etc/sudoers and the files it includes, resolves the aliases, and fails the host when a principal other than root holds the ALL command under NOPASSWD, or when !authenticate is in force for the unscoped Defaults or for a user or runas scope. The %sudo and %wheel lines that ask for a password are the shipped state and pass; cloud-init's 90-cloud-init-users line for the image's default user and the GitHub runner's runner line read FAIL, and params.allowed_nopasswd_principals is where an image's service account is recorded on purpose. It is rated 상 because it turns any foothold in one account into root without a second credential. The principals are judged from the local files, so a passing host that also resolves accounts through a remote NSS source reads WARN instead of PASS; a FAIL stays FAIL. A rule whose alias, netgroup or non-Unix group muster could not resolve, or an include muster could not follow, may carry the tag in lines it never read, so either reads MANUAL naming them; /etc/sudoers is 0440, so a non-root run reads ERROR.
description_ko: sudoers(5) 가 NOPASSWD 로 ALL 을 허용한 주체, 즉 비밀번호 없이 아무 사용자로 아무 명령이나 실행할 수 있는 주체는 한 단계를 더 거칠 뿐인 root 이며, Defaults !authenticate 줄은 그것이 적용되는 모두에게 같은 일을 합니다. 그 계정의 세션을 가로채거나 그 계정으로 코드를 실행하는 사람은 곧바로 root 가 됩니다. muster 는 /etc/sudoers 와 그것이 포함하는 파일을 읽고 별칭을 풀어, root 가 아닌 주체가 NOPASSWD 로 ALL 명령을 가지고 있거나, 범위 없는 Defaults 또는 사용자나 runas 범위에 !authenticate 가 적용되어 있으면 호스트를 실패로 판정합니다. 비밀번호를 묻는 %sudo 와 %wheel 줄은 배포 상태이므로 통과합니다. 이미지 기본 사용자를 위한 cloud-init 의 90-cloud-init-users 줄과 GitHub 러너의 runner 줄은 FAIL 이며, 이미지의 서비스 계정을 의도적으로 허용할 때는 params.allowed_nopasswd_principals 에 기록합니다. 한 계정에서 얻은 발판을 두 번째 자격 증명 없이 root 로 바꾸므로 중요도는 상 입니다. 주체는 로컬 파일로 판정하므로, 원격 NSS 소스로도 계정을 조회하는 호스트는 통과할 때 PASS 대신 WARN 이며 FAIL 은 그대로 FAIL 입니다. muster 가 별칭, netgroup, Unix 가 아닌 그룹을 풀 수 없었던 규칙이나 따라갈 수 없었던 include 는 읽지 못한 줄에 태그가 있을 수 있으므로 둘 다 그 이름을 밝힌 MANUAL 입니다. /etc/sudoers 는 0440 이므로 root 가 아닌 실행은 ERROR 입니다.
category: beyond
importance: 상
automation: auto
references:
  stig:
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-432025 }
    - { benchmark: ubuntu2204, version: V2R9, id: UBTU-22-432010 }
    - { benchmark: ubuntu2404, version: V1R6, id: UBTU-24-300021 }
  nist_800_53: ["IA-11", "SC-11", "CM-6"]
requires_facts: ">=1"
applies_when:
  - { fact: env.container, op: eq, expected: none }
  - { fact: sudo.installed, op: eq, expected: true }
absent_means: manual
params:
  allowed_nopasswd_principals: { type: list<string>, default: [], description: "principals, spelled as sudo.nopasswd_all spells them (a user, %group or ALL), that may run every command without a password on purpose - an image's service account" }
checks:
  - { fact: sudo.nopasswd_all, op: none, where: { op: not_in, expected: "${allowed_nopasswd_principals}" } }
  - { fact: sudo.authenticate_disabled, op: eq, expected: false }
remediation:
  text_en: Copy the file first (cp -a <file> <file>.bak), then edit it with visudo -f <file> - drop NOPASSWD from the ALL line, or narrow the line to the commands the account really needs - and remove any Defaults !authenticate line. Give the account a password or a key-backed PAM method before it loses NOPASSWD, or it cannot use sudo at all. Restore with cp -a <file>.bak <file>; visudo -c checks the result.
  text_ko: 먼저 파일을 복사한 뒤(cp -a <file> <file>.bak) visudo -f <file> 로 편집합니다. ALL 줄에서 NOPASSWD 를 빼거나 그 계정이 정말 필요한 명령으로 줄을 좁히고, Defaults !authenticate 줄을 지웁니다. NOPASSWD 를 잃기 전에 그 계정에 비밀번호나 키 기반 PAM 방식을 주어야 합니다. 그렇지 않으면 sudo 를 전혀 쓸 수 없습니다. cp -a <file>.bak <file> 로 되돌리며, visudo -c 로 결과를 검사합니다.
  risk: none
  idempotent: true
