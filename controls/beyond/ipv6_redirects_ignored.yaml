id: muster.beyond.ipv6_redirects_ignored
title_en: The host does not accept IPv6 ICMP redirects
title_ko: 호스트는 IPv6 ICMP 리다이렉트를 받아들이지 않는다
description_en: An ICMPv6 redirect does for IPv6 what an ICMP redirect does for IPv4 - it tells the host to reach a destination through another next hop - and accepted from a neighbour it lets that neighbour sit in the middle of the host's IPv6 connections. net.ipv6.conf.all.accept_redirects and net.ipv6.conf.default.accept_redirects must both be 0. The kernel's Documentation/networking/ip-sysctl.rst describes them; muster rates it 중 because, as with IPv4, the attacker needs the same link and then redirects silently, and IPv6 is often enabled and unwatched on hosts whose operators think only of IPv4. muster judges the effective, running value; the sysctl.d side rides along as drift. The control gates on one derived key, net.sysctl.ipv6_disabled - it reads NOT_APPLICABLE when the kernel has no IPv6 (built without it, or booted with ipv6.disable=1) and when disable_ipv6 is 1 on all, on default and on every present interface other than lo (net.sysctl.ipv6_disabled), IPv6 turned off the common way; a host that set only one of the two, or re-enabled one interface under all, still speaks IPv6 and is judged. Stock Ubuntu and EL9 FAIL - the kernel accepts IPv6 redirects by default and neither distribution changes it.
description_ko: ICMPv6 리다이렉트는 IPv6 에서 ICMP 리다이렉트가 IPv4 에서 하는 일, 즉 다른 다음 홉을 거쳐 목적지에 가라고 호스트에 알리는 일을 하며, 이웃에게서 받아들이면 그 이웃이 호스트의 IPv6 연결 한가운데에 끼어들 수 있습니다. net.ipv6.conf.all.accept_redirects 와 net.ipv6.conf.default.accept_redirects 가 모두 0 이어야 합니다. 커널 문서 Documentation/networking/ip-sysctl.rst 가 두 값을 설명합니다. IPv4 와 마찬가지로 공격자는 같은 링크가 필요하고 그다음에는 조용히 트래픽을 돌리며, IPv4 만 생각하는 운영자의 호스트에서 IPv6 는 켜진 채 방치되기 쉬우므로 muster 는 중요도를 중으로 둡니다. muster 는 실행 중인 실효값을 판정하고 sysctl.d 쪽은 차이로 함께 보고합니다. 이 통제 항목의 게이트는 파생 키 net.sysctl.ipv6_disabled 하나입니다. 커널에 IPv6 가 없거나(빌드하지 않았거나 ipv6.disable=1 로 부팅) disable_ipv6 가 all, default 와 lo 외의 모든 현재 인터페이스에서 1 인 경우(net.sysctl.ipv6_disabled; IPv6 를 끄는 흔한 방식) NOT_APPLICABLE 이며, 둘 중 하나만 설정했거나 all 아래서 인터페이스 하나를 다시 켠 호스트는 여전히 IPv6 를 쓰므로 판정합니다. 기본 Ubuntu 와 EL9 은 FAIL 입니다. 커널이 기본으로 IPv6 리다이렉트를 받아들이며 두 배포판 모두 이를 바꾸지 않습니다.
category: beyond
importance: 중
automation: auto
references:
  cis:
    - { benchmark: rhel9, version: "2.0.0", rec: "3.3.5" }
    - { benchmark: ubuntu2204, version: "2.0.0", rec: "3.3.5" }
    - { benchmark: ubuntu2404, version: "1.0.0", rec: "3.3.5" }
  stig:
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-254015 }
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-254035 }
  nist_800_53: ["CM-6"]
requires_facts: ">=1"
applies_when:
  - { fact: env.container, op: eq, expected: none }
  - { fact: net.sysctl.ipv6_disabled, op: eq, expected: 0 }
absent_means: not_applicable
checks:
  - { fact: net.sysctl.ipv6_all_accept_redirects, op: eq, expected: 0 }
  - { fact: net.sysctl.ipv6_default_accept_redirects, op: eq, expected: 0 }
remediation:
  text_en: Write net.ipv6.conf.all.accept_redirects = 0 and net.ipv6.conf.default.accept_redirects = 0 into /etc/sysctl.d/99-muster-ipv6-redirects-ignored.conf and apply it with sysctl --system; they take effect at once. A value set in /etc/sysctl.conf, or in a sysctl.d file that sorts after 99-muster-ipv6-redirects-ignored.conf, still wins at boot; correct it there. The review script never follows a symlink; a 99-muster-ipv6-redirects-ignored.conf that is a symlink (a mask) is left as is and the block stops.
  text_ko: /etc/sysctl.d/99-muster-ipv6-redirects-ignored.conf 에 net.ipv6.conf.all.accept_redirects = 0 과 net.ipv6.conf.default.accept_redirects = 0 을 적고 sysctl --system 으로 적용합니다. 즉시 반영됩니다. /etc/sysctl.conf나 99-muster-ipv6-redirects-ignored.conf 뒤에 정렬되는 sysctl.d 파일에 둔 값이 부팅 때 여전히 이기므로 그 파일을 고치십시오. 검토 스크립트는 심볼릭 링크를 따라가지 않으므로, 심볼릭 링크(마스크)인 99-muster-ipv6-redirects-ignored.conf 는 그대로 두고 그 블록을 멈춥니다.
  risk: none
  idempotent: true
  sysctl: [net.ipv6.conf.all.accept_redirects, net.ipv6.conf.default.accept_redirects]
  backup: [/etc/sysctl.d/99-muster-ipv6-redirects-ignored.conf]
  script: |
    f=/etc/sysctl.d/99-muster-ipv6-redirects-ignored.conf
    if [ -L "$f" ]; then log "muster.beyond.ipv6_redirects_ignored: $f is a symlink (a mask), left as is"; exit 1; fi
    put() {
      sysctl -q -w "$1=$2"
      if grep -q "^$1 " "$f" 2>/dev/null; then sed -i "s|^$1 .*|$1 = $2|" "$f"; else { if [ -s "$f" ] && [ -n "$(tail -c1 "$f")" ]; then echo >> "$f"; fi; printf '%s = %s\n' "$1" "$2" >> "$f"; }; fi
    }
    case "$(sysctl -n net.ipv6.conf.all.accept_redirects)" in 0) ;; *) put net.ipv6.conf.all.accept_redirects 0;; esac
    case "$(sysctl -n net.ipv6.conf.default.accept_redirects)" in 0) ;; *) put net.ipv6.conf.default.accept_redirects 0;; esac
    if [ -f "$f" ] && [ ! -L "$f" ]; then chmod 644 "$f"; fi
  validate: |
    case "$(sysctl -n net.ipv6.conf.all.accept_redirects)" in 0) ;; *) false;; esac && case "$(sysctl -n net.ipv6.conf.default.accept_redirects)" in 0) ;; *) false;; esac
