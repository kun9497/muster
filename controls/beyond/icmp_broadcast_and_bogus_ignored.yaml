id: muster.beyond.icmp_broadcast_and_bogus_ignored
title_en: The host ignores broadcast ICMP echo requests and bogus ICMP error responses
title_ko: 호스트는 브로드캐스트 ICMP echo 요청과 잘못된 ICMP 오류 응답을 무시한다
description_en: A host that answers an echo request sent to a broadcast address joins every other host on the subnet in flooding whoever the request claimed to come from - the smurf amplification - and one that logs every malformed ICMP error response lets a remote sender fill its kernel log. net.ipv4.icmp_echo_ignore_broadcasts and net.ipv4.icmp_ignore_bogus_error_responses must both be 1. The kernel's Documentation/networking/ip-sysctl.rst describes them; muster rates it 하 because both are the kernel's defaults and the harm is to others' bandwidth or to log space, not to the host's control. muster judges the effective, running value; the sysctl.d side rides along as drift. A kernel that publishes neither value reads FAIL. Stock Ubuntu and EL9 pass with 1 and 1.
description_ko: 브로드캐스트 주소로 보낸 echo 요청에 답하는 호스트는 서브넷의 다른 모든 호스트와 함께 요청이 출발지라고 주장한 대상을 공격하게 되며(smurf 증폭), 잘못된 ICMP 오류 응답을 모두 기록하는 호스트는 원격 송신자가 커널 로그를 채우게 둡니다. net.ipv4.icmp_echo_ignore_broadcasts 와 net.ipv4.icmp_ignore_bogus_error_responses 가 모두 1 이어야 합니다. 커널 문서 Documentation/networking/ip-sysctl.rst 가 두 값을 설명합니다. 둘 다 커널 기본값이고 피해가 호스트의 통제권이 아니라 다른 이의 대역폭이나 로그 공간에 미치므로 muster 는 중요도를 하로 둡니다. muster 는 실행 중인 실효값을 판정하고 sysctl.d 쪽은 차이로 함께 보고합니다. 두 값을 모두 내놓지 않는 커널은 FAIL 입니다. 기본 Ubuntu 와 EL9 은 1 과 1 로 통과합니다.
category: beyond
importance: 하
automation: auto
references:
  stig:
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-253055 }
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-253060 }
  nist_800_53: ["CM-6"]
requires_facts: ">=1"
applies_when:
  - { fact: env.container, op: eq, expected: none }
absent_means: fail
checks:
  - { fact: net.sysctl.ipv4_icmp_echo_ignore_broadcasts, op: eq, expected: 1 }
  - { fact: net.sysctl.ipv4_icmp_ignore_bogus_error_responses, op: eq, expected: 1 }
remediation:
  text_en: Write net.ipv4.icmp_echo_ignore_broadcasts = 1 and net.ipv4.icmp_ignore_bogus_error_responses = 1 into a file under /etc/sysctl.d and apply it with sysctl --system; they take effect at once. A file that sets either to 0 is the one to find and fix first.
  text_ko: /etc/sysctl.d 아래 파일에 net.ipv4.icmp_echo_ignore_broadcasts = 1 과 net.ipv4.icmp_ignore_bogus_error_responses = 1 을 적고 sysctl --system 으로 적용합니다. 즉시 반영됩니다. 둘 중 하나를 0 으로 설정한 파일을 먼저 찾아 고치십시오.
  risk: none
  idempotent: true
