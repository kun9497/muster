id: muster.beyond.account_inactivity_lock
title_en: Accounts that can log in are disabled a bounded number of days after their password expires, and useradd gives new accounts the same bound
title_ko: 로그인할 수 있는 계정은 비밀번호가 만료된 뒤 정해진 날짜 안에 비활성화되고, useradd 도 새 계정에 같은 기한을 준다
description_en: shadow(5)'s inactivity field (field 7) disables an account a fixed number of days after its password expires, and useradd(8) writes INACTIVE from /etc/default/useradd into every account it creates; together they are the only mechanism the base system has for closing an account nobody uses any more. muster reads every account with an interactive shell that is not a system account — root is covered like every other account, and so is a password-locked account, which may still log in with a key — and fails the host when a row has the field empty or above params.max_inactive_days, or when useradd's INACTIVE is unset (-1) or above it. The default of 35 days is the value the cited rules ask for; INACTIVE=0, which disables an account the day its password expires, passes. It is rated 중 because a forgotten account is a standing credential an attacker can guess or reuse, but the lock only takes effect once password ageing expires the password. Every stock release reads FAIL — EL writes INACTIVE=-1, Ubuntu ships the line commented out, and no account carries the field — so a stock host fails until the policy is set. /etc/shadow is readable by root only, so a non-root run reads ERROR; a host without /etc/passwd has no account list to judge and reads FAIL.
description_ko: shadow(5) 의 비활성 필드(7번째 필드)는 비밀번호가 만료된 뒤 정해진 날짜가 지나면 계정을 비활성화하고, useradd(8) 는 /etc/default/useradd 의 INACTIVE 를 자신이 만드는 모든 계정에 기록합니다. 두 가지가 합쳐져 아무도 쓰지 않는 계정을 닫는, 기본 시스템이 가진 유일한 장치가 됩니다. muster 는 시스템 계정이 아니면서 대화형 셸을 가진 모든 계정을 읽습니다. root 도 다른 계정과 똑같이 포함되며, 비밀번호가 잠겼어도 키로 로그인할 수 있는 계정도 포함됩니다. 어떤 행의 필드가 비어 있거나 params.max_inactive_days 보다 크면, 또는 useradd 의 INACTIVE 가 설정되지 않았거나(-1) 그보다 크면 호스트는 실패합니다. 기본값 35일은 인용한 규칙이 요구하는 값이며, 비밀번호가 만료되는 날 계정을 비활성화하는 INACTIVE=0 은 통과합니다. 잊힌 계정은 공격자가 추측하거나 재사용할 수 있는 상시 자격 증명이지만 잠금은 비밀번호 사용 기한이 비밀번호를 만료시킨 뒤에야 효력이 있으므로 중요도는 중 입니다. 모든 기본 설치 릴리스는 FAIL 입니다. EL 은 INACTIVE=-1 을 기록하고 Ubuntu 는 그 줄을 주석으로 배포하며 어떤 계정에도 필드가 없으므로, 정책을 설정하기 전까지 기본 호스트는 실패합니다. /etc/shadow 는 root 만 읽을 수 있으므로 root 가 아닌 실행은 ERROR 이고, /etc/passwd 가 없는 호스트는 판정할 계정 목록이 없어 FAIL 입니다.
category: beyond
importance: 중
automation: auto
references:
  stig:
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-411050 }
    - { benchmark: ubuntu2204, version: V2R9, id: UBTU-22-411035 }
    - { benchmark: ubuntu2404, version: V1R6, id: UBTU-24-200260 }
  nist_800_53: ["AC-2(3)", "IA-4"]
requires_facts: ">=1"
applies_when:
  - { fact: env.container, op: eq, expected: none }
absent_means: fail
params:
  max_inactive_days: { type: int, default: 35, description: "the most days an account may stay usable after its password expires (shadow(5) field 7, useradd's INACTIVE)" }
checks:
  - { fact: accounts.login_capable, op: none, subject: name, where: { field: inactive_unset, op: eq, expected: true } }
  - { fact: accounts.login_capable, op: none, subject: name, where: { field: inactive, op: gt, expected: "${max_inactive_days}" } }
  - { fact: accounts.useradd.inactive, op: gte, expected: 0 }
  - { fact: accounts.useradd.inactive, op: lte, expected: "${max_inactive_days}" }
remediation:
  text_en: Set the default for new accounts with useradd -D -f 35 (it writes INACTIVE=35 to /etc/default/useradd), then give each existing account the same bound with chage --inactive 35 <user>, root included. Record the current value first (chage -l <user>) and restore it with chage --inactive <old> <user>, or -1 to clear it. The lock only acts once the password expires, so password ageing (PASS_MAX_DAYS) has to be in force as well.
  text_ko: useradd -D -f 35 로 새 계정의 기본값을 설정하고(/etc/default/useradd 에 INACTIVE=35 를 기록합니다), root 를 포함한 기존 계정마다 chage --inactive 35 <user> 로 같은 기한을 줍니다. 먼저 현재 값을 기록하고(chage -l <user>) chage --inactive <이전 값> <user> 로, 지우려면 -1 로 되돌립니다. 잠금은 비밀번호가 만료된 뒤에야 작동하므로 비밀번호 사용 기한(PASS_MAX_DAYS)도 적용되어 있어야 합니다.
  risk: none
  idempotent: true
