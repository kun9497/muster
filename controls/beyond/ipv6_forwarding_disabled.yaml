id: muster.beyond.ipv6_forwarding_disabled
title_en: The host does not route IPv6 packets between its interfaces unless it is meant to
title_ko: 호스트는 의도한 경우가 아니면 인터페이스 사이에서 IPv6 패킷을 라우팅하지 않는다
description_en: net.ipv6.conf.all.forwarding set to 1 makes every interface forward IPv6 packets and act as a router, and net.ipv6.conf.default.forwarding is the value an interface created later starts with; together they decide whether the host bridges IPv6 traffic between its networks, which an IPv4-only firewall review never sees. The kernel's Documentation/networking/ip-sysctl.rst describes both; muster rates it 중 for the same reason as IPv4 forwarding - harmless on a single network, a hole in the segmentation on more than one. Both values must be in this control's params.allowed_forward, default [0] - the same name and default as muster.beyond.ip_forwarding_disabled's parameter, but parameters belong to one control each, so a router or container host names 1 in both. muster judges the effective, running value; the sysctl.d side rides along as drift. The control gates on one derived key, net.sysctl.ipv6_disabled - it reads NOT_APPLICABLE when the kernel has no IPv6 (built without it, or booted with ipv6.disable=1) and when disable_ipv6 is 1 on all, on default and on every present interface other than lo (net.sysctl.ipv6_disabled), IPv6 turned off the common way; a host that set only one of the two, or re-enabled one interface under all, still speaks IPv6 and is judged. Stock Ubuntu and EL9 pass with 0 and 0.
description_ko: net.ipv6.conf.all.forwarding 이 1 이면 모든 인터페이스가 IPv6 패킷을 포워딩하며 라우터로 동작하고, net.ipv6.conf.default.forwarding 은 나중에 만들어지는 인터페이스가 시작할 때의 값입니다. 두 값이 함께 호스트가 네트워크 사이에서 IPv6 트래픽을 잇는지 결정하며, IPv4 만 보는 방화벽 검토에서는 드러나지 않습니다. 커널 문서 Documentation/networking/ip-sysctl.rst 가 두 값을 설명합니다. IPv4 포워딩과 같은 이유, 즉 단일 네트워크에서는 무해하지만 여러 네트워크에서는 망 분리의 구멍이 되므로 muster 는 중요도를 중으로 둡니다. 두 값 모두 이 통제 항목의 params.allowed_forward(기본값 [0])에 있어야 합니다. 이름과 기본값은 muster.beyond.ip_forwarding_disabled 의 파라미터와 같지만 파라미터는 통제 항목마다 따로이므로, 라우터나 컨테이너 호스트는 두 항목 모두에 1 을 적습니다. muster 는 실행 중인 실효값을 판정하고 sysctl.d 쪽은 차이로 함께 보고합니다. 이 통제 항목의 게이트는 파생 키 net.sysctl.ipv6_disabled 하나입니다. 커널에 IPv6 가 없거나(빌드하지 않았거나 ipv6.disable=1 로 부팅) disable_ipv6 가 all, default 와 lo 외의 모든 현재 인터페이스에서 1 인 경우(net.sysctl.ipv6_disabled; IPv6 를 끄는 흔한 방식) NOT_APPLICABLE 이며, 둘 중 하나만 설정했거나 all 아래서 인터페이스 하나를 다시 켠 호스트는 여전히 IPv6 를 쓰므로 판정합니다. 기본 Ubuntu 와 EL9 은 0 과 0 으로 통과합니다.
category: beyond
importance: 중
automation: auto
references:
  cis:
    - { benchmark: rhel9, version: "2.0.0", rec: "3.3.1" }
    - { benchmark: ubuntu2204, version: "2.0.0", rec: "3.3.1" }
    - { benchmark: ubuntu2404, version: "1.0.0", rec: "3.3.1" }
  stig:
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-254025 }
  nist_800_53: ["CM-6"]
requires_facts: ">=1"
applies_when:
  - { fact: env.container, op: eq, expected: none }
  - { fact: net.sysctl.ipv6_disabled, op: eq, expected: 0 }
absent_means: not_applicable
params:
  allowed_forward: { type: list<int>, default: [0], description: "forwarding values the host accepts - 0 for a host that only serves; a router or a container host names 1" }
checks:
  - { fact: net.sysctl.ipv6_all_forwarding, op: in, expected: "${allowed_forward}" }
  - { fact: net.sysctl.ipv6_default_forwarding, op: in, expected: "${allowed_forward}" }
remediation:
  text_en: Write net.ipv6.conf.all.forwarding = 0 and net.ipv6.conf.default.forwarding = 0 into /etc/sysctl.d/99-muster-ipv6-forwarding-disabled.conf and apply it with sysctl --system; they take effect at once. A router, VPN gateway or container host names 1 in params.allowed_forward instead - turning forwarding off there cuts its clients off. A failed block puts back net.ipv6.conf.all.forwarding and net.ipv6.conf.default.forwarding only; every interface's forwarding then follows the global value, because the kernel copies it. A value set in /etc/sysctl.conf, or in a sysctl.d file that sorts after 99-muster-ipv6-forwarding-disabled.conf, still wins at boot; correct it there. The review script never follows a symlink; a 99-muster-ipv6-forwarding-disabled.conf that is a symlink (a mask) is left as is and the block stops.
  text_ko: /etc/sysctl.d/99-muster-ipv6-forwarding-disabled.conf 에 net.ipv6.conf.all.forwarding = 0 과 net.ipv6.conf.default.forwarding = 0 을 적고 sysctl --system 으로 적용합니다. 즉시 반영됩니다. 라우터, VPN 게이트웨이, 컨테이너 호스트는 포워딩을 끄면 클라이언트가 끊기므로 대신 params.allowed_forward 에 1 을 적습니다. 실패한 블록은 net.ipv6.conf.all.forwarding 과 net.ipv6.conf.default.forwarding 만 되돌리며, 커널이 전역 값을 복사하므로 각 인터페이스의 포워딩은 그 전역 값을 따릅니다. /etc/sysctl.conf나 99-muster-ipv6-forwarding-disabled.conf 뒤에 정렬되는 sysctl.d 파일에 둔 값이 부팅 때 여전히 이기므로 그 파일을 고치십시오. 검토 스크립트는 심볼릭 링크를 따라가지 않으므로, 심볼릭 링크(마스크)인 99-muster-ipv6-forwarding-disabled.conf 는 그대로 두고 그 블록을 멈춥니다.
  risk: restart_service
  idempotent: true
  script_params: [allowed_forward]
  sysctl: [net.ipv6.conf.all.forwarding, net.ipv6.conf.default.forwarding]
  backup: [/etc/sysctl.d/99-muster-ipv6-forwarding-disabled.conf]
  script: |
    f=/etc/sysctl.d/99-muster-ipv6-forwarding-disabled.conf
    if [ -L "$f" ]; then log "muster.beyond.ipv6_forwarding_disabled: $f is a symlink (a mask), left as is"; exit 1; fi
    put() {
      sysctl -q -w "$1=$2"
      if grep -q "^$1 " "$f" 2>/dev/null; then sed -i "s|^$1 .*|$1 = $2|" "$f"; else { if [ -s "$f" ] && [ -n "$(tail -c1 "$f")" ]; then echo >> "$f"; fi; printf '%s = %s\n' "$1" "$2" >> "$f"; }; fi
    }
    first=${P_allowed_forward%% *}
    case " $P_allowed_forward " in *" $(sysctl -n net.ipv6.conf.all.forwarding) "*) ;; *) put net.ipv6.conf.all.forwarding "$first";; esac
    case " $P_allowed_forward " in *" $(sysctl -n net.ipv6.conf.default.forwarding) "*) ;; *) put net.ipv6.conf.default.forwarding "$first";; esac
    if [ -f "$f" ] && [ ! -L "$f" ]; then chmod 644 "$f"; fi
  validate: |
    case " $P_allowed_forward " in *" $(sysctl -n net.ipv6.conf.all.forwarding) "*) ;; *) false;; esac && case " $P_allowed_forward " in *" $(sysctl -n net.ipv6.conf.default.forwarding) "*) ;; *) false;; esac
