id: muster.beyond.ipv6_forwarding_disabled
title_en: The host does not route IPv6 packets between its interfaces unless it is meant to
title_ko: 호스트는 의도한 경우가 아니면 인터페이스 사이에서 IPv6 패킷을 라우팅하지 않는다
description_en: net.ipv6.conf.all.forwarding set to 1 makes every interface forward IPv6 packets and act as a router, and net.ipv6.conf.default.forwarding is the value an interface created later starts with; together they decide whether the host bridges IPv6 traffic between its networks, which an IPv4-only firewall review never sees. The kernel's Documentation/networking/ip-sysctl.rst describes both; muster rates it 중 for the same reason as IPv4 forwarding - harmless on a single network, a hole in the segmentation on more than one. Both values must be in params.allowed_forward, default [0], the parameter IPv4 forwarding reads too, so a router or container host names 1 once for both families. muster judges the effective, running value; the sysctl.d side rides along as drift. The control reads NOT_APPLICABLE when the kernel has no IPv6 (built without it, or booted with ipv6.disable=1) and when IPv6 is switched off on all and on default interfaces through disable_ipv6 - a host that turned IPv6 off is not judged on defaults it never uses. Stock Ubuntu and EL9 pass with 0 and 0.
description_ko: net.ipv6.conf.all.forwarding 이 1 이면 모든 인터페이스가 IPv6 패킷을 포워딩하며 라우터로 동작하고, net.ipv6.conf.default.forwarding 은 나중에 만들어지는 인터페이스가 시작할 때의 값입니다. 두 값이 함께 호스트가 네트워크 사이에서 IPv6 트래픽을 잇는지 결정하며, IPv4 만 보는 방화벽 검토에서는 드러나지 않습니다. 커널 문서 Documentation/networking/ip-sysctl.rst 가 두 값을 설명합니다. IPv4 포워딩과 같은 이유, 즉 단일 네트워크에서는 무해하지만 여러 네트워크에서는 망 분리의 구멍이 되므로 muster 는 중요도를 중으로 둡니다. 두 값 모두 IPv4 포워딩도 읽는 params.allowed_forward(기본값 [0])에 있어야 하므로 라우터나 컨테이너 호스트는 1 을 한 번만 적으면 두 계열에 모두 적용됩니다. muster 는 실행 중인 실효값을 판정하고 sysctl.d 쪽은 차이로 함께 보고합니다. 커널에 IPv6 가 없거나(빌드하지 않았거나 ipv6.disable=1 로 부팅) disable_ipv6 로 all 과 default 인터페이스 모두에서 IPv6 를 끈 경우 NOT_APPLICABLE 입니다. IPv6 를 끈 호스트를 쓰지도 않는 기본값으로 판정하지 않습니다. 기본 Ubuntu 와 EL9 은 0 과 0 으로 통과합니다.
category: beyond
importance: 중
automation: auto
references:
  stig:
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-254025 }
  nist_800_53: ["CM-6"]
requires_facts: ">=1"
applies_when:
  - { fact: env.container, op: eq, expected: none }
  - { fact: net.sysctl.ipv6_all_disable_ipv6, op: eq, expected: 0 }
  - { fact: net.sysctl.ipv6_default_disable_ipv6, op: eq, expected: 0 }
absent_means: not_applicable
params:
  allowed_forward: { type: list<int>, default: [0], description: "forwarding values the host accepts - 0 for a host that only serves; a router or a container host names 1" }
checks:
  - { fact: net.sysctl.ipv6_all_forwarding, op: in, expected: "${allowed_forward}" }
  - { fact: net.sysctl.ipv6_default_forwarding, op: in, expected: "${allowed_forward}" }
remediation:
  text_en: Write net.ipv6.conf.all.forwarding = 0 and net.ipv6.conf.default.forwarding = 0 into a file under /etc/sysctl.d and apply it with sysctl --system; they take effect at once. A router, VPN gateway or container host names 1 in params.allowed_forward instead - turning forwarding off there cuts its clients off.
  text_ko: /etc/sysctl.d 아래 파일에 net.ipv6.conf.all.forwarding = 0 과 net.ipv6.conf.default.forwarding = 0 을 적고 sysctl --system 으로 적용합니다. 즉시 반영됩니다. 라우터, VPN 게이트웨이, 컨테이너 호스트는 포워딩을 끄면 클라이언트가 끊기므로 대신 params.allowed_forward 에 1 을 적습니다.
  risk: none
  idempotent: true
