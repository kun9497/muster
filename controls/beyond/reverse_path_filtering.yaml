id: muster.beyond.reverse_path_filtering
title_en: The host drops IPv4 packets whose source could not have come in on their interface, and logs them
title_ko: 호스트는 들어온 인터페이스로 올 수 없는 출발지의 IPv4 패킷을 버리고 기록한다
description_en: Reverse-path filtering drops a packet whose source address the host would not route back out of the interface it arrived on - the mark of a spoofed source - and log_martians writes such impossible packets to the kernel log so an operator can see them. net.ipv4.conf.all.rp_filter and net.ipv4.conf.default.rp_filter must each be 1 (strict - the reply must leave by the same interface) or 2 (loose - the source must be reachable by some interface, the value systemd's 50-default.conf sets where systemd ships it, and the right one for asymmetric routing); 0 turns the check off. net.ipv4.conf.all.log_martians and net.ipv4.conf.default.log_martians must both be 1. The kernel's Documentation/networking/ip-sysctl.rst describes the knobs and RFC 3704 the filtering; muster rates it 중 because spoofed sources are the basis of reflection attacks and of slipping past address-based rules, and logging is the only way the host tells anyone. muster judges the effective, running value; the sysctl.d side rides along as drift. A value the kernel does not publish reads FAIL - one missing value is enough, and a kernel that publishes none of them reads FAIL too. Stock Ubuntu 22.04 FAILs - rp_filter is 2 on both (procps' 10-network-security.conf and systemd's 50-default.conf, which systemd ships on Ubuntu 22.04 and EL9 and Ubuntu 24.04 does not) but log_martians is 0 on both. Stock EL9 FAILs as well - log_martians is 0, and all.rp_filter stays at the kernel's 0 because 50-default.conf's glob excludes all while every interface takes 2 from default; the kernel filters by the larger of all and the interface's value, so such a host still filters, but all is the value judged, as the benchmarks judge it.
description_ko: 역경로 필터링은 들어온 인터페이스로 되돌려 보낼 수 없는 출발지 주소의 패킷, 즉 위조된 출발지의 표시를 버리며, log_martians 는 그런 불가능한 패킷을 커널 로그에 남겨 운영자가 볼 수 있게 합니다. net.ipv4.conf.all.rp_filter 와 net.ipv4.conf.default.rp_filter 는 각각 1(strict, 응답이 같은 인터페이스로 나가야 함) 또는 2(loose, 어떤 인터페이스로든 출발지에 도달할 수 있어야 함. systemd 가 50-default.conf 를 배포하는 곳에서 그 파일이 설정하는 값이며 비대칭 라우팅에 맞는 값)여야 하고, 0 은 검사를 끕니다. net.ipv4.conf.all.log_martians 와 net.ipv4.conf.default.log_martians 는 모두 1 이어야 합니다. 커널 문서 Documentation/networking/ip-sysctl.rst 가 값들을, RFC 3704 가 필터링을 설명합니다. 위조된 출발지는 반사 공격과 주소 기반 규칙 우회의 바탕이고 기록은 호스트가 누군가에게 알리는 유일한 방법이므로 muster 는 중요도를 중으로 둡니다. muster 는 실행 중인 실효값을 판정하고 sysctl.d 쪽은 차이로 함께 보고합니다. 커널이 내놓지 않는 값이 하나라도 있으면 FAIL 이며, 어느 값도 내놓지 않는 커널도 FAIL 입니다. 기본 Ubuntu 22.04 는 FAIL 입니다. rp_filter 는 둘 다 2 이지만(procps 의 10-network-security.conf 와 systemd 의 50-default.conf. systemd 는 이 파일을 Ubuntu 22.04 와 EL9 에서 배포하고 Ubuntu 24.04 에서는 배포하지 않음) log_martians 가 둘 다 0 입니다. 기본 EL9 도 FAIL 입니다. log_martians 가 0 이고, 50-default.conf 의 glob 이 all 을 제외하므로 all.rp_filter 는 커널 기본값 0 에 머물며 모든 인터페이스는 default 에서 2 를 받습니다. 커널은 all 과 인터페이스 값 중 큰 값으로 필터링하므로 그런 호스트도 필터링은 하지만, 벤치마크처럼 판정하는 값은 all 입니다.
category: beyond
importance: 중
automation: auto
references:
  stig:
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-253025 }
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-253030 }
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-253035 }
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-253050 }
  nist_800_53: ["CM-6"]
requires_facts: ">=1"
applies_when:
  - { fact: env.container, op: eq, expected: none }
absent_means: fail
checks:
  - { fact: net.sysctl.ipv4_all_rp_filter, op: in, expected: [1, 2] }
  - { fact: net.sysctl.ipv4_default_rp_filter, op: in, expected: [1, 2] }
  - { fact: net.sysctl.ipv4_all_log_martians, op: eq, expected: 1 }
  - { fact: net.sysctl.ipv4_default_log_martians, op: eq, expected: 1 }
remediation:
  text_en: Write net.ipv4.conf.all.log_martians = 1 and net.ipv4.conf.default.log_martians = 1, and rp_filter = 1 or 2 for all and default if they are 0, into a file under /etc/sysctl.d and apply it with sysctl --system; they take effect at once. Choose 2 on a host with asymmetric routes (several uplinks, policy routing), where strict filtering drops legitimate replies.
  text_ko: net.ipv4.conf.all.log_martians = 1 과 net.ipv4.conf.default.log_martians = 1 을, rp_filter 가 0 이면 all 과 default 에 1 또는 2 를 /etc/sysctl.d 아래 파일에 적고 sysctl --system 으로 적용합니다. 즉시 반영됩니다. 비대칭 경로가 있는 호스트(여러 업링크, 정책 라우팅)에서는 strict 필터링이 정상 응답을 버리므로 2 를 고릅니다.
  risk: none
  idempotent: true
