id: muster.beyond.reverse_path_filtering
title_en: The host drops IPv4 packets whose source could not have come in on their interface, and logs them
title_ko: 호스트는 들어온 인터페이스로 올 수 없는 출발지의 IPv4 패킷을 버리고 기록한다
description_en: Reverse-path filtering drops a packet whose source address the host would not route back out of the interface it arrived on - the mark of a spoofed source - and log_martians writes such impossible packets to the kernel log so an operator can see them. net.ipv4.conf.all.rp_filter and net.ipv4.conf.default.rp_filter must each be 1 (strict - the reply must leave by the same interface) or 2 (loose - the source must be reachable by some interface, the value systemd's 50-default.conf sets where systemd ships it, and the right one for asymmetric routing); 0 turns the check off. net.ipv4.conf.all.log_martians and net.ipv4.conf.default.log_martians must both be 1. The kernel's Documentation/networking/ip-sysctl.rst describes the knobs and RFC 3704 the filtering; muster rates it 중 because spoofed sources are the basis of reflection attacks and of slipping past address-based rules, and logging is the only way the host tells anyone. muster judges the effective, running value; the sysctl.d side rides along as drift. A value the kernel does not publish reads FAIL - one missing value is enough, and a kernel that publishes none of them reads FAIL too. Stock Ubuntu 22.04 FAILs - rp_filter is 2 on both (procps' 10-network-security.conf and systemd's 50-default.conf, which systemd ships on Ubuntu 22.04 and EL9 and Ubuntu 24.04 does not) but log_martians is 0 on both. Stock EL9 FAILs as well - log_martians is 0, and all.rp_filter stays at the kernel's 0 because the sysctl.d globs exclude all while every interface takes 1 from default (EL's 50-redhat.conf is read after systemd's 50-default.conf and sets 1); the kernel filters by the larger of all and the interface's value, so such a host still filters, but all is the value judged, as the benchmarks judge it.
description_ko: 역경로 필터링은 들어온 인터페이스로 되돌려 보낼 수 없는 출발지 주소의 패킷, 즉 위조된 출발지의 표시를 버리며, log_martians 는 그런 불가능한 패킷을 커널 로그에 남겨 운영자가 볼 수 있게 합니다. net.ipv4.conf.all.rp_filter 와 net.ipv4.conf.default.rp_filter 는 각각 1(strict, 응답이 같은 인터페이스로 나가야 함) 또는 2(loose, 어떤 인터페이스로든 출발지에 도달할 수 있어야 함. systemd 가 50-default.conf 를 배포하는 곳에서 그 파일이 설정하는 값이며 비대칭 라우팅에 맞는 값)여야 하고, 0 은 검사를 끕니다. net.ipv4.conf.all.log_martians 와 net.ipv4.conf.default.log_martians 는 모두 1 이어야 합니다. 커널 문서 Documentation/networking/ip-sysctl.rst 가 값들을, RFC 3704 가 필터링을 설명합니다. 위조된 출발지는 반사 공격과 주소 기반 규칙 우회의 바탕이고 기록은 호스트가 누군가에게 알리는 유일한 방법이므로 muster 는 중요도를 중으로 둡니다. muster 는 실행 중인 실효값을 판정하고 sysctl.d 쪽은 차이로 함께 보고합니다. 커널이 내놓지 않는 값이 하나라도 있으면 FAIL 이며, 어느 값도 내놓지 않는 커널도 FAIL 입니다. 기본 Ubuntu 22.04 는 FAIL 입니다. rp_filter 는 둘 다 2 이지만(procps 의 10-network-security.conf 와 systemd 의 50-default.conf. systemd 는 이 파일을 Ubuntu 22.04 와 EL9 에서 배포하고 Ubuntu 24.04 에서는 배포하지 않음) log_martians 가 둘 다 0 입니다. 기본 EL9 도 FAIL 입니다. log_martians 가 0 이고, sysctl.d 의 glob 이 all 을 제외하므로 all.rp_filter 는 커널 기본값 0 에 머물며 모든 인터페이스는 default 에서 1 을 받습니다(EL 의 50-redhat.conf 가 systemd 의 50-default.conf 다음에 읽혀 1 을 설정함). 커널은 all 과 인터페이스 값 중 큰 값으로 필터링하므로 그런 호스트도 필터링은 하지만, 벤치마크처럼 판정하는 값은 all 입니다.
category: beyond
importance: 중
automation: auto
references:
  stig:
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-253025 }
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-253030 }
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-253035 }
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-253050 }
  nist_800_53: ["CM-6"]
requires_facts: ">=1"
applies_when:
  - { fact: env.container, op: eq, expected: none }
absent_means: fail
checks:
  - { fact: net.sysctl.ipv4_all_rp_filter, op: in, expected: [1, 2] }
  - { fact: net.sysctl.ipv4_default_rp_filter, op: in, expected: [1, 2] }
  - { fact: net.sysctl.ipv4_all_log_martians, op: eq, expected: 1 }
  - { fact: net.sysctl.ipv4_default_log_martians, op: eq, expected: 1 }
remediation:
  text_en: Write net.ipv4.conf.all.log_martians = 1 and net.ipv4.conf.default.log_martians = 1, and rp_filter = 1 or 2 for all and default if they are 0, into /etc/sysctl.d/99-muster-reverse-path-filtering.conf and apply it with sysctl --system; they take effect at once. The review script writes 1 (strict), which drops asymmetrically routed traffic, replies that come back on another interface included; a host with asymmetric routes (several uplinks, policy routing) sets 2 instead. A value set in /etc/sysctl.conf, or in a sysctl.d file that sorts after 99-muster-reverse-path-filtering.conf, still wins at boot; correct it there. The review script never follows a symlink; a 99-muster-reverse-path-filtering.conf that is a symlink (a mask) is left as is and the block stops.
  text_ko: net.ipv4.conf.all.log_martians = 1 과 net.ipv4.conf.default.log_martians = 1 을, rp_filter 가 0 이면 all 과 default 에 1 또는 2 를 /etc/sysctl.d/99-muster-reverse-path-filtering.conf 에 적고 sysctl --system 으로 적용합니다. 즉시 반영됩니다. 검토 스크립트는 1(strict)을 쓰며, 이 값은 다른 인터페이스로 돌아오는 응답을 포함해 비대칭으로 라우팅되는 트래픽을 버립니다. 비대칭 경로가 있는 호스트(여러 업링크, 정책 라우팅)는 대신 2 를 설정합니다. /etc/sysctl.conf나 99-muster-reverse-path-filtering.conf 뒤에 정렬되는 sysctl.d 파일에 둔 값이 부팅 때 여전히 이기므로 그 파일을 고치십시오. 검토 스크립트는 심볼릭 링크를 따라가지 않으므로, 심볼릭 링크(마스크)인 99-muster-reverse-path-filtering.conf 는 그대로 두고 그 블록을 멈춥니다.
  risk: restart_service
  idempotent: true
  sysctl: [net.ipv4.conf.all.rp_filter, net.ipv4.conf.default.rp_filter, net.ipv4.conf.all.log_martians, net.ipv4.conf.default.log_martians]
  backup: [/etc/sysctl.d/99-muster-reverse-path-filtering.conf]
  script: |
    f=/etc/sysctl.d/99-muster-reverse-path-filtering.conf
    if [ -L "$f" ]; then log "muster.beyond.reverse_path_filtering: $f is a symlink (a mask), left as is"; exit 1; fi
    put() {
      sysctl -q -w "$1=$2"
      if grep -q "^$1 " "$f" 2>/dev/null; then sed -i "s|^$1 .*|$1 = $2|" "$f"; else { if [ -s "$f" ] && [ -n "$(tail -c1 "$f")" ]; then echo >> "$f"; fi; printf '%s = %s\n' "$1" "$2" >> "$f"; }; fi
    }
    case "$(sysctl -n net.ipv4.conf.all.rp_filter)" in 1|2) ;; *) put net.ipv4.conf.all.rp_filter 1;; esac
    case "$(sysctl -n net.ipv4.conf.default.rp_filter)" in 1|2) ;; *) put net.ipv4.conf.default.rp_filter 1;; esac
    case "$(sysctl -n net.ipv4.conf.all.log_martians)" in 1) ;; *) put net.ipv4.conf.all.log_martians 1;; esac
    case "$(sysctl -n net.ipv4.conf.default.log_martians)" in 1) ;; *) put net.ipv4.conf.default.log_martians 1;; esac
    if [ -f "$f" ] && [ ! -L "$f" ]; then chmod 644 "$f"; fi
  validate: |
    case "$(sysctl -n net.ipv4.conf.all.rp_filter)" in 1|2) ;; *) false;; esac && case "$(sysctl -n net.ipv4.conf.default.rp_filter)" in 1|2) ;; *) false;; esac && case "$(sysctl -n net.ipv4.conf.all.log_martians)" in 1) ;; *) false;; esac && case "$(sysctl -n net.ipv4.conf.default.log_martians)" in 1) ;; *) false;; esac
