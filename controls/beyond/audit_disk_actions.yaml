id: muster.beyond.audit_disk_actions
title_en: The audit daemon does something visible when its log storage runs short, fills or fails
title_ko: 감사 로그 저장 공간이 부족해지거나 가득 차거나 오류가 나면 감사 데몬이 드러나는 조치를 한다
description_en: auditd.conf(5) gives the daemon five decisions to make about its own storage — space_left_action when free space falls below the first threshold, admin_space_left_action below the second, disk_full_action when the partition is full, disk_error_action when a write fails, and max_log_file_action when the current log reaches its size limit. Two of the documented values lose records. ignore does nothing and says nothing; suspend writes one syslog line and then stops writing audit records while the host runs on as before, so everything that happens afterwards is missing from the trail. muster accepts every other documented value — for the two space thresholds syslog, email, exec, rotate, single and halt (params.allowed_space_actions); for a full disk syslog, rotate, exec, single and halt (params.allowed_disk_full_actions); for a write error syslog, exec, single and halt (params.allowed_disk_error_actions); for a full log file rotate, keep_logs and syslog (params.allowed_rotate_actions). The daemon reads the values without regard to case, and muster compares them lower-cased. It is rated 중 because filling a log partition is something an attacker can cause on purpose, and a daemon that suspends in answer hands the attacker an unrecorded host, but it only matters once the storage has run short. A line auditd.conf does not carry leaves the daemon's compiled default to decide, which nobody chose, so when any one of the five lines is missing the whole control reads MANUAL — even when another line is set to suspend — rather than muster judging a default in the administrator's name. A stock EL9 host ships admin_space_left_action, disk_full_action and disk_error_action all set to suspend and fails; a stock Ubuntu host has no auditd and reads NOT_APPLICABLE, where auditd_active fires instead.
description_ko: auditd.conf(5) 는 데몬이 자신의 저장 공간에 대해 내려야 할 다섯 가지 결정을 정합니다. 여유 공간이 첫 번째 기준 아래로 내려갈 때의 space_left_action, 두 번째 기준 아래의 admin_space_left_action, 파티션이 가득 찼을 때의 disk_full_action, 쓰기가 실패했을 때의 disk_error_action, 현재 로그가 크기 한도에 도달했을 때의 max_log_file_action 입니다. 문서화된 값 가운데 둘은 기록을 잃습니다. ignore 는 아무것도 하지 않고 아무것도 알리지 않으며, suspend 는 syslog 에 한 줄을 남긴 뒤 호스트가 그대로 돌아가는 동안 감사 기록 쓰기를 멈추므로 그 이후의 모든 일이 기록에서 빠집니다. muster 는 그 밖의 문서화된 값을 모두 인정합니다. 두 공간 기준에는 syslog, email, exec, rotate, single, halt(params.allowed_space_actions), 디스크가 가득 찬 경우에는 syslog, rotate, exec, single, halt(params.allowed_disk_full_actions), 쓰기 오류에는 syslog, exec, single, halt(params.allowed_disk_error_actions), 로그 파일이 가득 찬 경우에는 rotate, keep_logs, syslog(params.allowed_rotate_actions) 입니다. 데몬은 값의 대소문자를 구분하지 않고 읽으며 muster 는 소문자로 바꿔 비교합니다. 로그 파티션을 채우는 일은 공격자가 일부러 일으킬 수 있고 그에 대한 답으로 기록을 멈추는 데몬은 공격자에게 기록되지 않는 호스트를 넘겨주지만, 저장 공간이 부족해진 뒤에야 의미가 생기므로 중요도는 중 입니다. auditd.conf 에 없는 줄은 아무도 고르지 않은 데몬의 컴파일 기본값이 결정하게 두므로, 다섯 줄 가운데 하나라도 없으면 다른 줄이 suspend 로 설정되어 있더라도 항목 전체가 MANUAL 이 됩니다. muster 가 관리자의 이름으로 기본값을 판정하지 않기 위해서입니다. EL9 기본 설치는 admin_space_left_action, disk_full_action, disk_error_action 을 모두 suspend 로 배포하므로 실패하고, Ubuntu 기본 설치는 auditd 가 없어 NOT_APPLICABLE 이며 대신 auditd_active 가 경고합니다.
category: beyond
importance: 중
automation: auto
references:
  stig:
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-653020 }
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-653025 }
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-653040 }
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-653050 }
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-653055 }
    - { benchmark: ubuntu2204, version: V2R9, id: UBTU-22-653030 }
    - { benchmark: ubuntu2204, version: V2R9, id: UBTU-22-653040 }
    - { benchmark: ubuntu2404, version: V1R6, id: UBTU-24-900960 }
  nist_800_53: ["AU-5", "AU-5(1)"]
requires_facts: ">=1"
applies_when:
  - { fact: env.container, op: eq, expected: none }
  - { fact: services.auditd.installed, op: eq, expected: true }
absent_means: manual
params:
  allowed_space_actions: { type: list<string>, default: [syslog, email, exec, rotate, single, halt], description: "space_left_action and admin_space_left_action values that keep records or say so (auditd.conf(5)'s list without ignore and suspend)" }
  allowed_disk_full_actions: { type: list<string>, default: [syslog, rotate, exec, single, halt], description: "disk_full_action values that keep records or say so (auditd.conf(5)'s list without ignore and suspend)" }
  allowed_disk_error_actions: { type: list<string>, default: [syslog, exec, single, halt], description: "disk_error_action values that say so (auditd.conf(5)'s list without ignore and suspend)" }
  allowed_rotate_actions: { type: list<string>, default: [rotate, keep_logs, syslog], description: "max_log_file_action values that keep writing records (auditd.conf(5)'s list without ignore and suspend)" }
checks:
  - { fact: audit.conf.space_left_action, op: in, expected: "${allowed_space_actions}" }
  - { fact: audit.conf.admin_space_left_action, op: in, expected: "${allowed_space_actions}" }
  - { fact: audit.conf.disk_full_action, op: in, expected: "${allowed_disk_full_actions}" }
  - { fact: audit.conf.disk_error_action, op: in, expected: "${allowed_disk_error_actions}" }
  - { fact: audit.conf.max_log_file_action, op: in, expected: "${allowed_rotate_actions}" }
remediation:
  text_en: Set all five lines in /etc/audit/auditd.conf — for example space_left_action = email (with action_mail_acct naming a mailbox someone reads) or syslog, admin_space_left_action = single, disk_full_action = halt or single, disk_error_action = halt or syslog, and max_log_file_action = rotate or keep_logs — and make auditd reread the file with service auditd reload (or restart). halt and single take the host out of service when the audit storage fails, which is the point where records would otherwise be lost; choose them only where the host may stop rather than run unrecorded, and syslog or email where it may not.
  text_ko: /etc/audit/auditd.conf 에 다섯 줄을 모두 설정합니다. 예를 들어 space_left_action = email(action_mail_acct 에 누군가 읽는 메일함 지정) 또는 syslog, admin_space_left_action = single, disk_full_action = halt 또는 single, disk_error_action = halt 또는 syslog, max_log_file_action = rotate 또는 keep_logs 로 두고 service auditd reload(또는 restart)로 데몬이 파일을 다시 읽게 합니다. halt 와 single 은 감사 저장 공간이 실패하는 순간, 즉 그렇지 않으면 기록을 잃게 되는 시점에 호스트를 서비스에서 내립니다. 기록 없이 계속 도는 것보다 멈추는 편이 나은 호스트에서만 고르고, 그렇지 않은 호스트에서는 syslog 나 email 을 고르십시오.
  risk: restart_service
  idempotent: true
