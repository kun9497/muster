absent_means: manual
params:
  allowed_space_actions: { type: list<string>, default: [syslog, email, exec, rotate, single, halt], description: "space_left_action and admin_space_left_action values that keep records or say so (auditd.conf(5)'s list without ignore and suspend)" }
  allowed_disk_full_actions: { type: list<string>, default: [syslog, rotate, exec, single, halt], description: "disk_full_action values that keep records or say so (auditd.conf(5)'s list without ignore and suspend)" }
  allowed_disk_error_actions: { type: list<string>, default: [syslog, exec, single, halt], description: "disk_error_action values that say so (auditd.conf(5)'s list without ignore and suspend)" }
  allowed_rotate_actions: { type: list<string>, default: [rotate, keep_logs, syslog], description: "max_log_file_action values that keep writing records (auditd.conf(5)'s list without ignore and suspend)" }
checks:
  - { fact: audit.conf.space_left_action, op: in, expected: "${allowed_space_actions}" }
  - { fact: audit.conf.admin_space_left_action, op: in, expected: "${allowed_space_actions}" }
  - { fact: audit.conf.disk_full_action, op: in, expected: "${allowed_disk_full_actions}" }
  - { fact: audit.conf.disk_error_action, op: in, expected: "${allowed_disk_error_actions}" }
  - { fact: audit.conf.max_log_file_action, op: in, expected: "${allowed_rotate_actions}" }
remediation:
  text_en: 'Set all five lines in /etc/audit/auditd.conf to listed actions (email needs action_mail_acct naming a mailbox someone reads; single and halt stop the host, see the description) and make auditd reread it with auditctl --signal reload. The review script backs up auditd.conf (a symlink is refused) and rewrites every line of each key whose action is outside its list to the first listed value that keeps the host up: syslog or rotate for the space and full-disk keys, syslog for disk_error_action, rotate, keep_logs or syslog for max_log_file_action. It never writes email, exec, single or halt; a key whose list holds no such value is left. rotate deletes logs beyond num_logs; a tuning that lists keep_logs first keeps them. When it changed the file and auditd was running, it sends auditctl --signal reload. auditd.conf is a package configuration file: at the next upgrade dpkg (Debian, Ubuntu) asks about the edited file, and rpm (EL) keeps the edit and writes the package''s version as .rpmnew.'
  text_ko: '/etc/audit/auditd.conf 의 다섯 줄을 모두 목록에 있는 조치로 설정하고(email 은 action_mail_acct 에 누군가 읽는 메일함이 있어야 하며, single 과 halt 는 호스트를 멈춥니다. 설명 참고) auditctl --signal reload 로 데몬이 파일을 다시 읽게 합니다. 검토 스크립트는 auditd.conf 를 백업한 뒤(심볼릭 링크이면 거부합니다), 조치가 목록 밖에 있는 키마다 그 키의 모든 줄을 목록에서 호스트를 멈추지 않는 첫 번째 값으로 고쳐 씁니다. 두 공간 키와 디스크 가득 참 키에는 syslog 나 rotate, disk_error_action 에는 syslog, max_log_file_action 에는 rotate, keep_logs, syslog 가운데 하나입니다. email, exec, single, halt 는 쓰지 않으며, 목록에 쓸 수 있는 값이 없는 키는 운영자에게 맡깁니다. rotate 는 num_logs 를 넘는 로그를 지우며, keep_logs 를 먼저 둔 튜닝은 로그를 남깁니다. 파일을 바꾸었고 auditd 가 실행 중이었으면 auditctl --signal reload 를 보냅니다. auditd.conf 는 패키지 설정 파일이므로, 다음 업그레이드 때 dpkg(Debian, Ubuntu)는 수정된 파일을 어떻게 할지 묻고, rpm(EL)은 수정본을 유지한 채 패키지의 버전을 옆에 .rpmnew 로 씁니다.'
  risk: restart_service
  idempotent: true
  backup: [/etc/audit/auditd.conf]
  script_params: [allowed_space_actions, allowed_disk_full_actions, allowed_disk_error_actions, allowed_rotate_actions]
  script: |
    rm -f "$MB/disk.keys" "$MB/auditd.edited" "$MB/auditd.was-running"
    f=/etc/audit/auditd.conf
    if [ -L "$f" ]; then log "muster.beyond.audit_disk_actions: $f is a symlink, left as is"; exit 1; fi
    if LC_ALL=C systemctl is-active --quiet auditd.service; then : > "$MB/auditd.was-running"; fi
    rd_action() { LC_ALL=C awk -v k="$2" '{ l = $0; sub(/^[[:space:]]+/, "", l); if (l == "" || substr(l, 1, 1) == "#") next; i = index(l, "="); if (i == 0) next; n = substr(l, 1, i - 1); sub(/[[:space:]]+$/, "", n); if (tolower(n) != k) next; v = substr(l, i + 1); sub(/^[[:space:]]+/, "", v); sub(/[[:space:]]+$/, "", v); sub(/ .*$/, "", v); a = tolower(v) } END { print a }' "$1"; }
    one() {
      v=$(rd_action "$f" "$1")
      if [ -n "$v" ]; then
        case " $2 " in *" $v "*) return 0;; esac
      fi
      n=
      for x in $2; do
        case " $3 " in *" $x "*) n=$x; break;; esac
      done
      if [ -z "$n" ]; then
        log "muster.beyond.audit_disk_actions: $1: no writable value in the list in force; left to the operator"
        return 0
      fi
      printf '%s\n' "$1" >> "$MB/disk.keys"
      : > "$MB/auditd.edited"
      LC_ALL=C sed -i -E "s/^[[:space:]]*$1[[:space:]]*=.*/$1 = $n/I" "$f"
    }
    sp=$P_allowed_space_actions
    fu=$P_allowed_disk_full_actions
    er=$P_allowed_disk_error_actions
    ro=$P_allowed_rotate_actions
    one space_left_action "$sp" 'syslog rotate'
    one admin_space_left_action "$sp" 'syslog rotate'
    one disk_full_action "$fu" 'syslog rotate'
    one disk_error_action "$er" 'syslog'
    one max_log_file_action "$ro" 'rotate keep_logs syslog'
    if [ -f "$MB/auditd.edited" ] && [ -f "$MB/auditd.was-running" ]; then auditctl --signal reload; fi
  validate: |
    LC_ALL=C awk -v sp="$P_allowed_space_actions" -v fu="$P_allowed_disk_full_actions" -v er="$P_allowed_disk_error_actions" -v ro="$P_allowed_rotate_actions" -v keys="$(cat "$MB/disk.keys" 2>/dev/null)" 'BEGIN { L["space_left_action"] = sp; L["admin_space_left_action"] = sp; L["disk_full_action"] = fu; L["disk_error_action"] = er; L["max_log_file_action"] = ro } { l = $0; sub(/^[[:space:]]+/, "", l); if (l == "" || substr(l, 1, 1) == "#") next; i = index(l, "="); if (i == 0) next; n = substr(l, 1, i - 1); sub(/[[:space:]]+$/, "", n); n = tolower(n); v = substr(l, i + 1); sub(/^[[:space:]]+/, "", v); sub(/[[:space:]]+$/, "", v); sub(/ .*$/, "", v); a[n] = tolower(v) } END { m = split(keys, K, /[[:space:]]+/); bad = 0; for (j = 1; j <= m; j++) { k = K[j]; if (index(" " L[k] " ", " " a[k] " ") == 0) bad = 1 } exit bad }' /etc/audit/auditd.conf && { [ ! -f "$MB/auditd.was-running" ] || systemctl is-active --quiet auditd.service; }
  rollback: |
    restore /etc/audit/auditd.conf
    if [ -f "$MB/auditd.edited" ] && [ -f "$MB/auditd.was-running" ]; then auditctl --signal reload; fi
