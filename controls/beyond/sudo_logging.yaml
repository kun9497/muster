id: muster.beyond.sudo_logging
title_en: sudo records every command it runs to syslog or to a log file
title_ko: sudo 가 실행하는 모든 명령을 syslog 나 로그 파일에 기록한다
description_en: sudo is how an administrator's own account becomes root, and the line it logs for each command — who ran what, as whom, from which terminal — is the record that ties a root action to a person. sudoers(5) turns the syslog option on by default, so sudo writes that line to syslog (the authpriv facility) unless a Defaults line negates it with !syslog; a logfile= option makes it write the line to a file of its own as well. muster passes a host where syslog logging is on, and a host that switched it off only when an unscoped logfile= names an absolute path. It reads /etc/sudoers and every file of its @includedir in the order sudo reads them, later lines winning, and judges the unscoped Defaults lines only; a Defaults line scoped to a user, host, runas list or command (Defaults:user, Defaults@host, Defaults>runas, Defaults!command) changes one persona and is counted in sudo.defaults.scoped_count rather than judged, so a count above zero is worth reading. It is rated 중 because switching the log off opens nothing, but it cuts the link between a root action and the account that asked for it. A stock Ubuntu or EL9 host sets neither option and passes on sudo's own default. A host without /etc/sudoers reads NOT_APPLICABLE. An @include or @includedir outside the paths muster reads, or a symlinked drop-in muster does not follow, leaves the leaves absent and the control MANUAL naming the path. A sudoers file the run could not read is that read's status and reads ERROR — /etc/sudoers is 0440 root on both families, so a non-root run meets it.
description_ko: sudo 는 관리자 자신의 계정이 root 가 되는 통로이며, 명령마다 남기는 로그 줄(누가, 무엇을, 어떤 사용자로, 어느 터미널에서 실행했는지)은 root 권한의 행위를 사람과 연결하는 기록입니다. sudoers(5) 는 syslog 옵션을 기본으로 켜 두므로, Defaults 줄이 !syslog 로 끄지 않는 한 sudo 는 그 줄을 syslog(authpriv 시설)에 씁니다. logfile= 옵션을 주면 별도의 파일에도 씁니다. muster 는 syslog 기록이 켜져 있는 호스트를 통과시키고, 그것을 끈 호스트는 범위 한정이 없는 logfile= 이 절대 경로를 지정할 때만 통과시킵니다. /etc/sudoers 와 그 @includedir 의 모든 파일을 sudo 가 읽는 순서대로 읽어 나중 줄이 이기게 하며, 범위 한정이 없는 Defaults 줄만 판정합니다. 사용자·호스트·runas 목록·명령으로 범위를 한정한 Defaults 줄(Defaults:user, Defaults@host, Defaults>runas, Defaults!command)은 한 대상에만 적용되므로 판정하지 않고 sudo.defaults.scoped_count 에 개수만 세며, 개수가 0 보다 크면 읽어 볼 가치가 있습니다. 기록을 꺼도 열리는 것은 없지만 root 권한의 행위와 그것을 요청한 계정 사이의 연결이 끊기므로 중요도는 중 입니다. Ubuntu·EL9 기본 설치는 두 옵션 모두 설정하지 않아 sudo 자체 기본값으로 통과합니다. /etc/sudoers 가 없는 호스트는 NOT_APPLICABLE 입니다. muster 가 읽는 경로 밖을 가리키는 @include 나 @includedir, 또는 muster 가 따라가지 않는 심볼릭 링크 drop-in 이 있으면 값이 absent 로 남고 이 항목은 그 경로를 밝힌 MANUAL 이 됩니다. 읽지 못한 sudoers 파일은 그 읽기의 상태가 답이 되어 ERROR 입니다. /etc/sudoers 는 두 계열 모두 0440 root 이므로 root 가 아닌 실행에서 이 경우를 만납니다.
category: beyond
importance: 중
automation: auto
references: { nist_800_53: ["AU-3"] }
requires_facts: ">=1"
applies_when:
  - { fact: env.container, op: eq, expected: none }
  - { fact: sudo.installed, op: eq, expected: true }
absent_means: manual
mechanisms:
  - when:
      - { fact: sudo.log.syslog, op: eq, expected: true }
    checks:
      - { fact: sudo.log.syslog, op: eq, expected: true }
  - when:
      - { fact: sudo.log.syslog, op: eq, expected: false }
    checks:
      - { fact: sudo.log.logfile, op: matches, expected: '^/' }
remediation:
  text_en: Remove !syslog from the unscoped Defaults lines of /etc/sudoers and of the files it includes, or add Defaults logfile="/var/log/sudo.log" so that sudo writes a log of its own. Edit with visudo, which checks the syntax before saving — a sudoers file with a syntax error stops sudo for every account.
  text_ko: /etc/sudoers 와 그것이 포함하는 파일의 범위 한정 없는 Defaults 줄에서 !syslog 를 지우거나, Defaults logfile="/var/log/sudo.log" 를 추가해 sudo 가 자체 로그를 쓰게 합니다. 저장 전에 문법을 검사하는 visudo 로 편집하십시오. 문법 오류가 있는 sudoers 파일은 모든 계정의 sudo 를 멈춥니다.
  risk: none
  idempotent: true
