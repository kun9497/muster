id: muster.beyond.listeners_packaged
title_en: Every process serving a listening socket runs an executable the host's package manager installed
title_ko: 수신 소켓을 제공하는 모든 프로세스는 호스트의 패키지 관리자가 설치한 실행 파일을 실행한다
description_en: A process listening on the network is the first thing an attacker talks to, and an executable no package installed has no maintainer behind it - nobody ships its security updates, nothing verifies its files, and it is also what a backdoor looks like. muster reads every listening TCP and UDP socket, finds the processes whose file descriptors hold it and looks each one's executable up in the host's own dpkg or rpm database; processes.unpackaged_listeners lists the holders whose executable is unpackaged, a snap (snap:<name>), a flatpak, an AppImage or foreign_ns, and the control fails when one of them is not named in params.allowed_executables, which takes exact paths (/usr/local/sbin/mydaemon). An entry is the path exactly as /proc/<pid>/exe resolves it; for a snap that is /snap/<name>/<revision>/..., and the revision changes on every refresh, so a snap you own is better allowed by a waiver on the control than by a path. A daemon under /usr/local or /opt, installed by hand or by a vendor script, is the common honest FAIL; name it in the parameter once you own its updates. A snap daemon and a flatpak are honest FAILs as read - the host's package manager did not install them and does not update them. foreign_ns is a process in another mount namespace, typically a container started with --net=host, serving on the host's own network namespace, where its executable cannot be looked up on the host. A socket the kernel holds itself (nfsd, WireGuard) has no owning process and is packaged by nature. The primary source is NIST SP 800-53 CM-7(5), authorised software allow-listing; muster rates it 중 because an unpackaged listener is a finding to explain, not proof of compromise. The control reads MANUAL when the host has no package database (neither dpkg nor rpm) or when the owner of a listening socket could not be matched (owner_status unmatched) - no process this run can see holds it and the pid view may be partial (inside a container, or with hidepid) - or the holder is a zombie thread-group leader whose executable and namespace cannot be read; a non-root run, which cannot read other accounts' file descriptors, reads ERROR, as does a package query that timed out. Stock Ubuntu and EL9 pass - every listener is owned by a packaged daemon, including pid 1 for a socket-activated service.
description_ko: 네트워크에서 수신 대기하는 프로세스는 공격자가 가장 먼저 말을 거는 대상이며, 어떤 패키지도 설치하지 않은 실행 파일에는 관리 주체가 없습니다. 아무도 보안 업데이트를 내지 않고 아무것도 파일을 검증하지 않으며, 백도어도 바로 그런 모습입니다. muster 는 모든 TCP·UDP 수신 소켓을 읽어 파일 디스크립터로 그 소켓을 가진 프로세스를 찾고, 각 프로세스의 실행 파일을 호스트 자신의 dpkg 또는 rpm 데이터베이스에서 조회합니다. processes.unpackaged_listeners 는 실행 파일이 패키지에 속하지 않거나(unpackaged) snap(snap:<name>), flatpak, AppImage, foreign_ns 인 소유 프로세스를 나열하며, 그중 params.allowed_executables 에 없는 것이 하나라도 있으면 실패입니다. 이 파라미터는 정확한 경로(/usr/local/sbin/mydaemon)를 받습니다. 항목은 /proc/<pid>/exe 가 가리키는 경로 그대로이며, snap 은 /snap/<name>/<revision>/... 이고 revision 은 refresh 할 때마다 바뀌므로 직접 관리하는 snap 은 경로보다 이 통제 항목의 예외(waiver)로 허용하는 편이 낫습니다. 직접 또는 벤더 스크립트로 설치한 /usr/local 이나 /opt 아래의 데몬이 흔한 정직한 FAIL 이며, 그 업데이트를 책임지기로 했다면 파라미터에 적습니다. snap 데몬과 flatpak 은 읽은 그대로 정직한 FAIL 입니다. 호스트의 패키지 관리자가 설치하지도 갱신하지도 않기 때문입니다. foreign_ns 는 다른 마운트 네임스페이스의 프로세스, 보통 --net=host 로 시작한 컨테이너가 호스트 자신의 네트워크 네임스페이스에서 서비스하는 경우이며 그 실행 파일은 호스트에서 조회할 수 없습니다. 커널이 직접 가진 소켓(nfsd, WireGuard)은 소유 프로세스가 없고 본래 패키지에 속합니다. 1차 근거는 NIST SP 800-53 CM-7(5)(허가된 소프트웨어 허용 목록)이며, 패키지에 속하지 않은 수신 프로세스는 침해의 증거가 아니라 설명이 필요한 발견이므로 muster 는 중요도를 중으로 둡니다. 호스트에 패키지 데이터베이스가 없거나(dpkg 도 rpm 도 없음), 수신 소켓의 소유자를 대응시키지 못했거나(owner_status unmatched - 이번 실행이 볼 수 있는 프로세스 중 그 소켓을 가진 것이 없고 pid 시야가 부분적일 수 있음 - 컨테이너 안, 또는 hidepid), 소유자가 실행 파일과 네임스페이스를 읽을 수 없는 좀비 스레드 그룹 리더이면 MANUAL 입니다. 다른 계정의 파일 디스크립터를 읽을 수 없는 root 가 아닌 실행과 시간이 초과된 패키지 조회는 ERROR 입니다. 기본 Ubuntu 와 EL9 은 통과합니다. 소켓 활성화 서비스의 pid 1 을 포함해 모든 수신 소켓을 패키지에 속한 데몬이 가지고 있습니다.
category: beyond
importance: 중
automation: auto
references: { nist_800_53: ["CM-7(5)"] }
requires_facts: ">=1"
applies_when:
  - { fact: env.container, op: eq, expected: none }
absent_means: manual
params:
  allowed_executables: { type: list<string>, default: [], description: "executable paths, spelled as processes.unpackaged_listeners spells them, that serve the network on purpose without a package - a vendor daemon under /usr/local or /opt (a snap path carries its revision; waive a snap instead)" }
checks:
  - { fact: processes.unpackaged_listeners, op: none, subject: exe, where: { field: exe, op: not_in, expected: "${allowed_executables}" } }
remediation:
  text_en: For each listed executable, find out who installed it and why it listens. Replace it with the distribution's package where one exists, remove it if nobody can account for it (treat that as an incident), or, when it is meant to be there, name its path in params.allowed_executables and take over its updates. The parameter changes nothing on the host.
  text_ko: 나열된 실행 파일마다 누가 왜 설치했고 왜 수신 대기하는지 확인합니다. 배포판 패키지가 있으면 그것으로 바꾸고, 아무도 설명할 수 없으면 지우고(침해 사고로 다룹니다), 있어야 하는 것이라면 그 경로를 params.allowed_executables 에 적고 업데이트를 책임집니다. 파라미터는 호스트에서 아무것도 바꾸지 않습니다.
  risk: none
  idempotent: true
