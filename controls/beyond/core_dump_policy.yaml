id: muster.beyond.core_dump_policy
title_en: A core dump is thrown away rather than written to disk
title_ko: 코어 덤프가 디스크에 기록되지 않고 버려진다
description_en: A core dump is a copy of a process's memory written to disk, so it carries whatever that process held — a private key, a session token, a password still in a buffer — with none of the access control the process kept it behind. muster reads kernel.core_pattern first and judges the host by the handler it names, first match winning. A pattern piped into systemd-coredump is judged on the coredump.conf chain, where Storage must be none and ProcessSizeMax 0, so the daemon accepts the dump and keeps nothing. A pattern piped into /bin/false or /bin/true throws every dump away and passes on that ground alone. A plain path means the kernel writes the file itself, so the hard core limit that limits.conf and limits.d set for every account ("*") must be 0; that value is in 1024-byte blocks and -1 means unlimited, so a host with no line at all sets no limit. Any other pipe — Ubuntu's apport is the common one — is reported for review rather than judged, because muster cannot know what a third-party handler does with the dump it is given; that is why this control is automation partial and why its judged failures read WARN. A host with neither a systemd-coredump chain nor a limits line has decided nothing at all, and absent_means fail makes that the one FAIL this control can give. The kernel gate that keeps a privileged program out of the dump in the first place is a separate control, suid_dumpable_disabled; coredump.conf(5) and limits.conf(5) document the two configuration sides.
description_ko: 코어 덤프는 프로세스 메모리를 디스크에 그대로 옮겨 적은 것이므로, 개인 키·세션 토큰·버퍼에 남아 있던 비밀번호 등 그 프로세스가 쥐고 있던 것을 프로세스가 지키던 접근 통제 없이 담아냅니다. muster 는 kernel.core_pattern 을 먼저 읽고 그것이 지목하는 처리기로 호스트를 판정하며, 먼저 일치하는 경우가 이깁니다. systemd-coredump 로 파이프되는 패턴은 coredump.conf 체인으로 판정하여 Storage 가 none, ProcessSizeMax 가 0 이어야 데몬이 덤프를 받고도 아무것도 남기지 않습니다. /bin/false 나 /bin/true 로 파이프되는 패턴은 모든 덤프를 버리므로 그 사실만으로 통과합니다. 일반 경로는 커널이 직접 파일을 쓴다는 뜻이므로 limits.conf 와 limits.d 가 모든 계정("*")에 설정하는 hard core 한도가 0 이어야 합니다. 이 값의 단위는 1024 바이트 블록이고 -1 은 무제한이므로 아무 줄도 없는 호스트는 한도를 두지 않은 것입니다. 그 밖의 파이프(Ubuntu 의 apport 가 대표적)는 판정하지 않고 검토 대상으로 보고합니다. 제3자 처리기가 건네받은 덤프로 무엇을 하는지 muster 가 알 수 없기 때문이며, 이 항목이 automation partial 이고 판정 실패가 WARN 으로 보고되는 이유도 그것입니다. systemd-coredump 체인도 limits 줄도 없는 호스트는 아무것도 결정하지 않은 것이고, absent_means fail 에 따라 그것이 이 항목이 낼 수 있는 유일한 FAIL 입니다. 권한을 바꾼 프로그램을 애초에 덤프 대상에서 빼는 커널 차원의 차단은 별도 항목 suid_dumpable_disabled 에서 다룹니다. 두 설정 축은 coredump.conf(5) 와 limits.conf(5) 에 문서화되어 있습니다.
category: beyond
importance: 중
automation: partial
references:
  stig:
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-213040 }
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-213085 }
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-213090 }
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-213095 }
    - { benchmark: ubuntu2204, version: V2R9, id: UBTU-22-213015 }
    - { benchmark: ubuntu2404, version: V1R6, id: UBTU-24-600070 }
  nist_800_53: ["CM-6", "SC-24"]
requires_facts: ">=1"
applies_when:
  - { fact: env.container, op: eq, expected: none }
absent_means: fail
mechanisms:
  - when:
      - { fact: coredump.core_pattern, op: matches, expected: '^\|.*systemd-coredump' }
    checks:
      - { fact: coredump.systemd.storage, op: eq, expected: none }
      - { fact: coredump.systemd.process_size_max, op: eq, expected: 0 }
  - when:
      - { fact: coredump.core_pattern, op: matches, expected: '^\|/bin/(false|true)( |$)' }
    checks:
      - { fact: coredump.core_pattern, op: matches, expected: '^\|/bin/' }
  - when:
      - { fact: coredump.core_pattern, op: not_matches, expected: '^\|' }
    checks:
      - { fact: coredump.limits.hard_core, op: eq, expected: 0 }
  - when:
      - { fact: coredump.core_pattern, op: matches, expected: '^\|' }
    checks:
      - { fact: coredump.core_pattern, op: not_matches, expected: '^\|' }
remediation:
  text_en: On a systemd host set Storage=none and ProcessSizeMax=0 in a drop-in under /etc/systemd/coredump.conf.d/ and reload systemd; otherwise set the kernel handler to a discard with kernel.core_pattern = |/bin/false in a file under /etc/sysctl.d, and add "* hard core 0" to /etc/security/limits.conf (or a file under /etc/security/limits.d/) so that a login session cannot raise the limit again. A host running apport or another third-party handler has to decide what that handler keeps before this control can pass. Replacing an existing handler stops crash reports reaching it, so confirm that nothing depends on them.
  text_ko: systemd 호스트에서는 /etc/systemd/coredump.conf.d/ 아래 드롭인에 Storage=none 과 ProcessSizeMax=0 을 설정하고 systemd 를 다시 읽어들입니다. 그렇지 않은 호스트에서는 /etc/sysctl.d 아래 파일에 kernel.core_pattern = |/bin/false 를 적어 커널 처리기를 폐기로 바꾸고, 로그인 세션이 한도를 다시 올리지 못하도록 /etc/security/limits.conf(또는 /etc/security/limits.d/ 아래 파일)에 "* hard core 0" 을 추가합니다. apport 등 제3자 처리기를 쓰는 호스트는 그 처리기가 무엇을 보관하는지 먼저 결정해야 이 항목을 통과할 수 있습니다. 기존 처리기를 교체하면 크래시 리포트가 더 이상 전달되지 않으므로 그것에 의존하는 것이 없는지 확인하십시오.
  risk: restart_service
  idempotent: true
