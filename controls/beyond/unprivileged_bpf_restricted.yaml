id: muster.beyond.unprivileged_bpf_restricted
title_en: An unprivileged account cannot load a BPF program, and the JIT blinds its constants
title_ko: 비권한 계정이 BPF 프로그램을 적재할 수 없고 JIT 가 상수를 가린다
description_en: The BPF syscall compiles a program supplied from user space and runs it inside the kernel, so kernel.unprivileged_bpf_disabled must be 1 (the syscall is refused to a caller without CAP_BPF until the next boot) or 2 (refused, and the knob may no longer be relaxed), and net.core.bpf_jit_harden must be 1 (the just-in-time compiler blinds the constants it emits for an unprivileged program) or 2 (for every program), so that a constant an attacker chose cannot be reached as executable kernel text. Both are described in Documentation/admin-guide/sysctl/kernel.rst and net.rst. It is rated 하 rather than higher because reaching it needs the ability to run code on the host already, and because blinding costs performance an operator may knowingly decline. Note that net.core.bpf_jit_harden defaults to 0 and neither the stock Ubuntu nor the stock EL9 sysctl.d sets it, so every stock host fails this control — that is a real weakness of the shipped kernel configuration rather than a muster quirk, and it is kept as its own low-importance control precisely so that the failure does not colour the ptrace and profiling verdict beside it. A kernel built without the BPF syscall or without the JIT carries neither value, which is not_applicable — there is nothing there to restrict.
description_ko: BPF 시스템 호출은 사용자 공간이 건넨 프로그램을 컴파일해 커널 안에서 실행하므로, kernel.unprivileged_bpf_disabled 는 1(CAP_BPF 없는 호출자에게 다음 부팅 전까지 거부) 또는 2(거부하며 이후 완화 불가)여야 하고, net.core.bpf_jit_harden 은 1(비권한 프로그램에 대해 JIT 가 생성 상수를 가림) 또는 2(모든 프로그램에 대해)여야 공격자가 고른 상수가 실행 가능한 커널 코드로 도달하지 못합니다. 두 값 모두 Documentation/admin-guide/sysctl/kernel.rst 와 net.rst 에 설명되어 있습니다. 악용하려면 이미 호스트에서 코드를 실행할 수 있어야 하고 상수 가림은 운영자가 알고서 포기할 수 있는 성능 비용을 수반하므로 중요도는 하 입니다. net.core.bpf_jit_harden 의 기본값은 0 이고 Ubuntu 기본 설치도 EL9 기본 설치도 sysctl.d 에서 이를 바꾸지 않으므로 모든 기본 설치 호스트가 이 항목에서 실패합니다. 이는 muster 의 특이 동작이 아니라 배포 커널 설정의 실제 약점이며, 그 실패가 옆의 ptrace·프로파일링 판정을 물들이지 않도록 일부러 낮은 중요도의 별도 항목으로 둡니다. BPF 시스템 호출이나 JIT 없이 빌드된 커널에는 두 값이 모두 없고, 제한할 대상이 없으므로 not_applicable 입니다.
category: beyond
importance: 하
automation: auto
references:
  stig:
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-213075 }
  nist_800_53: ["SC-2"]
requires_facts: ">=1"
applies_when:
  - { fact: env.container, op: eq, expected: none }
absent_means: not_applicable
checks:
  - { fact: kernel.sysctl.unprivileged_bpf_disabled, op: in, expected: [1, 2] }
  - { fact: kernel.sysctl.bpf_jit_harden, op: in, expected: [1, 2] }
remediation:
  text_en: Write kernel.unprivileged_bpf_disabled = 1 and net.core.bpf_jit_harden = 2 into a file under /etc/sysctl.d and apply it with sysctl --system. Check first whether any observability or container-networking agent on the host loads BPF programs as an unprivileged account; those agents normally run with CAP_BPF and are unaffected, and constant blinding costs throughput on a host whose packet path is BPF-based.
  text_ko: /etc/sysctl.d 아래 파일에 kernel.unprivileged_bpf_disabled = 1 과 net.core.bpf_jit_harden = 2 를 적고 sysctl --system 으로 적용합니다. 호스트의 관측·컨테이너 네트워킹 에이전트가 비권한 계정으로 BPF 프로그램을 적재하지는 않는지 먼저 확인하십시오. 그런 에이전트는 보통 CAP_BPF 로 실행되어 영향을 받지 않으며, 상수 가림은 패킷 경로가 BPF 기반인 호스트에서 처리량 비용이 있습니다.
  risk: none
  idempotent: true
