id: muster.beyond.source_routing_rejected
title_en: The host rejects source-routed IPv4 packets
title_ko: 호스트는 소스 라우팅된 IPv4 패킷을 거부한다
description_en: A source-routed packet carries the path it wants to take in its own header, so a sender can steer it around the filters and routes the network's owner chose, or make a reply come back through a host the sender controls. net.ipv4.conf.all.accept_source_route and net.ipv4.conf.default.accept_source_route must both be 0. The kernel's Documentation/networking/ip-sysctl.rst describes them; muster rates it 중 because source routing has no legitimate use on a server today and accepting it hands the sender control of the path. muster judges the effective, running value; the sysctl.d side rides along as drift. A value the kernel does not publish reads FAIL - one missing value is enough, and a kernel that publishes none of them reads FAIL too. Stock Ubuntu 22.04 and EL9 pass - the kernel rejects source routing on all by default, and systemd's 50-default.conf, where systemd ships it (Ubuntu 22.04, EL9; Ubuntu 24.04 ships none), sets the default interface value to 0.
description_ko: 소스 라우팅된 패킷은 지나갈 경로를 자기 헤더에 담고 있어, 보낸 쪽이 네트워크 소유자가 정한 필터와 경로를 우회하게 하거나 응답이 자기가 통제하는 호스트를 거쳐 돌아오게 할 수 있습니다. net.ipv4.conf.all.accept_source_route 와 net.ipv4.conf.default.accept_source_route 가 모두 0 이어야 합니다. 커널 문서 Documentation/networking/ip-sysctl.rst 가 두 값을 설명합니다. 오늘날 서버에서 소스 라우팅의 정당한 용도는 없고 이를 받아들이면 보낸 쪽에 경로의 통제권을 넘기므로 muster 는 중요도를 중으로 둡니다. muster 는 실행 중인 실효값을 판정하고 sysctl.d 쪽은 차이로 함께 보고합니다. 커널이 내놓지 않는 값이 하나라도 있으면 FAIL 이며, 어느 값도 내놓지 않는 커널도 FAIL 입니다. 기본 Ubuntu 22.04 와 EL9 은 통과합니다. 커널은 기본으로 all 에서 소스 라우팅을 거부하고, systemd 가 50-default.conf 를 배포하는 곳(Ubuntu 22.04, EL9. Ubuntu 24.04 에는 없음)에서는 그 파일이 default 인터페이스 값을 0 으로 설정합니다.
category: beyond
importance: 중
automation: auto
references:
  cis:
    - { benchmark: rhel9, version: "2.0.0", rec: "3.3.8" }
    - { benchmark: ubuntu2204, version: "2.0.0", rec: "3.3.8" }
    - { benchmark: ubuntu2404, version: "1.0.0", rec: "3.3.8" }
  stig:
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-253020 }
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-253045 }
  nist_800_53: ["CM-6"]
requires_facts: ">=1"
applies_when:
  - { fact: env.container, op: eq, expected: none }
absent_means: fail
checks:
  - { fact: net.sysctl.ipv4_all_accept_source_route, op: eq, expected: 0 }
  - { fact: net.sysctl.ipv4_default_accept_source_route, op: eq, expected: 0 }
remediation:
  text_en: Write net.ipv4.conf.all.accept_source_route = 0 and net.ipv4.conf.default.accept_source_route = 0 into /etc/sysctl.d/99-muster-source-routing-rejected.conf and apply it with sysctl --system; they take effect at once. A value set in /etc/sysctl.conf, or in a sysctl.d file that sorts after 99-muster-source-routing-rejected.conf, still wins at boot; correct it there. The review script never follows a symlink; a 99-muster-source-routing-rejected.conf that is a symlink (a mask) is left as is and the block stops.
  text_ko: /etc/sysctl.d/99-muster-source-routing-rejected.conf 에 net.ipv4.conf.all.accept_source_route = 0 과 net.ipv4.conf.default.accept_source_route = 0 을 적고 sysctl --system 으로 적용합니다. 즉시 반영됩니다. /etc/sysctl.conf나 99-muster-source-routing-rejected.conf 뒤에 정렬되는 sysctl.d 파일에 둔 값이 부팅 때 여전히 이기므로 그 파일을 고치십시오. 검토 스크립트는 심볼릭 링크를 따라가지 않으므로, 심볼릭 링크(마스크)인 99-muster-source-routing-rejected.conf 는 그대로 두고 그 블록을 멈춥니다.
  risk: none
  idempotent: true
  sysctl: [net.ipv4.conf.all.accept_source_route, net.ipv4.conf.default.accept_source_route]
  backup: [/etc/sysctl.d/99-muster-source-routing-rejected.conf]
  script: |
    f=/etc/sysctl.d/99-muster-source-routing-rejected.conf
    if [ -L "$f" ]; then log "muster.beyond.source_routing_rejected: $f is a symlink (a mask), left as is"; exit 1; fi
    put() {
      sysctl -q -w "$1=$2"
      if grep -q "^$1 " "$f" 2>/dev/null; then sed -i "s|^$1 .*|$1 = $2|" "$f"; else { if [ -s "$f" ] && [ -n "$(tail -c1 "$f")" ]; then echo >> "$f"; fi; printf '%s = %s\n' "$1" "$2" >> "$f"; }; fi
    }
    case "$(sysctl -n net.ipv4.conf.all.accept_source_route)" in 0) ;; *) put net.ipv4.conf.all.accept_source_route 0;; esac
    case "$(sysctl -n net.ipv4.conf.default.accept_source_route)" in 0) ;; *) put net.ipv4.conf.default.accept_source_route 0;; esac
    if [ -f "$f" ] && [ ! -L "$f" ]; then chmod 644 "$f"; fi
  validate: |
    case "$(sysctl -n net.ipv4.conf.all.accept_source_route)" in 0) ;; *) false;; esac && case "$(sysctl -n net.ipv4.conf.default.accept_source_route)" in 0) ;; *) false;; esac
