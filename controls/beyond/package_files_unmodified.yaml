id: muster.beyond.package_files_unmodified
title_en: Every packaged file still matches the package database
title_ko: 패키지로 설치된 모든 파일이 패키지 데이터베이스와 여전히 일치한다
description_en: A file a package installed that no longer matches the package database — different content, mode, owner, device, link target or file capabilities, or gone — is either a change that went around the package manager or a replacement nobody made on purpose, and a replaced binary under /usr/bin is the classic way an intruder stays on a host. rpm -Va (rpm(8)) and dpkg --verify (dpkg(1)) compare every installed file with the digest and attributes the database records, and muster passes the host when no packaged file differs. The comparison has to read every file, so it runs only under collect --deep, as root, and without --no-verify; a run without it reads MANUAL, a run that was not root, timed out or could not read its package database reads ERROR, and a host with neither database reads NOT_APPLICABLE. The raw output is noisy, so the rows pass a filter the snapshot records. Configuration files move to packages.verify.modified_config, which is there for the reader and is not judged, because a changed configuration file is what administration looks like. Documentation files (by type letter, or under /usr/share/doc, man, info and locale), paths dpkg was told not to install (path-exclude), ghost files, files whose only difference is the modification time, files the tool could not test and rows where nothing differs are dropped; packages.verify.filter names the rules and packages.verify.filtered_counts says how many rows each removed. The list is capped at 5000 rows, and a list at its cap reads ERROR(truncated), because a row past the cap is unknown. On a dpkg host a package that ships no md5sums file cannot be checked at all; packages.verify.stats counts them. It is rated 상 because a modified system binary means the host runs code nobody installed. A public Ubuntu or EL9 image passes; the GitHub Actions runner image reads FAIL by design, because its provider changes packaged files after installing them, and that FAIL is the truth of the image.
description_ko: 패키지가 설치한 파일이 패키지 데이터베이스와 더 이상 일치하지 않는다면(내용, mode, 소유자, 장치, 링크 대상, 파일 capability 가 다르거나 파일이 없어졌다면) 패키지 관리자를 거치지 않은 변경이거나 누구도 의도하지 않은 교체이며, /usr/bin 아래의 교체된 실행 파일은 침입자가 호스트에 머무르는 전형적인 방법입니다. rpm -Va(rpm(8))와 dpkg --verify(dpkg(1))는 설치된 모든 파일을 데이터베이스가 기록한 digest 와 속성과 비교하며, muster 는 달라진 패키지 파일이 하나도 없을 때 호스트를 통과시킵니다. 비교하려면 모든 파일을 읽어야 하므로 collect --deep 에서 root 로, --no-verify 없이 실행할 때만 수행됩니다. 수행하지 않은 실행은 MANUAL, root 가 아니었거나 시간이 초과되었거나 패키지 데이터베이스를 읽지 못한 실행은 ERROR, 두 데이터베이스가 모두 없는 호스트는 NOT_APPLICABLE 입니다. 원래 출력에는 잡음이 많으므로 행은 스냅샷에 기록되는 필터를 거칩니다. 설정 파일은 packages.verify.modified_config 로 옮겨져 읽는 사람에게 보여 주되 판정하지 않습니다. 설정 파일이 바뀐 것은 관리하는 모습 그 자체이기 때문입니다. 문서 파일(유형 문자로, 또는 /usr/share/doc, man, info, locale 아래), dpkg 에 설치하지 말라고 지시한 경로(path-exclude), ghost 파일, 수정 시각만 다른 파일, 도구가 검사하지 못한 파일, 아무것도 다르지 않은 행은 버립니다. packages.verify.filter 에 규칙이, packages.verify.filtered_counts 에 규칙별로 제거한 행 수가 있습니다. 목록은 5000 행으로 제한되며, 한도에 이른 목록은 한도 밖의 행을 알 수 없으므로 ERROR(truncated) 입니다. dpkg 호스트에서 md5sums 파일이 없는 패키지는 전혀 검사할 수 없으며 packages.verify.stats 가 그 수를 셉니다. 수정된 시스템 실행 파일은 아무도 설치하지 않은 코드를 호스트가 실행한다는 뜻이므로 중요도는 상 입니다. 공개 Ubuntu·EL9 이미지는 통과하고, GitHub Actions 러너 이미지는 제공자가 설치 후 패키지 파일을 바꾸므로 설계상 FAIL 이며, 그 FAIL 이 그 이미지의 사실입니다.
category: beyond
importance: 상
automation: auto
references: { nist_800_53: ["CM-6"] }
requires_facts: ">=1"
applies_when:
  - { fact: env.container, op: eq, expected: none }
absent_means: fail
checks:
  - { fact: packages.verify.modified, op: none, subject: path, where: { field: path, op: present } }
remediation:
  text_en: For each path in packages.verify.modified, find the package that owns it (rpm -qf, or dpkg -S) and find out why it changed. A change nobody can account for is an incident — keep the file for analysis before replacing it. Otherwise reinstall the package (dnf reinstall, or apt install --reinstall) to put the packaged file back, and make a deliberate local change through a configuration file or a package of your own instead.
  text_ko: packages.verify.modified 의 각 경로마다 소유 패키지를 찾고(rpm -qf 또는 dpkg -S) 바뀐 이유를 확인합니다. 아무도 설명할 수 없는 변경은 침해 사고이므로 교체하기 전에 분석용으로 파일을 보관하십시오. 그렇지 않다면 패키지를 다시 설치해(dnf reinstall 또는 apt install --reinstall) 패키지의 파일을 되돌리고, 의도한 로컬 변경은 설정 파일이나 자체 패키지로 하십시오.
  risk: none
  idempotent: true
