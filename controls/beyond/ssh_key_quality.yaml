id: muster.beyond.ssh_key_quality
title_en: No authorized_keys file holds a DSA key or an RSA key shorter than the minimum
title_ko: 어떤 authorized_keys 파일에도 DSA 키나 최소 길이보다 짧은 RSA 키가 없다
description_en: OpenSSH disabled DSA keys at run time by default in 7.0, stopped building DSA support by default in 9.8 and removed it in 10.0 - EL9's 9.9p1 is still built with it - so an ssh-dss line is dead weight on most servers and a downgrade target on one that still accepts it. An RSA key below 2048 bits is under the size OpenSSH's own ssh-keygen(1) has generated by default since 2014. muster reads the authorized_keys and authorized_keys2 files of every account whose home it reads and fails the host when one holds an ssh-dss key or an RSA key whose modulus is shorter than params.min_rsa_bits. The default of 2048 is stricter than sshd_config(5)'s RequiredRSASize, present from OpenSSH 9.1, whose default of 1024 still admits such a key. Certificate keys and sk-* security-key types are recorded and not judged, and a line muster could not parse is counted in ssh.authorized_keys as evidence only, so the verdict covers the keys it parsed. It is rated 중 because a weak key is a credential that can be forged without being stolen, but only for the one account whose file holds it. An interactive account homed outside the paths muster reads, or a key file behind a symlink muster does not follow, is a hole in the inventory and reads MANUAL naming it; /root is 0700, so a non-root run reads ERROR.
description_ko: OpenSSH 는 7.0 에서 DSA 키를 실행 시 기본으로 비활성화했고, 9.8 에서 DSA 지원을 기본 빌드에서 뺐으며, 10.0 에서 제거했습니다. EL9 의 9.9p1 은 여전히 DSA 를 포함해 빌드됩니다. 따라서 ssh-dss 줄은 대부분의 서버에서 쓸모없는 줄이고, 아직 그것을 받아들이는 서버에서는 다운그레이드 공격의 대상입니다. 2048비트보다 짧은 RSA 키는 OpenSSH 의 ssh-keygen(1) 이 2014년부터 기본으로 만들어 온 크기에 못 미칩니다. muster 는 홈을 읽는 모든 계정의 authorized_keys 와 authorized_keys2 파일을 읽고, ssh-dss 키나 모듈러스가 params.min_rsa_bits 보다 짧은 RSA 키가 있으면 호스트를 실패로 판정합니다. 기본값 2048 은 OpenSSH 9.1 부터 있는 sshd_config(5) 의 RequiredRSASize 보다 엄격하며, 그 기본값 1024 는 그런 키를 여전히 받아들입니다. 인증서 키와 sk-* 보안 키 유형은 기록만 하고 판정하지 않으며, muster 가 해석하지 못한 줄은 ssh.authorized_keys 에 증거로만 세므로 판정은 해석한 키에 대한 것입니다. 약한 키는 훔치지 않고도 위조할 수 있는 자격 증명이지만 그 파일을 가진 한 계정에만 해당하므로 중요도는 중 입니다. muster 가 읽는 경로 밖에 홈이 있는 대화형 계정이나 muster 가 따라가지 않는 심볼릭 링크 뒤의 키 파일은 목록의 구멍이므로 그것을 밝힌 MANUAL 입니다. /root 는 0700 이므로 root 가 아닌 실행은 ERROR 입니다.
category: beyond
importance: 중
automation: auto
references: { nist_800_53: ["IA-5(2)"] }
requires_facts: ">=1"
applies_when:
  - { fact: env.container, op: eq, expected: none }
absent_means: manual
params:
  min_rsa_bits: { type: int, default: 2048, description: "the shortest RSA modulus, in bits, an authorized_keys file may hold (what ssh-keygen -l prints)" }
checks:
  - { fact: ssh.dsa_key_count, op: eq, expected: 0 }
  - { fact: ssh.rsa_keys, op: none, subject: fingerprint, where: { field: bits, op: lt, expected: "${min_rsa_bits}" } }
remediation:
  text_en: Have each key's owner generate a replacement (ssh-keygen -t ed25519, or -t rsa -b 3072) and install it before the old one is removed, then test a login with the new key in a second session. Copy the file first (cp -a <file> <file>.bak) and delete the ssh-dss and short RSA lines, which ssh.rsa_keys names by path, line and fingerprint. Restore with cp -a <file>.bak <file>.
  text_ko: 각 키의 소유자가 대체 키를 만들어(ssh-keygen -t ed25519, 또는 -t rsa -b 3072) 이전 키를 지우기 전에 설치하게 하고, 두 번째 세션에서 새 키로 로그인을 시험합니다. 먼저 파일을 복사한 뒤(cp -a <file> <file>.bak) ssh-dss 줄과 짧은 RSA 줄을 지웁니다. ssh.rsa_keys 가 경로, 줄, 지문으로 그 줄을 밝힙니다. cp -a <file>.bak <file> 로 되돌립니다.
  risk: lockout_risk
  idempotent: true
