id: muster.beyond.bootloader_password
title_en: The boot menu is guarded by a bootloader superuser password
title_ko: 부팅 메뉴가 부트로더 superuser 비밀번호로 보호된다
description_en: Anyone standing at the console of a host whose boot menu is unguarded can edit the kernel command line, append init=/bin/sh and reach a root shell without a password, or boot a rescue entry and read every unencrypted file on the disk; a bootloader superuser password is what turns that from a keystroke into an authentication. muster reads grub.cfg, /boot/grub2/user.cfg and the /etc/grub.d fragments and requires a literal grub.pbkdf2. hash to be present in one of them — either as the third field of a password_pbkdf2 line or as the value of GRUB2_PASSWORD. Nothing else counts, and the reason is the EL family, whose /etc/grub.d/01_users emits set superusers="root" and password_pbkdf2 root "${GRUB2_PASSWORD}" into every generated grub.cfg whether or not a password was ever set — crediting those tokens would pass every stock EL host. It is rated 중 rather than 상 because the attack needs physical or console access, which most estates already restrict by other means, and because full-disk encryption defeats the same attacker more thoroughly. A host with no grub.cfg and no fragments is NOT_APPLICABLE, because it boots through something this control does not describe; a chain muster could not read — an unprivileged run against the EL layout, where grub.cfg is 0600 — is ERROR, as every denied fact is, and never a quiet false.
description_ko: 부팅 메뉴가 보호되지 않은 호스트의 콘솔 앞에 선 사람은 커널 명령줄을 편집해 init=/bin/sh 를 덧붙이는 것만으로 비밀번호 없이 root 셸을 얻거나, 복구 항목으로 부팅해 디스크의 암호화되지 않은 모든 파일을 읽을 수 있습니다. 부트로더 superuser 비밀번호는 그 한 번의 키 입력을 인증 절차로 바꿉니다. muster 는 grub.cfg, /boot/grub2/user.cfg, /etc/grub.d 조각들을 읽어 그중 한 곳에 실제 grub.pbkdf2. 해시가 password_pbkdf2 줄의 세 번째 필드 또는 GRUB2_PASSWORD 의 값으로 존재하는지를 요구합니다. 다른 것은 인정하지 않으며 그 이유는 EL 계열입니다. EL 의 /etc/grub.d/01_users 는 비밀번호 설정 여부와 무관하게 생성되는 모든 grub.cfg 에 set superusers="root" 와 password_pbkdf2 root "${GRUB2_PASSWORD}" 를 넣으므로, 그 토큰을 인정하면 모든 EL 기본 설치가 통과해 버립니다. 이 공격에는 물리적 또는 콘솔 접근이 필요하고 대부분의 환경이 이미 다른 수단으로 그것을 제한하며 같은 공격자는 전체 디스크 암호화로 더 확실히 막히므로 중요도는 상 이 아니라 중 입니다. grub.cfg 도 조각도 없는 호스트는 이 항목이 설명하지 않는 방식으로 부팅하므로 NOT_APPLICABLE 입니다. 읽을 수 없었던 체인(grub.cfg 가 0600 인 EL 구성을 권한 없이 수집한 경우)은 다른 모든 거부된 사실과 마찬가지로 ERROR 이며 조용한 false 가 아닙니다.
category: beyond
importance: 중
automation: auto
references:
  stig:
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-212010 }
  nist_800_53: ["AC-3"]
requires_facts: ">=1"
applies_when:
  - { fact: env.container, op: eq, expected: none }
absent_means: not_applicable
checks:
  - { fact: boot.grub_password_set, op: eq, expected: true }
remediation:
  text_en: Generate a hash with grub2-mkpasswd-pbkdf2 (EL) or grub-mkpasswd-pbkdf2 (Debian and Ubuntu) and record it — on the EL family as GRUB2_PASSWORD= in /boot/grub2/user.cfg, which survives grub2-mkconfig, and on Debian and Ubuntu as a set superusers and password_pbkdf2 pair in a new /etc/grub.d fragment, then regenerate grub.cfg. Keep the password where the people who need console recovery can get it, because a host whose boot menu is locked and whose password is lost needs installation media to recover.
  text_ko: grub2-mkpasswd-pbkdf2(EL) 또는 grub-mkpasswd-pbkdf2(Debian·Ubuntu)로 해시를 만들어 기록합니다. EL 계열에서는 grub2-mkconfig 를 거쳐도 남는 /boot/grub2/user.cfg 에 GRUB2_PASSWORD= 로, Debian·Ubuntu 에서는 새 /etc/grub.d 조각에 set superusers 와 password_pbkdf2 한 쌍으로 적은 뒤 grub.cfg 를 다시 생성합니다. 부팅 메뉴가 잠긴 채 비밀번호를 잃어버린 호스트는 설치 미디어가 있어야 복구할 수 있으므로, 콘솔 복구가 필요한 사람들이 접근할 수 있는 곳에 비밀번호를 보관하십시오.
  risk: none
  idempotent: true
