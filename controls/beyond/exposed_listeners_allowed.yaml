id: muster.beyond.exposed_listeners_allowed
title_en: Every listening service a packet from off the host can reach is one the host declares it serves
title_ko: 호스트 밖에서 패킷이 도달할 수 있는 모든 수신 서비스는 호스트가 제공한다고 선언한 서비스이다
description_en: A daemon listening on an address other than loopback, with no firewall rule standing between it and the network, is attack surface whether anyone meant to offer it or not. muster joins three readings - the kernel's listening sockets, the processes holding them and the firewall as configured - and lists every socket a packet from off the host can reach in exposure.exposed; the control fails when one of them is a service outside params.allowed_ports. The allow list is the host's own declaration of what it serves, spelled lower-case as <tcp|udp>/<port> and matched exactly (TCP/22 or tcp/* match nothing); the two wildcard sockets of one daemon (0.0.0.0 and ::) are one service, so one entry or one waiver covers both. The default names sshd (tcp/22) and the DHCP and DHCPv6 client sockets (udp/68, udp/546) every address-by-DHCP host binds. The primary source is NIST SP 800-53 CM-7, least functionality, with CM-6 for the configuration that declares it; muster rates it 상 because an unintended reachable service is the shortest path from the network into the host. It is the consequence of what U-28 judges as cause (no firewall restricting inbound traffic) and of what U-52 judges per daemon (services that should not run), not a duplicate of either - a host can pass both and still serve a port nobody declared. A socket is reached through an open policy (the firewall restricts nothing), an accept rule with no protocol or port, an accept of its protocol and port, or no_chain_in_family - a v6 listener on a host whose rules exist for IPv4 only; IPv6 disabled by sysctl on all and default interfaces is not an enabled family, and a link-local listener is reachable by every neighbour on the link. The verdict reads MANUAL when it cannot be read - the firewall's normalisation confidence is partial, or an opaque rule muster cannot model sits in the family that would decide - and the cause is in exposure.stats.manual_reason; today a host whose accept-policy input chain carries rules - every firewalld host (filter_INPUT), a ufw host that also runs another table's INPUT chain - reads partial and therefore MANUAL; docker's FORWARD chains never enter confidence, so a docker host with an empty accept INPUT is decided. A host with no firewall binary reads NOT_APPLICABLE, as U-28 does; a non-root run, which cannot read other accounts' file descriptors, or a firewall that refused to be read, reads ERROR. Stock Ubuntu with ufw installed and inactive exposes sshd and the DHCP client and passes with the default list; stock EL9 with firewalld reads MANUAL.
description_ko: 루프백이 아닌 주소에서 수신 대기하는 데몬과 네트워크 사이에 방화벽 규칙이 없다면, 누군가 그것을 제공하려 했든 아니든 공격 표면입니다. muster 는 커널의 수신 소켓, 그 소켓을 가진 프로세스, 설정된 방화벽이라는 세 가지 읽기를 결합해 호스트 밖에서 패킷이 도달할 수 있는 모든 소켓을 exposure.exposed 에 나열하고, 그중 하나라도 params.allowed_ports 밖의 서비스이면 실패로 판정합니다. 허용 목록은 호스트가 무엇을 제공하는지 스스로 선언한 것이며 소문자 <tcp|udp>/<port> 형식으로 적고 정확히 일치해야 합니다(TCP/22 나 tcp/* 는 아무것과도 일치하지 않습니다). 한 데몬의 두 와일드카드 소켓(0.0.0.0 과 ::)은 하나의 서비스이므로 항목 하나나 예외(waiver) 하나로 둘 다 처리됩니다. 기본값은 sshd(tcp/22)와 DHCP 로 주소를 받는 모든 호스트가 여는 DHCP·DHCPv6 클라이언트 소켓(udp/68, udp/546)입니다. 1차 근거는 NIST SP 800-53 CM-7(최소 기능)이며 이를 선언하는 설정에 CM-6 을 함께 듭니다. 의도하지 않은 도달 가능한 서비스는 네트워크에서 호스트로 들어오는 가장 짧은 경로이므로 muster 는 중요도를 상으로 둡니다. 이 항목은 U-28 이 원인으로 판정하는 것(인바운드를 제한하는 방화벽 없음)과 U-52 가 데몬별로 판정하는 것(실행되면 안 되는 서비스)의 결과이며 어느 쪽의 중복도 아닙니다. 두 항목을 모두 통과하고도 아무도 선언하지 않은 포트를 제공하는 호스트가 있을 수 있습니다. 소켓에 도달하는 경로는 열린 정책(방화벽이 아무것도 제한하지 않음), 프로토콜이나 포트가 없는 허용 규칙, 그 프로토콜과 포트를 허용하는 규칙, 그리고 no_chain_in_family(규칙이 IPv4 에만 있는 호스트의 v6 수신 소켓)입니다. all 과 default 인터페이스 모두에서 sysctl 로 IPv6 를 끈 경우 그 계열은 활성 계열이 아니며, 링크 로컬 수신 소켓은 같은 링크의 모든 이웃이 도달할 수 있습니다. 판정을 읽을 수 없으면, 즉 방화벽 정규화 신뢰도가 partial 이거나 판정할 계열에 muster 가 모델링하지 못하는 불투명 규칙이 있으면 MANUAL 이고 원인은 exposure.stats.manual_reason 에 있습니다. 현재 accept 정책 input 체인이 규칙을 가진 호스트 - 모든 firewalld 호스트(filter_INPUT), 다른 테이블의 INPUT 체인도 도는 ufw 호스트 - 는 partial 이므로 MANUAL 이고, docker 의 FORWARD 체인은 신뢰도에 들어가지 않으므로 INPUT 이 빈 accept 인 docker 호스트는 판정됩니다. 방화벽 바이너리가 없는 호스트는 U-28 과 같이 NOT_APPLICABLE 이고, 다른 계정의 파일 디스크립터를 읽을 수 없는 root 가 아닌 실행이나 읽기를 거부한 방화벽은 ERROR 입니다. ufw 가 설치되어 있고 비활성인 기본 Ubuntu 는 sshd 와 DHCP 클라이언트를 노출하며 기본 목록으로 통과하고, firewalld 를 쓰는 기본 EL9 은 MANUAL 입니다.
category: beyond
importance: 상
automation: auto
references: { nist_800_53: ["CM-7", "CM-6"] }
requires_facts: ">=1"
applies_when:
  - { fact: env.container, op: eq, expected: none }
absent_means: manual
params:
  allowed_ports: { type: list<string>, default: ["tcp/22", "udp/68", "udp/546"], description: "services the host declares it serves to the network, spelled as exposure.exposed spells them - lower-case <tcp|udp>/<port>, exact" }
checks:
  - { fact: exposure.exposed, op: none, subject: service, where: { field: service, op: not_in, expected: "${allowed_ports}" } }
remediation:
  text_en: For each exposed service outside the list, decide whether the host is meant to serve it. If not, stop and disable the daemon (systemctl disable --now <unit>) or bind it to loopback in its own configuration; if it is, either add a firewall rule that admits only the sources that need it (ufw allow from <net> to any port <port> proto <tcp|udp>, or firewall-cmd --add-rich-rule) or add the service to params.allowed_ports. Undo by re-enabling the unit or deleting the rule.
  text_ko: 목록 밖의 노출된 서비스마다 호스트가 그것을 제공해야 하는지 판단합니다. 아니라면 데몬을 중지·비활성화하거나(systemctl disable --now <unit>) 데몬 설정에서 루프백에만 바인딩합니다. 제공해야 한다면 필요한 출발지만 허용하는 방화벽 규칙을 추가하거나(ufw allow from <net> to any port <port> proto <tcp|udp>, 또는 firewall-cmd --add-rich-rule) 서비스를 params.allowed_ports 에 추가합니다. 유닛을 다시 활성화하거나 규칙을 지워 되돌립니다.
  risk: none
  idempotent: true
