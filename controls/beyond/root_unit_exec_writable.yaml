id: muster.beyond.root_unit_exec_writable
title_en: No service that runs as root executes a file, or reads a unit file, that a non-root user can change
title_ko: root 로 실행되는 서비스는 root 가 아닌 사용자가 바꿀 수 있는 파일을 실행하거나 그런 unit 파일을 읽지 않는다
description_en: A systemd service that runs as root executes whatever its Exec lines name at its next start, so an executable a non-root user can rewrite — or one in a directory that is not root's or that its group or others can write, where the file can be swapped (parent_writable) — hands them that start, and so does a unit file or drop-in they can edit, since it says what runs. muster takes every enabled or active system service whose User= is unset, root or 0, stats each Exec command and the unit's files, and fails the host when one is owned by a uid other than 0, is group- or other-writable, or sits in a directory that is not root's or that its group or others can write. It is rated 상 because it is a direct path from a local account to root that waits only for a restart or a reboot. A stock host passes; Debian's root:staff /usr/local, which the staff group can write, reads FAIL for a root service run from there, truthfully. A unit file or drop-in muster could not read, a linked unit file muster does not follow, an active unit whose unit file is missing, an executable outside the paths muster reads, a symlinked executable whose target is outside them, a chain of symlinks or a path through a symlink muster does not follow, or an executable muster could not stat may hide the answer, so each reads MANUAL naming the unit and path. A host without systemd reads NOT_APPLICABLE.
description_ko: root 로 실행되는 systemd 서비스는 다음에 시작할 때 Exec 줄이 가리키는 것을 무엇이든 실행하므로, root 가 아닌 사용자가 다시 쓸 수 있는 실행 파일이나 root 의 것이 아니거나 그룹이나 다른 사용자가 쓸 수 있어 파일을 바꿔치기할 수 있는 디렉터리 안의 실행 파일(parent_writable)은 그 시작을 그 사용자에게 넘겨줍니다. 무엇이 실행될지 정하는 unit 파일이나 drop-in 을 그 사용자가 편집할 수 있어도 마찬가지입니다. muster 는 User= 가 설정되지 않았거나 root 또는 0 인, 활성화되었거나 실행 중인 모든 시스템 서비스를 골라 각 Exec 명령과 unit 의 파일을 stat 하고, uid 0 이 아닌 소유자를 가지거나 그룹이나 다른 사용자가 쓸 수 있거나 root 의 것이 아닌 디렉터리 또는 그룹이나 다른 사용자가 쓸 수 있는 디렉터리에 있으면 호스트를 실패로 판정합니다. 재시작이나 재부팅만 기다리면 되는, 로컬 계정에서 root 로 가는 직접 경로이므로 중요도는 상 입니다. 기본 호스트는 통과하며, staff 그룹이 쓸 수 있는 Debian 의 root:staff /usr/local 에서 실행되는 root 서비스는 사실대로 FAIL 입니다. muster 가 읽지 못한 unit 파일이나 drop-in, muster 가 따라가지 않는 링크된 unit 파일, unit 파일이 없는 실행 중인 unit, muster 가 읽는 경로 밖의 실행 파일, 대상이 그 경로 밖에 있는 심볼릭 링크 실행 파일, muster 가 따라가지 않는 심볼릭 링크 사슬이나 심볼릭 링크를 지나는 경로, muster 가 stat 하지 못한 실행 파일은 답을 숨길 수 있으므로 각각 unit 과 경로를 밝힌 MANUAL 입니다. systemd 가 없는 호스트는 NOT_APPLICABLE 입니다.
category: beyond
importance: 상
automation: auto
references: { nist_800_53: ["AC-6(10)"] }
requires_facts: ">=1"
applies_when:
  - { fact: env.container, op: eq, expected: none }
  - { fact: env.has_systemd, op: eq, expected: true }
absent_means: manual
checks:
  - { fact: units.exec_writable, op: none, subject: path, where: { field: why, op: present } }
remediation:
  text_en: For each row, record the current owner and mode first (stat -c '%U:%G %a %n' <path>), then chown root:root <path> and chmod go-w <path> - on the file, or on its directory when the row says parent_writable - or move the executable to a root-owned directory and point the unit at it. Restore with chown <recorded owner> <path> and chmod <recorded mode> <path>. systemctl daemon-reload picks up an edited unit file.
  text_ko: 각 행마다 먼저 현재 소유자와 mode 를 기록한 뒤(stat -c '%U:%G %a %n' <path>) chown root:root <path> 와 chmod go-w <path> 를 실행합니다. 대상은 그 파일이며, 행이 parent_writable 이면 그 디렉터리입니다. 또는 실행 파일을 root 소유 디렉터리로 옮기고 unit 이 그것을 가리키게 합니다. chown <기록한 소유자> <path> 와 chmod <기록한 mode> <path> 로 되돌립니다. 편집한 unit 파일은 systemctl daemon-reload 로 반영됩니다.
  risk: none
  idempotent: true
