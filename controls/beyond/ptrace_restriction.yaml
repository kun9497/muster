id: muster.beyond.ptrace_restriction
title_en: One process cannot attach a debugger to another it did not start
title_ko: 한 프로세스가 자신이 띄우지 않은 프로세스에 디버거를 붙일 수 없다
description_en: A process must not be able to read another process's memory just because both run as the same account. kernel.yama.ptrace_scope must be 1 (a process may be traced only by one of its own ancestors), 2 (only by a process holding CAP_SYS_PTRACE) or 3 (not at all, a choice that cannot be relaxed again until the next boot), and kernel.perf_event_paranoid must be 2 or higher so that an unprivileged account cannot read another process's performance events either. Both are described in Documentation/admin-guide/sysctl/kernel.rst. This is rated 중 because ptrace and the performance-event interface both read a running process's memory, which is where a session key, a decrypted credential or a password the user just typed lives — and the default of 0 on several distributions lets any process of the same account take them without touching a file muster could otherwise judge. A kernel built without Yama carries no ptrace_scope at all; muster reports that rather than passing it, and because the evaluator resolves a control on the first absent fact, the performance-event setting is then evidence rather than a second verdict.
description_ko: 같은 계정으로 실행된다는 이유만으로 한 프로세스가 다른 프로세스의 메모리를 읽을 수 있어서는 안 됩니다. kernel.yama.ptrace_scope 는 1(자신의 조상 프로세스만 추적 가능), 2(CAP_SYS_PTRACE 를 가진 프로세스만 가능) 또는 3(아예 불가, 다음 부팅 전까지 되돌릴 수 없음)이어야 하고, kernel.perf_event_paranoid 는 2 이상이어서 비권한 계정이 다른 프로세스의 성능 이벤트도 읽을 수 없어야 합니다. 두 값 모두 Documentation/admin-guide/sysctl/kernel.rst 에 설명되어 있습니다. ptrace 와 성능 이벤트 인터페이스는 모두 실행 중인 프로세스의 메모리를 읽으며 그곳에는 세션 키, 복호화된 자격 증명, 방금 입력한 비밀번호가 들어 있고, 여러 배포판의 기본값 0 은 같은 계정의 어떤 프로세스든 파일을 건드리지 않고 그것을 가져가게 하므로 중요도를 중으로 둡니다. Yama 없이 빌드된 커널에는 ptrace_scope 자체가 없으며 muster 는 이를 통과가 아니라 그대로 보고하고, 평가기가 첫 부재 사실에서 판정을 끝내므로 성능 이벤트 설정은 그때 두 번째 판정이 아니라 증거로 남습니다.
category: beyond
importance: 중
automation: auto
references:
  stig:
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-213015 }
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-213080 }
  nist_800_53: ["SC-2", "SC-4"]
requires_facts: ">=1"
applies_when:
  - { fact: env.container, op: eq, expected: none }
absent_means: fail
checks:
  - { fact: kernel.sysctl.yama_ptrace_scope, op: in, expected: [1, 2, 3] }
  - { fact: kernel.sysctl.perf_event_paranoid, op: gte, expected: 2 }
remediation:
  text_en: Write kernel.yama.ptrace_scope = 1 and kernel.perf_event_paranoid = 2 into /etc/sysctl.d/99-muster-ptrace-restriction.conf and apply it with sysctl --system; the review script writes a key only when its value is outside the accepted set, and leaves a host at kernel.yama.ptrace_scope = 3, which locks until reboot, alone. Confirm first that no debugger, profiler or crash handler on the host attaches to a process it did not start; 1 is the value that keeps gdb working on a program you launched yourself, and 3 cannot be undone without a reboot. A value set in /etc/sysctl.conf, or in a sysctl.d file that sorts after 99-muster-ptrace-restriction.conf, still wins at boot; correct it there. The review script never follows a symlink; a 99-muster-ptrace-restriction.conf that is a symlink (a mask) is left as is and the block stops.
  text_ko: /etc/sysctl.d/99-muster-ptrace-restriction.conf 에 kernel.yama.ptrace_scope = 1 과 kernel.perf_event_paranoid = 2 를 적고 sysctl --system 으로 적용합니다. 검토 스크립트는 값이 허용 범위 밖인 키만 쓰며, 재부팅 전까지 잠기는 kernel.yama.ptrace_scope = 3인 호스트는 그대로 둡니다. 호스트의 디버거·프로파일러·크래시 처리기가 자신이 띄우지 않은 프로세스에 붙지 않는지 먼저 확인하십시오. 직접 실행한 프로그램에 gdb 를 붙이는 용도는 값 1 에서 그대로 동작하며, 3 은 재부팅 없이는 되돌릴 수 없습니다. /etc/sysctl.conf나 99-muster-ptrace-restriction.conf 뒤에 정렬되는 sysctl.d 파일에 둔 값이 부팅 때 여전히 이기므로 그 파일을 고치십시오. 검토 스크립트는 심볼릭 링크를 따라가지 않으므로, 심볼릭 링크(마스크)인 99-muster-ptrace-restriction.conf 는 그대로 두고 그 블록을 멈춥니다.
  risk: none
  idempotent: true
  sysctl: [kernel.yama.ptrace_scope, kernel.perf_event_paranoid]
  backup: [/etc/sysctl.d/99-muster-ptrace-restriction.conf]
  script: |
    f=/etc/sysctl.d/99-muster-ptrace-restriction.conf
    if [ -L "$f" ]; then log "muster.beyond.ptrace_restriction: $f is a symlink (a mask), left as is"; exit 1; fi
    put() {
      sysctl -q -w "$1=$2"
      if grep -q "^$1 " "$f" 2>/dev/null; then sed -i "s|^$1 .*|$1 = $2|" "$f"; else printf '%s = %s\n' "$1" "$2" >> "$f"; fi
    }
    case "$(sysctl -n kernel.yama.ptrace_scope)" in 1|2|3) ;; *) put kernel.yama.ptrace_scope 1;; esac
    case "$(sysctl -n kernel.perf_event_paranoid)" in [2-9]|[1-9][0-9]|[1-9][0-9][0-9]*) ;; *) put kernel.perf_event_paranoid 2;; esac
    if [ -f "$f" ] && [ ! -L "$f" ]; then chmod 644 "$f"; fi
  validate: |
    case "$(sysctl -n kernel.yama.ptrace_scope)" in 1|2|3) ;; *) false;; esac && case "$(sysctl -n kernel.perf_event_paranoid)" in [2-9]|[1-9][0-9]|[1-9][0-9][0-9]*) ;; *) false;; esac
