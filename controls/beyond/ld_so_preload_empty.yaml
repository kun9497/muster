id: muster.beyond.ld_so_preload_empty
title_en: /etc/ld.so.preload names no library other than the ones allowed on purpose
title_ko: /etc/ld.so.preload 에는 의도적으로 허용한 것 말고는 어떤 라이브러리도 없다
description_en: ld.so(8) loads every shared object named in /etc/ld.so.preload into every dynamically linked program the host starts, before any library the program asked for, root's programs and setuid programs included, so one line there runs its code inside every privileged process on the host - which is why the file is a classic place for a user-space rootkit to hide. muster reads the file as glibc's loader does (a # starts a comment anywhere on a line; entries are separated by space, tab, newline or colon) and fails the host when it names an entry that is not in params.allowed_preload. The file does not exist on a stock host, which reads as an empty list and passes; any entry is a review at least, so the default allowlist is empty and a library an agent installs there on purpose is recorded in it. It is rated 상 because a single entry is code execution as root in every program that starts. A file that exists and cannot be read reads ERROR naming it.
description_ko: ld.so(8) 는 /etc/ld.so.preload 에 적힌 모든 공유 객체를 호스트가 시작하는 모든 동적 링크 프로그램에, 그 프로그램이 요청한 어떤 라이브러리보다 먼저 올립니다. root 의 프로그램과 setuid 프로그램도 예외가 아니므로, 그 파일의 한 줄은 호스트의 모든 특권 프로세스 안에서 자기 코드를 실행합니다. 그래서 이 파일은 사용자 공간 루트킷이 숨는 전형적인 자리입니다. muster 는 glibc 로더와 같은 방식으로 파일을 읽고(# 는 줄의 어디서든 주석을 시작하며, 항목은 공백, 탭, 줄바꿈, 콜론으로 구분됩니다), params.allowed_preload 에 없는 항목이 있으면 호스트를 실패로 판정합니다. 기본 호스트에는 이 파일이 없으며, 그것은 빈 목록으로 읽혀 통과합니다. 어떤 항목이든 적어도 검토 대상이므로 기본 허용 목록은 비어 있으며, 에이전트가 의도적으로 설치한 라이브러리는 그 목록에 기록합니다. 한 항목이 곧 시작되는 모든 프로그램에서의 root 코드 실행이므로 중요도는 상 입니다. 파일이 있는데 읽을 수 없으면 그 파일을 밝힌 ERROR 입니다.
category: beyond
importance: 상
automation: auto
references: { nist_800_53: ["AC-6(10)"] }
requires_facts: ">=1"
applies_when:
  - { fact: env.container, op: eq, expected: none }
absent_means: fail
params:
  allowed_preload: { type: list<string>, default: [], description: "entries of /etc/ld.so.preload, spelled as privilege.ld_so_preload spells them, that are there on purpose - a security agent's library" }
checks:
  - { fact: privilege.ld_so_preload, op: none, where: { op: not_in, expected: "${allowed_preload}" } }
remediation:
  text_en: Find out which package or agent wrote the entry first (dpkg -S <library> or rpm -qf <library>); an entry nobody can account for is an incident, not a setting. Otherwise copy the file (cp -a /etc/ld.so.preload /etc/ld.so.preload.bak) and delete the line, or the whole file when it is empty. Restore with cp -a /etc/ld.so.preload.bak /etc/ld.so.preload; programs already running keep the library until they restart.
  text_ko: 먼저 어떤 패키지나 에이전트가 그 항목을 기록했는지 확인합니다(dpkg -S <library> 또는 rpm -qf <library>). 아무도 설명할 수 없는 항목은 설정이 아니라 침해 사고입니다. 그렇지 않으면 파일을 복사한 뒤(cp -a /etc/ld.so.preload /etc/ld.so.preload.bak) 그 줄을 지우고, 파일이 비면 파일을 지웁니다. cp -a /etc/ld.so.preload.bak /etc/ld.so.preload 로 되돌리며, 이미 실행 중인 프로그램은 다시 시작할 때까지 그 라이브러리를 유지합니다.
  risk: none
  idempotent: true
