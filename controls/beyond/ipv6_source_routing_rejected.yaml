id: muster.beyond.ipv6_source_routing_rejected
title_en: The host rejects source-routed IPv6 packets
title_ko: 호스트는 소스 라우팅된 IPv6 패킷을 거부한다
description_en: An IPv6 routing header lets a sender name the hops a packet takes, steering it around the network's filters; the type-0 header was deprecated for exactly that reason (RFC 5095). net.ipv6.conf.all.accept_source_route and net.ipv6.conf.default.accept_source_route must both be 0. The kernel's Documentation/networking/ip-sysctl.rst describes them; muster rates it 중 because no server needs to accept a sender's choice of path and accepting it gives the sender that control. muster judges the effective, running value; the sysctl.d side rides along as drift. The control gates on one derived key, net.sysctl.ipv6_disabled - it reads NOT_APPLICABLE when the kernel has no IPv6 (built without it, or booted with ipv6.disable=1) and when disable_ipv6 is 1 on all, on default and on every present interface other than lo (net.sysctl.ipv6_disabled), IPv6 turned off the common way; a host that set only one of the two, or re-enabled one interface under all, still speaks IPv6 and is judged. Stock Ubuntu and EL9 pass - the kernel rejects IPv6 source routing by default.
description_ko: IPv6 라우팅 헤더는 보낸 쪽이 패킷이 거칠 홉을 지정해 네트워크의 필터를 우회하게 할 수 있으며, 타입 0 헤더는 바로 그 이유로 폐기되었습니다(RFC 5095). net.ipv6.conf.all.accept_source_route 와 net.ipv6.conf.default.accept_source_route 가 모두 0 이어야 합니다. 커널 문서 Documentation/networking/ip-sysctl.rst 가 두 값을 설명합니다. 보낸 쪽이 고른 경로를 받아들여야 하는 서버는 없고 받아들이면 그 통제권을 보낸 쪽에 넘기므로 muster 는 중요도를 중으로 둡니다. muster 는 실행 중인 실효값을 판정하고 sysctl.d 쪽은 차이로 함께 보고합니다. 이 통제 항목의 게이트는 파생 키 net.sysctl.ipv6_disabled 하나입니다. 커널에 IPv6 가 없거나(빌드하지 않았거나 ipv6.disable=1 로 부팅) disable_ipv6 가 all, default 와 lo 외의 모든 현재 인터페이스에서 1 인 경우(net.sysctl.ipv6_disabled; IPv6 를 끄는 흔한 방식) NOT_APPLICABLE 이며, 둘 중 하나만 설정했거나 all 아래서 인터페이스 하나를 다시 켠 호스트는 여전히 IPv6 를 쓰므로 판정합니다. 기본 Ubuntu 와 EL9 은 통과합니다. 커널이 기본으로 IPv6 소스 라우팅을 거부합니다.
category: beyond
importance: 중
automation: auto
references:
  stig:
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-254020 }
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-254040 }
  nist_800_53: ["CM-6"]
requires_facts: ">=1"
applies_when:
  - { fact: env.container, op: eq, expected: none }
  - { fact: net.sysctl.ipv6_disabled, op: eq, expected: 0 }
absent_means: not_applicable
checks:
  - { fact: net.sysctl.ipv6_all_accept_source_route, op: eq, expected: 0 }
  - { fact: net.sysctl.ipv6_default_accept_source_route, op: eq, expected: 0 }
remediation:
  text_en: Write net.ipv6.conf.all.accept_source_route = 0 and net.ipv6.conf.default.accept_source_route = 0 into a file under /etc/sysctl.d and apply it with sysctl --system; they take effect at once.
  text_ko: /etc/sysctl.d 아래 파일에 net.ipv6.conf.all.accept_source_route = 0 과 net.ipv6.conf.default.accept_source_route = 0 을 적고 sysctl --system 으로 적용합니다. 즉시 반영됩니다.
  risk: none
  idempotent: true
