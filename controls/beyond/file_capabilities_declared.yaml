id: muster.beyond.file_capabilities_declared
title_en: Every executable carrying file capabilities has them because its package declares them
title_ko: 파일 capability 를 가진 모든 실행 파일은 그 패키지가 선언했기 때문에 그것을 가진다
description_en: capabilities(7) — a file capability gives an executable a slice of root's power, such as opening raw sockets or binding low ports, without a setuid bit, so a search for setuid files never sees it; one the owning package did not declare is a setuid binary nobody knows about. This is the setuid control's twin. The deep walk reads security.capability from every executable and joins each one with its package's declaration — rpm's FILECAPS header on EL, the setcap call in the package's postinst on the dpkg family — and muster fails the host when a file's capabilities are not declared, whether the file belongs to no package or its package says nothing about it. It is rated 상 for the same reason setuid files are — a capability such as cap_setuid or cap_dac_override is root in all but name. A stock host passes — Ubuntu's ping, mtr-packet, gst-ptp-helper and snap-confine are declared by their postinst, EL's ping by its header. The walk runs only under --deep as root, so a run without --deep reads MANUAL and an incomplete walk reads ERROR; a host with no package database has nothing to declare against and reads MANUAL. walk.acl_grants, the executables whose ACL widens write or execute, is evidence the same walk records and no control reads.
description_ko: capabilities(7) — 파일 capability 는 raw 소켓 열기나 낮은 포트 바인딩 같은 root 권한의 일부를 setuid 비트 없이 실행 파일에 주므로, setuid 파일을 찾는 검색은 그것을 보지 못합니다. 소유 패키지가 선언하지 않은 capability 는 아무도 모르는 setuid 실행 파일입니다. 이 항목은 setuid 항목의 짝입니다. 심층 탐색은 모든 실행 파일의 security.capability 를 읽고 각각을 패키지의 선언, 즉 EL 에서는 rpm 의 FILECAPS 헤더, dpkg 계열에서는 패키지 postinst 의 setcap 호출과 맞춰 보며, 파일의 capability 가 선언되지 않았으면, 즉 어떤 패키지에도 속하지 않은 파일이거나 패키지가 그것에 대해 아무 말도 하지 않으면 muster 는 호스트를 실패로 판정합니다. cap_setuid 나 cap_dac_override 같은 capability 는 이름만 다를 뿐 root 이므로, setuid 파일과 같은 이유로 중요도는 상 입니다. 기본 호스트는 통과합니다. Ubuntu 의 ping, mtr-packet, gst-ptp-helper, snap-confine 은 postinst 가, EL 의 ping 은 헤더가 선언합니다. 탐색은 root 의 --deep 실행에서만 돌기 때문에 --deep 없는 실행은 MANUAL, 끝나지 않은 탐색은 ERROR 이며, 패키지 데이터베이스가 없는 호스트는 대조할 선언이 없어 MANUAL 입니다. ACL 이 쓰기나 실행을 넓히는 실행 파일의 목록인 walk.acl_grants 는 같은 탐색이 기록하는 증거이며 어떤 항목도 판정하지 않습니다.
category: beyond
importance: 상
automation: auto
references: { nist_800_53: ["AC-6(10)"] }
requires_facts: ">=1"
applies_when:
  - { fact: env.container, op: eq, expected: none }
absent_means: manual
checks:
  - { fact: walk.capabilities, op: none, subject: path, where: { field: package_declared, op: eq, expected: false } }
remediation:
  text_en: For each row, record the current capabilities first (getcap <path>). If the file belongs to software installed on purpose and needs them, waive the row with that reason; otherwise remove them with setcap -r <path>, restoring with setcap '<recorded caps>' <path>. For a file that belongs to no package, find out how it got there before anything else.
  text_ko: 각 행마다 먼저 현재 capability 를 기록합니다(getcap <path>). 의도적으로 설치한 소프트웨어의 파일이고 그 capability 가 필요하다면 그 사유로 waive 하고, 그렇지 않다면 setcap -r <path> 로 제거하며 setcap '<기록한 capability>' <path> 로 되돌립니다. 어떤 패키지에도 속하지 않은 파일이라면 무엇보다 먼저 그것이 어떻게 생겼는지 확인하십시오.
  risk: none
  idempotent: true
