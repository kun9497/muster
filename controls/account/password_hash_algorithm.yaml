id: muster.account.password_hash_algorithm
title_en: Passwords are hashed with a strong algorithm
title_ko: 비밀번호가 안전한 알고리즘으로 해시된다
description_en: ENCRYPT_METHOD in login.defs must name an allowed algorithm and every stored hash - including those of locked accounts - must use one. MD5 and the legacy DES scheme are not allowed; SHA-256, SHA-512, yescrypt, scrypt and bcrypt are. Passwords must live in /etc/shadow for the hashes to be judged at all. When pam_unix.so in the password stack carries its own hashing argument, that argument overrides login.defs and must be an allowed one.
description_ko: login.defs 의 ENCRYPT_METHOD 가 허용 알고리즘이어야 하고, 잠긴 계정의 것을 포함한 모든 저장 해시가 허용 알고리즘을 써야 합니다. MD5 와 구형 DES 방식은 허용되지 않고 SHA-256, SHA-512, yescrypt, scrypt, bcrypt 는 허용됩니다. 해시를 판단하려면 비밀번호가 /etc/shadow 에 있어야 합니다. password 스택의 pam_unix.so 가 자체 해시 인자를 가지면 그 인자가 login.defs 를 우선하므로 허용 값이어야 합니다.
category: account
importance: 중
automation: auto
references:
  kisa: { "2026": ["U-13"] }
  cis:
    - { benchmark: ubuntu-22.04, version: "2.0.0", rec: "5.4.1.4" }
  stig:
    - { benchmark: ubuntu2204, version: V2R9, id: UBTU-22-611070 }
    - { benchmark: ubuntu2404, version: V1R6, id: UBTU-24-400400 }
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-671015 }
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-671025 }
  nist_800_53: ["IA-7", "IA-5(1)"]
requires_facts: ">=1"
absent_means: fail
params:
  allowed_methods: { type: list<string>, default: ["SHA256", "SHA512", "YESCRYPT", "BCRYPT"], description: ENCRYPT_METHOD values that count as strong }
  allowed_hashes: { type: list<string>, default: ["$5$", "$6$", "$y$", "$gy$", "$7$", "$2b$", "$2y$", "$2a$"], description: crypt hash ids that count as strong }
  allowed_pam_hashes: { type: list<string>, default: ["", "sha256", "sha512", "yescrypt", "gost_yescrypt", "blowfish"], description: pam_unix hashing arguments that count as strong; "" means the argument is absent and login.defs decides }
checks:
  - { fact: accounts.login_defs.encrypt_method, op: in, expected: "${allowed_methods}" }
  - { fact: pam.password.unix_hash, op: in, expected: "${allowed_pam_hashes}" }
  - { fact: accounts.shadow_in_use, op: eq, expected: true }
  - { fact: accounts.users, op: each, subject: name, where: { field: hash_algo, op: ne, expected: "" }, require: { field: hash_algo, op: in, expected: "${allowed_hashes}" } }
remediation:
  text_en: Set ENCRYPT_METHOD SHA512 (or YESCRYPT) in /etc/login.defs, make the PAM password stack use the same algorithm, and have every listed account change its password so the hash is regenerated.
  text_ko: /etc/login.defs 에 ENCRYPT_METHOD SHA512 (또는 YESCRYPT) 를 설정하고 PAM password 스택이 같은 알고리즘을 쓰게 한 뒤, 나열된 계정의 비밀번호를 변경해 해시를 다시 생성합니다.
  risk: none
  idempotent: true
