id: muster.account.password_policy
title_en: Password ageing, length and complexity policy is set and enforced
title_ko: 비밀번호 사용 기간·길이·복잡성 정책이 설정되고 강제된다
description_en: Maximum and minimum password age from login.defs must apply to existing accounts too; the minimum length must meet the parameter in login.defs and, since PAM decides what a new password may be, pam_pwquality must be stacked in the password stack with a minimum length and a number of required character classes that meet the parameters. A pwquality.conf that is never consulted enforces nothing, so a host without the module in its stack fails even when the file looks right. pam_unix's own minlen and Debian's obscure checks are not counted as enforcement.
description_ko: login.defs 의 최대·최소 사용 기간이 기존 계정에도 적용되어야 하고, 최소 길이는 login.defs 에서 파라미터를 충족해야 하며, 새 비밀번호의 허용 여부는 PAM 이 결정하므로 password 스택에 pam_pwquality 가 올라가 있고 그 최소 길이와 요구 문자 종류 수가 파라미터를 충족해야 합니다. 참조되지 않는 pwquality.conf 는 아무것도 강제하지 않으므로 모듈이 스택에 없는 호스트는 파일이 올바르더라도 실패합니다. pam_unix 자체의 minlen 과 Debian 의 obscure 검사는 강제로 보지 않습니다.
category: account
importance: 상
automation: auto
references:
  kisa: { "2026": ["U-02"], "2021": ["U-02", "U-46", "U-47", "U-48"] }
  cis:
    - { benchmark: ubuntu-22.04, version: "2.0.0", rec: "5.3.3.2.2" }
    - { benchmark: ubuntu-22.04, version: "2.0.0", rec: "5.3.3.2.3" }
  stig:
    - { benchmark: ubuntu2204, version: V2R9, id: UBTU-22-215010 }
    - { benchmark: ubuntu2404, version: V1R6, id: UBTU-24-100600 }
  nist_800_53: ["CM-6"]
requires_facts: ">=1"
absent_means: fail
params:
  max_days: { type: int, default: 90, description: Maximum password age in days }
  min_days: { type: int, default: 1, description: Minimum password age in days }
  min_len: { type: int, default: 8, description: Minimum password length in login.defs and in pwquality }
  min_classes: { type: int, default: 3, description: Character classes (lower/upper/digit/other) a new password must combine }
checks:
  - { fact: accounts.login_defs.pass_max_days, op: lte, expected: "${max_days}" }
  - { fact: accounts.login_defs.pass_min_days, op: gte, expected: "${min_days}" }
  - { fact: accounts.login_defs.pass_min_len, op: gte, expected: "${min_len}" }
  - { fact: pam.pwquality.enabled, op: eq, expected: true }
  - { fact: pam.pwquality.minlen, op: gte, expected: "${min_len}" }
  - { fact: pam.pwquality.required_classes, op: gte, expected: "${min_classes}" }
remediation:
  text_en: Set PASS_MAX_DAYS, PASS_MIN_DAYS and PASS_MIN_LEN in /etc/login.defs and apply the ageing values to existing accounts with chage; install libpam-pwquality (Debian family) or keep pam_pwquality in the authselect profile (RHEL family), then set minlen and minclass (or the four credits) in /etc/security/pwquality.conf.
  text_ko: /etc/login.defs 에 PASS_MAX_DAYS, PASS_MIN_DAYS, PASS_MIN_LEN 을 설정하고 기존 계정에는 chage 로 사용 기간 값을 적용하며, libpam-pwquality 를 설치하거나 (Debian 계열) authselect 프로파일에 pam_pwquality 를 유지한 뒤 (RHEL 계열) /etc/security/pwquality.conf 에 minlen 과 minclass (또는 네 credit) 를 설정합니다.
  risk: none
  idempotent: true
decision: D10
