id: muster.account.cron_permissions
title_en: Cron configuration files are 0640 or stricter and owned appropriately
title_ko: cron 설정 파일이 0640 이하로 엄격하며 소유가 적절하다
description_en: Every crontab-format file — /etc/crontab, /etc/anacrontab, the /etc/cron.d drop-ins, the cron/at access files and the per-user spools — must be mode 0640 or stricter (relax the default with params.allowed_modes, spec §6.6), must not be group- or world-writable, and a system or access file must be owned by root; no cron file may be world-writable and the cron directories must not be world-writable. The /etc/cron.{hourly,daily,weekly,monthly} directories hold executable run-parts scripts (0755), which are never a bit-subset of 0640 and would break if chmod-ed to it, so those periodic scripts are judged only on ownership and writability, not on the 0640 mode. Both distribution families ship /etc/crontab and /etc/cron.d at 0644, so a stock host fails this by the guide's 0640 criterion until an operator tightens it. A file muster could not stat is reported rather than skipped. A host with no cron configuration at all yields cron.files as an ok empty list, which is a vacuous PASS.
description_ko: 모든 crontab 형식 파일(/etc/crontab, /etc/anacrontab, /etc/cron.d 드롭인, cron/at 접근 제어 파일, 사용자별 스풀)은 mode 0640 이하로 엄격하고(기본값은 params.allowed_modes 로 완화, 스펙 §6.6) 그룹·전체 쓰기가 가능하면 안 되며, 시스템·접근 제어 파일은 root 소유여야 하고, 어떤 cron 파일도 전체 쓰기가 가능하면 안 되고 cron 디렉터리도 전체 쓰기가 가능하면 안 됩니다. /etc/cron.{hourly,daily,weekly,monthly} 디렉터리는 실행 가능한 run-parts 스크립트(0755)를 담고 있어 0640 의 비트 부분집합이 될 수 없고 0640 으로 바꾸면 오히려 동작이 깨지므로, 이 주기 스크립트는 0640 mode 가 아니라 소유·쓰기 가능성만으로 판정합니다. 두 배포판 계열 모두 /etc/crontab 과 /etc/cron.d 를 0644 로 배포하므로 운영자가 조일 때까지 가이드의 0640 기준으로는 기본 설치가 실패합니다. stat 할 수 없었던 파일은 건너뛰지 않고 보고합니다. cron 설정이 전혀 없는 호스트는 cron.files 가 정상 빈 목록이 되어 공허하게 통과합니다.
category: account
importance: 상
automation: auto
references:
  kisa: { "2026": ["U-37"], "2021": ["U-22", "U-65"] }
  stig:
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-232230 }
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-232235 }
  nist_800_53: ["CM-6"]
requires_facts: ">=1"
absent_means: fail
params:
  allowed_modes: { type: list<int>, default: [0, 32, 128, 160, 256, 288, 384, 416], description: cron file modes at 0640 or stricter (bit-subsets of 0640) }
checks:
  - { fact: cron.files, op: none, subject: path, where: { field: reason, op: present } }
  - { fact: cron.files, op: each, subject: path, where: { field: scope, op: in, expected: ["system", "access", "user"] }, require: { field: mode, op: in, expected: "${allowed_modes}" } }
  - { fact: cron.files, op: none, subject: path, where: { field: other_writable, op: eq, expected: true } }
  - { fact: cron.files, op: each, subject: path, where: { field: scope, op: in, expected: ["system", "access"] }, require: { field: owner_ok, op: eq, expected: true } }
  - { fact: cron.files, op: each, subject: path, where: { field: scope, op: eq, expected: "user" }, require: { field: owner_ok, op: eq, expected: true } }
  - { fact: cron.files, op: each, subject: path, where: { field: scope, op: eq, expected: "periodic" }, require: { field: owner_ok, op: eq, expected: true } }
  - { fact: cron.dirs, op: none, subject: path, where: { field: other_writable, op: eq, expected: true } }
remediation:
  text_en: chmod 0640 the crontab-format files (/etc/crontab, /etc/cron.d/*, user spools), chown system files to root, chmod go-w (0640 breaks run-parts) the /etc/cron.{hourly,daily,weekly,monthly} directories and scripts, and chmod o-w the cron directories. A pending at job keeps its execute bit, so this control stays FAIL until it has run. On Debian and Ubuntu a root-group access file gets group crontab (cron.allow, cron.deny) or daemon (at.allow, at.deny). A system crontab (/etc/crontab, /etc/anacrontab, /etc/cron.d/*) not owned by root is never chowned (cron ignores it, and adopting it would run what another user wrote); the block logs it and rolls back, so review it and chown it by hand. The script never follows a symlink; it fixes the directories first, then changes files only in a directory root-owned and not world-writable up to / (a root-owned group-writable one, like the crontabs spool, is trusted with its group); any other, like a daemon-owned at spool, is left to the operator.
  text_ko: crontab 형식 파일(/etc/crontab, /etc/cron.d/*, 사용자별 스풀)에 chmod 0640 을 적용하고 시스템 파일을 root 로 chown 하며, /etc/cron.{hourly,daily,weekly,monthly} 주기 스크립트 디렉터리와 그 스크립트에는 (run-parts 를 깨뜨리는 0640 이 아니라) chmod go-w 를 적용하고, cron 디렉터리에 chmod o-w 를 적용합니다. 대기 중인 at 작업은 실행 가능 표시인 실행 비트를 유지하므로, 그 작업이 실행될 때까지 이 control은 FAIL로 남습니다. 검토 스크립트는 그 비트를 지우지 않습니다. Debian 과 Ubuntu 에서는 그룹이 root 인 접근 제어 파일에 crontab(cron.allow, cron.deny) 또는 daemon(at.allow, at.deny) 그룹을 줍니다. root 소유가 아닌 시스템 crontab(/etc/crontab, /etc/anacrontab, /etc/cron.d/*)은 chown 하지 않습니다. cron 은 지금 그 파일을 무시하며, 그 파일을 넘겨받으면 다른 사용자가 쓴 내용이 실행됩니다. 검토 스크립트는 이를 기록하고 블록은 실패해 되돌아가므로, 내용을 검토한 뒤 직접 chown 하십시오. 검토 스크립트는 심볼릭 링크를 따라가지 않습니다. cron 디렉터리를 먼저 고친 뒤, / 까지 root 소유이고 전체 쓰기가 불가능한 디렉터리 안의 파일만 바꿉니다. Debian 의 crontabs 스풀처럼 root 소유이면서 그룹 쓰기가 가능한 디렉터리는 그 그룹과 함께 신뢰합니다. daemon 소유 at 스풀 같은 그 밖의 디렉터리는 운영자에게 맡깁니다.
  risk: none
  idempotent: true
  modes: [/etc/crontab, /etc/anacrontab, /etc/cron.allow, /etc/cron.deny, /etc/at.allow, /etc/at.deny, "/etc/cron.d/*", /etc/cron.d, /etc/cron.hourly, /etc/cron.daily, /etc/cron.weekly, /etc/cron.monthly, "/etc/cron.hourly/*", "/etc/cron.daily/*", "/etc/cron.weekly/*", "/etc/cron.monthly/*", /var/spool/cron, "/var/spool/cron/*", /var/spool/cron/crontabs, "/var/spool/cron/crontabs/*", /var/spool/cron/atjobs, "/var/spool/cron/atjobs/*", /var/spool/at, "/var/spool/at/*"]
  script: |
    for c in /etc/cron.d /etc/cron.hourly /etc/cron.daily /etc/cron.weekly /etc/cron.monthly /var/spool/cron /var/spool/cron/crontabs /var/spool/cron/atjobs /var/spool/at; do
      if [ -d "$c" ] && [ ! -L "$c" ]; then chmod o-w "$c"; fi
    done
    for p in /etc/crontab /etc/anacrontab /etc/cron.allow /etc/cron.deny /etc/at.allow /etc/at.deny; do
      if [ -f "$p" ] && [ ! -L "$p" ]; then
        u=$(stat -c %u "$p")
        case "$p" in
          /etc/crontab|/etc/anacrontab) if [ "$u" != 0 ]; then log "muster.account.cron_permissions: $p is owned by uid $u; review it before chown root, left as is"; continue; fi;;
        esac
        chown root "$p"
        if [ "$(stat -c %g "$p")" = 0 ]; then
          case "$p" in
            /etc/cron.allow|/etc/cron.deny) if getent group crontab >/dev/null; then chgrp crontab "$p"; fi;;
            /etc/at.allow|/etc/at.deny) a=$(command -v at || :); if [ -n "$a" ] && [ -g "$a" ] && [ "$(stat -c %G "$a")" = daemon ]; then chgrp daemon "$p"; fi;;
          esac
        fi
        chmod u-xs,g-wxs,o-rwxt "$p"
      fi
    done
    if [ -d /etc/cron.d ] && [ ! -L /etc/cron.d ]; then
      if modes_trusted /etc/cron.d/. 0; then
        find /etc/cron.d -mindepth 1 -maxdepth 1 -type f ! -user root -printf '%U %p\n' | while read -r u f; do log "muster.account.cron_permissions: $f is owned by uid $u; review it before chown root, left as is"; done
        find /etc/cron.d -mindepth 1 -maxdepth 1 -type f -user root -exec chmod u-xs,g-wxs,o-rwxt {} +
      else
        log "muster.account.cron_permissions: /etc/cron.d is not root's, left as is"
      fi
    fi
    for c in /etc/cron.hourly /etc/cron.daily /etc/cron.weekly /etc/cron.monthly; do
      if [ -d "$c" ] && [ ! -L "$c" ]; then
        if modes_trusted "$c/." 0; then
          find "$c" -mindepth 1 -maxdepth 1 -type f -exec chown root {} + -exec chmod o-w {} +
        else
          log "muster.account.cron_permissions: $c is not root's, left as is"
        fi
      fi
    done
    for c in /var/spool/cron /var/spool/cron/crontabs; do
      if [ -d "$c" ] && [ ! -L "$c" ]; then
        if modes_trusted "$c/." 0; then
          find "$c" -mindepth 1 -maxdepth 1 -type f -exec chmod u-xs,g-wxs,o-rwxt {} +
        else
          log "muster.account.cron_permissions: $c is not root's, left as is"
        fi
      fi
    done
    for s in /var/spool/cron/atjobs /var/spool/at; do
      if [ -d "$s" ] && [ ! -L "$s" ]; then
        if modes_trusted "$s/." 0; then
          find "$s" -mindepth 1 -maxdepth 1 -type f -exec chmod u-s,g-wxs,o-rwxt {} +
        elif [ -n "$(find "$s" -mindepth 1 -maxdepth 1 -type f -perm /7037 2>/dev/null)" ]; then
          log "muster.account.cron_permissions: $s is not root's, left as is"
        fi
      fi
    done
  validate: |
    [ -z "$(find /etc/crontab /etc/anacrontab /etc/cron.allow /etc/cron.deny /etc/at.allow /etc/at.deny -maxdepth 0 -type f \( -perm /7137 -o ! -user root \) 2>/dev/null)" ] && { [ ! -d /etc/cron.d ] || [ -L /etc/cron.d ] || ! modes_trusted /etc/cron.d/. 0 || [ -z "$(find /etc/cron.d -mindepth 1 -maxdepth 1 -type f \( -perm /7137 -o ! -user root \) 2>/dev/null)" ]; } && for c in /etc/cron.hourly /etc/cron.daily /etc/cron.weekly /etc/cron.monthly; do if [ -d "$c" ] && [ ! -L "$c" ] && modes_trusted "$c/." 0 && [ -n "$(find "$c" -mindepth 1 -maxdepth 1 -type f \( -perm /002 -o ! -user root \) 2>/dev/null)" ]; then exit 1; fi; done && for c in /var/spool/cron /var/spool/cron/crontabs; do if [ -d "$c" ] && [ ! -L "$c" ] && modes_trusted "$c/." 0 && [ -n "$(find "$c" -mindepth 1 -maxdepth 1 -type f -perm /7137 2>/dev/null)" ]; then exit 1; fi; done && for s in /var/spool/cron/atjobs /var/spool/at; do if [ -d "$s" ] && [ ! -L "$s" ] && modes_trusted "$s/." 0 && [ -n "$(find "$s" -mindepth 1 -maxdepth 1 -type f -perm /7037 2>/dev/null)" ]; then exit 1; fi; done && [ -z "$(find /etc/cron.d /etc/cron.hourly /etc/cron.daily /etc/cron.weekly /etc/cron.monthly /var/spool/cron /var/spool/cron/crontabs /var/spool/cron/atjobs /var/spool/at -maxdepth 0 -type d -perm /002 2>/dev/null)" ]
