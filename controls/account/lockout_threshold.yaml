id: muster.account.lockout_threshold
title_en: Accounts lock after a bounded number of failed logins
title_ko: 로그인 실패가 정해진 횟수를 넘으면 계정이 잠긴다
description_en: pam_faillock must be stacked in every login-facing service (preauth and authfail in the auth phase, and either the module in the account phase or an authsucc line in the auth phase) and its deny value must be between 1 and the parameter; deny 0 disables the lockout. Neither distribution family stacks faillock by default, so a stock host fails until authselect's with-faillock feature or pam-auth-update's faillock profile is enabled. A pam_tally2 line, or a lockout stacked only under some other service, is not counted. DISA's rules require three attempts; the parameter tightens or relaxes the guide's five.
description_ko: 모든 로그인 서비스에 pam_faillock 이 올라가 있어야 하고 (auth 단계의 preauth 와 authfail, 그리고 account 단계의 모듈 또는 auth 단계의 authsucc 줄) deny 값이 1 이상 파라미터 이하여야 하며, deny 0 은 잠금을 해제합니다. 두 배포판 계열 모두 기본으로는 faillock 을 올리지 않으므로 authselect 의 with-faillock 기능이나 pam-auth-update 의 faillock 프로파일을 켜기 전까지 기본 설치는 실패합니다. pam_tally2 줄이나 다른 서비스에만 올라간 잠금은 인정하지 않습니다. DISA 규칙은 3회를 요구하며, 파라미터로 가이드의 5회를 조이거나 넓힐 수 있습니다.
category: account
importance: 상
automation: auto
references:
  kisa: { "2026": ["U-03"], "2021": ["U-03"] }
  cis:
    - { benchmark: ubuntu-22.04, version: "2.0.0", rec: "5.3.2.2" }
    - { benchmark: ubuntu-22.04, version: "2.0.0", rec: "5.3.3.1.1" }
  stig:
    - { benchmark: ubuntu2204, version: V2R9, id: UBTU-22-411045 }
    - { benchmark: ubuntu2404, version: V1R6, id: UBTU-24-200610 }
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-411075 }
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-611030 }
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-611035 }
  nist_800_53: ["AC-7"]
requires_facts: ">=1"
absent_means: fail
params:
  max_attempts: { type: int, default: 5, description: The largest deny value that counts as a lockout threshold }
checks:
  - { fact: pam.faillock.enabled, op: eq, expected: true }
  - { fact: pam.faillock.deny, op: gte, expected: 1 }
  - { fact: pam.faillock.deny, op: lte, expected: "${max_attempts}" }
remediation:
  text_en: RHEL family - authselect enable-feature with-faillock and set deny in /etc/security/faillock.conf; Debian family - add pam_faillock.so preauth and authfail lines to common-auth and a pam_faillock.so line to common-account (or use a pam-auth-update profile), then set deny in /etc/security/faillock.conf. A deny= argument on the pam_faillock lines wins over the file; the review script edits the file only. pam_faillock reads only a lower-case deny (DENY or Deny is ignored), and the script rewrites only such lines.
  text_ko: RHEL 계열은 authselect enable-feature with-faillock 을 실행하고 /etc/security/faillock.conf 에 deny 를 설정하며, Debian 계열은 common-auth 에 pam_faillock.so preauth 와 authfail 줄, common-account 에 pam_faillock.so 줄을 추가하거나 pam-auth-update 프로파일을 쓴 뒤 /etc/security/faillock.conf 에 deny 를 설정합니다. pam_faillock 줄의 deny= 인자는 파일보다 우선하며, 검토 스크립트는 파일만 고칩니다. pam_faillock 은 소문자 deny 만 읽으며(DENY, Deny 는 무시), 스크립트도 그런 줄만 고쳐 씁니다.
  risk: lockout_risk
  idempotent: true
  script_params: [max_attempts]
  backup: [/etc/security/faillock.conf]
  script: |
    fc=/etc/security/faillock.conf
    if [ -L "$fc" ]; then log "muster.account.lockout_threshold: $fc is a symlink, left as is"; exit 1; fi
    n=$P_max_attempts
    if [ -e "$fc" ]; then had=1; else had=0; fi
    # deny as pam_faillock reads faillock.conf (read_config_file, set_conf_opt): cut at the first #, the key ends at a blank or = and is case-sensitive, one = is skipped, sscanf %hu takes the leading digits (low 16 bits) and a value with none is ignored; the last line wins; 3 when nothing sets it
    rd_deny() { LC_ALL=C awk 'BEGIN { d = 3; while ((getline l < ARGV[1]) > 0) { sub(/#.*/, "", l); sub(/^[[:space:]]+/, "", l); sub(/[[:space:]]+$/, "", l); k = l; sub(/[[:space:]=].*/, "", k); if (k != "deny") continue; v = substr(l, 5); e = (v ~ /^=/); v = substr(v, 2); while (v ~ /^[[:space:]]/ || (v ~ /^=/ && !e)) { if (v ~ /^=/) e = 1; v = substr(v, 2) } if (!match(v, /^[+-]?[0-9]+/)) continue; s = substr(v, 1, RLENGTH); g = (s ~ /^-/); sub(/^[+-]/, "", s); sub(/^0+/, "", s); if (length(s) > 20 || (length(s) == 20 && s > "18446744073709551615")) { d = 65535; continue } m = 0; for (i = 1; i <= length(s); i++) m = (m * 10 + substr(s, i, 1)) % 65536; d = (g && m) ? 65536 - m : m } print d }' "$@"; }
    v=$(rd_deny "$fc")
    case "$v" in ''|*[!0-9]*) v=3;; esac
    if [ "$v" -lt 1 ] || [ "$v" -gt "$n" ]; then
      if LC_ALL=C grep -Eq '^[[:space:]]*deny([[:space:]=#]|$)' "$fc" 2>/dev/null; then sed -i -E "s|^([[:space:]]*)deny([[:space:]=#].*)?$|\1deny = $n|" "$fc"; else { if [ -s "$fc" ] && [ -n "$(tail -c1 "$fc")" ]; then echo >> "$fc"; fi; printf 'deny = %s\n' "$n" >> "$fc"; }; fi
      if [ "$had" = 0 ]; then chmod 644 "$fc"; fi
    fi
  validate: |
    LC_ALL=C awk 'BEGIN { d = 3; while ((getline l < ARGV[1]) > 0) { sub(/#.*/, "", l); sub(/^[[:space:]]+/, "", l); sub(/[[:space:]]+$/, "", l); k = l; sub(/[[:space:]=].*/, "", k); if (k != "deny") continue; v = substr(l, 5); e = (v ~ /^=/); v = substr(v, 2); while (v ~ /^[[:space:]]/ || (v ~ /^=/ && !e)) { if (v ~ /^=/) e = 1; v = substr(v, 2) } if (!match(v, /^[+-]?[0-9]+/)) continue; s = substr(v, 1, RLENGTH); g = (s ~ /^-/); sub(/^[+-]/, "", s); sub(/^0+/, "", s); if (length(s) > 20 || (length(s) == 20 && s > "18446744073709551615")) { d = 65535; continue } m = 0; for (i = 1; i <= length(s); i++) m = (m * 10 + substr(s, i, 1)) % 65536; d = (g && m) ? 65536 - m : m } print d }' /etc/security/faillock.conf | awk '{ exit !($1 + 0 >= 1 && $1 + 0 <= M) }' M="$P_max_attempts"
