id: muster.account.umask_policy
title_en: The default file-creation mask denies group and other write
title_ko: 기본 파일 생성 마스크가 그룹·기타 쓰기를 막는다
description_en: The default UMASK in login.defs must be 022 or stricter so new files are not group- or world-writable, and pam_umask must be stacked so the mask applies to sessions that never read /etc/profile (cron, non-login SSH). The parameter lists the masks that count as strict enough; a host that sets a weaker mask, or that does not stack pam_umask, is reported.
description_ko: login.defs 의 기본 UMASK 가 022 이상으로 엄격해 새 파일이 그룹·전체 쓰기 가능이 되지 않아야 하고, /etc/profile 을 읽지 않는 세션(cron, 비로그인 SSH)에도 마스크가 적용되도록 pam_umask 가 올라가 있어야 합니다. 파라미터는 충분히 엄격한 것으로 인정하는 마스크 목록이며, 더 약한 마스크를 설정했거나 pam_umask 를 올리지 않은 호스트는 보고됩니다.
category: account
importance: 중
automation: auto
references:
  kisa: { "2026": ["U-30"], "2021": ["U-56"] }
  stig:
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-411025 }
  nist_800_53: ["CM-6"]
requires_facts: ">=1"
absent_means: fail
params:
  acceptable: { type: list<string>, default: ["027", "022", "077", "0027", "0022", "0077"], description: UMASK values that deny at least group and other write }
checks:
  - { fact: accounts.login_defs.umask, op: in, expected: "${acceptable}" }
  - { fact: pam.umask_module.enabled, op: eq, expected: true }
remediation:
  text_en: Set UMASK 027 in /etc/login.defs and ensure a "session optional pam_umask.so" line is present in the login and non-login PAM session stacks (pam-auth-update on Debian, authselect on RHEL). The review script sets UMASK in /etc/login.defs only and never edits a PAM stack, so on a host without a pam_umask line the block ends done and the control still FAILs. A symlinked /etc/login.defs is never followed; the block stops.
  text_ko: /etc/login.defs 에 UMASK 027 을 설정하고 로그인·비로그인 PAM 세션 스택에 "session optional pam_umask.so" 줄이 있게 합니다(Debian 은 pam-auth-update, RHEL 은 authselect). 검토 스크립트는 /etc/login.defs 의 UMASK 만 고치며 PAM 스택은 건드리지 않으므로, pam_umask 줄이 없는 호스트에서는 블록이 done 으로 끝나도 이 control은 FAIL로 남습니다. 심볼릭 링크인 /etc/login.defs 는 따라가지 않고 그 블록을 멈춥니다.
  risk: none
  idempotent: true
  script_params: [acceptable]
  backup: [/etc/login.defs]
  script: |
    ld=/etc/login.defs
    if [ -L "$ld" ]; then log "muster.account.umask_policy: $ld is a symlink, left as is"; exit 1; fi
    first=${P_acceptable%% *}
    v=$(awk '$1 == "UMASK" { print $2; exit }' "$ld")
    case " $P_acceptable " in
      *" $v "*) ;;
      *) if grep -Eq '^[[:space:]]*UMASK[[:space:]]' "$ld"; then sed -i -E "s|^([[:space:]]*UMASK)[[:space:]].*|\1 $first|" "$ld"; else { if [ -s "$ld" ] && [ -n "$(tail -c1 "$ld")" ]; then echo >> "$ld"; fi; printf 'UMASK %s\n' "$first" >> "$ld"; }; fi;;
    esac
  validate: |
    case " $P_acceptable " in *" $(awk '$1 == "UMASK" { print $2; exit }' /etc/login.defs) "*) ;; *) false;; esac
