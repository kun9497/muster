id: muster.account.root_remote_login
title_en: Root cannot log in directly over SSH
title_ko: root 계정이 SSH로 직접 로그인할 수 없다
description_en: The SSH daemon's effective PermitRootLogin must not allow a root password login. Where the sshd option cannot be read, the legacy /etc/securetty list must not allow pseudo-terminals.
description_ko: sshd의 유효 PermitRootLogin 값이 root 패스워드 로그인을 허용하면 안 됩니다. sshd 옵션을 읽을 수 없는 경우 구형 /etc/securetty 목록이 가상 터미널을 허용하면 안 됩니다.
category: account
importance: 상
automation: auto
references:
  kisa: { "2026": ["U-01"], "2021": ["U-01"] }
  stig:
    - { benchmark: ubuntu2204, version: V2R9, id: UBTU-22-411010 }
    - { benchmark: ubuntu2404, version: V1R6, id: UBTU-24-400110 }
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-255045 }
  nist_800_53: ["IA-2(5)"]
requires_facts: ">=1"
applies_when:
  - { fact: services.ssh.installed, op: eq, expected: true }
absent_means: manual
params:
  allowed: { type: list<string>, default: ["no", "prohibit-password"], description: PermitRootLogin values that count as disabled }
mechanisms:
  - when:
      - { fact: sshd.options.permit_root_login, op: present }
    checks:
      - { fact: sshd.options.permit_root_login, on: effective, persona: root, op: in, expected: "${allowed}" }
  - when:
      - { fact: pam.securetty_enabled, op: eq, expected: true }
      - { fact: files.etc_securetty, op: present }
    checks:
      - { fact: files.etc_securetty_lines, op: none, where: { op: matches, expected: "^pts/" } }
remediation:
  text_en: 'Set PermitRootLogin no in /etc/ssh/sshd_config.d/00-muster.conf, validate with sshd -t, then restart sshd while keeping a second session open. Where /etc/securetty lists pts/* entries instead, remove those lines so no pseudo-terminal can be used for a securetty-gated root login. sshd keeps the first value it reads: a drop-in that sorts before 00-muster.conf, or a PermitRootLogin line before the Include in sshd_config, still wins. The script reloads a running sshd; a Match block that sets PermitRootLogin for root also wins, and the validate then fails and rolls back. The script replaces a pre-existing 00-muster.conf whole with that one line; a rollback puts the recorded file back before it reloads.'
  text_ko: /etc/ssh/sshd_config.d/00-muster.conf 파일에 PermitRootLogin no 를 넣고 sshd -t 로 검증한 뒤, 다른 세션을 열어 둔 채 sshd 를 재시작합니다. 대신 /etc/securetty 에 pts/* 항목이 있다면 그 줄을 제거하여 securetty 로 통제되는 root 로그인에 가상 터미널을 쓸 수 없게 합니다. sshd는 처음 읽은 값을 지키므로 00-muster.conf보다 먼저 정렬되는 드롭인이나 sshd_config의 Include 앞 PermitRootLogin 줄이 여전히 이깁니다. 스크립트는 실행 중인 sshd를 다시 읽게 합니다. root에 PermitRootLogin을 정하는 Match 블록도 이기며, 그러면 validate가 실패하고 롤백합니다. 스크립트는 이미 있던 00-muster.conf를 그 한 줄로 통째로 바꾸며, 롤백은 다시 읽게 하기 전에 기록해 둔 파일을 되돌립니다.
  risk: lockout_risk
  idempotent: true
  backup: [/etc/ssh/sshd_config.d/00-muster.conf, /etc/securetty]
  script: |
    if [ -L /etc/ssh/sshd_config.d/00-muster.conf ]; then log "muster.account.root_remote_login: /etc/ssh/sshd_config.d/00-muster.conf is a symlink (a mask), left as is"; exit 1; fi
    if [ -L /etc/securetty ]; then log "muster.account.root_remote_login: /etc/securetty is a symlink, left as is"; exit 1; fi
    if command -v sshd >/dev/null 2>&1; then
      [ -d /run/sshd ] || mkdir -p /run/sshd
      printf 'PermitRootLogin no\n' > /etc/ssh/sshd_config.d/00-muster.conf
      chmod 644 /etc/ssh/sshd_config.d/00-muster.conf
      sshd -t
      if systemctl is-active --quiet sshd.service; then systemctl reload sshd.service; fi
      if systemctl is-active --quiet ssh.service; then systemctl reload ssh.service; fi
    fi
    if [ -f /etc/securetty ]; then
      sed -i '/^[[:space:]]*pts\//d' /etc/securetty
    fi
  validate: "if command -v sshd >/dev/null 2>&1; then sshd -T -C user=root,host=localhost,addr=127.0.0.1 2>/dev/null | grep -qx 'permitrootlogin no'; fi"
  rollback: |
    [ -L /etc/ssh/sshd_config.d/00-muster.conf ] || restore /etc/ssh/sshd_config.d/00-muster.conf
    if command -v sshd >/dev/null 2>&1; then sshd -t; fi
    if command -v sshd >/dev/null 2>&1; then
      if systemctl is-active --quiet sshd.service; then systemctl reload sshd.service; fi
      if systemctl is-active --quiet ssh.service; then systemctl reload ssh.service; fi
    fi
decision: D09
