id: muster.service.login_banner
title_en: A login warning banner is presented
title_ko: 로그인 시 경고 메시지가 표시된다
description_en: A login must present a warning banner. When sshd is installed, its Banner directive must name a non-empty file, so a remote login sees the message before authenticating; otherwise the network banner /etc/issue.net must carry an actual warning rather than only the distribution and version string. This is reported for review rather than as a hard failure because a real message of the day on the Ubuntu family is generated by /etc/update-motd.d scripts that muster inventories but does not judge, so the static-file check is structurally incomplete. A stock host serves no sshd Banner and leaks the release string in /etc/issue.net, so it is flagged for the operator to set a real banner.
description_ko: 로그인 시 경고 배너가 표시되어야 합니다. sshd 가 설치된 경우 Banner 지시자가 비어 있지 않은 파일을 가리켜 원격 로그인이 인증 전에 메시지를 보게 해야 하고, 그렇지 않으면 네트워크 배너 /etc/issue.net 이 배포판·버전 문자열이 아닌 실제 경고를 담아야 합니다. Ubuntu 계열의 실제 message of the day 는 muster 가 목록만 만들고 판단하지 않는 /etc/update-motd.d 스크립트로 생성되어 정적 파일 점검이 구조적으로 불완전하므로, 하드 실패가 아니라 검토 대상으로 보고합니다. 기본 설치는 sshd Banner 를 제공하지 않고 /etc/issue.net 에 릴리스 문자열을 노출하므로, 운영자가 실제 배너를 설정하도록 표시됩니다.
category: service
importance: 하
automation: partial
references:
  kisa: { "2026": ["U-62"], "2021": ["U-68"] }
  cis:
    - { benchmark: ubuntu-22.04, version: "2.0.0", rec: "1.6.3" }
    - { benchmark: ubuntu-22.04, version: "2.0.0", rec: "5.1.5" }
  stig:
    - { benchmark: ubuntu2204, version: V2R9, id: UBTU-22-255020 }
    - { benchmark: ubuntu2404, version: V1R6, id: UBTU-24-200640 }
    - { benchmark: rhel9, version: V2R9, id: RHEL-09-255025 }
  nist_800_53: ["AC-8"]
requires_facts: ">=1"
absent_means: manual
mechanisms:
  - when:
      - { fact: services.ssh.installed, op: eq, expected: true }
    checks:
      - { fact: sshd.banner_file.nonempty, op: eq, expected: true }
  - when:
      - { fact: banners.issue_net.nonempty, op: present }
    checks:
      - { fact: banners.issue_net.nonempty, op: eq, expected: true }
      - { fact: banners.issue_net.os_escapes, op: eq, expected: false }
remediation:
  text_en: Point sshd's Banner at a file holding your warning (Banner /etc/issue.net in /etc/ssh/sshd_config.d/, validate with sshd -t, restart sshd) and replace the distribution string in /etc/issue and /etc/issue.net with an authorized-use warning.
  text_ko: sshd 의 Banner 를 경고 문구가 담긴 파일로 지정하고(/etc/ssh/sshd_config.d/ 에 Banner /etc/issue.net, sshd -t 로 검증 후 재시작) /etc/issue 와 /etc/issue.net 의 배포판 문자열을 인가된 사용 경고로 바꿉니다.
  risk: none
  idempotent: true
