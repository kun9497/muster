id: muster.service.ftpusers_permissions
title_en: The FTP access-control files are root-owned and 0640 or stricter
title_ko: FTP 접근 제어 파일이 root 소유이고 0640 이하로 엄격하다
description_en: "The files an FTP daemon consults to decide who may log in - /etc/ftpusers, the list a pam_listfile.so line in the daemon's PAM stack names, and vsftpd's own userlist_file - decide access, so an account that can rewrite one can grant itself a login. Each of them must be owned by root and no more permissive than 0640 (relax the default with params.allowed_modes, spec §6.6); the mode is compared against the bit-subsets of 0640, since there is no bit operator in a clause. A host whose FTP configuration names no access-control file at all fails: there is nothing standing between a local account and the service. So does one whose configuration names lists that exist on no disk - the presence leaf asks whether at least one named file is really there, and a path nothing has created refuses nobody. The permissions are judged only for a file that EXISTS - a configuration may legitimately name one list that has not been created yet, and a file that is not there has no permissions to judge, so it is reported and not counted against the host. Where the set of access files could not be completed - a PAM stack outside this collector's declaration or one it could not read, a list whose own stat failed, or a pam_listfile line filtering on something other than the account name - the result is a manual review rather than a pass over a partial list. A host with no FTP daemon installed is not applicable."
description_ko: "FTP 데몬이 로그인 허용 여부를 결정할 때 참조하는 파일들 - /etc/ftpusers, 데몬 PAM 스택의 pam_listfile.so 줄이 지정한 목록, vsftpd 자신의 userlist_file - 은 접근을 결정하므로, 이 파일을 고쳐 쓸 수 있는 계정은 스스로에게 로그인을 허용할 수 있습니다. 각 파일은 root 소유여야 하고 0640 이하로 엄격해야 합니다(기본값은 params.allowed_modes 로 완화, 스펙 §6.6). 절 안에는 비트 연산자가 없으므로 mode 는 0640 의 비트 부분집합들과 비교합니다. FTP 설정이 접근 제어 파일을 하나도 지정하지 않은 호스트는 실패입니다 - 로컬 계정과 서비스 사이에 아무것도 없기 때문입니다. 설정이 목록을 지정했지만 그중 어느 것도 디스크에 없는 호스트도 마찬가지로 실패입니다 - 존재 여부 리프는 지정된 파일 중 적어도 하나가 실제로 있는지를 묻고, 아무도 만들지 않은 경로는 누구도 거부하지 못하기 때문입니다. 권한은 실제로 존재하는 파일에 대해서만 판정합니다 - 아직 만들지 않은 목록 하나를 설정이 지정하는 것은 정당할 수 있고, 없는 파일에는 판정할 권한이 없으므로 보고만 하고 결함으로 세지 않습니다. 접근 파일 집합을 완성하지 못한 경우 - 이 수집기의 선언 밖이거나 읽지 못한 PAM 스택, stat 에 실패한 목록, 계정 이름이 아닌 다른 것으로 걸러 내는 pam_listfile 줄 - 는 불완전한 목록을 통과시키는 대신 수동 검토입니다. FTP 데몬이 설치되어 있지 않은 호스트는 해당 없음입니다."
category: service
importance: 하
automation: auto
references:
  kisa: { "2026": ["U-56"], "2021": ["U-63"] }
requires_facts: ">=1"
absent_means: manual
applies_when:
  - { fact: services.ftp.installed, op: eq, expected: true }
params:
  # Ruling L-15: the collector stores the raw 0o7777 bits as an INT, so this
  # parameter is a list of ints (416 is 0640), the shape
  # muster.account.cron_permissions uses.
  allowed_modes: { type: list<int>, default: [0, 32, 128, 160, 256, 288, 384, 416], description: access-file modes at 0640 or stricter (bit-subsets of 0640) }
checks:
  - { fact: ftp.access_file_present, op: eq, expected: true }
  # `where` runs before `require`, so a row for a file that is not there is
  # dropped before its -1 sentinel mode and uid are ever compared.
  - { fact: ftp.access_files, op: each, subject: path, where: { field: exists, op: eq, expected: true }, require: { field: uid, op: eq, expected: 0 } }
  - { fact: ftp.access_files, op: each, subject: path, where: { field: exists, op: eq, expected: true }, require: { field: mode, op: in, expected: "${allowed_modes}" } }
remediation:
  text_en: Create the access-control file the daemon names if it does not exist, then chown root:root and chmod 640 each of /etc/ftpusers, the pam_listfile list and vsftpd's userlist_file.
  text_ko: 데몬이 지정한 접근 제어 파일이 없으면 만든 뒤, /etc/ftpusers 와 pam_listfile 목록, vsftpd 의 userlist_file 각각에 chown root:root 와 chmod 640 을 적용합니다.
  risk: none
  idempotent: true
decision: D09
