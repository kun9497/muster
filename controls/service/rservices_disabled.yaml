id: muster.service.rservices_disabled
title_en: The r-services are not enabled or reachable
title_ko: r-services(rsh/rlogin/rexec)가 활성화되어 있지 않다
description_en: No rsh, rlogin or rexec server may be active, enabled at boot, hosted by inetd/xinetd, or listening on a non-loopback address. A host without any r-service server passes.
description_ko: rsh, rlogin, rexec 서버가 활성이거나 부팅 시 시작되도록 설정되어 있거나 inetd/xinetd 로 구동되거나 루프백 외 주소에서 대기하면 안 됩니다. r-services 서버가 전혀 없는 호스트는 통과합니다.
category: service
importance: 상
automation: auto
references:
  kisa: { "2026": ["U-36"], "2021": ["U-21"] }
  stig:
    - { benchmark: ubuntu2204, version: "V2R9", id: "UBTU-22-215030" }
    - { benchmark: ubuntu2404, version: "V1R6", id: "UBTU-24-100040" }
requires_facts: ">=1"
absent_means: pass
checks:
  - { fact: services.rservices.active, op: eq, expected: false }
  - { fact: services.rservices.enabled, op: eq, expected: false }
  - { fact: services.rservices.reachable, op: eq, expected: false }
remediation:
  text_en: Disable and mask the rsh, rlogin and rexec services or remove the r-services package, and remove any inetd/xinetd r-services entries. An rsh, rlogin or rexec started by inetd or xinetd is not stopped by the script; remove its entry there.
  text_ko: rsh, rlogin, rexec 서비스를 비활성화·mask 하거나 r-services 패키지를 제거하고, inetd/xinetd 의 r-services 항목을 제거합니다. inetd나 xinetd가 띄우는 rsh, rlogin, rexec는 스크립트가 멈추지 않습니다. 거기서 항목을 지우십시오.
  risk: restart_service
  idempotent: true
  script: |
    for u in rsh.socket rlogin.socket rexec.socket; do
      systemctl cat "$u" >/dev/null 2>&1 || continue
      systemctl disable --now "$u"
      systemctl mask "$u"
    done
  validate: '! systemctl is-active --quiet rsh.socket && case "$(systemctl is-enabled rsh.socket 2>/dev/null)" in enabled|enabled-runtime) false;; esac && ! systemctl is-active --quiet rlogin.socket && case "$(systemctl is-enabled rlogin.socket 2>/dev/null)" in enabled|enabled-runtime) false;; esac && ! systemctl is-active --quiet rexec.socket && case "$(systemctl is-enabled rexec.socket 2>/dev/null)" in enabled|enabled-runtime) false;; esac'
  rollback: |
    for u in rsh.socket rlogin.socket rexec.socket; do
      systemctl cat "$u" >/dev/null 2>&1 || continue
      systemctl unmask "$u"
      systemctl enable --now "$u"
    done
decision: D19
