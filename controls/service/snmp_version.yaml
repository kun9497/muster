id: muster.service.snmp_version
title_en: The SNMP agent enables only version 3
title_ko: SNMP 에이전트가 버전 3 만 사용한다
description_en: "An SNMP agent must not enable SNMPv1 or SNMPv2c. Both carry the community string in clear text on every packet and authenticate with nothing else, so anyone who can read one query owns read - and, with a write community, write - access to the agent. The enabled versions are read from the agent's own configuration stack: a rocommunity or rwcommunity directive is net-snmp shorthand that enables both v1 and v2c, a com2sec enables a version only once a group names that model for its security name, and v3 is enabled by the existence of a configured v3 user. A user recorded only as a usmUser line in the persistent state file is not parsed, so snmp.v3_users can be empty on a host that does run v3 - no control judges that list, and this one judges the versions, where the miss can only understate v3 and never add v1 or v2c. A host with no SNMP agent installed is not applicable. Where part of the configuration could not be read, the enabled versions are unknown and the result is a manual review rather than a pass."
description_ko: "SNMP 에이전트는 SNMPv1 과 SNMPv2c 를 활성화하면 안 됩니다. 두 버전은 모든 패킷에 커뮤니티 문자열을 평문으로 실어 보내고 그 외의 인증 수단이 없으므로, 질의 한 번을 엿볼 수 있는 사람이면 누구나 읽기 권한을 - 쓰기 커뮤니티라면 쓰기 권한까지 - 갖게 됩니다. 활성 버전은 에이전트 설정 전체에서 읽습니다: rocommunity·rwcommunity 지시자는 v1 과 v2c 를 함께 켜는 net-snmp 축약형이고, com2sec 는 그 보안 이름에 대해 group 이 모델을 지정해야 비로소 해당 버전을 켜며, v3 는 설정된 v3 사용자의 존재로 판단합니다. 영속 상태 파일의 usmUser 줄로만 남은 사용자는 파싱하지 않으므로 실제로 v3 를 쓰는 호스트에서도 snmp.v3_users 가 비어 있을 수 있습니다 - 그 목록은 어떤 점검도 판단 근거로 쓰지 않으며, 이 점검은 버전을 봅니다. 누락은 v3 를 과소 보고할 뿐 v1·v2c 를 더하지는 않습니다. SNMP 에이전트가 설치되어 있지 않은 호스트는 해당 없음입니다. 설정 일부를 읽지 못했다면 활성 버전을 알 수 없으므로 통과가 아니라 수동 검토로 처리합니다."
category: service
importance: 상
automation: auto
references:
  kisa: { "2026": ["U-59"], "2021": [] }
requires_facts: ">=1"
absent_means: manual
applies_when:
  # Ruling J-22 - never `op: present`; see muster.service.nfs_export_access.
  - { fact: services.snmp.installed, op: eq, expected: true }
checks:
  - { fact: snmp.versions_enabled, op: none, where: { op: in, expected: ["v1", "v2c"] } }
remediation:
  text_en: Remove every rocommunity, rocommunity6, rwcommunity, rwcommunity6 and com2sec directive from snmpd.conf and define SNMPv3 users instead (net-snmp-create-v3-user with an authentication and a privacy protocol), then restart the agent.
  text_ko: snmpd.conf 에서 rocommunity, rocommunity6, rwcommunity, rwcommunity6, com2sec 지시자를 모두 제거하고 대신 SNMPv3 사용자를 정의한 뒤(net-snmp-create-v3-user 로 인증·암호 프로토콜을 지정) 에이전트를 재시작합니다.
  risk: restart_service
  idempotent: true
decision: D09
