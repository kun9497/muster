id: muster.service.snmp_access_control
title_en: SNMP communities are bound to the managers allowed to use them
title_ko: SNMP 커뮤니티가 사용을 허용한 관리 서버에 묶여 있다
description_en: "Every configured SNMP community must name the host or network allowed to use it rather than accepting any source. A community with no source, or one bound to an any-address form such as default, 0.0.0.0/0 or ::, is usable by anyone who can reach the agent's port. The source is read from the directive that defines the community - the third token of a rocommunity or rwcommunity line, the middle field of a com2sec - and the VACM lines and agentaddress specifications the collector also records are evidence for a reviewer, not conditions of this check: an agent bound only to loopback is a real mitigation but it is a listen address, changeable without touching the community, so it does not by itself pass a community that names no source. A trap destination's community is outbound and has no source at all, so a host that traps is judged here too; where a trap community is deliberately unbound, waive the control rather than widening it. A host with no SNMP agent installed is not applicable, and where part of the configuration could not be read the result is a manual review rather than a pass."
description_ko: "설정된 모든 SNMP 커뮤니티는 아무 출발지나 받아들이지 말고 사용을 허용할 호스트나 네트워크를 지정해야 합니다. 소스가 없는 커뮤니티, 또는 default·0.0.0.0/0·:: 같은 임의 주소 형태에 묶인 커뮤니티는 에이전트 포트에 닿을 수 있는 누구나 쓸 수 있습니다. 소스는 커뮤니티를 정의한 지시자에서 읽습니다 - rocommunity·rwcommunity 줄의 세 번째 토큰, com2sec 의 가운데 필드입니다. 수집기가 함께 기록하는 VACM 줄과 agentaddress 지정은 검토자를 위한 증거이지 이 점검의 조건이 아닙니다: 루프백에만 바인딩한 에이전트는 실제로 완화 수단이지만 커뮤니티를 건드리지 않고도 바꿀 수 있는 리슨 주소이므로, 소스를 지정하지 않은 커뮤니티를 그것만으로 통과시키지 않습니다. 트랩 대상의 커뮤니티는 나가는 방향이라 소스가 아예 없으므로 트랩을 보내는 호스트도 여기서 함께 판단합니다. 트랩 커뮤니티를 의도적으로 묶지 않는 경우라면 점검을 넓히지 말고 예외(waiver)로 처리하십시오. SNMP 에이전트가 설치되어 있지 않은 호스트는 해당 없음이고, 설정 일부를 읽지 못했다면 통과가 아니라 수동 검토로 처리합니다."
category: service
importance: 상
automation: auto
references:
  kisa: { "2026": ["U-61"], "2021": [] }
requires_facts: ">=1"
absent_means: manual
applies_when:
  # Ruling J-22 - never `op: present`; see muster.service.nfs_export_access.
  - { fact: services.snmp.installed, op: eq, expected: true }
checks:
  - { fact: snmp.communities, op: each, subject: ref, require: { field: source_restricted, op: eq, expected: true } }
remediation:
  text_en: Give every rocommunity, rwcommunity and com2sec line in snmpd.conf the address or CIDR range of the manager allowed to use it instead of default or an any-address form, restart the agent, and restrict 161/udp at the host firewall as well.
  text_ko: snmpd.conf 의 rocommunity·rwcommunity·com2sec 줄에 default 나 임의 주소 형태 대신 사용을 허용할 관리 서버의 주소나 CIDR 대역을 지정하고, 에이전트를 재시작한 뒤 호스트 방화벽에서도 161/udp 를 제한합니다.
  risk: restart_service
  idempotent: true
decision: D09
