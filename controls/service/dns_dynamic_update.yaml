id: muster.service.dns_dynamic_update
title_en: Every authoritative zone restricts who may update it dynamically
title_ko: 모든 권한 존이 동적 업데이트 대상을 제한한다
description_en: "Dynamic update lets a client write records into a zone over the network. A zone that accepts updates from anyone lets a caller add, replace or delete any name it serves - pointing a host name at an address of the caller's choosing is enough to sit in the middle of traffic that was meant for somewhere else. The check reads each zone this host is authoritative for (type primary or master) and requires that updates be restricted: allow-update names someone rather than any, or the zone carries an update-policy, which grants named identities per-name permission instead of opening the zone to an address range. allow-update is unset by default in every BIND version and an unset list is none, so a zone that never mentions it is restricted. That is a fact about the directive, not a promise about this control's reach: a host is described by ONE zone list, so when a zone leaves allow-transfer unset on a BIND build muster cannot place, the whole list is withheld and this control reads MANUAL on that host exactly as U-50 does. What the build never touches is the options-level allow-update, which keeps its answer either way. A configuration using views is a manual review: muster does not model them, and the same zone name can carry different lists per view. An address match list element written in the geoip or ecs address-match form is read as a name no acl in the chain defines, so a configuration using either is reported as unknown and reviewed manually rather than judged from the elements beside it. So is a chain muster could not read in full, or one whose zone list it had to withhold. A host with no BIND installed, or one running unbound, is not applicable."
description_ko: "동적 업데이트는 클라이언트가 네트워크를 통해 존에 레코드를 기록하게 해 줍니다. 누구의 업데이트든 받아들이는 존은 자신이 서비스하는 이름을 임의로 추가·교체·삭제하도록 허용하는 셈이며, 호스트 이름을 공격자가 고른 주소로 돌려놓는 것만으로도 다른 곳으로 향하던 트래픽 한가운데에 자리 잡을 수 있습니다. 이 점검은 이 호스트가 권한을 가진 존(type 이 primary 또는 master)마다 업데이트가 제한되어 있는지 확인합니다 - allow-update 가 any 가 아니라 대상을 지정하고 있거나, 존이 update-policy 를 두어 주소 대역을 여는 대신 지정된 신원에 이름 단위 권한을 주는 경우입니다. allow-update 는 모든 BIND 버전에서 기본적으로 설정되지 않으며 설정되지 않은 목록은 none 이므로, 이를 전혀 언급하지 않은 존은 제한된 상태입니다. 이는 지시자에 대한 사실일 뿐 이 항목의 적용 범위를 보장하지는 않습니다 - 한 호스트는 하나의 존 목록으로 기술되므로, muster 가 판별하지 못하는 BIND 빌드에서 어떤 존이 allow-transfer 를 설정하지 않으면 목록 전체가 보류되고 이 항목도 U-50 과 똑같이 수동 검토가 됩니다. 빌드와 무관한 것은 options 수준의 allow-update 이며, 이쪽은 어느 경우든 답을 유지합니다. view 를 쓰는 구성은 수동 검토입니다. muster 는 view 를 모델링하지 않으며 같은 존 이름이 view 마다 다른 목록을 가질 수 있기 때문입니다. geoip 또는 ecs 주소 일치 형식으로 쓴 원소는 체인의 어떤 acl 도 정의하지 않는 이름으로 읽히므로, 둘 중 하나를 쓰는 구성은 곁에 있는 원소로 판정하지 않고 알 수 없는 것으로 보아 수동 검토합니다. 끝까지 읽지 못한 설정 체인이나 존 목록을 보류해야 했던 경우도 마찬가지입니다. BIND 가 설치되지 않았거나 unbound 를 쓰는 호스트는 해당 없음입니다."
category: service
importance: 중
automation: auto
references:
  kisa: { "2026": ["U-51"], "2021": [] }
requires_facts: ">=1"
absent_means: manual
applies_when:
  - { fact: services.dns.installed, op: eq, expected: true }
  - { fact: dns.implementation, op: eq, expected: bind }
checks:
  # The `where` runs before the `require`, for the same reason as U-50: a
  # record of another type may carry fewer fields (Ruling L-53).
  - { fact: dns.zones, op: each, subject: name, where: { field: type, op: in, expected: ["primary", "master"] }, require: { field: update_restricted, op: eq, expected: true } }
remediation:
  text_en: Remove allow-update { any; } from the zone, leaving it unset (which is none) or naming the updaters, or replace it with an update-policy that grants a TSIG identity permission over the names it really owns; then reload named.
  text_ko: 존에서 allow-update { any; } 를 제거하여 설정하지 않은 상태(none)로 두거나 업데이트 주체를 지정하고, 또는 TSIG 신원에 실제로 소유한 이름에 대해서만 권한을 주는 update-policy 로 대체한 뒤 named 를 다시 읽힙니다.
  risk: restart_service
  idempotent: true
decision: D09
