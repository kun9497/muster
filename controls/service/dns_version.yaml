id: muster.service.dns_version
title_en: The nameserver is kept at the vendor's patched level
title_ko: 네임서버가 벤더가 패치한 수준으로 유지된다
description_en: "A nameserver answers on port 53 for every client that can reach it, with no credential in the way, and the history of BIND includes remotely triggerable crashes and cache-poisoning bugs - so the version the package is at decides how much of that history this host still carries. This item asks whether the DNS server package - BIND on almost every host, unbound where that is what is installed - is at the level the distribution's security updates have reached, and muster deliberately does not answer it. Matching a version string against an advisory is a claim about which fixes were backported into which build (D24), and the distributions muster targets patch in place while leaving the upstream version number alone; asking named for its version would mean running it, which muster never does (D14). What the host does carry is its patch state: patch.pending_security_count is how many security updates are waiting, and patch.metadata_age_s is how old the index those counts came from is - a count of zero read from a stale index says nothing. Read the two beside the package manager's own record of the installed nameserver and decide. A host with no DNS server installed is not applicable."
description_ko: "네임서버는 port 53 에서 도달 가능한 모든 클라이언트에게 자격 증명 없이 응답하며, BIND 의 이력에는 원격에서 유발할 수 있는 중단과 캐시 오염 결함이 포함되어 있습니다. 따라서 패키지가 어느 버전에 있는지가 이 호스트가 그 이력을 얼마나 안고 있는지를 결정합니다. 이 항목은 DNS 서버 패키지 - 대부분의 호스트에서는 BIND, unbound 를 설치한 호스트에서는 unbound - 가 배포판 보안 업데이트가 도달한 수준에 있는지를 묻고, muster 는 의도적으로 답하지 않습니다. 버전 문자열을 권고문과 대조하는 것은 어떤 수정이 어떤 빌드에 백포트되었는지에 대한 주장이며(D24), muster 가 대상으로 삼는 배포판은 상위 버전 번호를 그대로 둔 채 제자리에서 패치합니다. named 에게 버전을 묻는 것은 데몬을 실행하는 일이므로 muster 는 하지 않습니다(D14). 호스트가 실제로 가진 근거는 패치 상태입니다 - patch.pending_security_count 는 대기 중인 보안 업데이트 수이고, patch.metadata_age_s 는 그 수를 읽어 온 인덱스의 나이입니다. 오래된 인덱스에서 읽은 0 은 아무 말도 하지 못합니다. 이 둘을 패키지 관리자가 기록한 설치된 네임서버 정보와 함께 읽고 판단하십시오. DNS 서버가 설치되지 않은 호스트는 해당 없음입니다."
category: service
importance: 상
automation: manual
manual_reason: "Confirm by hand that the nameserver package on this host is at the level the vendor's security updates have reached. muster never matches a version against an advisory (D24) and never asks the daemon, so read patch.pending_security_count and patch.metadata_age_s together with the package manager's own record of the installed DNS server."
references:
  kisa: { "2026": ["U-49"], "2021": ["U-33"] }
requires_facts: ">=1"
applies_when:
  # Ruling L-11: both gates are facts the snapshot always carries, so a host
  # with no nameserver reads NOT_APPLICABLE rather than a permanent MANUAL
  # row, and the two of them are the evidence the MANUAL result is shown
  # with. Ruling L-6: the patch.* leaves the operator reads are evidence,
  # never a gate - a host whose patch collector could not answer must still
  # raise this item.
  - { fact: services.dns.installed, op: eq, expected: true }
  - { fact: dns.implementation, op: present }
remediation:
  text_en: Refresh the package index and install the distribution's pending security updates for the nameserver from its own repository, then restart named and confirm it is answering again.
  text_ko: 패키지 인덱스를 갱신하고 배포판 저장소에서 네임서버의 대기 중인 보안 업데이트를 설치한 뒤, named 를 재시작하고 다시 응답하는지 확인합니다.
  risk: restart_service
  idempotent: true
decision: D09
