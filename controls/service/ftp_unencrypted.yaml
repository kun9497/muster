id: muster.service.ftp_unencrypted
title_en: No FTP service accepts a cleartext session
title_ko: 암호화되지 않은 FTP 서비스가 동작하지 않는다
description_en: "FTP authenticates with a password sent in the clear, so a running FTP service must refuse a session that is not wrapped in TLS. Two questions decide this control, and which one is asked depends on the host. When the FTP unit is installed but NOT running, there is no unencrypted service to find and the control passes: an operator who has stopped the daemon has removed the exposure, whatever the configuration file still says. When it IS running, the configuration must enforce TLS for every session it serves - vsftpd's ssl_enable with force_local_logins_ssl and force_local_data_ssl (both default YES) left on, plus force_anon_logins_ssl and force_anon_data_ssl (both default NO) turned on wherever anonymous logins are served, so ssl_enable beside an anonymous login is not enough; proftpd's TLSEngine on with TLSRequired on at the top level; pure-ftpd's TLS at 2 or higher, which refuses a cleartext session outright. Where muster cannot tell whether the unit is running - a host with no service manager it can query - neither question can be asked and the result is a manual review, not a pass. A host with no FTP daemon installed is not applicable, and a configuration that could not be read in full or uses a construct outside this collector's model is a manual review."
description_ko: "FTP 는 비밀번호를 평문으로 보내 인증하므로, 동작 중인 FTP 서비스는 TLS 로 감싸지 않은 세션을 거부해야 합니다. 이 항목은 두 가지 질문 중 하나로 판정하며, 어느 쪽을 묻는지는 호스트에 달려 있습니다. FTP 유닛이 설치되어 있지만 실행 중이 아니면 찾을 암호화되지 않은 서비스 자체가 없으므로 통과입니다 - 설정 파일에 무엇이 남아 있든 데몬을 멈춘 운영자는 노출을 제거한 것입니다. 실행 중이라면 설정이 제공하는 모든 세션에 TLS 를 강제해야 합니다 - vsftpd 는 ssl_enable 과 함께 force_local_logins_ssl·force_local_data_ssl(둘 다 기본 YES)을 켠 상태로 두고, 익명 로그인을 제공한다면 force_anon_logins_ssl·force_anon_data_ssl(둘 다 기본 NO)도 켜야 하므로 익명 로그인 곁의 ssl_enable 만으로는 부족합니다. proftpd 는 TLSEngine on 과 최상위의 TLSRequired on, pure-ftpd 는 평문 세션을 아예 거부하는 TLS 2 이상이어야 합니다. 유닛이 실행 중인지 muster 가 알 수 없는 경우 - 질의할 서비스 관리자가 없는 호스트 - 는 어느 질문도 물을 수 없으므로 통과가 아니라 수동 검토입니다. FTP 데몬이 설치되어 있지 않은 호스트는 해당 없음이고, 설정을 끝까지 읽지 못했거나 모델 밖 구문을 쓰는 설정은 수동 검토입니다."
category: service
importance: 중
automation: auto
references:
  kisa: { "2026": ["U-54"], "2021": ["U-61"] }
requires_facts: ">=1"
absent_means: manual
applies_when:
  - { fact: services.ftp.installed, op: eq, expected: true }
# The two questions are separated so that a stopped daemon is not judged by a
# configuration nothing is serving, and a running one is not excused by it.
# A mechanism whose `when` fact is absent or unsupported is skipped, so a host
# whose service manager cannot answer `active` matches neither and takes
# absent_means (MANUAL) with "no mechanism applies to this host" - never a
# silent pass.
mechanisms:
  # Installed but stopped: there is no unencrypted service on this host.
  - when:
      - { fact: services.ftp.active, op: eq, expected: false }
    checks:
      - { fact: services.ftp.active, op: eq, expected: false }
  # Running: the configuration must enforce TLS on every session it serves.
  - when:
      - { fact: services.ftp.active, op: eq, expected: true }
    checks:
      - { fact: ftp.tls_enforced, op: eq, expected: true }
remediation:
  text_en: Stop and disable the FTP unit where the service is not needed; otherwise set ssl_enable=YES with force_local_logins_ssl=YES, force_local_data_ssl=YES (and force_anon_logins_ssl=YES, force_anon_data_ssl=YES where anonymous logins are served) in vsftpd.conf, TLSEngine on with TLSRequired on in proftpd.conf, or TLS 2 for pure-ftpd, then restart the daemon.
  text_ko: 서비스가 필요 없으면 FTP 유닛을 중지하고 비활성화합니다. 필요하다면 vsftpd.conf 에 ssl_enable=YES 와 force_local_logins_ssl=YES, force_local_data_ssl=YES (익명 로그인을 제공하면 force_anon_logins_ssl=YES, force_anon_data_ssl=YES 도) 를 설정하거나, proftpd.conf 에 TLSEngine on 과 TLSRequired on 을 설정하거나, pure-ftpd 에 TLS 2 를 설정한 뒤 데몬을 재시작합니다.
  risk: restart_service
  idempotent: true
decision: D09
