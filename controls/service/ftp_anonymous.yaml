id: muster.service.ftp_anonymous
title_en: The FTP service serves no anonymous login
title_ko: FTP 서비스가 익명 로그인을 제공하지 않는다
description_en: "An anonymous FTP login hands an unauthenticated caller a session on the host, so a daemon that serves one must be able to justify it. The verdict is read from the daemon's own configuration: vsftpd's anonymous_enable, a proftpd <Anonymous> block, and pure-ftpd's NoAnonymous. vsftpd's COMPILED default is YES in both the Debian and the RHEL build - the Debian man page's \"Default: NO\" is a documentation-only patch that never reached tunables.c - so a configuration file that never names anonymous_enable really does serve anonymous logins and is a finding, not a pass by default. A host with no FTP daemon installed is not applicable. A configuration this collector could not read in full, or one using a construct outside its model (a second vsftpd instance, a proftpd VirtualHost, Global or IfModule section enclosing a modelled directive), is a manual review rather than a pass: the settings that decide the answer may live where muster does not look. The pure-ftpd-mysql, pure-ftpd-ldap and pure-ftpd-postgresql packages install their own binary and unit, which the services table sees only through a listener on port 21; where that is all this host offers, the daemon's own settings are still read from /etc/pure-ftpd."
description_ko: "익명 FTP 로그인은 인증되지 않은 접속자에게 호스트의 세션을 그대로 내어 주므로, 이를 제공하는 데몬은 그럴 만한 근거가 있어야 합니다. 판정은 데몬 자신의 설정에서 읽습니다 - vsftpd 의 anonymous_enable, proftpd 의 <Anonymous> 블록, pure-ftpd 의 NoAnonymous 입니다. vsftpd 의 컴파일 기본값은 Debian 빌드와 RHEL 빌드 모두 YES 입니다. Debian man page 의 \"Default: NO\" 는 tunables.c 에 반영되지 않은 문서만의 패치이므로, anonymous_enable 을 전혀 적지 않은 설정 파일은 실제로 익명 로그인을 제공하며 기본값에 의한 통과가 아니라 결함입니다. FTP 데몬이 설치되어 있지 않은 호스트는 해당 없음입니다. 설정을 끝까지 읽지 못했거나 모델 밖 구문(두 번째 vsftpd 인스턴스, 모델이 읽는 지시어를 감싼 proftpd VirtualHost·Global·IfModule 섹션)을 쓰는 설정은 통과가 아니라 수동 검토입니다 - 답을 결정하는 설정이 muster 가 보지 않는 곳에 있을 수 있기 때문입니다. pure-ftpd-mysql, pure-ftpd-ldap, pure-ftpd-postgresql 패키지는 각자의 바이너리와 유닛을 설치하며 services 표는 이를 21 번 포트 리스너로만 인식하지만, 그런 호스트에서도 데몬 설정은 /etc/pure-ftpd 에서 그대로 읽습니다."
category: service
importance: 상
automation: auto
references:
  kisa: { "2026": ["U-35"], "2021": ["U-20"] }
requires_facts: ">=1"
absent_means: manual
applies_when:
  # Ruling J-22: the services collector writes ok:false - not absent - for a
  # unit that is not installed, so `op: present` would run the checks on every
  # host and one with no FTP daemon would read MANUAL. `eq true` gives
  # NOT_APPLICABLE there, and an unsupported (no systemd) reading screens to
  # NOT_APPLICABLE as well.
  - { fact: services.ftp.installed, op: eq, expected: true }
checks:
  - { fact: ftp.anonymous_enabled, op: eq, expected: false }
remediation:
  text_en: 'Set anonymous_enable=NO in vsftpd.conf, remove the <Anonymous> block from proftpd.conf, or set NoAnonymous yes for pure-ftpd, then restart the daemon. The review script backs up /etc/vsftpd.conf and /etc/vsftpd/vsftpd.conf and, in each that is a regular file where vsftpd reads anonymous_enable as other than NO, FALSE or 0 (a missing key is the compiled YES), writes anonymous_enable=NO - every anonymous_enable line is rewritten, or one is appended; a symlink is left as is. This closes an anonymous service someone may have meant to run, so check first that nothing depends on it. When it changed a file and vsftpd was running, it restarts vsftpd.service. The proftpd <Anonymous> block and pure-ftpd''s NoAnonymous stay the operator''s. vsftpd.conf is a package configuration file on both families: at the next upgrade dpkg (Debian, Ubuntu) asks about the edited file, and rpm (EL) keeps the edit and writes the package''s version beside it as .rpmnew.'
  text_ko: 'vsftpd.conf 에 anonymous_enable=NO 를 설정하거나, proftpd.conf 의 <Anonymous> 블록을 제거하거나, pure-ftpd 에 NoAnonymous yes 를 설정한 뒤 데몬을 재시작합니다. 검토 스크립트는 /etc/vsftpd.conf 와 /etc/vsftpd/vsftpd.conf 를 백업한 뒤, 일반 파일이면서 vsftpd 가 anonymous_enable 을 NO, FALSE, 0 이외의 값으로 읽는(키가 없으면 컴파일 기본값 YES) 파일마다 anonymous_enable=NO 를 씁니다(모든 anonymous_enable 줄을 고쳐 쓰고, 없으면 한 줄을 덧붙입니다). 심볼릭 링크는 그대로 둡니다. 누군가 의도해서 운영했을 수도 있는 익명 서비스를 닫는 것이므로, 이에 기대는 곳이 없는지 먼저 확인합니다. 파일을 바꾸었고 vsftpd 가 실행 중이었으면 vsftpd.service 를 재시작합니다. proftpd 의 <Anonymous> 블록과 pure-ftpd 의 NoAnonymous 는 운영자가 정리합니다. vsftpd.conf 는 두 계열 모두에서 패키지 설정 파일이므로, 다음 업그레이드 때 dpkg(Debian, Ubuntu)는 수정된 파일을 어떻게 할지 묻고, rpm(EL)은 수정본을 유지한 채 패키지의 버전을 옆에 .rpmnew 로 씁니다.'
  risk: restart_service
  idempotent: true
  backup: [/etc/vsftpd.conf, /etc/vsftpd/vsftpd.conf]
  script: |
    rm -f "$MB/vsftpd.was-running" "$MB/vsftpd.edited"
    if LC_ALL=C systemctl is-active --quiet vsftpd.service; then : > "$MB/vsftpd.was-running"; fi
    rd_anon() { LC_ALL=C awk '{ l = $0; sub(/^[[:space:]]+/, "", l); if (l == "" || substr(l, 1, 1) == "#") next; i = index(l, "="); if (i == 0) next; k = substr(l, 1, i - 1); sub(/[[:space:]]+$/, "", k); k = tolower(k); v = substr(l, i + 1); sub(/^[[:space:]]+/, "", v); sub(/[[:space:]]+$/, "", v); if (k == "anonymous_enable") a = tolower(v) } END { if (a == "no" || a == "false" || a == "0") print "no"; else print "yes" }' "$1"; }
    for f in /etc/vsftpd.conf /etc/vsftpd/vsftpd.conf; do
      if [ -f "$f" ] && [ ! -L "$f" ]; then
        if [ "$(rd_anon "$f")" = yes ]; then
          : > "$MB/vsftpd.edited"
          if LC_ALL=C grep -Eiq '^[[:space:]]*anonymous_enable[[:space:]]*=' "$f"; then
            LC_ALL=C sed -i -E 's/^[[:space:]]*anonymous_enable[[:space:]]*=.*/anonymous_enable=NO/I' "$f"
          else
            if [ -s "$f" ] && [ -n "$(tail -c1 "$f")" ]; then echo >> "$f"; fi
            echo 'anonymous_enable=NO' >> "$f"
          fi
        fi
      fi
    done
    if [ -f "$MB/vsftpd.edited" ] && [ -f "$MB/vsftpd.was-running" ]; then
      systemctl reset-failed vsftpd.service 2>/dev/null || :
      systemctl restart vsftpd.service
    fi
  validate: |
    { [ ! -f /etc/vsftpd.conf ] || [ -L /etc/vsftpd.conf ] || [ "$(LC_ALL=C awk '{ l = $0; sub(/^[[:space:]]+/, "", l); if (l == "" || substr(l, 1, 1) == "#") next; i = index(l, "="); if (i == 0) next; k = substr(l, 1, i - 1); sub(/[[:space:]]+$/, "", k); k = tolower(k); v = substr(l, i + 1); sub(/^[[:space:]]+/, "", v); sub(/[[:space:]]+$/, "", v); if (k == "anonymous_enable") a = tolower(v) } END { if (a == "no" || a == "false" || a == "0") print "no"; else print "yes" }' /etc/vsftpd.conf)" = no ]; } && { [ ! -f /etc/vsftpd/vsftpd.conf ] || [ -L /etc/vsftpd/vsftpd.conf ] || [ "$(LC_ALL=C awk '{ l = $0; sub(/^[[:space:]]+/, "", l); if (l == "" || substr(l, 1, 1) == "#") next; i = index(l, "="); if (i == 0) next; k = substr(l, 1, i - 1); sub(/[[:space:]]+$/, "", k); k = tolower(k); v = substr(l, i + 1); sub(/^[[:space:]]+/, "", v); sub(/[[:space:]]+$/, "", v); if (k == "anonymous_enable") a = tolower(v) } END { if (a == "no" || a == "false" || a == "0") print "no"; else print "yes" }' /etc/vsftpd/vsftpd.conf)" = no ]; } && { [ ! -f "$MB/vsftpd.was-running" ] || systemctl is-active --quiet vsftpd.service; }
  rollback: |
    restore /etc/vsftpd.conf /etc/vsftpd/vsftpd.conf
    if [ -f "$MB/vsftpd.edited" ] && [ -f "$MB/vsftpd.was-running" ]; then
      systemctl reset-failed vsftpd.service 2>/dev/null || :
      systemctl restart vsftpd.service
    fi
decision: D09
