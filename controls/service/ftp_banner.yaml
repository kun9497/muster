id: muster.service.ftp_banner
title_en: The FTP greeting does not name the software serving it
title_ko: FTP 접속 안내 문구가 서비스 소프트웨어를 알리지 않는다
description_en: "The greeting an FTP daemon sends before a client authenticates is read by anyone who can open the port, so it must not tell them which product - and therefore which advisories - to try. muster judges the CONFIGURED greeting: vsftpd's ftpd_banner or the contents of its banner_file, and proftpd's ServerIdent. A greeting is a disclosure when it names vsftpd, proftpd, pure-ftpd or wu-ftpd, matched case-insensitively; a bare version number in an otherwise custom greeting is deliberately not a disclosure, because a number identifies no product. An unset vsftpd banner and an unset or argument-less proftpd ServerIdent are findings, since both daemons then send a compiled greeting that names themselves - muster does not invent that text, it reports the source. ServerIdent off is a pass. pure-ftpd's greeting is not configurable in this model, so a pure-ftpd host is a manual review rather than a guess, as is a banner file outside this collector's declaration, one that could not be read, or one cut at the read limit. A host with no FTP daemon installed is not applicable."
description_ko: "FTP 데몬이 클라이언트 인증 전에 보내는 접속 안내 문구는 포트를 열 수 있는 누구나 읽을 수 있으므로, 어떤 제품인지 - 따라서 어떤 취약점 권고를 시도해 볼지 - 알려 주면 안 됩니다. muster 는 설정된 문구를 판정합니다 - vsftpd 의 ftpd_banner 또는 banner_file 의 내용, proftpd 의 ServerIdent 입니다. 문구가 vsftpd, proftpd, pure-ftpd, wu-ftpd 중 하나를 대소문자 구분 없이 포함하면 정보 노출로 봅니다. 그 외에는 사용자 정의 문구 안의 단순 버전 번호를 의도적으로 노출로 보지 않습니다 - 숫자만으로는 제품을 특정할 수 없기 때문입니다. vsftpd 의 문구를 설정하지 않은 경우와 proftpd 의 ServerIdent 를 설정하지 않았거나 인자 없이 켠 경우는 결함입니다. 두 데몬 모두 그때는 자기 이름을 담은 컴파일 기본 문구를 보내기 때문이며, muster 는 그 문구를 지어내지 않고 출처를 보고합니다. ServerIdent off 는 통과입니다. pure-ftpd 의 문구는 이 모델에서 설정 대상이 아니므로 pure-ftpd 호스트는 추측 대신 수동 검토이고, 선언 범위 밖의 banner 파일, 읽지 못한 파일, 읽기 한도에서 잘린 파일도 마찬가지입니다. FTP 데몬이 설치되어 있지 않은 호스트는 해당 없음입니다."
category: service
importance: 하
automation: auto
references:
  kisa: { "2026": ["U-53"], "2021": [] }
requires_facts: ">=1"
absent_means: manual
applies_when:
  - { fact: services.ftp.installed, op: eq, expected: true }
checks:
  - { fact: ftp.banner_discloses_version, op: eq, expected: false }
remediation:
  text_en: 'Set ftpd_banner to a notice that names no product in vsftpd.conf (or point banner_file at such a file), or set ServerIdent on "<notice>" in proftpd.conf, then restart the daemon. The review script backs up /etc/vsftpd.conf and /etc/vsftpd/vsftpd.conf and, in each that is a regular file whose greeting names a product or is vsftpd''s compiled one, writes ftpd_banner=FTP server ready. - every ftpd_banner line is rewritten, or one is appended; a non-empty banner_file sets the greeting and is left to the operator, and a symlink is left as is. When it changed a file and vsftpd was running, it restarts vsftpd.service. proftpd''s ServerIdent stays the operator''s, and a pure-ftpd host is reviewed by hand. vsftpd.conf is a package configuration file on both families: at the next upgrade dpkg (Debian, Ubuntu) asks about the edited file, and rpm (EL) keeps the edit and writes the package''s version beside it as .rpmnew.'
  text_ko: 'vsftpd.conf 의 ftpd_banner 를 제품명이 없는 안내 문구로 설정하거나(또는 banner_file 이 그런 파일을 가리키게 하고), proftpd.conf 에 ServerIdent on "<안내 문구>" 를 설정한 뒤 데몬을 재시작합니다. 검토 스크립트는 /etc/vsftpd.conf 와 /etc/vsftpd/vsftpd.conf 를 백업한 뒤, 일반 파일이면서 접속 문구가 제품명을 담거나 vsftpd 의 컴파일 기본 문구인 파일마다 ftpd_banner=FTP server ready. 를 씁니다(모든 ftpd_banner 줄을 고쳐 쓰고, 없으면 한 줄을 덧붙입니다). 비어 있지 않은 banner_file 이 문구를 정하는 경우는 운영자에게 맡기고, 심볼릭 링크는 그대로 둡니다. 파일을 바꾸었고 vsftpd 가 실행 중이었으면 vsftpd.service 를 재시작합니다. proftpd 의 ServerIdent 는 운영자가 정리하며, pure-ftpd 호스트는 수동으로 검토합니다. vsftpd.conf 는 두 계열 모두에서 패키지 설정 파일이므로, 다음 업그레이드 때 dpkg(Debian, Ubuntu)는 수정된 파일을 어떻게 할지 묻고, rpm(EL)은 수정본을 유지한 채 패키지의 버전을 옆에 .rpmnew 로 씁니다.'
  risk: restart_service
  idempotent: true
  backup: [/etc/vsftpd.conf, /etc/vsftpd/vsftpd.conf]
  script: |
    rm -f "$MB/vsftpd.was-running" "$MB/vsftpd.edited"
    if LC_ALL=C systemctl is-active --quiet vsftpd.service; then : > "$MB/vsftpd.was-running"; fi
    rd_greeting() { LC_ALL=C awk '{ l = $0; sub(/^[[:space:]]+/, "", l); if (l == "" || substr(l, 1, 1) == "#") next; i = index(l, "="); if (i == 0) next; k = substr(l, 1, i - 1); sub(/[[:space:]]+$/, "", k); k = tolower(k); v = substr(l, i + 1); sub(/^[[:space:]]+/, "", v); sub(/[[:space:]]+$/, "", v); if (k == "ftpd_banner") b = v; if (k == "banner_file") f = v } END { if (f == "-" || f == "/dev/stdin" || (f != "" && (getline x < f) != 0)) print "file"; else if (b == "" || tolower(b) ~ /(^|[^[:alnum:]_])(vsftpd|proftpd|pure-?ftpd|wu-?ftpd)([^[:alnum:]_]|$)/) print "disclose"; else print "clean" }' "$1"; }
    for f in /etc/vsftpd.conf /etc/vsftpd/vsftpd.conf; do
      if [ -f "$f" ] && [ ! -L "$f" ]; then
        case "$(rd_greeting "$f")" in
          file) log "muster.service.ftp_banner: banner_file $(LC_ALL=C sed -n -E 's/^[[:space:]]*banner_file[[:space:]]*=[[:space:]]*//Ip' "$f" | tail -n 1) sets the greeting; left to the operator";;
          disclose)
            : > "$MB/vsftpd.edited"
            if LC_ALL=C grep -Eiq '^[[:space:]]*ftpd_banner[[:space:]]*=' "$f"; then
              LC_ALL=C sed -i -E 's/^[[:space:]]*ftpd_banner[[:space:]]*=.*/ftpd_banner=FTP server ready./I' "$f"
            else
              if [ -s "$f" ] && [ -n "$(tail -c1 "$f")" ]; then echo >> "$f"; fi
              echo 'ftpd_banner=FTP server ready.' >> "$f"
            fi
            ;;
        esac
      fi
    done
    if [ -f "$MB/vsftpd.edited" ] && [ -f "$MB/vsftpd.was-running" ]; then
      systemctl reset-failed vsftpd.service 2>/dev/null || :
      systemctl restart vsftpd.service
    fi
  validate: |
    { [ ! -f /etc/vsftpd.conf ] || [ -L /etc/vsftpd.conf ] || case "$(LC_ALL=C awk '{ l = $0; sub(/^[[:space:]]+/, "", l); if (l == "" || substr(l, 1, 1) == "#") next; i = index(l, "="); if (i == 0) next; k = substr(l, 1, i - 1); sub(/[[:space:]]+$/, "", k); k = tolower(k); v = substr(l, i + 1); sub(/^[[:space:]]+/, "", v); sub(/[[:space:]]+$/, "", v); if (k == "ftpd_banner") b = v; if (k == "banner_file") f = v } END { if (f == "-" || f == "/dev/stdin" || (f != "" && (getline x < f) != 0)) print "file"; else if (b == "" || tolower(b) ~ /(^|[^[:alnum:]_])(vsftpd|proftpd|pure-?ftpd|wu-?ftpd)([^[:alnum:]_]|$)/) print "disclose"; else print "clean" }' /etc/vsftpd.conf)" in clean|file) true;; *) false;; esac; } && { [ ! -f /etc/vsftpd/vsftpd.conf ] || [ -L /etc/vsftpd/vsftpd.conf ] || case "$(LC_ALL=C awk '{ l = $0; sub(/^[[:space:]]+/, "", l); if (l == "" || substr(l, 1, 1) == "#") next; i = index(l, "="); if (i == 0) next; k = substr(l, 1, i - 1); sub(/[[:space:]]+$/, "", k); k = tolower(k); v = substr(l, i + 1); sub(/^[[:space:]]+/, "", v); sub(/[[:space:]]+$/, "", v); if (k == "ftpd_banner") b = v; if (k == "banner_file") f = v } END { if (f == "-" || f == "/dev/stdin" || (f != "" && (getline x < f) != 0)) print "file"; else if (b == "" || tolower(b) ~ /(^|[^[:alnum:]_])(vsftpd|proftpd|pure-?ftpd|wu-?ftpd)([^[:alnum:]_]|$)/) print "disclose"; else print "clean" }' /etc/vsftpd/vsftpd.conf)" in clean|file) true;; *) false;; esac; } && { [ ! -f "$MB/vsftpd.was-running" ] || systemctl is-active --quiet vsftpd.service; }
  rollback: |
    restore /etc/vsftpd.conf /etc/vsftpd/vsftpd.conf
    if [ -f "$MB/vsftpd.edited" ] && [ -f "$MB/vsftpd.was-running" ]; then
      systemctl reset-failed vsftpd.service 2>/dev/null || :
      systemctl restart vsftpd.service
    fi
decision: D09
