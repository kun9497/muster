id: muster.service.snmp_community_strength
title_en: SNMP community strings are neither well known nor short
title_ko: SNMP 커뮤니티 문자열이 잘 알려진 값도 짧은 값도 아니다
description_en: "No configured SNMP community may be one of the well-known defaults - public, private and the rest of the list the collector embeds - and none may be shorter than the minimum length, which is a parameter. A v1 or v2c community is the whole of the agent's authentication, so a guessable one is an open agent. The community strings themselves are never stored in a result: the collector measures each one and keeps only an opaque ordinal, its kind, whether it matched the well-known list, its length in characters and whether it is bound to a source, which is everything this control needs and nothing an attacker can use. That is also why the well-known list is embedded rather than a parameter - a site listing its own strings in a parameter would publish them into every result file. Outbound communities count: a trapcommunity, a community named on a trapsink, trap2sink or informsink line, a trapsess -c argument, net-snmp's compiled-in fallback for a destination that names none, and the community a proxy directive forwards with (its -c option) are all community strings on the wire and are all judged here. muster.service.snmp_access_control screens the trap and proxy kinds out, because neither has an inbound source to restrict; their strength is this control's business, since a weak outbound community is still a credential an attacker can read off the network. A host with no SNMP agent installed is not applicable. An agent that is installed but defines no community at all - a v3-only agent, or one whose community lines are commented out - reads an EMPTY community list and passes: there is no weak credential where there is no credential. An agent installed with no configuration file anywhere is a different shape - the list is absent rather than empty - and reads a manual review, as does a configuration that could only be read in part."
description_ko: "설정된 SNMP 커뮤니티는 잘 알려진 기본값(public, private 등 수집기가 내장한 목록)이면 안 되고, 파라미터로 정한 최소 길이보다 짧아도 안 됩니다. v1·v2c 에서 커뮤니티는 에이전트 인증의 전부이므로, 추측 가능한 커뮤니티는 곧 열린 에이전트입니다. 커뮤니티 문자열 자체는 결과에 절대 저장하지 않습니다: 수집기가 각 문자열을 측정해 불투명한 일련번호, 종류, 잘 알려진 목록과 일치하는지 여부, 문자 수, 소스에 묶여 있는지만 남기며, 이 점검에 필요한 것은 그것으로 충분하고 공격자가 쓸 수 있는 것은 남지 않습니다. 잘 알려진 목록을 파라미터가 아니라 내장으로 둔 이유도 같습니다 - 자기 문자열을 파라미터에 적는 사이트는 그것을 모든 결과 파일에 공개하게 됩니다. 나가는 방향의 커뮤니티도 포함합니다: trapcommunity, trapsink·trap2sink·informsink 줄이 지정한 커뮤니티, trapsess 의 -c 인자, 아무것도 지정하지 않은 대상에 net-snmp 가 쓰는 내장 기본값, 그리고 proxy 지시자가 전달에 쓰는 커뮤니티(-c 옵션)까지 모두 통신 상의 커뮤니티 문자열이며 여기서 함께 판단합니다. muster.service.snmp_access_control 은 trap 과 proxy 종류를 걸러 냅니다 - 제한할 인바운드 소스가 없기 때문입니다. 그 강도는 이 항목이 맡습니다. 나가는 방향의 약한 커뮤니티도 공격자가 네트워크에서 읽어 낼 수 있는 자격 증명이기 때문입니다. SNMP 에이전트가 설치되어 있지 않은 호스트는 해당 없음입니다. 에이전트는 설치되어 있으나 커뮤니티를 하나도 정의하지 않는 경우 - v3 전용이거나 커뮤니티 줄이 모두 주석 처리된 경우 - 커뮤니티 목록이 비어 있는 상태로 통과합니다. 자격 증명 자체가 없으면 약한 자격 증명도 없기 때문입니다. 설정 파일이 어디에도 없는 경우는 다릅니다 - 목록이 비어 있는 것이 아니라 부재이며 수동 검토로 처리합니다. 설정을 일부만 읽은 경우도 같습니다."
category: service
importance: 중
automation: auto
references:
  kisa: { "2026": ["U-60"], "2021": ["U-67"] }
requires_facts: ">=1"
absent_means: manual
params:
  min_length: { type: int, default: 8, description: "Minimum number of characters in an SNMP community string" }
applies_when:
  # Ruling J-22 - never `op: present`; see muster.service.nfs_export_access.
  - { fact: services.snmp.installed, op: eq, expected: true }
checks:
  - { fact: snmp.communities, op: each, subject: ref, require: { field: is_default, op: eq, expected: false } }
  - { fact: snmp.communities, op: each, subject: ref, require: { field: length, op: gte, expected: "${min_length}" } }
remediation:
  text_en: Replace every default or short community string in snmpd.conf, including the one on any trapcommunity or trap sink line, with a long random string, restart the agent, and update the managers and trap receivers that use it. Moving the agent to SNMPv3 removes community strings altogether.
  text_ko: snmpd.conf 의 기본값이거나 짧은 커뮤니티 문자열을 trapcommunity·트랩 sink 줄의 것까지 포함해 모두 길고 무작위한 문자열로 바꾸고, 에이전트를 재시작한 뒤 이를 사용하는 관리 서버와 트랩 수신기도 함께 변경합니다. 에이전트를 SNMPv3 로 옮기면 커뮤니티 문자열 자체가 없어집니다.
  risk: restart_service
  idempotent: true
decision: D09
