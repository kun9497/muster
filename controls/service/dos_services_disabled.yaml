id: muster.service.dos_services_disabled
title_en: The DoS-prone small services are not enabled or reachable
title_ko: DoS 취약 서비스가 활성화되어 있지 않다
description_en: No echo, discard, daytime or chargen server may be active, enabled at boot, hosted by inetd/xinetd, or listening on a non-loopback address. A host without any of these servers passes.
description_ko: echo, discard, daytime, chargen 서버가 활성이거나 부팅 시 시작되도록 설정되어 있거나 inetd/xinetd 로 구동되거나 루프백 외 주소에서 대기하면 안 됩니다. 이러한 서비스가 전혀 없는 호스트는 통과합니다.
category: service
importance: 상
automation: auto
references:
  kisa: { "2026": ["U-38"], "2021": ["U-23"] }
requires_facts: ">=1"
absent_means: pass
checks:
  - { fact: services.dos_services.active, op: eq, expected: false }
  - { fact: services.dos_services.enabled, op: eq, expected: false }
  - { fact: services.dos_services.reachable, op: eq, expected: false }
remediation:
  text_en: Disable and mask the echo, discard, daytime and chargen services or remove their inetd/xinetd entries. An echo, discard, daytime or chargen started by inetd or xinetd is not stopped by the script; remove its entry there.
  text_ko: echo, discard, daytime, chargen 서비스를 비활성화·mask 하거나 inetd/xinetd 의 해당 항목을 제거합니다. inetd나 xinetd가 띄우는 echo, discard, daytime, chargen은 스크립트가 멈추지 않습니다. 거기서 항목을 지우십시오.
  risk: restart_service
  idempotent: true
  units: [echo.socket, discard.socket, daytime.socket, chargen.socket]
  script: |
    for u in $UNITS; do
      systemctl cat "$u" >/dev/null 2>&1 || continue
      systemctl --quiet disable --now "$u"
      systemctl --quiet mask "$u" || true
    done
  validate: '! systemctl is-active --quiet echo.socket && case "$(systemctl is-enabled echo.socket 2>/dev/null)" in enabled|enabled-runtime) false;; esac && ! systemctl is-active --quiet discard.socket && case "$(systemctl is-enabled discard.socket 2>/dev/null)" in enabled|enabled-runtime) false;; esac && ! systemctl is-active --quiet daytime.socket && case "$(systemctl is-enabled daytime.socket 2>/dev/null)" in enabled|enabled-runtime) false;; esac && ! systemctl is-active --quiet chargen.socket && case "$(systemctl is-enabled chargen.socket 2>/dev/null)" in enabled|enabled-runtime) false;; esac'
decision: D19
