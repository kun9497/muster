id: muster.service.finger_disabled
title_en: The finger service is not enabled or reachable
title_ko: finger 서비스가 활성화되어 있지 않다
description_en: No finger server may be active, enabled at boot, hosted by inetd/xinetd, or listening on a non-loopback address. A host without any finger server passes.
description_ko: finger 서버가 활성이거나 부팅 시 시작되도록 설정되어 있거나 inetd/xinetd 로 구동되거나 루프백 외 주소에서 대기하면 안 됩니다. finger 서버가 전혀 없는 호스트는 통과합니다.
category: service
importance: 상
automation: auto
references:
  kisa: { "2026": ["U-34"], "2021": ["U-19"] }
requires_facts: ">=1"
absent_means: pass
checks:
  - { fact: services.finger.active, op: eq, expected: false }
  - { fact: services.finger.enabled, op: eq, expected: false }
  - { fact: services.finger.reachable, op: eq, expected: false }
remediation:
  text_en: Disable and mask the finger service or remove the finger server package, and remove any inetd/xinetd finger entry. A finger started by inetd or xinetd is not stopped by the script; remove its entry there.
  text_ko: finger 서비스를 비활성화·mask 하거나 finger 서버 패키지를 제거하고, inetd/xinetd 의 finger 항목을 제거합니다. inetd나 xinetd가 띄우는 finger는 스크립트가 멈추지 않습니다. 거기서 항목을 지우십시오.
  risk: restart_service
  idempotent: true
  units: [finger.socket, fingerd.service]
  script: |
    todo=
    for u in $UNITS; do
      systemctl cat "$u" >/dev/null 2>&1 || continue
      [ "$(systemctl show -p Id --value "$u" 2>/dev/null)" = "$u" ] || continue
      todo="$todo $u"
    done
    for u in $todo; do
      systemctl --quiet disable --now "$u"
      systemctl --quiet mask "$u" || true
    done
  validate: '! systemctl is-active --quiet finger.socket && case "$(systemctl is-enabled finger.socket 2>/dev/null)" in enabled|enabled-runtime) false;; esac && ! systemctl is-active --quiet fingerd.service && case "$(systemctl is-enabled fingerd.service 2>/dev/null)" in enabled|enabled-runtime) false;; esac'
decision: D19
