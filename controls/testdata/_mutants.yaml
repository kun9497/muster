# Surviving mutants no fixture can distinguish, one row each; the mutation test
# fails when a row's mutant is killed or is not generated (spec 3F, F-3).
#
# A mutant that survives because a fixture is MISSING is fixed by adding the
# fixture, never by a row here. Every reason below names the collector
# invariant or the closed value vocabulary that makes the mutant equivalent.

- control: muster.account.cron_permissions
  mutant: "checks[0] remove"
  reason: >-
    cronRow (internal/collect/collectors/cron.go) writes `reason` only on the stat-error
    branch, which also sets mode -1 and owner_ok false. Every value of the closed scope
    vocabulary (system, access, user, periodic) is then already judged by checks[1],
    checks[3], checks[4] or checks[5], so no cron.files row can be the sole failure of the
    reason clause.

- control: muster.account.primary_group_exists
  mutant: "checks[0].where expected -1"
  reason: >-
    The clause reads "the orphan list is non-empty" as `gid gte 0`, and orphanGIDs
    (internal/collect/collectors/accounts_groups.go, `if u.gid >= 0 && !exists[u.gid]`) never
    emits a row with a negative gid -- an unparsable gid is a parse failure, not an orphan.
    So no snapshot carries the gid -1 element that alone separates `gte -1` from `gte 0`.

- control: muster.account.password_policy
  mutant: "checks[3] remove"
  reason: >-
    pam.pwquality.enabled is ok:false only in pam_derive.go's "not stacked" branch, which
    sets pam.pwquality.minlen and pam.pwquality.required_classes to absent. Those are
    checks[4]'s and checks[5]'s facts, so such a host resolves through absent_means: fail
    in the screening pass before any clause runs, with or without this clause.

- control: muster.account.root_home_and_path
  mutant: "mechanisms[1].when[0] remove"
  reason: >-
    The `when` fact is files.root_home.uid under `op: present`, which holds for every ok
    envelope, and writeRootHome (internal/collect/collectors/files.go) gives all six /root
    leaves the SAME envelope when the stat fails. So the `when` is only ever absent — the
    mechanism is skipped and absent_means gives FAIL, exactly what the unconditional
    mechanism's own absent checks give — or hard, which is ERROR with the same reason code
    from either screening pass.

- control: muster.account.root_remote_login
  mutant: "mechanisms[1].when[1] remove"
  reason: >-
    files.etc_securetty and files.etc_securetty_lines are written from one ReadFile in
    internal/collect/collectors/files.go, so the screened `present` fact is ok exactly when
    the judged line list is ok. With the screen gone the line list's own absent or denied
    status produces the same MANUAL or the same ERROR code.

- control: muster.file.home_dir_exists
  mutant: "checks[0] remove"
  reason: >-
    files_home.go sets is_dir true only inside the branch that sets stat_status "ok", so a
    files.home_dirs row that fails checks[0] (stat_status eq "ok") always also fails
    checks[1] (is_dir eq true). No row can make the stat-status clause the sole failure.

- control: muster.file.ip_port_restriction
  mutant: "mechanisms[1].when[0] remove"
  reason: >-
    firewall.backend's vocabulary is firewalld, ufw, nftables, iptables and none. For the
    first four this `when` already holds. For none, Ruling H-16's normaliser always writes
    restricts_inbound ok:false (the readable-empty case), so the unconditional mechanism
    FAILs — and mechanisms[2] is reachable only when NOT (deny_all AND libwrap), which is
    when its own two checks FAIL. Both sides give FAIL with no reason code.

- control: muster.file.ip_port_restriction
  mutant: "mechanisms[2].when[0] remove"
  reason: >-
    mechanisms[1] already claims the four named firewall.backend values, so mechanisms[2]
    is only ever reached with backend == none, which is exactly what its own `when`
    selects. No snapshot can reach this mechanism with a backend the `when` would reject.

- control: muster.file.startup_script_permissions
  mutant: "checks[3] remove"
  reason: >-
    permRow (internal/collect/collectors/files_startup.go) sets `reason` only on the
    stat-error branch, which leaves uid -1 and is_symlink false, so every
    files.startup_scripts row carrying a reason also fails checks[2] (uid eq 0). The reason
    clause is never the sole failure.

- control: muster.file.suid_sgid
  mutant: "checks[1] remove"
  reason: >-
    This clause's `where` is `path in ${forbidden_suid}` and the shipped default is the
    empty list, so it selects no element of walk.suid_sgid on any host. Only an operator's
    own forbidden_suid override makes it judge anything, and a fixture carries no parameter
    overrides.

- control: muster.log.syslog_policy
  mutant: "mechanisms[0].checks[1] remove"
  reason: >-
    rsyslogCoverage (internal/collect/collectors/logging.go) assigns `persistent` only
    inside the branch that has already set `logged` true, so a facility that fails
    checks[1] (logged eq true) always also fails checks[2] (persistent eq true).

- control: muster.service.login_banner
  mutant: "mechanisms[1].when[0] remove"
  reason: >-
    The `when` fact is banners.issue_net.nonempty, which is also this mechanism's
    checks[0], and bannerContent (internal/collect/collectors/banners.go) writes nonempty
    and os_escapes from ONE ReadFile with the SAME envelope. The screen and the judgment
    can therefore never disagree: an ok envelope makes the `when` hold, so the mechanism
    is chosen with or without it; an absent one skips the mechanism into absent_means:
    manual, which is exactly the MANUAL that screening the same absent leaf in the checks
    gives; and a hard status gives the same ERROR code from the mechanism loop or from the
    check screening.

# Ruling G-28: the four manual service controls gate on `<svc>.implementation
# present`, and that gate can only fail on a shape the collector never writes.
# Both publish sites build the leaf unconditionally with collect.OK — mail.go's
# `impl := collect.OK(p.impl, p.implSource())` and the identical line in
# dns.go — and a host with nothing installed gets the value "none", not an
# absent envelope. So dropping the gate is an EQUIVALENT mutant: on every
# snapshot `collect` can produce, the first gate alone decides the row. The
# other mutants of these controls' gates are still generated and still killed
# by na-not-installed.json and the manual fixtures.

- control: muster.service.dns_version
  mutant: "applies_when[1] remove"
  reason: >-
    dnsParse.publish (internal/collect/collectors/dns.go) sets dns.implementation with
    `impl := collect.OK(p.impl, p.implSource())` on every path — a host with no nameserver
    gets the value "none", never an absent envelope — so this `present` gate holds on every
    snapshot collect writes and removing it cannot change any fixture's answer.

- control: muster.service.mail_version
  mutant: "applies_when[1] remove"
  reason: >-
    mailParse.publish (internal/collect/collectors/mail.go) sets mail.implementation with
    `impl := collect.OK(p.impl, p.implSource())` on every path — a host with no MTA gets the
    value "none", never an absent envelope — so this `present` gate holds on every snapshot
    collect writes and removing it cannot change any fixture's answer.

- control: muster.service.mail_relay
  mutant: "applies_when[1] remove"
  reason: >-
    mailParse.publish (internal/collect/collectors/mail.go) sets mail.implementation with
    `impl := collect.OK(p.impl, p.implSource())` on every path — a host with no MTA gets the
    value "none", never an absent envelope — so this `present` gate holds on every snapshot
    collect writes and removing it cannot change any fixture's answer.

- control: muster.service.mail_user_execution
  mutant: "applies_when[1] remove"
  reason: >-
    mailParse.publish (internal/collect/collectors/mail.go) sets mail.implementation with
    `impl := collect.OK(p.impl, p.implSource())` on every path — a host with no MTA gets the
    value "none", never an absent envelope — so this `present` gate holds on every snapshot
    collect writes and removing it cannot change any fixture's answer.

- control: muster.beyond.core_dump_policy
  mutant: "mechanisms[3].when[0] remove"
  reason: >-
    readCorePattern (internal/collect/collectors/coredump.go) writes coredump.core_pattern as
    ONE string leaf from one read of /proc/sys/kernel/core_pattern, and mechanism [2]'s `when`
    (not_matches ^\|) is the exact complement of mechanism [3]'s (matches ^\|) over that leaf's
    ok values. So mechanism [3] is only ever reached on a host whose pattern its own `when`
    already accepts; and where the leaf is not ok, every mechanism is skipped alike -- the
    original resolves through absent_means with "no mechanism applies", the mutant through the
    same absent_means on the mechanism's own checks, and both are FAIL with no reason code. No
    snapshot collect can write separates the two.

# The three rows below are NOT equivalent mutants: a fixture that reaches
# absentMeans on this control kills all three (verified -- with such a fixture
# in the directory the mutation test reports surviving 1, this file's first
# core_dump_policy row). They survive because the fixture harness cannot
# express the expectation. absentMeans returns FAIL even under `partial`
# (spec 3B B-5 row 6), and TestEveryControlHasFixturesThatBehave maps EVERY
# fail-*.json of a `partial` control to WARN (internal/controls/fixtures_test.go),
# while no other prefix expects FAIL. So the only fixture that could kill them
# is one the harness rejects. When the harness gains a way to expect FAIL on a
# partial control, add controls/testdata/muster.beyond.core_dump_policy/
# fail-all-absent.json (core_pattern ok, every judged leaf absent) and delete
# these three rows -- the kill loop reports an exclusion that is killed again,
# so the list cannot rot silently.

- control: muster.beyond.core_dump_policy
  mutant: "absent_means ->pass"
  reason: >-
    Reaching absentMeans on this control needs a fixture whose judged coredump leaf is absent
    while coredump.core_pattern is ok -- the shape coredumpCollector writes on a host with no
    coredump.conf and no limits.conf core line. That fixture answers FAIL, and the fixture
    harness expects WARN from every fail-*.json of a `partial` control, so it cannot be
    committed. See the comment above this row.

- control: muster.beyond.core_dump_policy
  mutant: "absent_means ->not_applicable"
  reason: >-
    Same as the ->pass row above: the only fixture that distinguishes this mutant reaches
    absentMeans and therefore answers FAIL, which no fixture prefix can express on a `partial`
    control. See the comment above these rows.

- control: muster.beyond.core_dump_policy
  mutant: "absent_means ->manual"
  reason: >-
    Same as the ->pass row above: the only fixture that distinguishes this mutant reaches
    absentMeans and therefore answers FAIL, which no fixture prefix can express on a `partial`
    control. See the comment above these rows.
