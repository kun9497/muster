# The round-trip table (3D-2b §4, 3D-2c §5): one entry per scripted control, sorted by id.
# `images` names the fix-roundtrip matrix rows (their `key`) that seed the control,
# run its review script and check it again; `unproven_units` names the declared units
# or modules those rows do not exercise; `unproven` says why no row exercises the
# control at all. Each reason names one of four causes: no systemd unit (the server
# ships only for inetd), no package in the image's enabled repositories, the unit
# cannot run in a container, or the kernel does not ship the module. A `beyond`
# control gates containers out, so it names host rows only (`runner`, the GitHub
# runner VM). The assignments are the Task 1 probes' measurements.
# TestEveryScriptedControlIsInTheRoundtripTable (internal/controls) pins this file to
# the fix-roundtrip job of .github/workflows/ci.yml: every row's `seeded` list equals
# the ids whose `images` name that row. The fixture harness never loads this file.
